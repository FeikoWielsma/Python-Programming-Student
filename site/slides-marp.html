<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="type-hinting-recap">Type Hinting Recap</h1>
<ul>
<li>Type hints have appeared alongside the examples throughout the course :
<ul>
<li>Values such as <code>seconds: int = 222</code></li>
<li>Collections such as <code>list[str]</code> and <code>dict[str, int]</code></li>
<li>Functions such as <code>format_duration(seconds: int) -&gt; str</code></li>
<li>Constructors and methods in Classes</li>
</ul>
</li>
<li>An annotation records the intended type :
<ul>
<li>Editors use it for completion and navigation</li>
<li>A checker finds code that contradicts it</li>
<li>Python does not enforce it while the program runs</li>
</ul>
</li>
<li>This appendix adds optional values, closed sets and a checker</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="227" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="227" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="basic-type-syntax">Basic Type Syntax</h1>
<ul>
<li>A colon introduces a variable or parameter type; an arrow introduces the result :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>None</code> describes a function without a useful returned result :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> print_playlist</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> tracks</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Playlist: </span><span style="color:#1976D2">{</span><span style="color:#212121">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> number</span><span style="color:#212121">,</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> enumerate</span><span style="color:#212121">(tracks, start</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">number</span><span style="color:#1976D2">}</span><span style="color:#22863A">. </span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Variable annotations use the same types : <code>seconds: int = 222</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">annotations</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="228" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="228" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="typing-collections">Typing Collections</h1>
<ul>
<li>Collections state the types of their contents :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">tracks</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">favourites</span><span style="color:#212121">:</span><span style="color:#24292EFF"> set</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">durations</span><span style="color:#212121">:</span><span style="color:#24292EFF"> dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 125</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A tuple describes each position; an ellipsis allows any length of one type :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">photo_size</span><span style="color:#212121">:</span><span style="color:#24292EFF"> tuple</span><span style="color:#212121">[</span><span style="color:#1976D2">int</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">1920</span><span style="color:#212121">,</span><span style="color:#1976D2"> 1080</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">track</span><span style="color:#212121">:</span><span style="color:#24292EFF"> tuple</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 183</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">album_lengths</span><span style="color:#212121">:</span><span style="color:#24292EFF"> tuple</span><span style="color:#212121">[</span><span style="color:#1976D2">int</span><span style="color:#212121">,</span><span style="color:#24292EFF"> ...</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">183</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#212121">,</span><span style="color:#1976D2"> 149</span><span style="color:#24292EFF">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The dictionary type gives the key type first, then the value type</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">collections</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="229" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="229" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="optional-values">Optional Values</h1>
<ul>
<li>A lookup may return a duration or no value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> find_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">title</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> durations</span><span style="color:#212121">:</span><span style="color:#24292EFF"> dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> |</span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> durations</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(title)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Test for <code>None</code> before using the duration :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">durations </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 125</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">seconds </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> find_duration</span><span style="color:#212121">(</span><span style="color:#22863A">"Wonderwall"</span><span style="color:#212121">, durations)</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">is</span><span style="color:#1976D2"> None</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Track not found"</span><span style="color:#212121">)</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">parse_seconds</span><span style="color:#212121">(</span><span style="color:#22863A">"222"</span><span style="color:#212121">))</span></span>

<ul>

<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="hints-are-not-enforced">Hints Are Not Enforced</h1>
<ul>
<li>A wrong type can reach the function without an immediate runtime error :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> repeat_track</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">title</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> count</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> [title] </span><span style="color:#D32F2F">*</span><span style="color:#24292EFF"> count</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">repeat_track</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # [222, 222], despite the str annotation.</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The result contains numbers even though the return type says <code>list[str]</code></li>
<li>Annotations do not convert or validate incoming values</li>
<li>Annotations remain available through <code>repeat_track.__annotations__</code></li>
<li>A checker can report the mismatch before this program runs</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">not_enforced</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="231" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="231" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="checking-with-mypy">Checking with mypy</h1>
<ul>
<li><code>mypy</code> checks calls against the declared parameter types :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> repeat_track</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">title</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> count</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> [title] </span><span style="color:#D32F2F">*</span><span style="color:#24292EFF"> count</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">queue</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> repeat_track</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> --dev</span><span style="color:#2B5581"> mypy</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> mypy</span><span style="color:#2B5581"> 05_mypy_error.py</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>error: Argument 1 to "repeat_track" has incompatible type "int"; expected "str"</span></span>

<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">mypy_error</code></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="232" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="232" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="closed-sets-with-literal">Closed Sets with Literal</h1>
<ul>
<li><code>Literal</code> lets a checker restrict a value to specific options :
<ul>
<li>This player implements normal playback and repeating the current track</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> typing </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Literal</span></span>
<span class="line"></span>
<span class="line"><span style="color:#1976D2">type</span><span style="color:#24292EFF"> PlaybackMode </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> Literal</span><span style="color:#212121">[</span><span style="color:#22863A">"normal"</span><span style="color:#212121">,</span><span style="color:#22863A"> "repeat"</span><span style="color:#212121">]</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> next_index</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">index</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#212121">,</span><span style="color:#FF9800"> mode</span><span style="color:#212121">:</span><span style="color:#24292EFF"> PlaybackMode) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> mode </span><span style="color:#D32F2F">==</span><span style="color:#22863A"> "repeat"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> index</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> index </span><span style="color:#D32F2F">+</span><span style="color:#1976D2"> 1</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">next_index</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#22863A">"repeat"</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">next_index</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#22863A">"shuffle"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # Deliberate checker error.</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>mypy</code> flags <code>&quot;shuffle&quot;</code> because it is outside the declared options</li>
<li>Runtime validation still needs ordinary Python checks</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">literal</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="233" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="233" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#225"><span class="ml-tag">python</span>Type Hinting</a></div>
<h1 id="summary--type-hinting">Summary : Type Hinting</h1>
<ul>
<li>Type hints record in the signature what a function expects and returns :
<ul>
<li><code>age: int</code> for a variable, <code>def f(a: int) -&gt; str</code> for a function</li>
<li><code>list[int]</code> , <code>dict[str, int]</code> and <code>tuple[int, int]</code> for containers</li>
<li><code>str | None</code> for a value that may be absent</li>
<li><code>Literal[&quot;normal&quot;, &quot;repeat&quot;]</code> for a closed set of literal values</li>
</ul>
</li>
<li>Annotations are ignored at runtime :
<ul>
<li>Their value comes from the editor and from a checker such as <code>mypy</code></li>
</ul>
</li>
<li><code>uv run mypy wordle</code> checks the package without running the game</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise12</code><br><code class="pill-exercise pill-desc">Type Hinting</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="standard-library-overview">Standard Library Overview</h1>
<ul>
<li>Python ships with a large standard library :
<ul>
<li>Available on every installation, with nothing to add and nothing to pin</li>
<li>Reach for it before reaching for a third party package</li>
</ul>
</li>
<li>The modules this appendix covers :
<ul>
<li><code>datetime</code> , dates, times and the arithmetic between them</li>
<li><code>json</code> , reading and writing the interchange format of the web</li>
<li><code>re</code> , regular expressions for searching and rewriting text</li>
<li><code>sys.argv</code> , inspecting command-line arguments passed to a script</li>
</ul>
</li>
<li><code>pytest</code> is third-party software for testing with plain assertions :
<ul>
<li>Exercise 13 installs it with <code>uv add --dev pytest</code></li>
</ul>
</li>
<li>Others worth knowing about :
<ul>
<li><code>pathlib</code> for filesystem paths, <code>csv</code> for tabular files</li>
<li><code>collections</code> for counters, deques and default dictionaries</li>
<li><code>itertools</code> for combinations, grouping and infinite sequences</li>
<li><code>argparse</code> for flags, options and generated help messages</li>
</ul>
</li>
<li>Full reference at <code>https://docs.python.org/3/library/</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="236" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="236" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="the-datetime-module">The datetime Module</h1>
<ul>
<li>Three types cover almost every need :
<ul>
<li><code>date</code> is a calendar day with no time on it</li>
<li><code>time</code> is a time of day with no date on it</li>
<li><code>datetime</code> is both together</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> datetime </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> date</span><span style="color:#212121">,</span><span style="color:#24292EFF"> datetime</span><span style="color:#212121">,</span><span style="color:#24292EFF"> time</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">photo_day </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> date</span><span style="color:#212121">(</span><span style="color:#1976D2">2026</span><span style="color:#212121">, </span><span style="color:#1976D2">8</span><span style="color:#212121">, </span><span style="color:#1976D2">15</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">midday </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> time</span><span style="color:#212121">(</span><span style="color:#1976D2">12</span><span style="color:#212121">, </span><span style="color:#1976D2">30</span><span style="color:#212121">, </span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">taken_at </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> datetime</span><span style="color:#212121">(</span><span style="color:#1976D2">2026</span><span style="color:#212121">, </span><span style="color:#1976D2">8</span><span style="color:#212121">, </span><span style="color:#1976D2">15</span><span style="color:#212121">, </span><span style="color:#1976D2">12</span><span style="color:#212121">, </span><span style="color:#1976D2">30</span><span style="color:#212121">, </span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(taken_at.year, taken_at.month, taken_at.day)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(taken_at.</span><span style="color:#6F42C1">weekday</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # Monday is 0, so this prints 5</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The current moment comes from the class itself :
<ul>
<li><code>date.today()</code> and <code>datetime.now()</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">datetime_basics</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="237" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="237" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="formatting-and-parsing-dates">Formatting and Parsing Dates</h1>
<ul>
<li><code>strftime</code> formats a datetime as text, <code>strptime</code> reads text back :
<ul>
<li>The <code>f</code> is for format, the <code>p</code> is for parse</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">taken_at</span><span style="color:#212121">.</span><span style="color:#6F42C1">strftime</span><span style="color:#212121">(</span><span style="color:#22863A">"</span><span style="color:#1976D2">%d</span><span style="color:#22863A">-%m-%Y %H:%M"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 15-08-2026 12:30</span></span>
<span class="line"><span style="color:#24292EFF">taken_at</span><span style="color:#212121">.</span><span style="color:#6F42C1">strftime</span><span style="color:#212121">(</span><span style="color:#22863A">"%A </span><span style="color:#1976D2">%d</span><span style="color:#22863A"> %B %Y"</span><span style="color:#212121">)</span><span style="color:#4a9c59">     # Saturday 15 August 2026</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">datetime</span><span style="color:#212121">.</span><span style="color:#6F42C1">strptime</span><span style="color:#212121">(</span><span style="color:#22863A">"24-12-2026 18:00"</span><span style="color:#212121">, </span><span style="color:#22863A">"</span><span style="color:#1976D2">%d</span><span style="color:#22863A">-%m-%Y %H:%M"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Common directives :
<ul>
<li><code>%Y</code> four digit year, <code>%m</code> month, <code>%d</code> day</li>
<li><code>%H</code> hour, <code>%M</code> minute, <code>%S</code> second</li>
<li><code>%A</code> weekday name, <code>%B</code> month name</li>
</ul>
</li>
<li>ISO 8601 needs no format string in either direction :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">taken_at</span><span style="color:#212121">.</span><span style="color:#6F42C1">isoformat</span><span style="color:#212121">()</span><span style="color:#4a9c59">  # 2026-08-15T12:30:00</span></span>
<span class="line"><span style="color:#24292EFF">datetime</span><span style="color:#212121">.</span><span style="color:#6F42C1">fromisoformat</span><span style="color:#212121">(</span><span style="color:#22863A">"2026-12-24T18:00:00"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">datetime_format</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="238" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="238" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="date-arithmetic-with-timedelta">Date Arithmetic with timedelta</h1>
<ul>
<li>Subtracting two dates gives a <code>timedelta</code>, a duration :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> datetime </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> date</span><span style="color:#212121">,</span><span style="color:#24292EFF"> timedelta</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">start </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> date</span><span style="color:#212121">(</span><span style="color:#1976D2">2026</span><span style="color:#212121">, </span><span style="color:#1976D2">8</span><span style="color:#212121">, </span><span style="color:#1976D2">15</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">end </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> date</span><span style="color:#212121">(</span><span style="color:#1976D2">2026</span><span style="color:#212121">, </span><span style="color:#1976D2">12</span><span style="color:#212121">, </span><span style="color:#1976D2">24</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">span </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> end </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF"> start</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(span.days)</span><span style="color:#4a9c59">  # 131</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Adding a <code>timedelta</code> to a date gives another date :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">start </span><span style="color:#D32F2F">+</span><span style="color:#6F42C1"> timedelta</span><span style="color:#212121">(weeks</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span><span style="color:#4a9c59">   # 2026-08-22</span></span>
<span class="line"><span style="color:#24292EFF">start </span><span style="color:#D32F2F">+</span><span style="color:#6F42C1"> timedelta</span><span style="color:#212121">(days</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">100</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 2026-11-23</span></span>
<span class="line"><span style="color:#24292EFF">start </span><span style="color:#D32F2F">-</span><span style="color:#6F42C1"> timedelta</span><span style="color:#212121">(days</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span><span style="color:#4a9c59">    # 2026-08-14</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A <code>timedelta</code> is built from any combination of units :
<ul>
<li><code>days</code> , <code>hours</code> , <code>minutes</code> , <code>seconds</code> , <code>weeks</code></li>
<li>It normalises itself, so 25 hours becomes one day and one hour</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">datetime_arithmetic</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="239" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="239" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="the-json-module">The json Module</h1>
<ul>
<li>JSON stores structured text exchanged by programs :
<ul>
<li><code>dumps</code> converts a Python value to JSON text; <code>loads</code> reads it back</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> json</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"name"</span><span style="color:#212121">:</span><span style="color:#22863A"> "Night drive"</span><span style="color:#212121">,</span><span style="color:#22863A"> "tracks"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span><span style="color:#22863A"> "cover"</span><span style="color:#212121">:</span><span style="color:#1976D2"> None</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> json</span><span style="color:#212121">.</span><span style="color:#6F42C1">dumps</span><span style="color:#212121">(playlist, indent</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">2</span><span style="color:#212121">, sort_keys</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">restored </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> json</span><span style="color:#212121">.</span><span style="color:#6F42C1">loads</span><span style="color:#212121">(text)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>{</span></span>
<span class="line"><span>  "cover": null,</span></span>
<span class="line"><span>  "name": "Night drive",</span></span>
<span class="line"><span>  "tracks": [</span></span>
<span class="line"><span>    "Imagine",</span></span>
<span class="line"><span>    "Yesterday"</span></span>
<span class="line"><span>  ]</span></span>
<span class="line"><span>}</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>indent</code> makes the output easier to read; <code>sort_keys</code> orders dictionary keys</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">json_strings</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="240" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="240" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="reading-and-writing-json-files">Reading and Writing JSON Files</h1>
<ul>
<li><code>dump</code> and <code>load</code> work with file objects :
<ul>
<li>The names are the string versions without the trailing <code>s</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> json</span></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"name"</span><span style="color:#212121">:</span><span style="color:#22863A"> "Night drive"</span><span style="color:#212121">,</span><span style="color:#22863A"> "tracks"</span><span style="color:#212121">:</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span><span style="color:#22863A"> "cover"</span><span style="color:#212121">:</span><span style="color:#1976D2"> None</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">path </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#22863A">"playlist.json"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> path</span><span style="color:#212121">.</span><span style="color:#6F42C1">open</span><span style="color:#212121">(</span><span style="color:#22863A">"w"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> file</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    json</span><span style="color:#212121">.</span><span style="color:#6F42C1">dump</span><span style="color:#212121">(playlist, file, indent</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">2</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> path</span><span style="color:#212121">.</span><span style="color:#6F42C1">open</span><span style="color:#212121">(encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> file</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    restored </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> json</span><span style="color:#212121">.</span><span style="color:#6F42C1">load</span><span style="color:#212121">(file)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(restored[</span><span style="color:#22863A">"tracks"</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Explicit UTF-8 keeps playlist files consistent across machines</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">json_files</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="241" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="241" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="json-and-python-types">JSON and Python Types</h1>
<ul>
<li>The mapping between the two type systems is not quite one to one :</li>
</ul>
<table>
<thead>
<tr>
<th>Python</th>
<th>JSON</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>dict</code></td>
<td>object</td>
</tr>
<tr>
<td><code>list</code> , <code>tuple</code></td>
<td>array</td>
</tr>
<tr>
<td><code>str</code></td>
<td>string</td>
</tr>
<tr>
<td><code>int</code> , <code>float</code></td>
<td>number</td>
</tr>
<tr>
<td><code>True</code> / <code>False</code></td>
<td><code>true</code> / <code>false</code></td>
</tr>
<tr>
<td><code>None</code></td>
<td><code>null</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Note what this costs on a round trip :
<ul>
<li>A <code>tuple</code> comes back as a <code>list</code></li>
<li>Dictionary keys come back as strings, whatever they went in as</li>
<li><code>set</code>, <code>datetime</code> and your own classes are not serialisable at all</li>
</ul>
</li>
<li>For those, convert to a supported type first, or pass <code>default=</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="242" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="242" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="regular-expressions-with-re">Regular Expressions with re</h1>
<ul>
<li>A regular expression is a pattern describing a set of strings :
<ul>
<li>Written as a raw string, <code>r&quot;...&quot;</code>, so backslashes reach the engine intact</li>
</ul>
</li>
<li>The character classes that do most of the work :
<ul>
<li><code>\d</code> digit, <code>\w</code> word character, <code>\s</code> whitespace</li>
<li><code>.</code> any character, <code>[abc]</code> one of these, <code>[^abc]</code> none of these</li>
</ul>
</li>
<li>The repetition operators :
<ul>
<li><code>*</code> zero or more, <code>+</code> one or more, <code>?</code> zero or one</li>
<li><code>{3}</code> exactly three, <code>{2,4}</code> between two and four</li>
</ul>
</li>
<li>Anchors tie a pattern to a position :
<ul>
<li><code>^</code> start of the string, <code>$</code> end of the string, <code>\b</code> word boundary</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">r</span><span style="color:#22863A">"\d{4}-\d{2}-\d{2}"</span><span style="color:#4a9c59">   # a date like 2026-08-15</span></span>
<span class="line"><span style="color:#D32F2F">r</span><span style="color:#22863A">"^IMG_\d{4}\.jpg$"</span><span style="color:#4a9c59">   # a photo filename like IMG_0421.jpg</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="243" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="243" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="matching-and-searching">Matching and Searching</h1>
<ul>
<li>Regex functions differ in where and how much they match :
<ul>
<li><code>match</code> starts at position zero; <code>search</code> scans the whole string</li>
<li><code>findall</code> returns all matches; <code>fullmatch</code> requires the whole string</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> re</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Playing Imagine (183s), Yesterday (125s)"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">match</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"Playing"</span><span style="color:#212121">, text) </span><span style="color:#D32F2F">is</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> None</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">match</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">, text) </span><span style="color:#D32F2F">is</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> None</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">search</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">, text) </span><span style="color:#D32F2F">is</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> None</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">findall</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"</span><span style="color:#1976D2">\d</span><span style="color:#D32F2F">+</span><span style="color:#22863A">"</span><span style="color:#212121">, text))</span><span style="color:#4a9c59">  # ['183', '125']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">fullmatch</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"IMG_</span><span style="color:#1976D2">\d</span><span style="color:#D32F2F">{4}</span><span style="color:#22863A">\.jpg"</span><span style="color:#212121">, </span><span style="color:#22863A">"IMG_0421.jpg"</span><span style="color:#212121">) </span><span style="color:#D32F2F">is</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> None</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">fullmatch</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"IMG_</span><span style="color:#1976D2">\d</span><span style="color:#D32F2F">{4}</span><span style="color:#22863A">\.jpg"</span><span style="color:#212121">, </span><span style="color:#22863A">"notes.txt"</span><span style="color:#212121">) </span><span style="color:#D32F2F">is</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> None</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>match</code>, <code>search</code> and <code>fullmatch</code> return a match object or <code>None</code></li>
<li>Flags include <code>re.IGNORECASE</code>, <code>re.MULTILINE</code> and <code>re.DOTALL</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">regex_search</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="244" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="244" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="groups-and-capturing">Groups and Capturing</h1>
<ul>
<li>Parentheses capture useful parts of a player log entry :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> re</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">line </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "12:30 PLAY Imagine"</span></span>

<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> match </span><span style="color:#D32F2F">is</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> None</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(match.</span><span style="color:#6F42C1">group</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 12:30 PLAY Imagine</span></span>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="substitution-and-splitting">Substitution and Splitting</h1>
<ul>
<li><code>sub</code> replaces matching text :
<ul>
<li>A backreference such as <code>\1</code> reuses a captured group</li>
</ul>
</li>
<li><code>re.split</code> uses a pattern to separate items :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> re</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "IMG_0421.JPG; IMG_0422.JPG"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">sub</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"IMG_</span><span style="color:#1976D2">\d</span><span style="color:#D32F2F">{4}</span><span style="color:#22863A">\.JPG"</span><span style="color:#212121">, </span><span style="color:#22863A">"[photo]"</span><span style="color:#212121">, text))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">sub</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"IMG_</span><span style="color:#1976D2">(\d</span><span style="color:#D32F2F">{4}</span><span style="color:#1976D2">)</span><span style="color:#22863A">\.JPG"</span><span style="color:#212121">, </span><span style="color:#D32F2F">r</span><span style="color:#22863A">"photo_\1</span><span style="color:#1976D2">.</span><span style="color:#22863A">jpg"</span><span style="color:#212121">, text))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">split</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">";</span><span style="color:#1976D2">\s</span><span style="color:#D32F2F">*</span><span style="color:#22863A">"</span><span style="color:#212121">, text))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>[photo]; [photo]</span></span>
<span class="line"><span>photo_0421.jpg; photo_0422.jpg</span></span>
<span class="line"><span>['IMG_0421.JPG', 'IMG_0422.JPG']</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The identifier stays available when a photo filename is reformatted</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">regex_sub</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="command-line-arguments-with-sysargv">Command-Line Arguments with sys.argv</h1>
<ul>
<li><code>sys.argv</code> contains the arguments passed to a script :
<ul>
<li>Position <code>0</code> is the script path; later positions contain its arguments</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sys</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Script: </span><span style="color:#1976D2">{</span><span style="color:#212121">sys.argv[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">playlist_file </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sys</span><span style="color:#212121">.</span><span style="color:#24292EFF">argv</span><span style="color:#212121">[</span><span style="color:#1976D2">1</span><span style="color:#212121">]</span><span style="color:#D32F2F"> if</span><span style="color:#6F42C1"> len</span><span style="color:#212121">(sys.argv)</span><span style="color:#D32F2F"> ></span><span style="color:#1976D2"> 1</span><span style="color:#D32F2F"> else</span><span style="color:#22863A"> "night-drive.json"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Playlist file: </span><span style="color:#1976D2">{</span><span style="color:#212121">playlist_file</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> 09_sys_argv.py</span><span style="color:#2B5581"> warm-up.json</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Arguments arrive as strings; convert numeric values explicitly</li>
<li><code>argparse</code> adds option flags, defaults and generated help</li>
</ul>

<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">sys_argv</code></p>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="testing-with-pytest">Testing with pytest</h1>
<ul>
<li>Tests can check the duration formatter already used by the player :
<ul>
<li>Each test function starts with <code>test_</code></li>
<li>A plain <code>assert</code> states the expected result</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> test_minutes_and_seconds</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    assert</span><span style="color:#6F42C1"> format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">)</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "3:42"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> test_exact_minute</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    assert</span><span style="color:#6F42C1"> format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">60</span><span style="color:#212121">)</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "1:00"</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> --dev</span><span style="color:#2B5581"> pytest</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> pytest</span><span style="color:#2B5581"> 10_pytest_basic.py</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">pytest_basic</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>

<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> test_exact_minute</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    assert</span><span style="color:#6F42C1"> format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">60</span><span style="color:#212121">)</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "1:00"</span></span>
<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="exceptions-and-parametrized-tests">Exceptions and Parametrized Tests</h1>
<ul>
<li><code>pytest.raises</code> checks a failure that the parser must report</li>
<li><code>parametrize</code> repeats one test with several inputs :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> test_invalid_duration</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    with</span><span style="color:#24292EFF"> pytest</span><span style="color:#212121">.</span><span style="color:#6F42C1">raises</span><span style="color:#212121">(</span><span style="color:#1976D2">ValueError</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        parse_duration</span><span style="color:#212121">(</span><span style="color:#22863A">"3:99"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">@pytest</span><span style="color:#212121">.</span><span style="color:#6F42C1">mark</span><span style="color:#212121">.</span><span style="color:#6F42C1">parametrize</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    (</span><span style="color:#22863A">"seconds"</span><span style="color:#212121">, </span><span style="color:#22863A">"expected"</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#212121">    [(</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#22863A">"0:00"</span><span style="color:#212121">), (</span><span style="color:#1976D2">59</span><span style="color:#212121">, </span><span style="color:#22863A">"0:59"</span><span style="color:#212121">), (</span><span style="color:#1976D2">60</span><span style="color:#212121">, </span><span style="color:#22863A">"1:00"</span><span style="color:#212121">), (</span><span style="color:#1976D2">3600</span><span style="color:#212121">, </span><span style="color:#22863A">"60:00"</span><span style="color:#212121">)],</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> test_duration_display</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#212121">,</span><span style="color:#FF9800"> expected</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    assert</span><span style="color:#6F42C1"> format_duration</span><span style="color:#212121">(seconds)</span><span style="color:#D32F2F"> ==</span><span style="color:#24292EFF"> expected</span></span>
<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#234"><span class="ml-tag">python</span>Python Libraries</a></div>
<h1 id="summary--python-libraries">Summary : Python Libraries</h1>
<ul>
<li><code>datetime</code> covers dates, times and durations :
<ul>
<li><code>date</code> , <code>time</code> , <code>datetime</code> and <code>timedelta</code></li>
<li><code>strftime</code> formats and <code>strptime</code> parses using a pattern</li>
<li><code>isoformat()</code> formats; <code>fromisoformat()</code> parses, without a format pattern</li>
</ul>
</li>
<li><code>json</code> converts between Python objects and JSON text :
<ul>
<li><code>dumps</code> and <code>loads</code> for strings, <code>dump</code> and <code>load</code> for files</li>
<li>A tuple returns as a list, and keys return as strings</li>
</ul>
</li>
<li><code>re</code> searches and rewrites text with patterns :
<ul>
<li><code>match</code> at the start, <code>search</code> anywhere, <code>findall</code> for every hit</li>
<li>Parentheses capture, and <code>sub</code> replaces using what was captured</li>
</ul>
</li>
<li><code>sys.argv</code> exposes command-line arguments as a list of strings :
<ul>
<li><code>argparse</code> is the next step for options, flags and automatic help</li>
</ul>
</li>
<li><code>pytest</code> runs checks over the code automatically :
<ul>
<li>Test functions named <code>test_</code> and plain <code>assert</code> statements</li>
<li><code>pytest.raises</code> for exceptions and <code>@pytest.mark.parametrize</code> for tables</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise13</code><br><code class="pill-exercise pill-desc">Python Libraries</code></p>
</blockquote>
</section>
