<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="scope-of-variables">Scope of Variables</h1>
<ul>
<li>Scope determines where an identifier can be accessed :
<ul>
<li>Variables created inside a function are local to that function</li>
<li>Variables created outside any function belong to the module's global scope</li>
</ul>
</li>
<li>Python looks up names in four scopes, in LEGB order :</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 746 / 88"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 746 88" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M175.62,44L216.62,44" /><path class="pele-marker" d="M223.62,44L215.62,47.36L215.62,40.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_C_0"><path d="M378.8,44L419.8,44" /><path class="pele-marker" d="M426.8,44L418.8,47.36L418.8,40.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_C_D_0"><path d="M541.95,44L582.95,44" /><path class="pele-marker" d="M589.95,44L581.95,47.36L581.95,40.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(91.81,44)"><rect x="-83.81" y="-36" width="167.62" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Local</tspan><tspan x="0" y="17.6">inside this function</tspan></text></g><g class="pele-node pele-shape-rect" data-id="B" transform="translate(301.21,44)"><rect x="-77.59" y="-36" width="155.18" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Enclosing</tspan><tspan x="0" y="17.6">an outer function</tspan></text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(484.38,44)"><rect x="-57.58" y="-36" width="115.15" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Global</tspan><tspan x="0" y="17.6">the module</tspan></text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(663.54,44)"><rect x="-73.58" y="-36" width="147.17" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Built-in</tspan><tspan x="0" y="17.6">len, print, range</tspan></text></g></g></svg></div>
<ul>
<li>The first scope that contains the name wins; the rest are not searched</li>
<li>Local variables :
<ul>
<li>Exist only while the function is executing</li>
<li>Cannot be read or modified from outside the function</li>
</ul>
</li>
<li>Global variables :
<ul>
<li>Can be read from anywhere within the module</li>
<li>Rebinding a global name inside a function requires <code>global</code></li>
<li>Mutating the object it names, such as calling <code>items.append(x)</code>, does not</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="112" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="112" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="example-variable-scope">Example Variable Scope</h1>
<ul>
<li>A local assignment affects only the current call :
<ul>
<li><code>preview_volume</code> shows a local volume without changing the configured value</li>
</ul>
</li>
<li><code>global</code> makes an assignment update the module's name :
<ul>
<li><code>set_limit</code> changes the shared queue limit</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">volume </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 50</span></span>
<span class="line"><span style="color:#24292EFF">queue_limit </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 20</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> preview_volume</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    volume </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 10</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Preview volume: </span><span style="color:#1976D2">{</span><span style="color:#212121">volume</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> set_limit</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    global</span><span style="color:#24292EFF"> queue_limit</span></span>
<span class="line"><span style="color:#24292EFF">    queue_limit </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 30</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">preview_volume</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Current volume: </span><span style="color:#1976D2">{</span><span style="color:#212121">volume</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">set_limit</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Queue limit: </span><span style="color:#1976D2">{</span><span style="color:#212121">queue_limit</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo15</code><br><code class="pill-demo pill-desc">variablescope</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="113" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="113" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="running-and-importing-a-file">Running and Importing a File</h1>
<ul>
<li>Importing a Python file runs its top-level statements :
<ul>
<li>Function definitions make functions available without calling them</li>
<li>An unguarded call would also run during the import</li>
</ul>
</li>
<li>Python sets <code>__name__</code> to <code>&quot;__main__&quot;</code> when the file is run directly</li>
<li>A guard starts the program only for direct execution :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> main</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playlist ready"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#1976D2"> __name__</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "__main__"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    main</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Importing the file defines <code>main</code> and skips its guarded call</li>
<li><code>from report import main</code> imports <code>main</code> from a file named <code>report.py</code></li>
<li>A fresh interpreter reads saved changes; an existing import is cached</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo16</code><br><code class="pill-demo pill-desc">guarded_program</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="114" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="114" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="summary--functions">Summary : Functions</h1>
<ul>
<li>Functions are reusable blocks of code defined with <code>def</code> :
<ul>
<li>Parameters and return types are documented with type annotations</li>
</ul>
</li>
<li>Python passes arguments by object reference :
<ul>
<li>Mutating an argument affects the caller; rebinding a parameter name does not</li>
</ul>
</li>
<li>Flexible argument handling :
<ul>
<li>Positional, keyword, default values, <code>*args</code> and <code>**kwargs</code></li>
</ul>
</li>
<li>Small anonymous functions use <code>lambda</code> :
<ul>
<li>Ideal as short key functions passed to <code>sorted()</code></li>
</ul>
</li>
<li>Functions are values :
<ul>
<li>A dictionary of functions is a dispatch table, <code>table[key](argument)</code></li>
</ul>
</li>
<li>Variables follow LEGB scope lookup :
<ul>
<li>Local, Enclosing, Global and Built-in scopes</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise05</code><br><code class="pill-exercise pill-desc">Functions</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="modules">Modules</h1>
<ul>
<li>A module is a Python file containing related functions and variables</li>
<li>Other files import the module to reuse those definitions</li>
<li><code>timing.py</code> holds the duration formatter used by a music player :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">SECONDS_PER_MINUTE</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 60</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#24292EFF"> SECONDS_PER_MINUTE</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#24292EFF"> SECONDS_PER_MINUTE</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The module name is the filename without <code>.py</code></li>
<li>Keep <code>timing.py</code> beside the script that imports it</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="117" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="117" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="import-statement">import Statement</h1>
<ul>
<li><code>import timing</code> loads the module and binds the name <code>timing</code>.</li>
<li>The module prefix identifies where a function or constant comes from.</li>
<li><code>as</code> gives a module an alternative name in the calling file.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> timing</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(timing.</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 3:42</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(timing.</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">65</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 1:05</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> timing </span><span style="color:#D32F2F">as</span><span style="color:#24292EFF"> clock</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(clock.SECONDS_PER_MINUTE)</span><span style="color:#4a9c59">  # 60</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">importmodule</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="118" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="118" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="fromimport-statement">from...import Statement</h1>
<ul>
<li><code>from ... import</code> binds selected names directly in the calling file.</li>
<li>Call the function without the module prefix.</li>
<li>Both import forms load the same module; they differ in the names they bind.</li>
<li>Explicit names keep dependencies visible; avoid <code>from timing import *</code>.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> timing </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> SECONDS_PER_MINUTE</span><span style="color:#212121">,</span><span style="color:#24292EFF"> format_duration</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 3:42</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(SECONDS_PER_MINUTE)</span><span style="color:#4a9c59">  # 60</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">usingfromimport</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="119" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="119" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="locating-modules">Locating Modules</h1>
<ul>
<li>Python searches the directories in <code>sys.path</code> for local modules.</li>
<li>A script's directory is searched before installed packages.</li>
<li>With <code>python -m</code>, the current directory is searched first.</li>
<li>Keep <code>timing.py</code> beside the script that imports it.</li>
<li>A file named <code>json.py</code> can hide the standard library's <code>json</code> module.</li>
<li><code>ModuleNotFoundError</code> means the requested module could not be found.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sys</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(sys.path[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(sys.executable)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">pythonpath</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="120" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="120" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="using-modules">Using Modules</h1>
<ul>
<li>A playlist display reuses the formatter without copying its calculation :
<ul>
<li>The calling script supplies track titles and lengths</li>
<li>The module formats each length consistently</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> timing </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> format_duration</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">tracks </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 125</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> tracks</span><span style="color:#212121">.</span><span style="color:#6F42C1">items</span><span style="color:#212121">():</span></span>
<span class="line"><span style="color:#24292EFF">    label </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> format_duration</span><span style="color:#212121">(seconds)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#212121">label</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Imagine: 3:03</span></span>
<span class="line"><span>Yesterday: 2:05</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Updating the formatter in one module updates every caller</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">usingmodules</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="121" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="121" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="dir-function">dir Function</h1>
<ul>
<li><code>dir(module)</code> lists the names available on a module.</li>
<li>Explore a module in the REPL before calling an unfamiliar function.</li>
<li>Names starting and ending with double underscores include module metadata.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> timing</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"format_duration"</span><span style="color:#D32F2F"> in</span><span style="color:#6F42C1"> dir</span><span style="color:#212121">(timing))</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"SECONDS_PER_MINUTE"</span><span style="color:#D32F2F"> in</span><span style="color:#6F42C1"> dir</span><span style="color:#212121">(timing))</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">usingdir</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="122" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="122" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="packages-in-python">Packages in Python</h1>
<ul>
<li>A package groups related modules in one directory.</li>
<li>A regular package contains an <code>__init__.py</code> file; it may be empty.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>player/</span></span>
<span class="line"><span>├── __init__.py</span></span>
<span class="line"><span>├── timing.py     the format_duration function</span></span>
<span class="line"><span>└── __main__.py     the command-line entry point</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Move the existing <code>timing.py</code> into <code>player/</code> to group reporting code.</li>
<li><code>__init__.py</code> runs when the package is first imported.</li>
<li>A module's top-level code runs on its first import in a Python process.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="123" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="123" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="explicit-import-of-package-modules">Explicit Import of Package Modules</h1>
<ul>
<li>Dots in an import follow directories in the package.</li>
<li><code>player.timing</code> refers to <code>player/timing.py</code>.</li>
<li>The full call is <code>package.module.function()</code>.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> player</span><span style="color:#212121">.</span><span style="color:#24292EFF">timing</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(player.timing.</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 3:42</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">explicitimport</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="124" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="124" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="importing-names-from-a-package">Importing Names from a Package</h1>
<ul>
<li>A package can expose selected functions from its internal modules.</li>
<li><code>player/__init__.py</code> contains this import :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> player</span><span style="color:#212121">.</span><span style="color:#24292EFF">timing </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> format_duration</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Callers can then use the shorter package-level name.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> player</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(player.</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 3:42</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> player </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> format_duration</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">65</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 1:05</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">implicitimport</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="125" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="125" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="running-a-module-directly">Running a Module Directly</h1>
<ul>
<li><code>__name__</code> is <code>&quot;__main__&quot;</code> when a file runs directly.</li>
<li>When imported, <code>__name__</code> is the module's name.</li>
<li>The guard runs <code>main()</code> only for direct execution.</li>
<li>Importing defines <code>main</code> without printing the playlist display.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> timing </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> format_duration</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> main</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Duration: </span><span style="color:#1976D2">{</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">)</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#1976D2"> __name__</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "__main__"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    main</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">testharness</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="126" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="126" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="running-packages-with-python--m">Running Packages with python -m</h1>
<ul>
<li>A package's <code>__main__.py</code> is its entry point.</li>
<li>The following code belongs in <code>player/__main__.py</code>.</li>
<li>Run from the directory containing <code>player/</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> -m</span><span style="color:#2B5581"> player</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> player</span><span style="color:#212121">.</span><span style="color:#24292EFF">timing </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> format_duration</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> main</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Duration: </span><span style="color:#1976D2">{</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">)</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#1976D2"> __name__</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "__main__"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    main</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">package_main</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="127" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="127" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="installing-packages">Installing Packages</h1>
<ul>
<li>Third-party packages are hosted on PyPI and installed with <code>uv add</code> :
<ul>
<li><code>uv add package</code> installs a package and records it in <code>pyproject.toml</code></li>
<li><code>uv add --dev package</code> adds a development tool, such as <code>pytest</code></li>
<li><code>uv remove package</code> uninstalls a dependency</li>
</ul>
</li>
<li>Two files track dependencies and belong in version control :
<ul>
<li><code>pyproject.toml</code> declares the project's direct requirements</li>
<li><code>uv.lock</code> records the exact resolved versions for reproducibility</li>
</ul>
</li>
<li>Anyone with the project can reproduce the exact environment :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> requests</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#22863A"> "requests>=2.28,&#x3C;3"</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> --dev</span><span style="color:#2B5581"> pytest</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> sync</span><span style="color:#4a9c59">          # install exactly what uv.lock says</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> remove</span><span style="color:#2B5581"> requests</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="128" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="128" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="virtual-environments">Virtual Environments</h1>
<ul>
<li>Virtual environments isolate dependencies per project :
<ul>
<li>Each project has its own libraries and Python executable</li>
<li>Different projects can require different versions without conflict</li>
</ul>
</li>
<li><code>uv</code> manages virtual environments automatically :
<ul>
<li><code>.venv/</code> is created on the first <code>uv run</code> or <code>uv add</code></li>
<li>Packages are installed into <code>.venv/</code> without touching system Python</li>
</ul>
</li>
<li>There is no environment to activate manually :
<ul>
<li><code>uv run</code> puts the project's <code>.venv</code> in front for the command</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>myproject/</span></span>
<span class="line"><span>├── pyproject.toml   dependencies declared for this project</span></span>
<span class="line"><span>├── uv.lock          pinned versions of all installed packages</span></span>
<span class="line"><span>└── .venv/           created on the first uv run or uv add</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Run code through <code>uv run</code>, which uses the project's interpreter :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> app.py</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Without <code>uv</code>, environments are made by <code>python -m venv .venv</code> and activated by hand</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="129" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="129" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#115"><span class="ml-tag">python</span>Modules</a></div>
<h1 id="summary--modules">Summary : Modules</h1>
<ul>
<li>Modules organize code into reusable files :
<ul>
<li>A module is a <code>.py</code> file defining functions, classes and variables</li>
<li><code>import</code> and <code>from ... import</code> bring names into the calling file</li>
</ul>
</li>
<li>Python locates modules using <code>sys.path</code> :
<ul>
<li>Script directory (current directory for REPL or <code>-m</code>), then <code>PYTHONPATH</code> and defaults</li>
<li><code>dir()</code> lists the names defined or imported in a module</li>
</ul>
</li>
<li>Packages group modules into directories with <code>__init__.py</code> :
<ul>
<li>Modules inside packages use dotted import paths</li>
<li><code>python -m package</code> runs a package via its <code>__main__.py</code></li>
</ul>
</li>
<li>Executing versus importing :
<ul>
<li><code>if __name__ == &quot;__main__&quot;:</code> guards code that only runs when executed directly</li>
</ul>
</li>
<li>Dependency and environment management :
<ul>
<li><code>uv add</code> installs packages into an automatic <code>.venv</code></li>
<li><code>uv run</code> executes commands with the project's environment active</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise06</code><br><code class="pill-exercise pill-desc">Modules</code></p>
</blockquote>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="131" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="131" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="list-comprehensions">List Comprehensions</h1>
<ul>
<li>A comprehension builds a new list by evaluating an expression for each item.</li>
<li>Read the <code>for</code> part first, then the expression on its left.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filenames</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"cover"</span><span style="color:#212121">,</span><span style="color:#22863A"> "stage"</span><span style="color:#212121">,</span><span style="color:#22863A"> "crowd"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">photo_files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">.jpg"</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> filenames]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo_files)</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg', 'crowd.jpg']</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">list_comprehensions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="132" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="132" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="syntax-list-comprehensions">Syntax List Comprehensions</h1>
<ul>
<li>A comprehension has the form <code>[expression for name in source]</code>.</li>
<li><code>source</code> supplies the items; <code>name</code> receives one item at a time.</li>
<li><code>expression</code> computes the value added to the new list.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filenames</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"cover"</span><span style="color:#212121">,</span><span style="color:#22863A"> "stage"</span><span style="color:#212121">,</span><span style="color:#22863A"> "crowd"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">photo_files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> filenames</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    photo_files</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">.jpg"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo_files)</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg', 'crowd.jpg']</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">photo_files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">.jpg"</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> filenames]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo_files)</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg', 'crowd.jpg']</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Both forms create a new list and leave <code>filenames</code> unchanged.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="133" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="133" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="filtered-list-comprehension">Filtered List Comprehension</h1>
<ul>
<li>An optional <code>if</code> keeps only the items that satisfy its condition.</li>
<li>These two forms produce the same list :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filenames </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"cover.jpg"</span><span style="color:#212121">,</span><span style="color:#22863A"> "notes.txt"</span><span style="color:#212121">,</span><span style="color:#22863A"> "stage.jpg"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">photo_files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> filenames</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> name</span><span style="color:#212121">.</span><span style="color:#6F42C1">endswith</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#24292EFF">        photo_files</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(name)</span></span>

<span class="line"></span>
<span class="line"><span style="color:#24292EFF">photo_files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [name </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> filenames </span><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> name</span><span style="color:#212121">.</span><span style="color:#6F42C1">endswith</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">)</span><span style="color:#24292EFF">]</span></span>

<span class="line"></span></code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="134" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="134" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="nested-list-comprehensions">Nested List Comprehensions</h1>
<ul>
<li>A nested comprehension builds a list of lists, preserving the row structure.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">photo_sizes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [[</span><span style="color:#1976D2">18.2</span><span style="color:#212121">,</span><span style="color:#1976D2"> 19.6</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">20.1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 21.8</span><span style="color:#24292EFF">]]</span></span>
<span class="line"><span style="color:#24292EFF">rounded </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [[</span><span style="color:#6F42C1">round</span><span style="color:#212121">(value)</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> value </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> row] </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> photo_sizes]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rounded)</span><span style="color:#4a9c59">  # [[18, 20], [20, 22]]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Each row holds the photo sizes in megabytes from one album.</li>
<li>The inner comprehension rounds the photo sizes in one row.</li>
<li>The outer comprehension repeats that operation for every row.</li>
<li>Use an ordinary loop when the nesting needs more explanation.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">nested_comprehensions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="135" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="135" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="flattening-a-list-of-lists">Flattening a List of Lists</h1>
<ul>
<li>Two <code>for</code> clauses collect all the photo_sizes into one list.</li>
<li>Their order is the same as in the equivalent nested loops.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">photo_sizes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [[</span><span style="color:#1976D2">18.2</span><span style="color:#212121">,</span><span style="color:#1976D2"> 19.6</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">20.1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 21.8</span><span style="color:#24292EFF">]]</span></span>
<span class="line"><span style="color:#24292EFF">flat </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> photo_sizes</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> value </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> row</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">        flat</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(value)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(flat)</span><span style="color:#4a9c59">  # [18.2, 19.6, 20.1, 21.8]</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">flat </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [value </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> photo_sizes </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> value </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> row]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(flat)</span><span style="color:#4a9c59">  # [18.2, 19.6, 20.1, 21.8]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The result can be used to calculate a minimum or maximum across all albums.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="136" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="136" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="comprehension-features">Comprehension Features</h1>
<ul>
<li>Unpack each track into a title and duration inside the <code>for</code> part</li>
<li>The expression can call a function :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">tracks </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 183</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Respect"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 149</span><span style="color:#24292EFF">)]</span></span>
<span class="line"><span style="color:#24292EFF">labels </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">title</span><span style="color:#1976D2">}</span><span style="color:#22863A"> [</span><span style="color:#1976D2">{</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(seconds)</span><span style="color:#1976D2">}</span><span style="color:#22863A">]"</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> tracks]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(labels)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>['Imagine [3:03]', 'Yesterday [2:05]', 'Respect [2:29]']</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">comprehension_features</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="137" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="137" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="zip-function">Zip Function</h1>
<ul>
<li><code>zip</code> pairs each track title with its duration :
<ul>
<li>It stops when the shortest input runs out by default</li>
<li><code>strict=True</code> raises <code>ValueError</code> if their lengths differ</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">lengths </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">183</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#212121">,</span><span style="color:#1976D2"> 149</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">pairs </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> list</span><span style="color:#212121">(</span><span style="color:#6F42C1">zip</span><span style="color:#212121">(titles, lengths))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(pairs)</span></span>
<span class="line"><span style="color:#24292EFF">checked </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> list</span><span style="color:#212121">(</span><span style="color:#6F42C1">zip</span><span style="color:#212121">(titles, lengths, strict</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(checked)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>[('Imagine', 183), ('Yesterday', 125), ('Respect', 149)]</span></span>
<span class="line"><span>[('Imagine', 183), ('Yesterday', 125), ('Respect', 149)]</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">zip_function</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="138" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="138" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="dictionary-construction-with-zip">Dictionary Construction with zip</h1>
<ul>
<li><code>dict</code> builds a lookup from pairs of keys and values :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">lengths </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">183</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#212121">,</span><span style="color:#1976D2"> 149</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">durations </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> dict</span><span style="color:#212121">(</span><span style="color:#6F42C1">zip</span><span style="color:#212121">(titles, lengths))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>{'Imagine': 183, 'Yesterday': 125, 'Respect': 149}</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">dictionary_with_zip</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="139" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="139" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="dictionary-comprehensions">Dictionary Comprehensions</h1>
<ul>
<li><code>key: value</code> computes each dictionary entry</li>
<li>An optional <code>if</code> keeps only matching tracks :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">durations </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 125</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 149</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">short_tracks </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#24292EFF">title</span><span style="color:#212121">:</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> durations</span><span style="color:#212121">.</span><span style="color:#6F42C1">items</span><span style="color:#212121">()</span><span style="color:#D32F2F"> if</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">&#x3C;</span><span style="color:#1976D2"> 150</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(short_tracks)</span><span style="color:#4a9c59">  # {'Yesterday': 125, 'Respect': 149}</span></span>
<span class="line"><span style="color:#24292EFF">minutes </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#24292EFF">title</span><span style="color:#212121">:</span><span style="color:#6F42C1"> round</span><span style="color:#212121">(seconds </span><span style="color:#D32F2F">/</span><span style="color:#1976D2"> 60</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">)</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> durations</span><span style="color:#212121">.</span><span style="color:#6F42C1">items</span><span style="color:#212121">()}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(minutes)</span><span style="color:#4a9c59">  # {'Imagine': 3.05, 'Yesterday': 2.08, 'Respect': 2.48}</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">dictionary_comprehension</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="140" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="140" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="dictionary-from-keys">Dictionary from Keys</h1>
<ul>
<li><code>dict.fromkeys</code> gives each key the same value</li>
<li>A comprehension gives each playlist its own mutable track list :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">albums </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Night drive"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Warm-up"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">play_counts </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> dict</span><span style="color:#212121">.</span><span style="color:#6F42C1">fromkeys</span><span style="color:#212121">(albums, </span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(play_counts)</span></span>
<span class="line"><span style="color:#24292EFF">playlists</span><span style="color:#212121">:</span><span style="color:#24292EFF"> dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]]</span><span style="color:#D32F2F"> =</span><span style="color:#212121"> {</span><span style="color:#24292EFF">name</span><span style="color:#212121">:</span><span style="color:#24292EFF"> [] </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> albums</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">playlists</span><span style="color:#212121">[</span><span style="color:#22863A">"Night drive"</span><span style="color:#212121">].</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(playlists)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>{'Night drive': 0, 'Warm-up': 0}</span></span>
<span class="line"><span>{'Night drive': ['Imagine'], 'Warm-up': []}</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>dict.fromkeys(albums, [])</code> would make every album share one list</li>
</ul>

<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">dictionary_from_keys</code></p>
