<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="multiple-assignment">Multiple Assignment</h1>
<ul>
<li>Simultaneous assignment of values :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">a </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> b </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> c </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"></span></code></pre>
<ul>
<li>All three names are bound to the same integer object</li>
<li>Reassigning one name changes only that binding :
<ul>
<li>The other names still refer to the original object</li>
</ul>
</li>
<li>Integers are immutable :
<ul>
<li>Rebinding a name does not change the integer it previously named</li>
<li>The new binding may refer to an already existing object</li>
</ul>
</li>
<li>Assignment of multiple objects to multiple variables :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">a</span><span style="color:#212121">,</span><span style="color:#24292EFF"> b</span><span style="color:#212121">,</span><span style="color:#24292EFF"> c </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Two integer objects with values 1 and 2 :
<ul>
<li>Assigned to variables a and b</li>
</ul>
</li>
<li>One string object with the value <code>&quot;Imagine&quot;</code> :
<ul>
<li>Assigned to the variable c</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">multipleassignment</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="30" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="30" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="strong-typing">Strong Typing</h1>
<ul>
<li>An object's type determines which operations it supports :
<ul>
<li>A duration stored as a number can be added to another duration</li>
<li>A duration read as text must be converted before doing arithmetic</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>222 + 30       -> 252         integer addition</span></span>
<span class="line"><span>"222" + "30"   -> '22230'     string concatenation</span></span>
<span class="line"><span>"222" + 30     -> TypeError   string and integer do not add</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Python reports an unsupported combination instead of silently converting it</li>
<li>Common types include numbers, strings, lists, tuples, sets and dictionaries</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">strongtyping</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="31" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="31" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="annotating-variables">Annotating Variables</h1>
<ul>
<li>A variable annotation records what a value is intended to represent :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 222</span></span>
<span class="line"><span style="color:#24292EFF">size_mb</span><span style="color:#212121">:</span><span style="color:#1976D2"> float</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 8.5</span></span>
<span class="line"><span style="color:#24292EFF">title</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#D32F2F"> =</span><span style="color:#22863A"> "Imagine"</span></span>
<span class="line"><span style="color:#24292EFF">is_favourite</span><span style="color:#212121">:</span><span style="color:#1976D2"> bool</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> True</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An annotation does not change runtime behaviour :
<ul>
<li>It does not convert a value or prevent another type from being assigned</li>
<li>Editors and type checkers use it to find mismatches</li>
</ul>
</li>
<li>An annotation is useful when the intended type is unclear :
<ul>
<li><code>total_mb: float = 0</code> records that a total may later include fractions</li>
</ul>
</li>
<li>Collection annotations and function signatures are introduced with those subjects</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="32" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="32" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="python-numbers">Python Numbers</h1>
<ul>
<li>Number objects are immutable; assignment changes a name's binding :
<ul>
<li><code>previous</code> keeps the original duration when <code>duration</code> is rebound</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">duration </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 222</span></span>
<span class="line"><span style="color:#24292EFF">previous </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> duration</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">duration </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 185</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(previous, duration)</span><span style="color:#4a9c59">  # 222 185</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">del</span><span style="color:#24292EFF"> previous</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(duration)</span><span style="color:#4a9c59">  # 185</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>del</code> removes a name; it does not change the number</li>
<li>Other references keep their objects available</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="33" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="33" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="type-conversions">Type Conversions</h1>
<ul>
<li>Convert text explicitly when it needs to represent a number :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">seconds_text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "222"</span></span>
<span class="line"><span style="color:#24292EFF">seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(seconds_text)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(seconds </span><span style="color:#D32F2F">+</span><span style="color:#1976D2"> 30</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 252</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">float</span><span style="color:#212121">(</span><span style="color:#22863A">"8.5"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 8.5</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">int</span><span style="color:#212121">(</span><span style="color:#1976D2">8.9</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 8, the fractional part is discarded</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>bool</code> converts a value using its truth value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">bool</span><span style="color:#212121">(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">bool</span><span style="color:#212121">(</span><span style="color:#22863A">""</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">bool</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">bool</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">int</span><span style="color:#212121">(</span><span style="color:#1976D2">True</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 1</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">int</span><span style="color:#212121">(</span><span style="color:#1976D2">False</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 0</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Nonzero numbers and nonempty strings are truthy</li>
<li>Zero, empty strings, empty collections and <code>None</code> are falsy</li>
<li><code>int(True)</code> is <code>1</code>; <code>int(False)</code> is <code>0</code></li>
<li><code>int(&quot;ff&quot;, 16)</code> reads a number written in hexadecimal</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">numbertypeconversion</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="34" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="34" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="conversion-functions">Conversion Functions</h1>
<ul>
<li>Convert text to a number before using it in arithmetic :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">duration_text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "222"</span></span>
<span class="line"><span style="color:#24292EFF">duration </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(duration_text)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(duration </span><span style="color:#D32F2F">+</span><span style="color:#1976D2"> 30</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 252</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">str</span><span style="color:#212121">(duration))</span><span style="color:#4a9c59">  # 222</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">repr</span><span style="color:#212121">(</span><span style="color:#22863A">" Imagine "</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # ' Imagine '</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>str</code> produces display text; <code>repr</code> exposes quotes and whitespace</li>
<li>Other conversions are useful when inspecting character and byte values :</li>
</ul>
<table>
<thead>
<tr>
<th>Function</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>chr(65)</code></td>
<td><code>'A'</code></td>
</tr>
<tr>
<td><code>ord(&quot;A&quot;)</code></td>
<td><code>65</code></td>
</tr>
<tr>
<td><code>hex(65)</code></td>
<td><code>'0x41'</code></td>
</tr>
<tr>
<td><code>oct(65)</code></td>
<td><code>'0o101'</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">conversionfunctions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="35" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="35" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="built-in-number-functions">Built-in Number Functions</h1>
<table>
<thead>
<tr>
<th>Function</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>abs(x)</code></td>
<td>Absolute value of x: the (positive) distance between x and zero</td>
</tr>
<tr>
<td><code>ceil(x)</code></td>
<td>The ceiling of x: the smallest integer greater than or equal to x</td>
</tr>
<tr>
<td><code>exp(x)</code></td>
<td>The exponential of x: e**x</td>
</tr>
<tr>
<td><code>fabs(x)</code></td>
<td>The absolute value of x, is part of math module</td>
</tr>
<tr>
<td><code>floor(x)</code></td>
<td>The floor of x: the largest integer not greater than x</td>
</tr>
<tr>
<td><code>log(x)</code></td>
<td>The natural logarithm of x, for x &gt; 0</td>
</tr>
<tr>
<td><code>log10(x)</code></td>
<td>The base-10 logarithm of x, for x &gt; 0</td>
</tr>
<tr>
<td><code>pow(x, y)</code></td>
<td>The value of x**y</td>
</tr>
<tr>
<td><code>sqrt(x)</code></td>
<td>The square root of x, for x &gt;= 0</td>
</tr>
<tr>
<td><code>max(x, y, ..)</code> / <code>min(x, y, ..)</code></td>
<td>The maximum or minimum of a list of numbers</td>
</tr>
</tbody>
</table>
<ul>
<li>For some of these functions the <code>math</code> module must be imported</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">numberfunctions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="36" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="36" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="python-operators">Python Operators</h1>
<ul>
<li>An operator combines one or more operands into a new value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">7</span><span style="color:#D32F2F"> /</span><span style="color:#1976D2"> 2</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 3.5, true division always gives a float</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">7</span><span style="color:#D32F2F"> //</span><span style="color:#1976D2"> 2</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 3, floor division rounds down</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">7</span><span style="color:#D32F2F"> %</span><span style="color:#1976D2"> 2</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 1, the remainder</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#D32F2F">**</span><span style="color:#1976D2">10</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 1024, exponentiation</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Python groups its operators as follows :
<ul>
<li>Arithmetic and assignment operators, for numbers and for strings</li>
<li>Comparison operators, which give <code>True</code> or <code>False</code></li>
<li>Logical, membership and identity operators</li>
</ul>
</li>
<li>Bitwise operators <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;</code> work on the bits of integers, rarely needed</li>
<li>There is no <code>++</code> or <code>--</code> : write <code>count += 1</code> instead</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">pythonoperators</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="37" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="37" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="arithmetic-and-assignment-operators">Arithmetic and Assignment Operators</h1>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Arithmetic Operator Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>+</code> / <code>-</code></td>
<td>Adds or subtracts the values on either side of the operator</td>
</tr>
<tr>
<td><code>*</code></td>
<td>Multiplies the values on either side of the operator</td>
</tr>
<tr>
<td><code>/</code></td>
<td>Divides left operand by right operand, the result is always a float</td>
</tr>
<tr>
<td><code>//</code></td>
<td>Floor division, the quotient rounded down to a whole number</td>
</tr>
<tr>
<td><code>%</code></td>
<td>Modulo, the remainder of the division</td>
</tr>
<tr>
<td><code>**</code></td>
<td>Exponentiation, the left operand raised to the power of the right</td>
</tr>
</tbody>
</table>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Assignment Operator Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>=</code></td>
<td>Binds the name on the left to the value on the right</td>
</tr>
<tr>
<td><code>+=</code> / <code>-=</code></td>
<td>Adds or subtracts the right operand, and assigns the result to the left</td>
</tr>
<tr>
<td><code>*=</code> / <code>/=</code></td>
<td>Multiplies or divides by the right operand, and assigns the result</td>
</tr>
<tr>
<td><code>//=</code> / <code>%=</code> / <code>**=</code></td>
<td>The same for floor division, modulo and exponentiation</td>
</tr>
</tbody>
</table>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">count </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 10</span></span>
<span class="line"><span style="color:#24292EFF">count </span><span style="color:#D32F2F">+=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"><span style="color:#24292EFF">count </span><span style="color:#D32F2F">*=</span><span style="color:#1976D2"> 2</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(count)</span><span style="color:#4a9c59">  # 22</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="38" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="38" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="comparison-operators">Comparison Operators</h1>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Comparison Operator Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>==</code> / <code>!=</code></td>
<td>True if the two values are equal, or not equal</td>
</tr>
<tr>
<td><code>&gt;</code> / <code>&lt;</code></td>
<td>True if the left value is greater, or less, than the right</td>
</tr>
<tr>
<td><code>&gt;=</code> / <code>&lt;=</code></td>
<td>True if the left value is greater or equal, or less or equal</td>
</tr>
</tbody>
</table>
<ul>
<li>Comparisons chain, so a range check reads as it would on paper :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">i </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 10</span></span>
<span class="line"><span style="color:#24292EFF">j </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 11</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(i </span><span style="color:#D32F2F">></span><span style="color:#212121"> j)</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(i </span><span style="color:#D32F2F">!=</span><span style="color:#212121"> j)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#D32F2F"> &#x3C;</span><span style="color:#212121"> i </span><span style="color:#D32F2F">&#x3C;</span><span style="color:#1976D2"> 20</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # True, comparisons chain</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"apple"</span><span style="color:#D32F2F"> &#x3C;</span><span style="color:#22863A"> "banana"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # True, strings compare letter by letter</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>==</code> compares values; whether two names are one object is <code>is</code>, on the next slide</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="39" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="39" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="logical-membership-identity-operators">Logical, Membership, Identity Operators</h1>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>and</code> / <code>or</code></td>
<td>True if both operands are true, or if at least one is</td>
</tr>
<tr>
<td><code>not</code></td>
<td>Reverses the truth value of its operand</td>
</tr>
<tr>
<td><code>in</code> / <code>not in</code></td>
<td>True if the value is, or is not, an element of the sequence</td>
</tr>
<tr>
<td><code>is</code> / <code>is not</code></td>
<td>True if both sides are, or are not, the very same object</td>
</tr>
</tbody>
</table>
<ul>
<li><code>and</code> and <code>or</code> stop as soon as the answer is known, and return an operand :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> ""</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(name </span><span style="color:#D32F2F">or</span><span style="color:#22863A"> "anonymous"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # anonymous, `or` returns the first truthy operand</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(name </span><span style="color:#D32F2F">and</span><span style="color:#22863A"> "anonymous"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # an empty line, `and` returns the first falsy operand</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>x if c else y</code> gives <code>x</code> when <code>c</code> is true, and <code>y</code> when it is false :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">age </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 17</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"adult"</span><span style="color:#D32F2F"> if</span><span style="color:#212121"> age </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 18</span><span style="color:#D32F2F"> else</span><span style="color:#22863A"> "minor"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # minor</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>is</code> asks whether two names refer to one object, <code>==</code> whether values are equal :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">a </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">,</span><span style="color:#1976D2"> 3</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">b </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> a</span></span>
<span class="line"><span style="color:#24292EFF">c </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">,</span><span style="color:#1976D2"> 3</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(a </span><span style="color:#D32F2F">==</span><span style="color:#212121"> c)</span><span style="color:#4a9c59">  # True, equal values</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(a </span><span style="color:#D32F2F">is</span><span style="color:#212121"> c)</span><span style="color:#4a9c59">  # False, two different lists</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(a </span><span style="color:#D32F2F">is</span><span style="color:#212121"> b)</span><span style="color:#4a9c59">  # True, two names for one list</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">booleanoperators</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="40" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="40" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="python-operators-precedence">Python Operators Precedence</h1>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Description, from highest to lowest</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>**</code></td>
<td>Exponentiation, which groups from the right</td>
</tr>
<tr>
<td><code>+x</code> <code>-x</code> <code>~x</code></td>
<td>Unary plus, minus and bitwise not</td>
</tr>
<tr>
<td><code>*</code> <code>/</code> <code>//</code> <code>%</code></td>
<td>Multiplication, division, floor division and modulo</td>
</tr>
<tr>
<td><code>+</code> <code>-</code></td>
<td>Addition and subtraction</td>
</tr>
<tr>
<td><code>&lt;&lt;</code> <code>&gt;&gt;</code> <code>&amp;</code> <code>^</code> <code>|</code></td>
<td>Bitwise shifts, and, exclusive or, or</td>
</tr>
<tr>
<td><code>==</code> <code>!=</code> <code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code> <code>in</code> <code>not in</code> <code>is</code> <code>is not</code></td>
<td>Comparisons, membership and identity</td>
</tr>
<tr>
<td><code>not</code></td>
<td>Logical not</td>
</tr>
<tr>
<td><code>and</code></td>
<td>Logical and</td>
</tr>
<tr>
<td><code>or</code></td>
<td>Logical or</td>
</tr>
</tbody>
</table>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#D32F2F"> +</span><span style="color:#1976D2"> 3</span><span style="color:#D32F2F"> *</span><span style="color:#1976D2"> 4</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 14</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">((</span><span style="color:#1976D2">2</span><span style="color:#D32F2F"> +</span><span style="color:#1976D2"> 3</span><span style="color:#212121">) </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 4</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 20</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#D32F2F">**</span><span style="color:#1976D2">3</span><span style="color:#D32F2F">**</span><span style="color:#1976D2">2</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 512, ** groups from the right</span></span>
<span class="line"></span></code></pre>
<ul>
<li>When in doubt, add parentheses : they cost nothing and help the reader</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="41" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="41" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="python-strings">Python Strings</h1>
<ul>
<li>A string is a sequence of Unicode characters between matching quotes :
<ul>
<li>Single and double quotes produce the same type</li>
<li>Triple quotes allow the text to span lines</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filename </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "IMG_0421.jpg"</span></span>
<span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Imagine"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Indexing selects one character; slicing selects a section :
<ul>
<li>The first position is <code>0</code>; negative indexes count from the end</li>
<li>The stop position of a slice is excluded</li>
<li>A single character is still a string</li>
</ul>
</li>
<li>Strings are immutable :
<ul>
<li>A changed filename is a new string; the original value is preserved</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="42" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="42" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="string-operators">String Operators</h1>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>+</code></td>
<td>Concatenation. Adds values on either side of the operator</td>
</tr>
<tr>
<td><code>*</code></td>
<td>Repetition. Creates string by concatenating multiple copies of same string</td>
</tr>
<tr>
<td><code>[]</code></td>
<td>Slice. Gives the character from the given index</td>
</tr>
<tr>
<td><code>[:]</code></td>
<td>Range Slice. Gives the characters from the given range</td>
</tr>
<tr>
<td><code>in</code></td>
<td>Membership. Returns true if a character exists in the given string</td>
</tr>
<tr>
<td><code>not in</code></td>
<td>Membership. Returns true if a character does not exist in the given string</td>
</tr>
<tr>
<td><code>r/R</code></td>
<td>Raw String. Suppresses actual meaning of escape characters</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="43" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="43" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="string-operations">String Operations</h1>
<ul>
<li>Indexes and slices select parts of a photo filename :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filename </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "IMG_0421.jpg"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(filename[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # I</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(filename[</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # g</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(filename[</span><span style="color:#1976D2">4</span><span style="color:#212121">:</span><span style="color:#1976D2">8</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # 0421</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(filename[</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">4</span><span style="color:#212121">:])</span><span style="color:#4a9c59">  # .jpg</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#D32F2F"> in</span><span style="color:#212121"> filename)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Concatenation builds a new name without changing the original :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">edited </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> filename</span><span style="color:#212121">[:</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">4</span><span style="color:#212121">]</span><span style="color:#D32F2F"> +</span><span style="color:#22863A"> "_edit.jpg"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(edited)</span><span style="color:#4a9c59">  # IMG_0421_edit.jpg</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(filename)</span><span style="color:#4a9c59">  # IMG_0421.jpg</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Repetition can produce a separator : <code>&quot;-&quot; * 12</code></li>
<li>A negative step reverses the characters : <code>filename[::-1]</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">stringoperations</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="44" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="44" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="escape-characters">Escape Characters</h1>
<ul>
<li>Escape or non-printable characters :
<ul>
<li>Characters that can be represented with backslash notation</li>
</ul>
</li>
</ul>
<table>
<thead>
<tr>
<th>Backslash Notation</th>
<th>Hexadecimal Character</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>\</code></td>
<td>0x5c</td>
<td>Backslash</td>
</tr>
<tr>
<td><code>\'</code> / <code>\&quot;</code></td>
<td>0x27 / 0x22</td>
<td>Single or double quote</td>
</tr>
<tr>
<td><code>\n</code></td>
<td>0x0a</td>
<td>Newline</td>
</tr>
<tr>
<td><code>\r</code></td>
<td>0x0d</td>
<td>Carriage return</td>
</tr>
<tr>
<td><code>\t</code></td>
<td>0x09</td>
<td>Tab</td>
</tr>
<tr>
<td><code>\a</code></td>
<td>0x07</td>
<td>Bell or alert</td>
</tr>
<tr>
<td><code>\b</code></td>
<td>0x08</td>
<td>Backspace</td>
</tr>
<tr>
<td><code>\ooo</code></td>
<td></td>
<td>Character with octal value ooo, digits 0 to 7</td>
</tr>
<tr>
<td><code>\xhh</code></td>
<td></td>
<td>Character with hexadecimal value hh</td>
</tr>
<tr>
<td><code>\uxxxx</code></td>
<td></td>
<td>Unicode character with 16-bit hexadecimal value xxxx</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">escapecharacters</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="45" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="45" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="raw-and-unicode-strings">Raw and Unicode Strings</h1>
<ul>
<li>Raw String don't treat backslash as a special character :
<ul>
<li>Every character in a raw string stays the way it was</li>
</ul>
</li>
<li>In a normal String the backslash can be escaped :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"C:\\nowhere"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Result : <code>C:\nowhere</code></li>
<li>A raw string is made with the <code>r</code> in front of the String :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"C:\nowhere"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Result : <code>C:\nowhere</code></li>
<li>Python strings are Unicode :
<ul>
<li>A string is a sequence of code points, so <code>len(&quot;Ä…Ä‡&quot;)</code> is 2</li>
<li>Text in almost every script in the world can be stored and processed</li>
</ul>
</li>
<li><code>unicodedata</code> module <code>:</code>
<ul>
<li>Provides access to Unicode Character Database (UCD)</li>
<li>UCD contains character properties for all Unicode characters</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="46" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="46" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="f-strings">f-Strings</h1>
<ul>
<li>An f-string inserts values into text using <code>{...}</code> fields :
<ul>
<li>Put <code>f</code> before the opening quote</li>
<li>Fields can contain arithmetic and method calls</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Imagine"</span></span>
<span class="line"><span style="color:#24292EFF">seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 222</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Now playing: </span><span style="color:#1976D2">{</span><span style="color:#212121">title.</span><span style="color:#6F42C1">upper</span><span style="color:#212121">()</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"With a 30-second intro: </span><span style="color:#1976D2">{</span><span style="color:#212121">seconds </span><span style="color:#D32F2F">+</span><span style="color:#1976D2"> 30}</span><span style="color:#22863A"> seconds"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Now playing: IMAGINE</span></span>
<span class="line"><span>With a 30-second intro: 252 seconds</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>!r</code> shows quotes and whitespace; <code>=</code> also shows the field's name :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # 'Imagine', quotes remain visible</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">seconds = </span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # seconds = 222, useful during debugging</span></span>
<span class="line"></span></code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="47" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="47" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="format-specifications">Format Specifications</h1>
<ul>
<li>A colon inside a field introduces its display format :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">photo_id </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 421</span></span>
<span class="line"><span style="color:#24292EFF">size_mb </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 8.537</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Photo </span><span style="color:#1976D2">{</span><span style="color:#212121">photo_id</span><span style="color:#D32F2F">:05d</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#212121">size_mb</span><span style="color:#D32F2F">:6.2f</span><span style="color:#1976D2">}</span><span style="color:#22863A"> MB"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The result is <code>Photo 00421:   8.54 MB</code></li>
</ul>
<table>
<thead>
<tr>
<th>Format</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>05d</code></td>
<td>Integer padded to five digits with zeroes</td>
</tr>
<tr>
<td><code>6.2f</code></td>
<td>Number six characters wide, with two decimal places</td>
</tr>
<tr>
<td><code>&lt;10</code>, <code>^10</code>, <code>&gt;10</code></td>
<td>Left, centre or right alignment in ten characters</td>
</tr>
<tr>
<td><code>:,.0f</code></td>
<td>Thousands separators and no decimals</td>
</tr>
<tr>
<td><code>:.0%</code></td>
<td>Percentage with no decimals</td>
</tr>
</tbody>
</table>
<ul>
<li>Older code uses <code>%</code> or <code>str.format</code>; recognise these forms :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Photo </span><span style="color:#1976D2">%05d</span><span style="color:#22863A">: </span><span style="color:#1976D2">%6.2f</span><span style="color:#22863A"> MB"</span><span style="color:#D32F2F"> %</span><span style="color:#212121"> (photo_id, size_mb))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Photo </span><span style="color:#1976D2">{</span><span style="color:#D32F2F">:05d</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#D32F2F">:6.2f</span><span style="color:#1976D2">}</span><span style="color:#22863A"> MB"</span><span style="color:#212121">.</span><span style="color:#6F42C1">format</span><span style="color:#212121">(photo_id, size_mb))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo14</code><br><code class="pill-demo pill-desc">formatspecs</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="48" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="48" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="triple-quotes">Triple Quotes</h1>
<ul>
<li>A triple-quoted string keeps line breaks written in the source :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">message </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> """Tonight's playlist</span></span>
<span class="line"><span style="color:#22863A">1. Imagine</span></span>
<span class="line"><span style="color:#22863A">2. Yesterday</span></span>
<span class="line"><span style="color:#22863A">Bring headphones."""</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(message)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Tonight's playlist</span></span>
<span class="line"><span>1. Imagine</span></span>
<span class="line"><span>2. Yesterday</span></span>
<span class="line"><span>Bring headphones.</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Both triple single quotes and triple double quotes are supported</li>
<li>Escape sequences such as <code>\n</code> and <code>\t</code> still work inside the string</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo15</code><br><code class="pill-demo pill-desc">triplequotes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="49" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="49" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="built-in-string-methods">Built-in String Methods</h1>
<ul>
<li>String methods are called with dot notation : <code>&quot;Imagine&quot;.upper()</code>
<ul>
<li>A string never changes, so each method returns a new string or a value</li>
</ul>
</li>
</ul>
<table>
<thead>
<tr>
<th>Method</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>strip()</code></td>
<td>Removes whitespace from both ends, <code>lstrip()</code> and <code>rstrip()</code> from one</td>
</tr>
<tr>
<td><code>lower()</code> / <code>upper()</code></td>
<td>Converts the string to all lowercase or all uppercase</td>
</tr>
<tr>
<td><code>split(sep)</code></td>
<td>Splits the string into a list of words, on whitespace by default</td>
</tr>
<tr>
<td><code>sep.join(words)</code></td>
<td>Joins a list of strings into one, with <code>sep</code> between them</td>
</tr>
<tr>
<td><code>count(sub)</code></td>
<td>Returns how many times <code>sub</code> occurs in the string</td>
</tr>
<tr>
<td><code>startswith(prefix)</code></td>
<td>Returns <code>True</code> if the string starts with <code>prefix</code>, see also <code>endswith()</code></td>
</tr>
<tr>
<td><code>isalpha()</code></td>
<td>Returns <code>True</code> if the string is not empty and holds only letters</td>
</tr>
<tr>
<td><code>replace(old, new)</code></td>
<td>Returns a copy with every <code>old</code> replaced by <code>new</code></td>
</tr>
<tr>
<td><code>find(sub)</code></td>
<td>Returns the index of the first <code>sub</code>, or <code>-1</code> if it is not there</td>
</tr>
<tr>
<td><code>isascii()</code></td>
<td>Returns <code>True</code> if every character is plain ASCII, so <code>False</code> for a letter such as <code>é</code></td>
</tr>
<tr>
<td><code>splitlines()</code></td>
<td>Splits the string at line breaks, one item per line, without the line breaks</td>
</tr>
</tbody>
</table>
<ul>
<li><code>len(s)</code> is a function rather than a method, and gives the number of characters</li>
<li>All the others : <code>https://docs.python.org/3/library/stdtypes.html#string-methods</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="50" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="50" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="cleaning-photo-filenames">Cleaning Photo Filenames</h1>
<ul>
<li>A pasted filename can contain spaces and inconsistent capitalisation :
<ul>
<li><code>strip</code> removes surrounding whitespace</li>
<li><code>lower</code> produces a consistent name for comparisons</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filename </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "  IMG_0421.JPG  "</span></span>
<span class="line"><span style="color:#24292EFF">clean </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> filename</span><span style="color:#212121">.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">().</span><span style="color:#6F42C1">lower</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">repr</span><span style="color:#212121">(clean))</span><span style="color:#4a9c59">  # 'img_0421.jpg'</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(clean.</span><span style="color:#6F42C1">endswith</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(clean.</span><span style="color:#6F42C1">replace</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">, </span><span style="color:#22863A">"_edit.jpg"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # img_0421_edit.jpg</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Each string method returns a result; <code>filename</code> still holds the original text</li>
<li>Chained calls apply left to right, passing each result to the next method</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo16</code><br><code class="pill-demo pill-desc">stringfunctions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="51" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="51" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="summary--variables-and-data-types">Summary : Variables and Data Types</h1>
<ul>
<li>A variable is a name bound to an object :
<ul>
<li>Created on first assignment with <code>=</code>, and can be annotated, as in <code>seconds: int = 222</code></li>
<li>Every object has an identity, <code>id(x)</code>, a type, <code>type(x)</code>, and a value</li>
</ul>
</li>
<li><code>input()</code> waits for a line of text and returns it as a string</li>
<li>Python is strongly typed :
<ul>
<li>Converting between types is explicit, with <code>int()</code>, <code>float()</code>, <code>str()</code> and <code>bool()</code></li>
</ul>
</li>
<li>Numbers are <code>int</code>, <code>float</code> and <code>complex</code>; <code>bool</code> is a subtype of <code>int</code></li>
<li>Operators compute, compare and combine values :
<ul>
<li><code>==</code> compares values, <code>is</code> compares identities</li>
</ul>
</li>
<li>Strings are immutable sequences of Unicode characters :
<ul>
<li>Indexed and sliced with <code>[]</code>, and have methods such as <code>strip()</code> and <code>split()</code></li>
</ul>
</li>
<li>f-strings are the way to format text :
<ul>
<li><code>f&quot;{size_mb:6.2f}&quot;</code> sets the width and the decimals of the value it shows</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise02</code><br><code class="pill-exercise pill-desc">Variables and Data Types</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="sequences">Sequences</h1>
<ul>
<li>Most basic data structure in Python is the sequence :
<ul>
<li>Each element of a sequence is assigned a number, its position or index</li>
<li>First index is zero, the second index is one, and so forth</li>
<li>Python distinguishes sequences on the basis of mutability</li>
</ul>
</li>
<li>Immutable sequences :
<ul>
<li>Contain objects and content cannot change once created :
<ul>
<li>Objects may reference other objects, and those other objects may change</li>
</ul>
</li>
<li>Examples are strings, tuples and bytes, which the IO module covers</li>
</ul>
</li>
<li>Mutable sequences :
<ul>
<li>Contain objects and content can be changed once created</li>
<li>The list is the example used everywhere</li>
</ul>
</li>
<li>Operations that work on all sequences types :
<ul>
<li>Indexing, slicing, multiplying, and checking for membership</li>
</ul>
</li>
<li>Python has built-in functions for :
<ul>
<li>Finding the length of a sequence and its largest and smallest elements</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="54" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="54" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="lists">Lists</h1>
<ul>
<li>A playlist stores tracks in a chosen order :
<ul>
<li>Lists are mutable sequences</li>
<li>List contains items separated by commas and enclosed within square brackets <code>[]</code></li>
<li>The items of one list can be of different data types</li>
</ul>
</li>
<li>Values are accessed using the index or slice operator <code>[ ]</code> and <code>[ : ]</code> :
<ul>
<li>Indexes start at 0, then upwards and with end-1</li>
<li>Lists can be sliced, concatenated and so on</li>
</ul>
</li>
<li>Lists respond to the <code>+</code> and * operators much like strings :
<ul>
<li>Meaning is concatenation and repetition</li>
<li>Except that result is a new list, not a string</li>
</ul>
</li>
<li>Lists respond to all sequence operations usable on strings :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">list1 </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Hey Jude"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list1)</span><span style="color:#4a9c59">  # Prints complete list</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list1[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # Prints first element of the list</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list1[</span><span style="color:#1976D2">1</span><span style="color:#212121">:</span><span style="color:#1976D2">3</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # Prints the 2nd and 3rd elements</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list1 </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 2</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # Prints list two times</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list1[::</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # Prints complete list in reverse order</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">lists</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="55" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="55" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="accessing-lists">Accessing Lists</h1>
<ul>
<li>Use index operator <code>[]</code> to access list at specific position :
<ul>
<li>Counting runs from <code>0</code> at the front and from <code>-1</code> at the back</li>
<li>A slice runs up to but not including its second index</li>
</ul>
</li>
</ul>
<svg viewBox="0 0 960 200" width="100%" style="width:100%;height:auto;display:block;margin:6px 0 4px" role="img" aria-label="A five element list with its positive indexes, negative indexes and the extent of the slice one to three">
