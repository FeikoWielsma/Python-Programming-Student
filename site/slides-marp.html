</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="141" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="141" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="set-comprehensions">Set Comprehensions</h1>
<ul>
<li>A set comprehension keeps each result once :
<ul>
<li>Titles that differ only in spacing and case can become one value</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">" Imagine "</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect "</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">unique </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#24292EFF">title</span><span style="color:#212121">.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">().</span><span style="color:#6F42C1">lower</span><span style="color:#212121">()</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> titles</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(unique))</span><span style="color:#4a9c59">  # ['imagine', 'respect', 'yesterday']</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"cover.jpg"</span><span style="color:#212121">,</span><span style="color:#22863A"> "notes.txt"</span><span style="color:#212121">,</span><span style="color:#22863A"> "cover.jpg"</span><span style="color:#212121">,</span><span style="color:#22863A"> "stage.jpg"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">unique_photos </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> files </span><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> name</span><span style="color:#212121">.</span><span style="color:#6F42C1">endswith</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">)}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(unique_photos))</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg']</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Sets have no display order; <code>sorted</code> makes printed output predictable</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">set_comprehensions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="142" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="142" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="generator-expressions">Generator Expressions</h1>
<ul>
<li>A generator expression supplies values without building a new list :
<ul>
<li>These photo sizes are checked and totalled as they are consumed</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">sizes_mb </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">12</span><span style="color:#212121">,</span><span style="color:#1976D2"> 8</span><span style="color:#212121">,</span><span style="color:#1976D2"> 25</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sum</span><span style="color:#212121">(size </span><span style="color:#D32F2F">for</span><span style="color:#212121"> size </span><span style="color:#D32F2F">in</span><span style="color:#212121"> sizes_mb </span><span style="color:#D32F2F">if</span><span style="color:#212121"> size </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 10</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 37</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">any</span><span style="color:#212121">(size </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 20</span><span style="color:#D32F2F"> for</span><span style="color:#212121"> size </span><span style="color:#D32F2F">in</span><span style="color:#212121"> sizes_mb))</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">all</span><span style="color:#212121">(size </span><span style="color:#D32F2F">&#x3C;=</span><span style="color:#1976D2"> 20</span><span style="color:#D32F2F"> for</span><span style="color:#212121"> size </span><span style="color:#D32F2F">in</span><span style="color:#212121"> sizes_mb))</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">any</span><span style="color:#212121">([]), </span><span style="color:#6F42C1">all</span><span style="color:#212121">([]))</span><span style="color:#4a9c59">  # False True</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>any</code> and <code>all</code> stop as soon as the answer is known</li>
<li>As the only argument of a call, the expression needs no extra parentheses</li>
<li>Generator functions and <code>yield</code> belong to Advanced Python</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">generator_expressions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="143" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="143" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="built-ins-that-take-a-function">Built-ins that Take a Function</h1>
<ul>
<li>A <code>key</code> function selects the value used for ordering :
<ul>
<li>Track titles can be sorted alphabetically or by title length</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Bohemian Rhapsody"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(titles))</span><span style="color:#4a9c59">  # ['Bohemian Rhapsody', 'Imagine', 'Yesterday']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(titles, key</span><span style="color:#D32F2F">=</span><span style="color:#6F42C1">len</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # ['Imagine', 'Yesterday', 'Bohemian Rhapsody']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">min</span><span style="color:#212121">(titles, key</span><span style="color:#D32F2F">=</span><span style="color:#6F42C1">len</span><span style="color:#212121">), </span><span style="color:#6F42C1">max</span><span style="color:#212121">(titles, key</span><span style="color:#D32F2F">=</span><span style="color:#6F42C1">len</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # Imagine Bohemian Rhapsody</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>sorted</code> returns a new list; <code>list.sort</code> changes a list in place</li>
<li><code>min</code> and <code>max</code> also accept a key function</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">sorted_by_key</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="144" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="144" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="recognising-map-and-filter">Recognising map and filter</h1>
<ul>
<li><code>map</code> transforms each item; <code>filter</code> keeps matching items</li>
<li>Both return iterators; <code>list</code> collects the results :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> clean_filename</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> name</span><span style="color:#212121">.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">().</span><span style="color:#6F42C1">lower</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> is_photo</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> bool</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> name</span><span style="color:#212121">.</span><span style="color:#6F42C1">endswith</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"  COVER.JPG "</span><span style="color:#212121">,</span><span style="color:#22863A"> "STAGE.JPG"</span><span style="color:#212121">,</span><span style="color:#22863A"> "NOTES.TXT"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">cleaned </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> list</span><span style="color:#212121">(</span><span style="color:#6F42C1">map</span><span style="color:#212121">(clean_filename, files))</span></span>
<span class="line"><span style="color:#24292EFF">photos </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> list</span><span style="color:#212121">(</span><span style="color:#6F42C1">filter</span><span style="color:#212121">(is_photo, cleaned))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photos)</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">([name </span><span style="color:#D32F2F">for</span><span style="color:#212121"> name </span><span style="color:#D32F2F">in</span><span style="color:#212121"> cleaned </span><span style="color:#D32F2F">if</span><span style="color:#6F42C1"> is_photo</span><span style="color:#212121">(name)])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>These forms also occur in existing code</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">map_and_filter_functions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="145" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="145" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="comprehensions-and-map">Comprehensions and map</h1>
<ul>
<li>A comprehension can express the same filename transformation as <code>map</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">files </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"COVER.JPG"</span><span style="color:#212121">,</span><span style="color:#22863A"> "STAGE.JPG"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">mapped </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> list</span><span style="color:#212121">(</span><span style="color:#6F42C1">map</span><span style="color:#212121">(</span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> name</span><span style="color:#212121">: name.</span><span style="color:#6F42C1">lower</span><span style="color:#212121">(), files))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(mapped)</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg']</span></span>
<span class="line"><span style="color:#24292EFF">comprehended </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [name</span><span style="color:#212121">.</span><span style="color:#6F42C1">lower</span><span style="color:#212121">()</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> files]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(comprehended)</span><span style="color:#4a9c59">  # ['cover.jpg', 'stage.jpg']</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Choose the form that makes the operation clear</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">syntactic_sugar</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="146" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="146" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="recognising-reduce">Recognising reduce</h1>
<ul>
<li><code>functools.reduce</code> combines items into one running result :
<ul>
<li>Each step adds the next track's duration to the accumulated duration</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> functools </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> reduce</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">lengths </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">183</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#212121">,</span><span style="color:#1976D2"> 149</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">total </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> reduce</span><span style="color:#212121">(</span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> running</span><span style="color:#212121">, </span><span style="color:#FF9800">seconds</span><span style="color:#212121">: running </span><span style="color:#D32F2F">+</span><span style="color:#212121"> seconds, lengths)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(total)</span><span style="color:#4a9c59">  # 457</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sum</span><span style="color:#212121">(lengths))</span><span style="color:#4a9c59">  # 457</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Prefer <code>sum</code> when it names the operation directly</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo14</code><br><code class="pill-demo pill-desc">reduce_and_lambda</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="147" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="147" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#130"><span class="ml-tag">python</span>Comprehensions</a></div>
<h1 id="summary--comprehensions">Summary : Comprehensions</h1>
<ul>
<li>Build lists, dictionaries and sets with comprehensions.</li>
<li>Use an optional <code>if</code> to filter the input.</li>
<li>Keep nested comprehensions simple.</li>
<li>Feed generator expressions into <code>sum</code>, <code>any</code> and <code>all</code>.</li>
<li>Pass a <code>key</code> function to <code>sorted</code>, <code>min</code> and <code>max</code>.</li>
<li>Recognise <code>map</code>, <code>filter</code> and <code>reduce</code> when reading other code.</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise07</code><br><code class="pill-exercise pill-desc">Comprehensions</code></p>

<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="unexpected-errors">Unexpected Errors</h1>
<ul>
<li>Python provides exceptions to handle unexpected errors :
<ul>
<li>Exceptions are events disrupting normal program flow</li>
<li>May occur during the execution of program instructions</li>
</ul>
</li>
<li>When Python encounters conditions it can't cope with :
<ul>
<li>An exception is raised</li>
<li>An exception is a Python object that represents an error</li>
</ul>
</li>
<li>Exception types are classes, and those classes form a tree :</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 733 / 328"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 733 328" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M150.72,164L191.72,164" /><path class="pele-marker" d="M198.72,164L190.72,167.36L190.72,160.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_C_0"><path d="M304.98,152C322.34,152 332.98,129.2 332.98,92C332.98,54.8 343.24,32 359.98,32L365.98,32" /><path class="pele-marker" d="M372.98,32L364.98,35.36L364.98,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_C_D_0"><path d="M515.65,32L556.65,32" /><path class="pele-marker" d="M563.65,32L555.65,35.36L555.65,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_E_0"><path d="M304.98,160L332.98,160C351.14,160 351.14,120 369.3,120L375.3,120" /><path class="pele-marker" d="M382.3,120L374.3,123.36L374.3,116.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_E_F_0"><path d="M506.33,120L556.65,120" /><path class="pele-marker" d="M563.65,120L555.65,123.36L555.65,116.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_G_0"><path d="M304.98,168L332.98,168C354.03,168 354.03,208 375.08,208L381.08,208" /><path class="pele-marker" d="M388.08,208L380.08,211.36L380.08,204.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_H_0"><path d="M304.98,176C322.34,176 332.98,198.8 332.98,236C332.98,273.2 352.36,296 383.98,296L389.98,296" /><path class="pele-marker" d="M396.98,296L388.98,299.36L388.98,292.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(79.36,164)"><rect x="-71.36" y="-24" width="142.72" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">BaseException</text></g><g class="pele-node pele-shape-rect" data-id="B" transform="translate(251.85,164)"><rect x="-53.13" y="-24" width="106.26" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">Exception</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(444.31,32)"><rect x="-71.34" y="-24" width="142.67" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">ArithmeticError</text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(643.87,32)"><rect x="-80.22" y="-24" width="160.45" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">ZeroDivisionError</text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(444.31,120)"><rect x="-62.02" y="-24" width="124.03" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">LookupError</text></g><g class="pele-node pele-shape-rect" data-id="F" transform="translate(618.99,120)"><rect x="-55.34" y="-24" width="110.69" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">IndexError</text></g><g class="pele-node pele-shape-rect" data-id="G" transform="translate(444.31,208)"><rect x="-56.23" y="-24" width="112.46" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">ValueError</text></g><g class="pele-node pele-shape-rect" data-id="H" transform="translate(444.31,296)"><rect x="-47.34" y="-24" width="94.67" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">OSError</text></g></g></svg></div>
<ul>
<li>Catching a class catches everything below it in that tree</li>
<li>When a Python script raises an exception :
<ul>
<li>Python looks for a matching handler in the callers; if none exists, the script stops</li>
</ul>
</li>
<li>Assertions check internal programmer assumptions :
<ul>
<li>A false assertion raises <code>AssertionError</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="150" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="150" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="reading-a-traceback">Reading a Traceback</h1>
<ul>
<li>A playlist contains a duration that cannot be converted to an integer :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> parse_seconds</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">text</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#1976D2"> int</span><span style="color:#212121">(text)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">parse_seconds</span><span style="color:#212121">(</span><span style="color:#22863A">"three"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Traceback (most recent call last):</span></span>
<span class="line"><span>  File "01_unexpectederrors.py", line 5, in &#x3C;module></span></span>
<span class="line"><span>    parse_seconds("three")</span></span>
<span class="line"><span>    ~~~~~~~~~~~~~^^^^^^^^^</span></span>
<span class="line"><span>  File "01_unexpectederrors.py", line 2, in parse_seconds</span></span>
<span class="line"><span>    return int(text)</span></span>
<span class="line"><span>ValueError: invalid literal for int() with base 10: 'three'</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Read the type and message, then the failing line and its caller</li>
<li>File paths are shortened; line numbers refer to the demo</li>
</ul>

<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">unexpectederrors</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="151" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="151" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="exception-handling">Exception Handling</h1>
<ul>
<li>A <code>try</code> block contains an operation that may fail</li>
<li>A matching <code>except</code> block handles the failure :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "three"</span></span>
<span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(text)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#1976D2"> ValueError</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Invalid track length: </span><span style="color:#1976D2">{</span><span style="color:#212121">text</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Invalid track length: 'three'</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Catch a specific error that the program can handle</li>
<li>A bare <code>except:</code> also catches keyboard interrupts; avoid it for ordinary input errors</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">exceptionhandling</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="152" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="152" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="typed-exception-handling">Typed Exception Handling</h1>
<ul>
<li>Handlers are tested in order; only the first matching handler runs :
<ul>
<li>A specific error belongs before a broader class</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(</span><span style="color:#22863A">"three"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#1976D2"> ValueError</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Track length must be a whole number"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#1976D2"> Exception</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> error</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Other problem: </span><span style="color:#1976D2">{</span><span style="color:#212121">error</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Track length: </span><span style="color:#1976D2">{</span><span style="color:#212121">seconds</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>ValueError</code> also belongs to <code>Exception</code>, so the second handler is not reached</li>
<li>A broad handler is useful only when the program has a meaningful recovery</li>
<li>Unmatched errors propagate to the caller</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">typedexceptionhandling</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="153" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="153" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="exception-handling-with-else">Exception Handling with Else</h1>
<ul>
<li><code>else</code> runs only when <code>try</code> finishes without an exception :
<ul>
<li>Keep the conversion in <code>try</code> and the successful result in <code>else</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "222"</span></span>
<span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(text)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#1976D2"> ValueError</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Invalid track length: </span><span style="color:#1976D2">{</span><span style="color:#212121">text</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Track length: </span><span style="color:#1976D2">{</span><span style="color:#212121">seconds</span><span style="color:#1976D2">}</span><span style="color:#22863A"> seconds"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Track length: 222 seconds</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">exceptionhandlingwithelse</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="154" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="154" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="except-clause-multiple-exceptions">except Clause Multiple Exceptions</h1>
<ul>
<li>A playlist duration may be missing or contain a nonnumeric label</li>
<li>One handler can give both cases the same recovery :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">lengths </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">222</span><span style="color:#212121">,</span><span style="color:#1976D2"> None</span><span style="color:#212121">,</span><span style="color:#22863A"> "live"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> length </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> lengths</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Length: </span><span style="color:#1976D2">{int</span><span style="color:#212121">(length)</span><span style="color:#1976D2">}</span><span style="color:#22863A"> seconds"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    except</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">TypeError</span><span style="color:#212121">,</span><span style="color:#1976D2"> ValueError</span><span style="color:#24292EFF">)</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Missing or invalid duration: </span><span style="color:#1976D2">{</span><span style="color:#212121">length</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Length: 222 seconds</span></span>
<span class="line"><span>Missing or invalid duration: None</span></span>
<span class="line"><span>Missing or invalid duration: 'live'</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Catch a tuple of exception types when the same action handles each one</li>
<li>Use separate handlers when the recovery differs</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">multipleexceptions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="155" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="155" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="python-standard-exceptions">Python Standard Exceptions</h1>
<table>
<thead>
<tr>
<th>Exception</th>
<th>Typical cause</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ValueError</code></td>
<td>A valid type has an unsuitable value, such as <code>int(&quot;six&quot;)</code>.</td>
</tr>
<tr>
<td><code>TypeError</code></td>
<td>An operation receives an unsuitable type.</td>
</tr>
<tr>
<td><code>NameError</code></td>
<td>A name has not been defined.</td>
</tr>
<tr>
<td><code>AttributeError</code></td>
<td>An object has no such attribute.</td>
</tr>
<tr>
<td><code>IndexError</code></td>
<td>A sequence index is out of range.</td>
</tr>
<tr>
<td><code>KeyError</code></td>
<td>A dictionary has no such key.</td>
</tr>
<tr>
<td><code>ZeroDivisionError</code></td>
<td>Division by zero.</td>
</tr>
<tr>
<td><code>OSError</code></td>
<td>A file or operating system operation fails.</td>
</tr>
<tr>
<td><code>FileNotFoundError</code></td>
<td>A requested file or directory does not exist.</td>
</tr>
<tr>
<td><code>AssertionError</code></td>
<td>An <code>assert</code> condition is false.</td>
</tr>
<tr>
<td><code>EOFError</code></td>
<td><code>input()</code> reaches the end of the input, with Ctrl+D on Linux and macOS, or Ctrl+Z and Enter on Windows.</td>
</tr>
<tr>
<td><code>KeyboardInterrupt</code></td>
<td>The user presses Ctrl+C. It is a <code>BaseException</code>, so <code>except Exception</code> does not catch it.</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="156" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="156" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="assertions-check-programmer-assumptions">Assertions Check Programmer Assumptions</h1>
<ul>
<li>An assertion checks an internal assumption about the program's own logic :
<ul>
<li>Reversing a playlist must preserve its number of tracks</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> reverse_playlist</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">tracks</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    reversed_tracks </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> tracks</span><span style="color:#212121">[::</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#D32F2F">    assert</span><span style="color:#6F42C1"> len</span><span style="color:#212121">(reversed_tracks)</span><span style="color:#D32F2F"> ==</span><span style="color:#6F42C1"> len</span><span style="color:#212121">(tracks),</span><span style="color:#22863A"> "Reversing must preserve every track"</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> reversed_tracks</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">reverse_playlist</span><span style="color:#212121">([</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">, </span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">, </span><span style="color:#22863A">"Respect"</span><span style="color:#212121">]))</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An incorrect slice such as <code>tracks[:-1]</code> makes this assertion fail</li>
<li>Assertions can be disabled with <code>-O</code></li>
<li>Required checks on incoming data use <code>raise</code>, so they remain active</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">assertionerror</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="157" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="157" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="try-finally-clause">try-finally Clause</h1>
<ul>
<li><code>finally</code> runs when execution leaves a <code>try</code> block :
<ul>
<li>It runs on success, on <code>return</code> and while an exception propagates</li>
<li>It performs cleanup; it does not handle the exception</li>
</ul>
</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 977 / 152"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 977 152" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M103.57,76L144.57,76" /><path class="pele-marker" d="M151.57,76L143.57,79.36L143.57,72.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_C_0"><path d="M322.46,68C339.11,68 339.11,32 355.76,32L410.05,32" /><path class="pele-marker" d="M417.05,32L409.05,35.36L409.05,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_D_0"><path d="M322.46,84C339.11,84 339.11,120 355.76,120L453.62,120" /><path class="pele-marker" d="M460.62,120L452.62,123.36L452.62,116.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_C_E_0"><path d="M611.34,32C628.84,32 628.84,68 646.34,68L652.34,68" /><path class="pele-marker" d="M659.34,68L651.34,71.36L651.34,64.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_D_E_0"><path d="M567.76,120C607.05,120 607.05,84 646.34,84L652.34,84" /><path class="pele-marker" d="M659.34,84L651.34,87.36L651.34,80.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_E_F_0"><path d="M778.02,76L819.02,76" /><path class="pele-marker" d="M826.02,76L818.02,79.36L818.02,72.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_B_C_0"><rect x="357.76" y="21.5" width="29.78" height="21" rx="3" fill="var(--_bg)" /><text x="372.66" y="36.9" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_B_D_0"><rect x="360.87" y="109.5" width="23.57" height="21" rx="3" fill="var(--_bg)" /><text x="372.66" y="124.9" text-anchor="middle">no</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(55.78,76)"><rect x="-47.78" y="-24" width="95.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">try block</text></g><g class="pele-node pele-shape-diam" data-id="B" transform="translate(243.42,76)"><polygon points="0,-57.4 91.85,0 0,57.4 -91.85,0" fill="var(--_s)" stroke="var(--_b)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">exception raised</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(514.19,32)"><rect x="-97.14" y="-24" width="194.29" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">matching except block</text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(514.19,120)"><rect x="-53.57" y="-24" width="107.14" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">else block</text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(718.68,76)"><rect x="-59.34" y="-24" width="118.69" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">finally block</text></g><g class="pele-node pele-shape-rect" data-id="F" transform="translate(897.38,76)"><rect x="-71.36" y="-24" width="142.72" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">statement after</text></g></g></svg></div>
<ul>
<li>An unmatched exception also passes through <code>finally</code> before reaching a caller</li>
<li><code>except</code>, <code>else</code> and <code>finally</code> can be combined in one statement</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="158" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="158" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="example-try-finally">Example try-finally</h1>
<ul>
<li>An invalid track length leaves the function through its <code>finally</code> block :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> parse_seconds</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">text</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#1976D2"> int</span><span style="color:#212121">(text)</span></span>
<span class="line"><span style="color:#D32F2F">    finally</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Duration check finished"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    parse_seconds</span><span style="color:#212121">(</span><span style="color:#22863A">"live"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#1976D2"> ValueError</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Duration unavailable"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Duration check finished</span></span>
<span class="line"><span>Duration unavailable</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The caller handles the error after the final message appears</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">tryfinally</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="159" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="159" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="exception-arguments">Exception Arguments</h1>
<ul>
<li><code>except ValueError as error</code> binds the exception object to <code>error</code>.</li>
<li><code>str(error)</code> gives its message; <code>print(error)</code> uses that text.</li>
<li><code>error.args</code> holds the constructor arguments as a tuple.</li>
<li>Some types expose additional attributes, such as <code>OSError.filename</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="160" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="160" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="example-argument-of-an-exception">Example Argument of an Exception</h1>
<ul>
<li>The exception retains the detail needed to report the faulty value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "live"</span></span>
<span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#1976D2">    int</span><span style="color:#212121">(text)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#1976D2"> ValueError</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> error</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Cannot read track length </span><span style="color:#1976D2">{</span><span style="color:#212121">text</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#212121">error</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(error.args)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Cannot read track length 'live': invalid literal for int() with base 10: 'live'</span></span>
<span class="line"><span>("invalid literal for int() with base 10: 'live'",)</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">exceptionarguments</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="161" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="161" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="raising-exceptions">Raising Exceptions</h1>
<ul>
<li><code>raise</code> reports a value that converts successfully but breaks a required rule :
<ul>
<li>A duration's seconds field must be between <code>0</code> and <code>59</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> parse_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">text</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes_text</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds_text </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> text</span><span style="color:#212121">.</span><span style="color:#6F42C1">split</span><span style="color:#212121">(</span><span style="color:#22863A">":"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(minutes_text)</span></span>
<span class="line"><span style="color:#24292EFF">    seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(seconds_text)</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> minutes </span><span style="color:#D32F2F">&#x3C;</span><span style="color:#1976D2"> 0</span><span style="color:#D32F2F"> or</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> 0</span><span style="color:#D32F2F"> &#x3C;=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">&#x3C;</span><span style="color:#1976D2"> 60</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">        raise</span><span style="color:#1976D2"> ValueError</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Invalid duration: </span><span style="color:#1976D2">{</span><span style="color:#212121">text</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> minutes </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 60</span><span style="color:#D32F2F"> +</span><span style="color:#24292EFF"> seconds</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The error message identifies the rejected duration</li>
<li><code>raise</code> inside an <code>except</code> block re-raises the current exception</li>
<li><code>raise NewError(...) from error</code> records another error as its cause</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="162" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="162" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="example-raising-an-exception">Example Raising an Exception</h1>
<ul>
<li>The parser returns seconds for valid text and raises for an invalid duration :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> parse_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">text</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes_text</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds_text </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> text</span><span style="color:#212121">.</span><span style="color:#6F42C1">split</span><span style="color:#212121">(</span><span style="color:#22863A">":"</span><span style="color:#212121">)</span></span>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="164" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="164" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#148"><span class="ml-tag">python</span>Exception Handling</a></div>
<h1 id="summary--exception-handling">Summary : Exception Handling</h1>
<ul>
<li>Exceptions are events disrupting normal program flow :
<ul>
<li>Python provides exception handling mechanism for unexpected errors</li>
</ul>
</li>
<li>Code that might raise an exception is placed in a <code>try</code> block :
<ul>
<li>This code is tested for exceptions</li>
</ul>
</li>
<li><code>try</code> block is followed by an <code>except</code> block :
<ul>
<li>Control jumps to this block in case of exceptions and exceptions are handled there</li>
</ul>
</li>
<li><code>try</code> block may also be followed by a <code>finally</code> block :
<ul>
<li>Is always executed whether or not the try-block raised an exception</li>
</ul>
</li>
<li>Exceptions can have an argument :
<ul>
<li>Value that gives additional information about the problem</li>
</ul>
</li>
<li>Python has a number of predefined exceptions like :
<ul>
<li><code>ValueError</code>, <code>TypeError</code>, <code>KeyError</code> and <code>OSError</code></li>
</ul>
</li>
<li>Exceptions can be raised with the <code>raise</code> statement</li>
<li>It is possible to create User Defined Exceptions :
<ul>
<li>By deriving classes from standard built-in exceptions</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise08</code><br><code class="pill-exercise pill-desc">Exception Handling</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="input-and-output">Input and Output</h1>
<ul>
<li><code>print</code> writes its arguments to standard output, separated by spaces.</li>
<li><code>input</code> reads one line from standard input and removes the trailing newline.</li>
<li>It returns a string; convert it before doing arithmetic.</li>

<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Now playing:"</span><span style="color:#212121">, </span><span style="color:#22863A">"So What"</span><span style="color:#212121">, </span><span style="color:#22863A">"by"</span><span style="color:#212121">, </span><span style="color:#22863A">"Miles Davis"</span><span style="color:#212121">)</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Volume set to </span><span style="color:#1976D2">{</span><span style="color:#212121">volume</span><span style="color:#1976D2">}</span><span style="color:#22863A">%"</span><span style="color:#212121">)</span></span>

<span class="line"><span>Volume set to 65%</span></span>

<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="opening-files">Opening Files</h1>
<ul>
<li><code>open</code> function :
<ul>
<li>Opens a file to be able to read or write a file later</li>
<li>Creates file object which can be used to call other support methods</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>file_object = open(file, mode="r", buffering=-1, encoding=None)</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>file</code> :
<ul>
<li>String value that contains the name of the file to be accessed</li>
</ul>
</li>
<li><code>mode</code> :
<ul>
<li>Determines mode in which the file has to be opened, read, write, append etc.</li>
<li><code>t</code> for text mode is default and optional, <code>b</code> is for byte mode</li>
</ul>
</li>
<li><code>encoding</code> names the encoding of a text file, such as <code>&quot;utf-8&quot;</code></li>
<li><code>buffering</code> :
<ul>
<li><code>0</code> disables buffering, but is allowed only in binary mode</li>
<li><code>1</code> enables line buffering in text mode</li>
<li>If buffering &gt; 1 : Buffering performed with indicated buffer size</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="168" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="168" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="file-open-modes">File Open Modes</h1>
<ul>
<li>Python distinguishes between binary and text I/O :
<ul>
<li>In binary mode content is returned as bytes objects without any decoding</li>
<li>In text mode, as <code>str</code>, bytes decoded using given or platform-specific encoding</li>
</ul>
</li>
</ul>
<table>
<thead>
<tr>
<th>Mode</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>r</code> / <code>rb</code></td>
<td>Reading only, text or binary format. Default is text mode</td>
</tr>
<tr>
<td><code>r+</code> / <code>rb+</code></td>
<td>Both reading and writing, text or binary format</td>
</tr>
<tr>
<td><code>w</code> / <code>wb</code></td>
<td>Writing only, text or binary. Overwrites existing file or creates new file</td>
</tr>
<tr>
<td><code>w+</code> / <code>wb+</code></td>
<td>Both writing and reading, text or binary. Overwrites or creates file</td>
</tr>
<tr>
<td><code>a</code> / <code>ab</code></td>
<td>Appending, text or binary. File pointer is at the end of the file</td>
</tr>
<tr>
<td><code>a+</code> / <code>ab+</code></td>
<td>Both appending and reading, text or binary format</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="169" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="169" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="using-with">Using with</h1>
<ul>
<li><code>with</code> closes the file when the block ends, even after an exception or <code>return</code>.</li>
<li>Closing writes any buffered text to the file.</li>
<li>Prefer this form whenever you open a file.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"last_played.txt"</span><span style="color:#212121">, mode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"w"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fw</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    fw</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(</span><span style="color:#22863A">"So What\n"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#4a9c59"># The file is closed here, even if write() raised.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(fw.closed)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"last_played.txt"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fr</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(fr.</span><span style="color:#6F42C1">read</span><span style="color:#212121">(), end</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # So What</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">usingwith</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="170" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="170" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="reading-text-files">Reading Text Files</h1>
<ul>
<li><code>readline()</code> reads one line, including its <code>\n</code>.</li>
<li><code>read()</code> reads from the current position to the end of the file :
<ul>
<li><code>read(count)</code> reads at most <code>count</code> characters in text mode</li>
</ul>
</li>
<li>A text file is also an iterable of its lines :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"playlist.txt"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> playlist</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> number</span><span style="color:#212121">,</span><span style="color:#24292EFF"> line </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> enumerate</span><span style="color:#212121">(playlist, start</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">number</span><span style="color:#1976D2">}</span><span style="color:#22863A">. </span><span style="color:#1976D2">{</span><span style="color:#212121">line.</span><span style="color:#6F42C1">rstrip</span><span style="color:#212121">()</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>1. So What</span></span>
<span class="line"><span>2. Blue in Green</span></span>
<span class="line"><span>3. Take Five</span></span>
<span class="line"><span>4. Jóga</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>rstrip()</code> removes the newline that ends each line.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">readtextfile</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="171" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="171" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="writing-text-files">Writing Text Files</h1>
<ul>
<li><code>write</code> writes a string to a file opened for writing :
<ul>
<li>It does not add a newline character (<code>\n</code>) to the end of the string</li>
</ul>
</li>
<li>Mode <code>w</code> creates the file or empties an existing one; mode <code>a</code> appends.</li>
<li><code>encoding=&quot;utf-8&quot;</code> stores titles such as <code>Jóga</code> the same way on every platform.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"road_trip.txt"</span><span style="color:#212121">, mode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"w"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fw</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    fw</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(</span><span style="color:#22863A">"Jóga\n"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    fw</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(</span><span style="color:#22863A">"Hoppípolla\n"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    fw</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(</span><span style="color:#22863A">"Svefn-g-englar\n"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"road_trip.txt"</span><span style="color:#212121">, mode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"a"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fa</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    fa</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(</span><span style="color:#22863A">"Glósóli\n"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>File <code>road_trip.txt</code> then holds :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Jóga</span></span>
<span class="line"><span>Hoppípolla</span></span>
<span class="line"><span>Svefn-g-englar</span></span>
<span class="line"><span>Glósóli</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">writetextfile</code></p>
</blockquote>
