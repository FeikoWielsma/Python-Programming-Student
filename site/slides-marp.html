<h1 id="what-is-python">What is Python?</h1>
<ul>
<li>Python is a programming language :
<ul>
<li>A program is a set of instructions a computer carries out</li>
<li>Python code expresses those instructions as text</li>
</ul>
</li>
<li>The Python interpreter is the application that runs Python code</li>
<li>Python programs can process files, automate tasks and build applications</li>
<li>A small Python program displays a message :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Hello, Python!"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Hello, Python!</span></span>
<span class="line"><span></span></span></code></pre>
</section>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="python-background">Python Background</h1>
<ul>
<li>Guido van Rossum started Python at CWI in the Netherlands in 1989</li>
<li>The first public release followed in February 1991</li>
<li>The name comes from the comedy series <em>Monty Python's Flying Circus</em></li>
<li>Python is open source :
<ul>
<li>Its source code can be inspected, changed and shared under its licence</li>
<li>It is free to use, including in commercial applications</li>
</ul>
</li>
</ul>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" role="img" aria-label="Python milestones: development begins in 1989, first public release in 1991, Python 2 in 2000, Python 3 in 2008, Python 2 support ends in 2020">
  <path d="M65 62H895" fill="none" stroke="currentColor" stroke-width="3" opacity=".4" />
  <g fill="currentColor" font-family="sans-serif" text-anchor="middle">
    <circle cx="65" cy="62" r="7" /><circle cx="255" cy="62" r="7" /><circle cx="465" cy="62" r="7" /><circle cx="675" cy="62" r="7" /><circle cx="895" cy="62" r="7" />
    <g font-size="26" font-weight="600"><text x="65" y="33">1989</text><text x="255" y="33">1991</text><text x="465" y="33">2000</text><text x="675" y="33">2008</text><text x="895" y="33">2020</text></g>
    <g font-size="18"><text x="65" y="100">Work begins</text><text x="255" y="100">Public release</text><text x="465" y="100">Python 2</text><text x="675" y="100">Python 3</text><text x="895" y="100">Python 2</text><text x="895" y="124">support ends</text></g>
  </g>
</svg>
<ul>
<li>Python 3 introduced changes that broke compatibility with Python 2</li>
<li>Python 2 examples in older books may need changes to run on Python 3</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="6" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="6" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="python-features">Python Features</h1>
<ul>
<li>Python is a general-purpose language with an emphasis on readable code</li>
</ul>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Meaning in practice</th>
</tr>
</thead>
<tbody>
<tr>
<td>High-level</td>
<td>Work with text, files and collections using built-in operations</td>
</tr>
<tr>
<td>Interpreted</td>
<td>Run source code through the Python interpreter</td>
</tr>
<tr>
<td>Interactive</td>
<td>Try statements directly at the <code>&gt;&gt;&gt;</code> prompt</td>
</tr>
<tr>
<td>Portable</td>
<td>Python runs on Windows, macOS and Linux</td>
</tr>
<tr>
<td>Standard library</td>
<td>Python includes tools for files, dates, internet access and more</td>
</tr>
<tr>
<td>Third-party packages</td>
<td>Install additional tools for specialised tasks</td>
</tr>
</tbody>
</table>
<ul>
<li>Operating-system paths and external tools can still require platform-specific code</li>
<li>A library is reusable code; a package groups code that can be installed or imported</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="7" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="7" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="python-applications">Python Applications</h1>
<ul>
<li>Python programs range from short scripts to complete applications</li>
</ul>
<table>
<thead>
<tr>
<th>Area</th>
<th>Example task</th>
<th>Common tools</th>
</tr>
</thead>
<tbody>
<tr>
<td>Automation</td>
<td>Rename photos and organise folders</td>
<td>Standard library</td>
</tr>
<tr>
<td>Data analysis</td>
<td>Summarise listening history and plot trends</td>
<td>pandas, Matplotlib</td>
</tr>
<tr>
<td>Web applications</td>
<td>Serve a music catalogue through a website</td>
<td>Django, Flask</td>
</tr>
<tr>
<td>Scientific computing</td>
<td>Calculate with arrays of measurements</td>
<td>NumPy, SciPy</td>
</tr>
<tr>
<td>Machine learning</td>
<td>Classify images using a trained model</td>
<td>scikit-learn, PyTorch</td>
</tr>
</tbody>
</table>
<ul>
<li>Libraries provide specialised operations; Python code connects them</li>
<li>Large computations often run inside libraries implemented in compiled languages</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="8" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="8" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="source-code-and-output">Source Code and Output</h1>
<ul>
<li>Source code is the text written in the Python language</li>
<li>Output is the text a running program displays</li>
<li><code>print()</code> displays the value between its parentheses :
<ul>
<li>Quotes mark the beginning and end of a piece of text</li>
<li>The displayed text does not include those quotes</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Playing Imagine</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">first_message</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="9" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="9" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="files-and-folders">Files and Folders</h1>
<ul>
<li>A file stores content under a name :
<ul>
<li>A Python source file has a name ending in <code>.py</code>, such as <code>hello.py</code></li>
<li>A saved file remains available after the editor closes</li>
</ul>
</li>
<li>A folder groups files and other folders :
<ul>
<li>A project folder keeps the files for one program together</li>
<li>A file's path describes its location</li>
</ul>
</li>
<li>An editor opens a file so its contents can be read and changed</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 409 / 200"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 409 200" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M175.58,92C193.08,92 193.08,44 210.58,44L216.58,44" /><path class="pele-marker" d="M223.58,44L215.58,47.36L215.58,40.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_A_C_0"><path d="M175.58,108C193.08,108 193.08,156 210.58,156L216.58,156" /><path class="pele-marker" d="M223.58,156L215.58,159.36L215.58,152.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(91.79,100)"><rect x="-83.79" y="-24" width="167.58" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">course-work folder</text></g><g class="pele-node pele-shape-rect" data-id="B" transform="translate(312.29,44)"><rect x="-88.7" y="-36" width="177.41" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">hello.py</tspan><tspan x="0" y="17.6">Python source code</tspan></text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(296.27,156)"><rect x="-72.69" y="-36" width="145.38" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">pyproject.toml</tspan><tspan x="0" y="17.6">Project settings</tspan></text></g></g></svg></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="10" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="10" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="the-editor-and-the-terminal">The Editor and the Terminal</h1>
<ul>
<li>Visual Studio Code provides two places to work :
<ul>
<li>The editor area contains the Python source file</li>
<li>The terminal accepts commands and displays their output</li>
</ul>
</li>
<li>The Explorer panel lists the files in the open folder</li>
<li><code>File &gt; Open Folder</code> opens a project folder</li>
<li><code>Terminal &gt; New Terminal</code> opens a terminal in that folder</li>
<li>A terminal prompt indicates that a command can be entered :
<ul>
<li>Type the command after the prompt, then press Enter</li>
<li>The prompt itself is not part of the command</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="11" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="11" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="preparing-python">Preparing Python</h1>
<ul>
<li>Python must be installed before a Python file can run</li>
<li><code>uv</code> is a tool that can install Python and run it for a project</li>
<li>On Windows, open PowerShell from the Start menu and run :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">powershell </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF">ExecutionPolicy ByPass </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF">c </span><span style="color:#22863A">"irm https://astral.sh/uv/install.ps1 | iex"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>On macOS or Linux, open Terminal and run :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">curl</span><span style="color:#2B5581"> -LsSf</span><span style="color:#2B5581"> https://astral.sh/uv/install.sh</span><span style="color:#D32F2F"> |</span><span style="color:#6F42C1"> sh</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Close and reopen the terminal, then install Python :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> install</span><span style="color:#1976D2"> 3.14</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="12" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="12" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="editor-setup">Editor Setup</h1>
<ul>
<li>Install Visual Studio Code from <code>https://code.visualstudio.com/</code></li>
<li>Open the Extensions panel using the squares icon on the left :
<ul>
<li>Search for <code>Python</code> and install the extension published by Microsoft</li>
<li>The extension adds Python editing and running support</li>
</ul>
</li>
<li><code>File &gt; Open Folder</code> selects the folder shown in the Explorer panel</li>
<li>A browser-based VS Code in a prepared Codespace already has these tools</li>
</ul>
<table>
<thead>
<tr>
<th>Part</th>
<th>Purpose</th>
<th>Example</th>
</tr>
</thead>
<tbody>
<tr>
<td>Editor</td>
<td>Write and save source code</td>
<td>Visual Studio Code</td>
</tr>
<tr>
<td>Python extension</td>
<td>Add Python support to the editor</td>
<td>Microsoft Python</td>
</tr>
<tr>
<td>Interpreter</td>
<td>Execute Python code</td>
<td>Python 3.14</td>
</tr>
<tr>
<td>Project tool</td>
<td>Prepare Python and run commands</td>
<td><code>uv</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="13" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="13" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="creating-a-project">Creating a Project</h1>
<ul>
<li>A project is a folder holding the files for a program</li>
<li>Open a folder for course work in VS Code, then open a new terminal</li>
<li>Run each command separately :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> init</span><span style="color:#2B5581"> --bare</span><span style="color:#2B5581"> --python</span><span style="color:#1976D2"> 3.14</span><span style="color:#2B5581"> course-work</span></span>
<span class="line"><span style="color:#6F42C1">cd</span><span style="color:#2B5581"> course-work</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>uv init</code> creates the <code>course-work</code> folder and its project settings</li>
<li><code>--bare</code> starts with only the project settings in <code>pyproject.toml</code></li>
<li><code>cd</code> changes the terminal's current folder :
<ul>
<li>Commands now run inside <code>course-work</code></li>
</ul>
</li>
<li>Open the new <code>course-work</code> folder with <code>File &gt; Open Folder</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="14" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="14" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="creating-a-python-file">Creating a Python File</h1>
<ul>
<li>In the Explorer panel, select New File and enter <code>hello.py</code></li>
<li>Type the Python statement in the editor area :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Save the file with <code>File &gt; Save</code> :
<ul>
<li><code>Ctrl+S</code> on Windows and Linux; <code>Cmd+S</code> on macOS</li>
<li>The <code>.py</code> ending is part of the filename</li>
</ul>
</li>
<li>Saving writes the editor's contents to the file on disk</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="15" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="15" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="running-a-python-file">Running a Python File</h1>
<ul>
<li>Open a terminal in the folder containing <code>hello.py</code></li>
<li>Enter this command in the terminal :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> hello.py</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>uv run</code> starts a command using the project's Python</li>
<li><code>python hello.py</code> tells Python to execute the saved file</li>
<li>The first run may display setup messages before the program's output :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Playing Imagine</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>When the program finishes, the terminal prompt returns</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="16" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="16" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="changing-a-program">Changing a Program</h1>
<ul>
<li>Change the text between the quotes in <code>hello.py</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Yesterday"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Save the file, then run the same command again :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> hello.py</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Playing Yesterday</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Python runs the saved contents on each run</li>
<li>Editing a file does not change output from a previous run</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">changed_message</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="17" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="17" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="statements-run-in-order">Statements Run in Order</h1>
<ul>
<li>A statement is an instruction in a Python program</li>
<li>These statements execute from top to bottom :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Yesterday"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Playing Imagine</span></span>
<span class="line"><span>Playing Yesterday</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Each <code>print()</code> ends its output with a new line by default</li>
<li>Running the file again starts the program from the beginning</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">statement_order</code></p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="18" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="18" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="quotes-in-python">Quotes in Python</h1>
<ul>
<li>A string is a value containing text</li>
<li>Matching quotes mark the beginning and end of a string :
<ul>
<li>Single quotes and double quotes both work</li>
<li>The opening and closing quote must be the same kind</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">'Playing Yesterday'</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Tonight's playlist"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An apostrophe can appear inside a double-quoted string</li>
<li>Parentheses surround the value passed to <code>print()</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">quoted_text</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="19" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="19" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="comments-in-python">Comments in Python</h1>
<ul>
<li><code>#</code> starts a comment outside a string :
<ul>
<li>Python ignores the rest of that line</li>
<li>A comment explains a reason or a constraint</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#4a9c59"># Keep the playlist order from the concert.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Yesterday"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Blank lines can separate parts of a program</li>
<li>Comments and blank lines do not produce output</li>
<li>A hash sign inside quotes is text :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Track #1"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">comments</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="20" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="20" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="reading-a-syntax-error">Reading a Syntax Error</h1>
<ul>
<li>Syntax is the set of rules for writing valid Python code</li>
<li>A missing closing quote breaks those rules :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>print("Playing Imagine)</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Python reports the file, line number and kind of error :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>  File "hello.py", line 1</span></span>
<span class="line"><span>    print("Playing Imagine)</span></span>
<span class="line"><span>          ^</span></span>
<span class="line"><span>SyntaxError: unterminated string literal (detected at line 1)</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>A <code>SyntaxError</code> prevents the script from running</li>
<li>The marked location is where Python detected the problem</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="21" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="21" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="correcting-and-rerunning">Correcting and Rerunning</h1>
<ul>
<li>Add the missing closing quote before the closing parenthesis :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Save the file and run it again :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> hello.py</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Playing Imagine</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>An error message remains visible in the terminal after the repair</li>
<li>The most recent run shows whether the saved correction worked</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="22" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="22" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="finding-a-file-to-run">Finding a File to Run</h1>
<ul>
<li>The terminal has a current folder :
<ul>
<li>The filename in the run command is resolved from that folder</li>
<li>The Explorer panel and an existing terminal can show different folders</li>
</ul>
</li>
<li>A message containing <code>can't open file</code> means Python could not open the script :
<ul>
<li>Check that the file is saved as <code>hello.py</code></li>
<li>Check that the terminal is in the folder containing it</li>
</ul>
</li>
<li>Opening the project folder and choosing <code>Terminal &gt; New Terminal</code> gives a new terminal there</li>
<li>An unknown <code>uv</code> command means the tool is unavailable in that terminal :
<ul>
<li>After installing uv, close and reopen VS Code</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="23" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="23" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="python-in-interactive-mode">Python in Interactive Mode</h1>
<ul>
<li>Python can also accept statements directly in a terminal</li>
<li>Start the interpreter without a filename :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The <code>&gt;&gt;&gt;</code> prompt accepts Python code :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>>>> print("Playing Imagine")</span></span>
<span class="line"><span>Playing Imagine</span></span>
<span class="line"><span>>>> 2 + 3</span></span>
<span class="line"><span>5</span></span>
<span class="line"><span>>>> exit()</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The interactive interpreter displays the result of <code>2 + 3</code> directly</li>
<li><code>exit()</code> returns to the terminal prompt; terminal commands run there</li>
<li>Interactive statements are not saved in a <code>.py</code> file</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="24" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="24" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Python Intro</a></div>
<h1 id="summary--python-intro">Summary : Python Intro</h1>
<ul>
<li>A Python program is source code saved in a <code>.py</code> file</li>
<li>The editor changes the source; the interpreter runs the saved file</li>
<li>Terminal commands run from the terminal's current folder</li>
<li><code>uv run python hello.py</code> runs a Python file</li>
<li>Statements run from top to bottom; <code>print()</code> displays output</li>
<li>Quotes enclose strings; <code>#</code> starts a comment outside a string</li>
<li>An error message identifies a problem to correct before rerunning</li>
<li>Changing a program follows a cycle : edit, save, run and inspect the output</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise01</code><br><code class="pill-exercise pill-desc">Python Intro</code></p>
</blockquote>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="26" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="26" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="variables">Variables</h1>
<ul>
<li>Variables give names to values :
<ul>
<li>Assignment makes the name on the left of <code>=</code> refer to the value on the right</li>
<li>Reading the name retrieves its current value</li>
</ul>
</li>
<li>Assignment creates a name; no separate declaration is needed</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">duration </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 222</span><span style="color:#4a9c59">  # Track length in seconds</span></span>
<span class="line"><span style="color:#24292EFF">size_mb </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 8.5</span><span style="color:#4a9c59">  # Photo file size</span></span>
<span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Imagine"</span><span style="color:#4a9c59">  # Track title</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Python represents values as objects with types :
<ul>
<li><code>type(duration)</code> is <code>int</code>, <code>type(size_mb)</code> is <code>float</code>, and <code>type(title)</code> is <code>str</code></li>
</ul>
</li>
<li>Uppercase names such as <code>MAX_VOLUME</code> mark values intended to stay constant</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">variables</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="27" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="27" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="reading-keyboard-input">Reading Keyboard Input</h1>
<ul>
<li><code>input()</code> displays a prompt and waits for a line of text :
<ul>
<li>Pressing Enter submits the text and lets the program continue</li>
<li>The prompt is the text passed between the parentheses</li>
</ul>
</li>
<li>Assignment stores the entered text under a variable name :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> input</span><span style="color:#212121">(</span><span style="color:#22863A">"Track title: "</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(title)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Track title: Imagine</span></span>
<span class="line"><span>Imagine</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>input()</code> returns a string, without the final line break :
<ul>
<li>Typing digits also produces text; numeric calculations require conversion</li>
</ul>
</li>
<li><code>print(title)</code> displays the value stored under <code>title</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">keyboard_input</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="28" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="28" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#25"><span class="ml-tag">python</span>Variables and Data Types</a></div>
<h1 id="everything-is-an-object">Everything is an Object</h1>
<ul>
<li>Every Python value is an object with a type and an identity :
<ul>
<li><code>type(x)</code> reports its type, such as <code>int</code> or <code>str</code></li>
<li><code>id(x)</code> reports an identifier that stays the same while the object exists</li>
</ul>
</li>
<li>Several names can refer to the same object :
<ul>
<li>This is called aliasing</li>
<li>Assigning another value to one name does not reassign the other names</li>
</ul>
</li>
<li>A namespace is the mapping from names to the objects they refer to</li>
</ul>
