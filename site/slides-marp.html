</svg>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Hey Jude"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Value available at index 2 : "</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(playlist[</span><span style="color:#1976D2">2</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">playlist</span><span style="color:#212121">[</span><span style="color:#1976D2">2</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#22863A"> "Jolene"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"New value available at index 2 : "</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(playlist[</span><span style="color:#1976D2">2</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Elements can be added to a list with <code>append()</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">list2 </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">,</span><span style="color:#1976D2"> 3</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">list2</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#1976D2">4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">list2</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#1976D2">5</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list2)</span><span style="color:#4a9c59">  # [1, 2, 3, 4, 5]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Elements can be added to a list at a position with <code>insert(index, item)</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">list2</span><span style="color:#212121">.</span><span style="color:#6F42C1">insert</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">99</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(list2)</span><span style="color:#4a9c59">  # [99, 1, 2, 3, 4, 5]</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="56" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="56" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="delete-list-elements">Delete List Elements</h1>
<ul>
<li>Remove a list element with <code>del</code> or <code>remove()</code></li>
<li>Use <code>del</code> statement if you know index of element to remove :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Hey Jude"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#D32F2F">del</span><span style="color:#24292EFF"> playlist</span><span style="color:#212121">[</span><span style="color:#1976D2">2</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"After deleting value at index 2 : "</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(playlist)</span><span style="color:#4a9c59">  # ['Thriller', 'Imagine', 'Hey Jude']</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Use <code>remove()</code> if want to remove element by value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist</span><span style="color:#212121">.</span><span style="color:#6F42C1">remove</span><span style="color:#212121">(</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"After deleting value 'Thriller' "</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(playlist)</span><span style="color:#4a9c59">  # ['Imagine', 'Hey Jude']</span></span>
<span class="line"></span></code></pre>
<ul>
<li>List itself can also be removed with <code>del</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">del</span><span style="color:#24292EFF"> list1</span></span>
<span class="line"><span style="color:#24292EFF">list1</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#1976D2">100</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # gives NameError, name list1 not defined anymore</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">updatinglists</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="57" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="57" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="multidimensional-lists">Multidimensional Lists</h1>
<ul>
<li>A tiny image can store brightness values in rows and columns :
<ul>
<li>Each row is a list inside the outer list</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">grid </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span></span>
<span class="line"><span style="color:#24292EFF">    [</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">,</span><span style="color:#1976D2"> 3</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">    [</span><span style="color:#1976D2">4</span><span style="color:#212121">,</span><span style="color:#1976D2"> 5</span><span style="color:#212121">,</span><span style="color:#1976D2"> 6</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(grid[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # [1, 2, 3], the first row</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(grid[</span><span style="color:#1976D2">1</span><span style="color:#212121">][</span><span style="color:#1976D2">2</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # 6, row 1, column 2</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(grid), </span><span style="color:#6F42C1">len</span><span style="color:#212121">(grid[</span><span style="color:#1976D2">0</span><span style="color:#212121">]))</span><span style="color:#4a9c59">  # 2 3, rows and columns</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Each row is an ordinary list, so it can be changed in place or added to :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">grid</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#24292EFF">[</span><span style="color:#1976D2">0</span><span style="color:#24292EFF">] </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 10</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(grid)</span><span style="color:#4a9c59">  # [[10, 2, 3], [4, 5, 6]]</span></span>
<span class="line"><span style="color:#24292EFF">grid</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">([</span><span style="color:#1976D2">7</span><span style="color:#212121">, </span><span style="color:#1976D2">8</span><span style="color:#212121">, </span><span style="color:#1976D2">9</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(grid)</span><span style="color:#4a9c59">  # [[10, 2, 3], [4, 5, 6], [7, 8, 9]]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Repeating a row with <code>*</code> repeats one list object, not a copy of it :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">shared </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [[</span><span style="color:#1976D2">0</span><span style="color:#24292EFF">] </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 3</span><span style="color:#24292EFF">] </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 2</span></span>
<span class="line"><span style="color:#24292EFF">shared</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#24292EFF">[</span><span style="color:#1976D2">0</span><span style="color:#24292EFF">] </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(shared)</span><span style="color:#4a9c59">  # [[1, 0, 0], [1, 0, 0]], both rows are one list</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">multidimensionallists</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="58" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="58" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="list-operations">List Operations</h1>
<table>
<thead>
<tr>
<th>Python Expression</th>
<th>Results</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>len([1,2,3])</code></td>
<td><code>3</code></td>
<td>Length</td>
</tr>
<tr>
<td><code>[1,2,3]+[4,5,6]</code></td>
<td><code>[1,2,3,4,5,6]</code></td>
<td>Concatenation</td>
</tr>
<tr>
<td><code>['go']*3</code></td>
<td><code>['go','go','go']</code></td>
<td>Repetition</td>
</tr>
<tr>
<td><code>3 in [1,2,3]</code></td>
<td><code>True</code></td>
<td>Membership</td>
</tr>
<tr>
<td><code>for x in [1,2,3]: print(x)</code></td>
<td><code>1 2 3</code></td>
<td>Iteration</td>
</tr>
</tbody>
</table>
<ul>
<li>A music player can keep a stack of visited views :
<ul>
<li><code>append</code> records the latest view; <code>pop</code> removes it when going back</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">history </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Library"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Album"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Track"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">history</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#22863A">"Queue"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">history</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#22863A">"Artist"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(history)</span><span style="color:#4a9c59">  # ['Library', 'Album', 'Track', 'Queue', 'Artist']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(history.</span><span style="color:#6F42C1">pop</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # Artist</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(history)</span><span style="color:#4a9c59">  # ['Library', 'Album', 'Track', 'Queue']</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">listsasstacks</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="59" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="59" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="list-functions-and-methods">List Functions and Methods</h1>
<table>
<thead>
<tr>
<th>Function</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>len(list)</code></td>
<td>Gives the total length of the list</td>
</tr>
<tr>
<td><code>max(list)</code> / <code>min(list)</code></td>
<td>Returns item from the list with max or min value</td>
</tr>
<tr>
<td><code>list(seq)</code></td>
<td>Converts a tuple into list</td>
</tr>
<tr>
<td><code>list.append(obj)</code></td>
<td>Appends object obj to list</td>
</tr>
<tr>
<td><code>list.count(obj)</code></td>
<td>Returns count of how many times obj occurs in list</td>
</tr>
<tr>
<td><code>list.extend(seq)</code></td>
<td>Appends the contents of seq to list</td>
</tr>
<tr>
<td><code>list.index(obj)</code></td>
<td>Returns the lowest index in list that obj appears</td>
</tr>
<tr>
<td><code>list.insert(index, obj)</code></td>
<td>Inserts object obj into list at offset index</td>
</tr>
<tr>
<td><code>list.pop(index=-1)</code></td>
<td>Removes and returns the item at an index; default is last</td>
</tr>
<tr>
<td><code>list.remove(obj)</code></td>
<td>Removes object obj from list</td>
</tr>
<tr>
<td><code>list.reverse()</code></td>
<td>Reverses objects of list in place</td>
</tr>
<tr>
<td><code>list.sort(key=None, reverse=False)</code></td>
<td>Sorts in place; options are keyword-only</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">listmethods</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="60" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="60" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="tuples">Tuples</h1>
<ul>
<li>A tuple stores a fixed sequence of values :
<ul>
<li>Each position can have a particular role, such as title and duration</li>
<li>Photo dimensions similarly pair width and height</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">track </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 183</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">dimensions </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">1920</span><span style="color:#212121">,</span><span style="color:#1976D2"> 1080</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#4a9c59">  # The comma creates a tuple.</span></span>
<span class="line"><span style="color:#24292EFF">empty </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ()</span></span>
<span class="line"><span style="color:#24292EFF">single </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#24292EFF">)  </span><span style="color:#4a9c59"># A one-item tuple needs the comma.</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Items cannot be replaced, inserted or removed from an existing tuple</li>
<li>Commas create the tuple; parentheses usually make its boundaries clearer</li>
<li>A tuple may contain mutable objects, whose own contents can still change</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">tuples</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="61" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="61" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="accessing-tuples">Accessing Tuples</h1>
<ul>
<li>Positions in this track record hold the title, artist and duration :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">track </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "John Lennon"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 183</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(track[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # Imagine</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(track[</span><span style="color:#1976D2">1</span><span style="color:#212121">:])</span><span style="color:#4a9c59">  # ('John Lennon', 183)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(track))</span><span style="color:#4a9c59">  # 3</span></span>
<span class="line"><span style="color:#4a9c59"># track[2] = 240  # TypeError: tuple items cannot be assigned.</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Slicing and concatenation can create a different record :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">long_mix </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> track</span><span style="color:#212121">[:</span><span style="color:#1976D2">2</span><span style="color:#212121">]</span><span style="color:#D32F2F"> +</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">240</span><span style="color:#212121">,</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(long_mix)</span><span style="color:#4a9c59">  # ('Imagine', 'John Lennon', 240)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(track)</span><span style="color:#4a9c59">  # ('Imagine', 'John Lennon', 183)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The original tuple remains unchanged</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">tupleaccess</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="62" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="62" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="delete-tuple-elements">Delete Tuple Elements</h1>
<ul>
<li>Individual items cannot be removed from an existing tuple</li>
<li>A slice can create a shorter tuple :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">shorter </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> titles</span><span style="color:#212121">[:</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(shorter)</span><span style="color:#4a9c59">  # ('Imagine', 'Yesterday')</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>del</code> removes a name binding, not items from a tuple :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">del</span><span style="color:#24292EFF"> titles</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(shorter)</span><span style="color:#4a9c59">  # ('Imagine', 'Yesterday')</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Other names keep their objects available after a binding is removed</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="63" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="63" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="usage-of-tuples">Usage of Tuples</h1>
<ul>
<li>Tuples have many uses :
<ul>
<li>Photo dimensions, track metadata and records from a database</li>
</ul>
</li>
<li>Any set of comma-separated objects default to tuples :
<ul>
<li>Even without parentheses around them</li>
</ul>
</li>
<li>Tuples can be dictionary keys and set members if every item is hashable</li>
<li>Tuples can make your code safer :
<ul>
<li>Allows you to &quot;write-protect&quot; data that does not need to be changed</li>
</ul>
</li>
<li>A tuple can have lists as items :
<ul>
<li>The items in the lists are mutable however</li>
</ul>
</li>
<li>Tuple can be destructured and contents assigned to variables :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">selection </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Toxic"</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(selection)</span><span style="color:#4a9c59">  # ('Imagine', 'Toxic')</span></span>
<span class="line"><span style="color:#24292EFF">primary</span><span style="color:#212121">,</span><span style="color:#24292EFF"> backup </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> selection</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(primary)</span><span style="color:#4a9c59">  # 'Imagine'</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(backup)</span><span style="color:#4a9c59">  # 'Toxic'</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">destructurewithtuples</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="64" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="64" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="tuple-functions">Tuple Functions</h1>
<ul>
<li>Only functions and methods that do not modify tuple available</li>
</ul>
<table>
<thead>
<tr>
<th>Function</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>len(tuple)</code></td>
<td>Gives the total length of the tuple</td>
</tr>
<tr>
<td><code>max(tuple)</code></td>
<td>Returns item from the tuple with max value</td>
</tr>
<tr>
<td><code>min(tuple)</code></td>
<td>Returns item from the tuple with min value</td>
</tr>
<tr>
<td><code>tuple(seq)</code></td>
<td>Converts a list into tuple</td>
</tr>
<tr>
<td><code>tup.index(i)</code></td>
<td>Index of the first occurrence of i in tup</td>
</tr>
<tr>
<td><code>tup.count(i)</code></td>
<td>Total number of occurrences of i in tup</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="65" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="65" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="sets">Sets</h1>
<ul>
<li>A set keeps each distinct value once :
<ul>
<li>Repeated artist names or track requests become single members</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">artists </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Queen"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Queen"</span><span style="color:#212121">,</span><span style="color:#22863A"> "ABBA"</span><span style="color:#212121">}</span><span style="color:#4a9c59">  # Duplicate names become one member.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(artists))</span><span style="color:#4a9c59">  # ['ABBA', 'Queen']</span></span>
<span class="line"><span style="color:#24292EFF">requests </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">unique </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> set</span><span style="color:#212121">(requests)</span></span>
<span class="line"><span style="color:#24292EFF">unique</span><span style="color:#212121">.</span><span style="color:#6F42C1">add</span><span style="color:#212121">(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(unique))</span><span style="color:#4a9c59">  # ['Imagine', 'Respect', 'Yesterday']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Respect"</span><span style="color:#D32F2F"> in</span><span style="color:#212121"> unique)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Sets have no sequence order; <code>sorted</code> gives predictable printed output</li>
<li>An empty set is <code>set()</code>; <code>{}</code> creates an empty dictionary</li>
<li><code>frozenset(requests)</code> creates a set whose members cannot be changed</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">setsandfrozensets</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="66" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="66" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="set-operations">Set Operations</h1>
<ul>
<li>Two fields of science show who worked in either field or in both :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">physics </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Einstein"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Bohr"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Curie"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Fermi"</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">chemistry </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Curie"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Rutherford"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Pauling"</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Curie"</span><span style="color:#D32F2F"> in</span><span style="color:#212121"> chemistry)</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(physics </span><span style="color:#D32F2F">|</span><span style="color:#212121"> chemistry))</span><span style="color:#4a9c59">  # union, in either set</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(physics </span><span style="color:#D32F2F">&#x26;</span><span style="color:#212121"> chemistry))</span><span style="color:#4a9c59">  # intersection, in both</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(physics </span><span style="color:#D32F2F">-</span><span style="color:#212121"> chemistry))</span><span style="color:#4a9c59">  # difference, in physics only</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(physics </span><span style="color:#D32F2F">^</span><span style="color:#212121"> chemistry))</span><span style="color:#4a9c59">  # in one of the two, not both</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>True</span></span>
<span class="line"><span>['Bohr', 'Curie', 'Einstein', 'Fermi', 'Pauling', 'Rutherford']</span></span>
<span class="line"><span>['Curie']</span></span>
<span class="line"><span>['Bohr', 'Einstein', 'Fermi']</span></span>
<span class="line"><span>['Bohr', 'Einstein', 'Fermi', 'Pauling', 'Rutherford']</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>A set has no order, so <code>sorted()</code> turns it into a list to print it predictably</li>
<li>Each operator has a method form that accepts any iterable :
<ul>
<li><code>union()</code>, <code>intersection()</code>, <code>difference()</code> and <code>symmetric_difference()</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="67" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="67" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="dictionaries">Dictionaries</h1>
<ul>
<li>A dictionary can map a track title to its duration in seconds :
<ul>
<li>Entries consist of keys and values</li>
<li>Keys must be hashable; strings and numbers are common choices</li>
<li>Values can be any arbitrary Python object</li>
</ul>
</li>
<li>Dictionaries are hash tables :
<ul>
<li>Looking up a key is fast, however large the dictionary</li>
</ul>
</li>
<li>Dictionaries are enclosed by curly braces <code>{ }</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">durations </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 125</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 149</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations)</span><span style="color:#4a9c59">  # {'Imagine': 183, 'Yesterday': 125, 'Respect': 149}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Values can be assigned and accessed using square brackets <code>[]</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">durations</span><span style="color:#212121">[</span><span style="color:#22863A">"Toxic"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 199</span></span>
<span class="line"><span style="color:#24292EFF">durations</span><span style="color:#212121">[</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 357</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations)</span></span>
<span class="line"><span style="color:#4a9c59"># {'Imagine': 183, 'Yesterday': 125, 'Respect': 149, 'Toxic': 199, 'Thriller': 357}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Dictionaries remember insertion order :
<ul>
<li>Keys come out in the order in which they were first added</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="68" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="68" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="accessing-values-in-dictionary">Accessing Values in Dictionary</h1>
<ul>
<li>Keys are unique within a dictionary while values may be the same :
<ul>
<li>Values of a dictionary can be of any type</li>
<li>Keys must be hashable; a tuple qualifies only if all its items are hashable</li>
</ul>
</li>
<li>Use square brackets along with the key to obtain its value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations[</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # 125</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations[</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # 357</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Dictionary can be updated by modifying an existing entry :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">durations</span><span style="color:#212121">[</span><span style="color:#22863A">"Respect"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 147</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations[</span><span style="color:#22863A">"Respect"</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # 147</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Dictionary entry can be deleted :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">del</span><span style="color:#24292EFF"> durations</span><span style="color:#212121">[</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations[</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # KeyError</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Entire contents of dictionary is cleared with <code>clear()</code> :
<ul>
<li>Entire dictionary can be deleted in single operation with del</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">dictionaries</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="69" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="69" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="properties-of-dictionary-keys">Properties of Dictionary Keys</h1>
<ul>
<li>Keys must be hashable :
<ul>
<li>Their hash stays stable, and equal keys must have equal hashes</li>
<li>Strings and numbers qualify; lists and dictionaries do not</li>
<li>A tuple is hashable only when every item is hashable</li>
</ul>
</li>
<li>Values can be any object; assigning an equal key replaces its value</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">track_lengths </span><span style="color:#D32F2F">=</span><span style="color:#212121"> {</span><span style="color:#24292EFF">(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "John Lennon"</span><span style="color:#24292EFF">)</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(track_lengths[(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">, </span><span style="color:#22863A">"John Lennon"</span><span style="color:#212121">)])</span><span style="color:#4a9c59">  # 183</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An immutable tuple can contain an unhashable list :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">hash</span><span style="color:#212121">((</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">, []))</span><span style="color:#4a9c59">  # TypeError: unhashable type: 'list'</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="70" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="70" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="annotating-collections">Annotating Collections</h1>
<ul>
<li>Each built-in collection is annotated with the type of what it holds :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">scores</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">10</span><span style="color:#212121">,</span><span style="color:#1976D2"> 20</span><span style="color:#212121">,</span><span style="color:#1976D2"> 30</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">names</span><span style="color:#212121">:</span><span style="color:#24292EFF"> set</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#212121"> {</span><span style="color:#22863A">"Alice"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Bob"</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#24292EFF">track_lengths</span><span style="color:#212121">:</span><span style="color:#24292EFF"> dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#212121"> {</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 183</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">:</span><span style="color:#1976D2"> 125</span><span style="color:#212121">}</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A dictionary takes two types, the key first and then the value</li>
<li>A tuple is annotated position by position, because its length is fixed :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">point</span><span style="color:#212121">:</span><span style="color:#24292EFF"> tuple</span><span style="color:#212121">[</span><span style="color:#1976D2">int</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">3</span><span style="color:#212121">,</span><span style="color:#1976D2"> 4</span><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">track</span><span style="color:#212121">:</span><span style="color:#24292EFF"> tuple</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 183</span><span style="color:#24292EFF">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An ellipsis means any number of one type :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">readings</span><span style="color:#212121">:</span><span style="color:#24292EFF"> tuple</span><span style="color:#212121">[</span><span style="color:#1976D2">float</span><span style="color:#212121">,</span><span style="color:#24292EFF"> ...</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">1.5</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2.5</span><span style="color:#212121">,</span><span style="color:#1976D2"> 3.5</span><span style="color:#24292EFF">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Annotate where the collection is homogeneous, which most are :
<ul>
<li>Mixed element types are allowed, but a playlist of titles has the clearer<br />
annotation <code>list[str]</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="71" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="71" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="dictionary-functions-and-methods">Dictionary Functions and Methods</h1>
<table>
<thead>
<tr>
<th>Function</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>len(dict)</code></td>
<td>Gives the total length, or nr. of items, in the dictionary</td>
</tr>
<tr>
<td><code>str(dict)</code></td>
<td>Produces a printable string representation of a dictionary</td>
</tr>
<tr>
<td><code>fromkeys()</code></td>
<td>Create new dictionary with keys from seq, values set to value</td>
</tr>
<tr>
<td><code>dict.clear()</code></td>
<td>Removes all elements of dictionary dict</td>
</tr>
<tr>
<td><code>dict.copy()</code></td>
<td>Returns a shallow copy of dictionary dict</td>
</tr>
<tr>
<td><code>dict.get(key, default)</code></td>
<td>Returns the value for the key, or the default when the key is absent</td>
</tr>
<tr>
<td><code>dict.popitem()</code></td>
<td>Removes and returns the (key, value) pair added last</td>
</tr>
<tr>
<td><code>dict.items()</code></td>
<td>Returns a view of the dictionary's <code>(key, value)</code> pairs</td>
</tr>
<tr>
<td><code>dict.keys()</code></td>
<td>Returns a view of the dictionary's keys</td>
</tr>
<tr>
<td><code>dict.update(dict2)</code></td>
<td>Adds or replaces entries using the key-value pairs in <code>dict2</code></td>
</tr>
<tr>
<td><code>dict.values()</code></td>
<td>Returns a view of the dictionary's values</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">dictionarymethods</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="72" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="72" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="using-library-code">Using Library Code</h1>
<ul>
<li>A module is a file of Python code whose names can be imported</li>
<li>The standard library supplies modules with Python :
<ul>
<li><code>import math</code> makes its names available through <code>math.name</code></li>
<li><code>from math import sqrt</code> makes just <code>sqrt</code> available directly</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> math</span></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> math </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqrt</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(math.</span><span style="color:#6F42C1">sqrt</span><span style="color:#212121">(</span><span style="color:#1976D2">9</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 3.0</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">sqrt</span><span style="color:#212121">(</span><span style="color:#1976D2">16</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # 4.0</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Imports run before the code that uses those names</li>
<li>Standard-library modules need no <code>uv add</code> command</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">library_imports</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="73" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="73" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="choosing-a-random-item">Choosing a Random Item</h1>
<ul>
<li><code>random.choice</code> returns one item from a nonempty sequence</li>
<li>Repeated runs can choose different items</li>
<li>A fixed value such as <code>track = &quot;Imagine&quot;</code> makes an example easier to check</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> random</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">tracks </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(random.</span><span style="color:#6F42C1">choice</span><span style="color:#212121">(tracks))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">random_choice</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="74" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="74" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#52"><span class="ml-tag">python</span>Data Structures</a></div>
<h1 id="summary--data-structures">Summary : Data Structures</h1>
<ul>
<li>Sequences are most basic data structure :
<ul>
<li>Each element of a sequence is assigned a number, its position or index</li>
<li>First index is zero, the second index is one, and so forth</li>
</ul>
</li>
<li>A playlist stores tracks in a chosen order :
<ul>
<li>Lists are mutable sequences</li>
<li>Contain items separated by commas and enclosed within square brackets <code>[]</code></li>
<li>Items can be of different data types, and lists can hold other lists</li>
</ul>
</li>
<li>Tuples are immutable sequences :
<ul>
<li>Enclosed in parenthesis ( ) instead of brackets</li>
<li>Consist of a number of values separated by commas</li>
</ul>
</li>
<li>Sets are unordered collections with no duplicates :
<ul>
<li>Fast membership tests, and union, intersection and difference</li>
<li>Set is mutable and <code>frozenset</code> is immutable</li>
</ul>
</li>
<li>Dictionaries map keys to values, in insertion order :
<ul>
<li>Pairs of keys and values, separated by a comma and a colon</li>
<li>Enclosed by curly braces <code>{ }</code>, values accessed with square brackets <code>[]</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise03</code><br><code class="pill-exercise pill-desc">Data Structures</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="control-flow-constructs">Control Flow Constructs</h1>
<ul>
<li>Statements run one after the other unless a control flow construct intervenes :
<ul>
<li>Branching constructs choose which block runs</li>
<li>Iteration constructs repeat a block</li>
</ul>
</li>
<li>Branching statements :
<ul>
<li><code>if</code>, <code>if...else</code> and <code>elif</code></li>
<li><code>match</code>, which compares one value against a series of patterns</li>
</ul>
</li>
<li>Iteration statements :
<ul>
<li><code>while</code>, which repeats as long as a condition holds</li>
<li><code>for</code>, which takes each item of a sequence in turn</li>
</ul>
</li>
<li>Statements that steer a loop or fill a gap :
<ul>
<li><code>break</code>, <code>continue</code>, a loop's <code>else</code>, and <code>pass</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="77" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="77" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="if-statement">if Statement</h1>
<ul>
<li><code>if</code> runs an indented block when its condition is true.</li>
<li>Execution continues after the block whether the condition is true or false.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">count </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 3</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> count </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 0</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Items available"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Check complete"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="else-statement">else Statement</h1>
<ul>
<li><code>else</code> runs when the <code>if</code> condition is false :
<ul>
<li>Exactly one of the two blocks runs</li>
<li><code>else</code> has no condition of its own</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">battery </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 15</span></span>

<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Camera ready"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Charge the battery"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Charge the battery</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>With <code>battery = 80</code>, the first block runs instead</li>
<li>An optional <code>else</code> comes last</li>

<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">else</code></p>

<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="elif-statement">elif Statement</h1>
<ul>
<li><code>elif</code> tests another condition when earlier conditions were false :
<ul>
<li>Only the first matching block runs</li>
<li>An optional <code>else</code> handles anything left over</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">filename </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "cover.png"</span></span>

<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Unsupported image format"</span><span style="color:#212121">)</span></span>

<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="nested-ifelifelse">Nested if...elif...else</h1>
<ul>
<li>An inner condition is tested only when its outer block runs :
<ul>
<li>The storage check runs only when the battery has enough charge</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">battery </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 80</span></span>
<span class="line"><span style="color:#24292EFF">photos_left </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 3</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> battery </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 20</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> photos_left </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 0</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Camera ready"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Storage full"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Charge the battery"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Each nesting level adds four spaces</li>
<li>A single test can combine these conditions when separate messages are unnecessary :
<ul>
<li><code>battery &gt;= 20 and photos_left &gt; 0</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">nested_if</code></p>
</blockquote>

<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="while-loop">while Loop</h1>
<ul>
<li><code>while</code> repeats a block while its condition is true :
<ul>
<li>The condition is tested before every pass, including the first</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">shot </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"><span style="color:#D32F2F">while</span><span style="color:#24292EFF"> shot </span><span style="color:#D32F2F">&#x3C;=</span><span style="color:#1976D2"> 5</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Photo </span><span style="color:#1976D2">{</span><span style="color:#212121">shot</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    shot </span><span style="color:#D32F2F">+=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"></span></code></pre>
<ul>
<li>This photo burst prints <code>Photo 1</code> through <code>Photo 5</code></li>
<li><code>shot += 1</code> changes the value used by the next condition test</li>
<li>When <code>shot</code> reaches <code>6</code>, execution continues after the loop</li>
</ul>
