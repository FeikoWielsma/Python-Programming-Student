<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="infinite-while-loop">Infinite while Loop</h1>
<ul>
<li>A player can keep accepting requests until interrupted :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">while</span><span style="color:#1976D2"> True</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    title </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> input</span><span style="color:#212121">(</span><span style="color:#22863A">"Queue a track: "</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Requested: </span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>True</code> never becomes false, so this loop does not finish by itself</li>
<li>Press Ctrl+C to interrupt it; Python reports <code>KeyboardInterrupt</code></li>
<li>A condition with <code>break</code> can provide an ordinary exit from a continuous loop</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">infinitewhile</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="84" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="84" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="for-loop">for Loop</h1>
<ul>
<li><code>for</code> runs a block once for each item in a list, string or other iterable.</li>
<li>The loop variable receives the next item before the block runs.</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 767 / 168"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 767 168" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M75.12,84L116.12,84" /><path class="pele-marker" d="M123.12,84L115.12,87.36L115.12,80.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_C_0"><path d="M238.53,68L251.53,68C268.08,68 268.08,32 284.63,32L341.25,32" /><path class="pele-marker" d="M348.25,32L340.25,35.36L340.25,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_C_D_0"><path d="M582.57,32C600.07,32 600.07,50 617.57,50L623.57,50" /><path class="pele-marker" d="M630.57,50L622.57,53.36L622.57,46.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_D_B_0"><path d="M630.57,66L617.57,66C600.07,66 600.07,84 582.57,84L271.13,84" /><path class="pele-marker" d="M264.13,84L272.13,80.64L272.13,87.36Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_E_0"><path d="M238.53,100L251.53,100C268.08,100 268.08,136 284.63,136L393.71,136" /><path class="pele-marker" d="M400.71,136L392.71,139.36L392.71,132.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_B_C_0"><rect x="286.63" y="21.5" width="32.12" height="21" rx="3" fill="var(--_bg)" /><text x="302.69" y="36.9" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_B_E_0"><rect x="289.74" y="125.5" width="25.89" height="21" rx="3" fill="var(--_bg)" /><text x="302.69" y="140.9" text-anchor="middle">No</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(41.56,84)"><rect x="-33.56" y="-24" width="67.12" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">start</text></g><g class="pele-node pele-shape-diam" data-id="B" transform="translate(193.62,84)"><polygon points="0,-44.06 70.5,0 0,44.07 -70.5,0" fill="var(--_s)" stroke="var(--_b)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">next item?</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(465.41,32)"><rect x="-117.16" y="-24" width="234.32" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">assign it to the loop variable</text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(694.37,58)"><rect x="-63.8" y="-24" width="127.6" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">run the block</text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(465.41,136)"><rect x="-64.7" y="-24" width="129.39" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">after the loop</text></g></g></svg></div>
<ul>
<li>An empty sequence skips the block entirely.</li>
<li>The loop stops automatically when there are no items left.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="85" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="85" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="looping-over-a-playlist">Looping over a Playlist</h1>
<ul>
<li><code>title</code> takes each item from <code>playlist</code> in turn.</li>
<li>The unindented <code>print</code> runs once, after the loop.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> playlist</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Now playing: </span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playlist finished"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Now playing: Imagine</span></span>
<span class="line"><span>Now playing: Yesterday</span></span>
<span class="line"><span>Now playing: Respect</span></span>
<span class="line"><span>Playlist finished</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Any iterable works the same way; a string gives one character per pass :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> letter </span><span style="color:#D32F2F">in</span><span style="color:#22863A"> "ABBA"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(letter, end</span><span style="color:#D32F2F">=</span><span style="color:#22863A">" "</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>A B B A</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">for</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="86" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="86" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="iterating-by-sequence-index">Iterating by Sequence Index</h1>
<ul>
<li>A sequence can be walked by index, using <code>len()</code> and <code>range()</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> index </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> range</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(playlist)):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Now playing :"</span><span style="color:#212121">, playlist[index])</span></span>
<span class="line"></span></code></pre>
<ul>
<li>This works, and is what a loop over positions looks like in many languages :
<ul>
<li><code>len()</code> gives the number of elements, <code>range()</code> the sequence of positions</li>
<li>It is worth recognising, because you will meet it in other people's code</li>
</ul>
</li>
<li>In Python it is rarely what you want :
<ul>
<li>The index is only used to look the element back up again</li>
<li>A <code>range</code> that drifts out of step with the sequence is a common bug</li>
</ul>
</li>
<li>When the element is all you need, iterate the sequence itself :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> playlist</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Now playing :"</span><span style="color:#212121">, title)</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="87" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="87" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="iterating-with-enumerate">Iterating with enumerate</h1>
<ul>
<li>When the index is genuinely needed, <code>enumerate</code> yields both :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> index</span><span style="color:#212121">,</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> enumerate</span><span style="color:#212121">(playlist):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(index, title)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>0 Imagine</span></span>
<span class="line"><span>1 Yesterday</span></span>
<span class="line"><span>2 Respect</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The two can never fall out of step, because they come from one call</li>
<li>Counting starts at zero unless a <code>start</code> is given :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> number</span><span style="color:#212121">,</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> enumerate</span><span style="color:#212121">(playlist, start</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(number, title)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The pattern generalises :
<ul>
<li><code>enumerate(seq)</code> for position and element</li>
<li><code>zip(a, b)</code> for two sequences walked in step, covered in Comprehensions</li>
<li><code>dict.items()</code> for a dictionary's keys and values together</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">loopbyindex</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="88" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="88" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="break-and-continue-statements">break and continue Statements</h1>
<ul>
<li><code>continue</code> skips an item and starts the next iteration :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> filename </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"cover.jpg"</span><span style="color:#212121">,</span><span style="color:#22863A"> "notes.txt"</span><span style="color:#212121">,</span><span style="color:#22863A"> "stage.jpg"</span><span style="color:#24292EFF">]</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#D32F2F"> not</span><span style="color:#24292EFF"> filename</span><span style="color:#212121">.</span><span style="color:#6F42C1">endswith</span><span style="color:#212121">(</span><span style="color:#22863A">".jpg"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#D32F2F">        continue</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Photo: </span><span style="color:#1976D2">{</span><span style="color:#212121">filename</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>break</code> ends the loop immediately when the requested track is found :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> track </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Thriller"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Hey Jude"</span><span style="color:#24292EFF">]</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> track </span><span style="color:#D32F2F">==</span><span style="color:#22863A"> "Respect"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">        break</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Checked </span><span style="color:#1976D2">{</span><span style="color:#212121">track</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Search complete"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The final message runs after the search; <code>Hey Jude</code> is never checked</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">breakandcontinue</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="89" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="89" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="loop-with-else-combination">Loop with else Combination</h1>
<ul>
<li>A search uses <code>else</code> for the case where no item matched :
<ul>
<li>The <code>else</code> block runs when the loop finishes without <code>break</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">requested </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Wonderwall"</span></span>
<span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Respect"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> track </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> playlist</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> track </span><span style="color:#D32F2F">==</span><span style="color:#24292EFF"> requested</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Found </span><span style="color:#1976D2">{</span><span style="color:#212121">requested</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">        break</span></span>
<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">requested</span><span style="color:#1976D2">}</span><span style="color:#22863A"> is not in the playlist"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Wonderwall is not in the playlist</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>With <code>requested = &quot;Yesterday&quot;</code>, <code>break</code> skips the <code>else</code> block</li>
<li>A <code>while</code> loop can also have <code>else</code>; it runs when the condition becomes false</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">for_else</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="90" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="90" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="pass-statement">pass Statement</h1>
<ul>
<li><code>pass</code> fills a required block while an action is still being written :
<ul>
<li>It performs no operation</li>
<li>Execution continues with the next statement</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">command </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "skip"</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> command </span><span style="color:#D32F2F">==</span><span style="color:#22863A"> "skip"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    pass</span><span style="color:#4a9c59">  # The next-track action is not implemented yet.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Command received: </span><span style="color:#1976D2">{</span><span style="color:#212121">command</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Command received: skip</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Unlike <code>continue</code>, <code>pass</code> does not skip the rest of a loop iteration</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">passstatement</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="91" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="91" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="match-statement">match Statement</h1>
<ul>
<li><code>match</code> compares a value with the cases in order :
<ul>
<li>Only the first matching case runs</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">command </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "play"</span></span>
<span class="line"><span style="color:#D32F2F">match</span><span style="color:#24292EFF"> command</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    case</span><span style="color:#22863A"> "play"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Playing the current track"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    case</span><span style="color:#22863A"> "skip"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Moving to the next track"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    case</span><span style="color:#22863A"> "quit"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Player stopped"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    case</span><span style="color:#24292EFF"> _</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"Unknown player command"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Quoted strings match those exact values</li>
<li><code>case _</code> handles remaining values and belongs last</li>
<li>Execution continues after the block; cases need no <code>break</code></li>
<li>Python 3.10 or later is required</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">matchstatement</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="92" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="92" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="unpacking-in-for-loops">Unpacking in for Loops</h1>
<ul>
<li>A <code>for</code> loop unpacks each item the same way, and the unpacking can nest :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [(</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (</span><span style="color:#1976D2">2</span><span style="color:#212121">,</span><span style="color:#24292EFF">)]</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> (number</span><span style="color:#212121">,</span><span style="color:#24292EFF">) </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> rows</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(number)</span><span style="color:#4a9c59">  # 1, then 2</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">records </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [(</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "John Lennon"</span><span style="color:#24292EFF">))]</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> number</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> artist) </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> records</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(number, title, artist)</span><span style="color:#4a9c59">  # 1 Imagine John Lennon</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">tuple_unpacking</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="93" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="93" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#75"><span class="ml-tag">python</span>Control Flow</a></div>
<h1 id="summary--control-flow">Summary : Control Flow</h1>
<ul>
<li>Branching statements choose which code runs :
<ul>
<li><code>if</code>, <code>if...else</code> and <code>elif</code> test conditions in turn</li>
<li><code>match</code> compares data against a series of patterns</li>
</ul>
</li>
<li>Iteration statements repeat a block of code :
<ul>
<li><code>while</code> repeats as long as a condition holds</li>
<li><code>for</code> iterates over each item of a sequence</li>
</ul>
</li>
<li>Statements that steer a loop :
<ul>
<li><code>break</code> exits the loop early</li>
<li><code>continue</code> skips to the next iteration</li>
<li>An <code>else</code> clause runs when the loop finishes without a <code>break</code></li>
</ul>
</li>
<li>The <code>pass</code> statement is a no-op placeholder where a statement is required</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise04</code><br><code class="pill-exercise pill-desc">Control Flow</code></p>
</blockquote>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="95" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="95" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="functions">Functions</h1>
<ul>
<li>A function gives a name to a task that a program repeats :
<ul>
<li>A music player stores track lengths in seconds</li>
<li>Its display needs a duration such as <code>3:42</code></li>
</ul>
</li>
<li>Python provides functions such as <code>print()</code>, <code>input()</code> and <code>len()</code> :
<ul>
<li>Programs define their own functions with <code>def</code></li>
</ul>
</li>
<li>A function can take a value and return a result :
<ul>
<li>The caller supplies the number of seconds</li>
<li>The function returns the display text</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="96" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="96" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="function-syntax">Function Syntax</h1>
<ul>
<li><code>format_duration</code> turns a track length into display text :
<ul>
<li><code>// 60</code> gives complete minutes; <code>% 60</code> gives remaining seconds</li>
<li><code>:02d</code> displays the seconds with two digits, including a leading zero</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A definition starts with <code>def</code>, the name and parentheses :
<ul>
<li><code>seconds</code> is a parameter that receives a track length</li>
<li>The colon starts the indented body</li>
</ul>
</li>
<li><code>return</code> passes the display text back to the caller</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="97" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="97" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="calling-functions">Calling Functions</h1>
<ul>
<li>Define a function before calling it :
<ul>
<li>Parentheses contain the argument supplied for <code>seconds</code></li>
<li>Each call runs the same body with a different track length</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">65</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>3:42</span></span>
<span class="line"><span>1:05</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Defining the function does not run its body</li>
<li>Omitting a required argument raises <code>TypeError</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">format_duration</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="98" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="98" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="return-statement">return Statement</h1>
<ul>
<li>A returned value can be stored and used by the caller :
<ul>
<li><code>label</code> receives the duration text</li>
<li>The caller includes it in a track description</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">label </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">125</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">message </span><span style="color:#D32F2F">=</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"Yesterday [</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">label</span><span style="color:#1976D2">}</span><span style="color:#22863A">]"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(message)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Yesterday [2:05]</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>return</code> ends the current call and passes its value back</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">returnstatement</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="99" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="99" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="functions-without-a-result">Functions Without a Result</h1>
<ul>
<li>Some functions perform a task without returning a useful value :
<ul>
<li><code>print_playlist</code> prints a heading and numbered tracks</li>
<li>The caller does not need to store a result</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> print_playlist</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">name</span><span style="color:#212121">,</span><span style="color:#FF9800"> tracks</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Playlist: </span><span style="color:#1976D2">{</span><span style="color:#212121">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> number</span><span style="color:#212121">,</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> enumerate</span><span style="color:#212121">(tracks, start</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">number</span><span style="color:#1976D2">}</span><span style="color:#22863A">. </span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print_playlist</span><span style="color:#212121">(</span><span style="color:#22863A">"Night drive"</span><span style="color:#212121">, [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">, </span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Playlist: Night drive</span></span>
<span class="line"><span>1. Imagine</span></span>
<span class="line"><span>2. Yesterday</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Reaching the end of a function returns <code>None</code></li>
<li>A bare <code>return</code> also returns <code>None</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">playlist</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="100" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="100" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="annotating-a-function">Annotating a Function</h1>
<ul>
<li>Annotations describe the values a function expects and returns :
<ul>
<li><code>seconds: int</code> describes the argument; <code>-&gt; str</code> describes the result</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>-&gt; None</code> describes a function that does not return a useful value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> print_playlist</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> tracks</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Playlist: </span><span style="color:#1976D2">{</span><span style="color:#212121">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> number</span><span style="color:#212121">,</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> enumerate</span><span style="color:#212121">(tracks, start</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">number</span><span style="color:#1976D2">}</span><span style="color:#22863A">. </span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Annotations help editors and checkers; Python does not enforce them</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">annotated_duration</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="101" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="101" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="documenting-a-function">Documenting a Function</h1>
<ul>
<li>A docstring describes the task and rules callers need to know :
<ul>
<li>It is the first string inside the function body</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#4a9c59">    """Format a non-negative track length as minutes and two-digit seconds."""</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}</span><span style="color:#22863A">:</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>help(format_duration)</code> displays the docstring</li>
<li>Triple quotes allow a description to span lines</li>
<li>Documentation tools can include docstrings in generated reference pages</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">docstring</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="102" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="102" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="function-arguments">Function Arguments</h1>
<ul>
<li>Positional arguments follow the parameter order :
<ul>
<li><code>seconds</code> receives the first value; <code>separator</code> receives the second</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#212121">,</span><span style="color:#FF9800"> separator</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}{</span><span style="color:#24292EFF">separator</span><span style="color:#1976D2">}{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">, </span><span style="color:#22863A">":"</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Keyword arguments specify parameter names</li>
<li>Default values allow arguments to be omitted</li>
<li><code>*args</code> and <code>**kwargs</code> collect extra positional and keyword arguments</li>
<li>Defining a name again replaces its earlier definition</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">positionalarguments</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="103" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="103" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="keyword-arguments">Keyword Arguments</h1>
<ul>
<li>Keyword arguments identify parameters by name :
<ul>
<li>Their order can differ from the definition</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#212121">,</span><span style="color:#FF9800"> separator</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}{</span><span style="color:#24292EFF">separator</span><span style="color:#1976D2">}{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(separator</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"."</span><span style="color:#212121">, seconds</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>3.42</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Positional arguments must come before keyword arguments</li>
<li>Names make the purpose of each argument visible</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">keywordarguments</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="104" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="104" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="default-arguments">Default Arguments</h1>
<ul>
<li>A default supplies a value when an argument is omitted :
<ul>
<li>Track durations usually separate minutes and seconds with <code>:</code></li>
<li>A caller can request another separator</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#212121">,</span><span style="color:#FF9800"> separator</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#D32F2F"> =</span><span style="color:#22863A"> ":"</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    minutes </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#24292EFF">    remainder </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> seconds </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">minutes</span><span style="color:#1976D2">}{</span><span style="color:#24292EFF">separator</span><span style="color:#1976D2">}{</span><span style="color:#24292EFF">remainder</span><span style="color:#D32F2F">:02d</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">format_duration</span><span style="color:#212121">(</span><span style="color:#1976D2">222</span><span style="color:#212121">, separator</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"m "</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>3:42</span></span>
<span class="line"><span>3m 42</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Parameters without defaults cannot follow parameters with defaults</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">defaultarguments</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="105" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="105" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="passing-object-references">Passing Object References</h1>
<ul>
<li>A parameter refers to the same object as the caller's argument :
<ul>
<li><code>add_encore</code> adds a final track to the shared queue</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> add_encore</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">tracks</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    tracks</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#22863A">"Let It Be"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Inside: </span><span style="color:#1976D2">{</span><span style="color:#212121">tracks</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">queue </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">add_encore</span><span style="color:#212121">(queue)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"After call: </span><span style="color:#1976D2">{</span><span style="color:#212121">queue</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Inside: ['Imagine', 'Yesterday', 'Let It Be']</span></span>
<span class="line"><span>After call: ['Imagine', 'Yesterday', 'Let It Be']</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>append</code> changes the existing list, so the caller sees the encore</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">objectreferences</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="106" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="106" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="overwriting-references">Overwriting References</h1>
<ul>
<li>A function can create an encore mix while keeping the original queue :
<ul>
<li><code>tracks + [&quot;Let It Be&quot;]</code> creates a new list</li>
<li>Assigning to <code>tracks</code> changes only the local name</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> with_encore</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">tracks</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    tracks </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> tracks </span><span style="color:#D32F2F">+</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Let It Be"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> tracks</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">queue </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">extended </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> with_encore</span><span style="color:#212121">(queue)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Original: </span><span style="color:#1976D2">{</span><span style="color:#212121">queue</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"With encore: </span><span style="color:#1976D2">{</span><span style="color:#212121">extended</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Original: ['Imagine', 'Yesterday']</span></span>
<span class="line"><span>With encore: ['Imagine', 'Yesterday', 'Let It Be']</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The caller stores the returned list in <code>extended</code>; <code>queue</code> keeps its original list</li>

<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="mutating-versus-rebinding">Mutating Versus Rebinding</h1>
<ul>
<li>Both functions add an encore, with different effects on the original queue :</li>
</ul>
<table>
<thead>
<tr>
<th>Operation inside the function</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>tracks.append(&quot;Let It Be&quot;)</code></td>
<td>Adds to the list the caller already holds</td>
</tr>
<tr>
<td><code>tracks = tracks + [&quot;Let It Be&quot;]</code></td>
<td>Binds the local name to a new list</td>
</tr>
<tr>
<td><code>return tracks</code></td>
<td>Passes that new list back to the caller</td>
</tr>
</tbody>
</table>
<ul>
<li>Mutate a shared queue when every caller should see the change</li>
<li>Return a new mix when the original should stay available</li>
<li>Integers and strings cannot be changed in place; a different value needs a new binding</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="108" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="108" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="variable-length-arguments">Variable Length Arguments</h1>
<ul>
<li><code>*tracks</code> collects extra positional arguments into a tuple</li>
<li><code>**details</code> collects extra keyword arguments into a dictionary</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> show_playlist</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#D32F2F"> *</span><span style="color:#FF9800">tracks</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#D32F2F"> **</span><span style="color:#FF9800">details</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Playlist: </span><span style="color:#1976D2">{</span><span style="color:#212121">name</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> track </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> tracks</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"- </span><span style="color:#1976D2">{</span><span style="color:#212121">track</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> key</span><span style="color:#212121">,</span><span style="color:#24292EFF"> value </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> details</span><span style="color:#212121">.</span><span style="color:#6F42C1">items</span><span style="color:#212121">():</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">key</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#212121">value</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">show_playlist</span><span style="color:#212121">(</span><span style="color:#22863A">"Night drive"</span><span style="color:#212121">, </span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">, </span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">, mood</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"calm"</span><span style="color:#212121">, owner</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Sam"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>At a call, <code>*values</code> unpacks a sequence and <code>**options</code> unpacks a dictionary</li>
<li><code>args</code> and <code>kwargs</code> are common names; task-specific names describe their contents</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">variableargumentlist</code></p>
</blockquote>

<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">callingwithstar</code></p>

</section>

<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>
<h1 id="lambda-functions">Lambda Functions</h1>
<ul>
<li>A lambda is a small function passed directly to another function :
<ul>
<li><code>sorted</code> calls the key function for each track</li>
<li><code>track[1]</code> selects its duration in seconds</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">tracks </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [(</span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 183</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"Respect"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 149</span><span style="color:#24292EFF">)]</span></span>
<span class="line"><span style="color:#24292EFF">by_length </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> sorted</span><span style="color:#212121">(tracks, key</span><span style="color:#D32F2F">=lambda</span><span style="color:#FF9800"> track</span><span style="color:#212121">: track[</span><span style="color:#1976D2">1</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(by_length)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>[('Yesterday', 125), ('Respect', 149), ('Imagine', 183)]</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The value after the colon is returned automatically</li>
<li>Use a named function when the calculation needs several lines</li>

<div class="ml-eyebrow"><a href="#94"><span class="ml-tag">python</span>Functions</a></div>

</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> clean_title</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">title</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> title</span><span style="color:#212121">.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> shout_title</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">title</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>

<span class="line"></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(formatters[</span><span style="color:#22863A">"clean"</span><span style="color:#212121">](</span><span style="color:#22863A">"  Imagine  "</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name</span><span style="color:#212121">,</span><span style="color:#24292EFF"> format_title </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> formatters</span><span style="color:#212121">.</span><span style="color:#6F42C1">items</span><span style="color:#212121">():</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(name, </span><span style="color:#6F42C1">format_title</span><span style="color:#212121">(</span><span style="color:#22863A">"Yesterday"</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Imagine</span></span>

<span class="line"><span>shout YESTERDAY</span></span>

<ul>
