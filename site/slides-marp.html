<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="python-tooling-and-reference">Python Tooling and Reference</h1>
<ul>
<li><code>uv</code> manages Python versions, project environments and installed packages</li>
<li>Ruff checks source code and applies consistent formatting</li>
<li>Project files record Python versions and package requirements</li>
<li>The syntax reference covers names, blocks and multiline statements</li>
<li>Tool documentation :
<ul>
<li><code>https://docs.astral.sh/uv/</code></li>
<li><code>https://docs.astral.sh/ruff/</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="253" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="253" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="python-features-1">Python Features</h1>
<ul>
<li>Broad standard library :
<ul>
<li>Files, paths, dates, JSON, CSV, regular expressions, SQLite and testing out of the box</li>
</ul>
</li>
<li>Portable :
<ul>
<li>The same code runs on Linux, Windows and macOS</li>
</ul>
</li>
<li>Large ecosystem :
<ul>
<li>Hundreds of thousands of packages on PyPI, installed with <code>uv add</code></li>
</ul>
</li>
<li>Used across many fields :
<ul>
<li>Automation and scripting, web back ends, data analysis, machine learning, testing</li>
</ul>
</li>
<li>Extendable :
<ul>
<li>Performance-critical parts can be written in C or Rust and called from Python</li>
</ul>
</li>
<li>Automatic memory management :
<ul>
<li>Objects are freed by reference counting and a garbage collector, not by hand</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="254" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="254" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="history-of-python">History of Python</h1>
<ul>
<li>Python was developed by Guido van Rossum around 1990 at :
<ul>
<li>National Research Institute for Mathematics and Computer Science in Netherlands</li>
</ul>
</li>
<li>Python is derived from many other languages :
<ul>
<li>Including Modula-3, C, C++, Smalltalk, Unix shell and other scripting languages</li>
</ul>
</li>
<li>Python is usable as :
<ul>
<li>Scripting language or compiled to byte-code for building large applications</li>
</ul>
</li>
<li>Python is copyrighted and the source is open :
<ul>
<li>Released under the PSF License, a permissive licence that allows commercial use</li>
</ul>
</li>
<li>Python is developed in the open by a community of core developers :
<ul>
<li>The Python Software Foundation holds the rights, the Steering Council decides</li>
</ul>
</li>
<li>Python supports :
<ul>
<li>Functional and structured programming methods as well as OOP</li>
<li>Very high-level dynamic data types and dynamic type checking</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="255" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="255" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="modern-python-tooling">Modern Python Tooling</h1>
<ul>
<li>Python needs an interpreter, an environment and a set of packages :
<ul>
<li>Historically each of these was installed and managed by a separate tool</li>
<li>The result was hard to reproduce on a second machine</li>
</ul>
</li>
<li>Two tools now cover almost all of it :
<ul>
<li><code>uv</code> installs Python, creates the environment and resolves the packages</li>
<li><code>ruff</code> checks style and catches a large class of mistakes before you run</li>
</ul>
</li>
<li>Both are single binaries with no Python of their own to bootstrap :</li>
</ul>
<table>
<thead>
<tr>
<th>Older tool</th>
<th>Replaced by</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>python.org</code> installer, <code>pyenv</code></td>
<td><code>uv python install</code></td>
</tr>
<tr>
<td><code>venv</code>, <code>virtualenv</code></td>
<td><code>uv</code> creates <code>.venv</code> for you</td>
</tr>
<tr>
<td><code>pip</code>, <code>pip-tools</code>, <code>requirements.txt</code></td>
<td><code>uv add</code> and <code>uv.lock</code></td>
</tr>
<tr>
<td><code>flake8</code>, <code>isort</code>, <code>black</code>, <code>pylint</code></td>
<td><code>ruff check</code> and <code>ruff format</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="256" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="256" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="getting-started">Getting Started</h1>
<ul>
<li>Install <code>uv</code> once, and let it install Python for you :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">powershell </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF">ExecutionPolicy ByPass </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF">c </span><span style="color:#22863A">"irm https://astral.sh/uv/install.ps1 | iex"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>On macOS or Linux use the shell installer :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">curl</span><span style="color:#2B5581"> -LsSf</span><span style="color:#2B5581"> https://astral.sh/uv/install.sh</span><span style="color:#D32F2F"> |</span><span style="color:#6F42C1"> sh</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Close and reopen the terminal, then fetch the interpreter :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> install</span><span style="color:#1976D2"> 3.14</span></span>
<span class="line"></span></code></pre>
<ul>
<li>This needs no administrator rights :
<ul>
<li>Any Python already on the machine is left alone, and versions live side by side</li>
</ul>
</li>
<li>The traditional route is the installer from <code>https://www.python.org/</code> :
<ul>
<li>Tick <code>Add python.exe to PATH</code> on the first page of the Windows wizard</li>
<li>Python 2 reached its end of life in 2020, so Python 3 is the only choice</li>
</ul>
</li>
<li>Documentation lives at <code>https://docs.python.org/3/</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="257" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="257" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="setting-up-path">Setting up PATH</h1>
<ul>
<li>Only needed when Python was installed by hand :
<ul>
<li><code>uv run</code> finds its managed Python; the <code>uv</code> command itself must be on PATH</li>
</ul>
</li>
<li>PATH is an environment variable :
<ul>
<li>Provides a search path that lists directories that OS searches for executables</li>
<li>Named PATH in Unix or Path in Windows, and Unix is case-sensitive</li>
</ul>
</li>
<li>Setting PATH in Linux :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">export</span><span style="color:#24292EFF"> PATH</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"$PATH:/usr/local/bin"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Setting PATH in Windows :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">$</span><span style="color:#1976D2">env:</span><span style="color:#24292EFF">Path </span><span style="color:#D32F2F">+=</span><span style="color:#22863A"> ";C:\Python"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Or use the environment variables tab under System Properties</li>
<li>PYTHONPATH is a separate variable :
<ul>
<li>It tells the interpreter where to find modules you import, not where Python is</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="258" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="258" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="project-files">Project Files</h1>
<ul>
<li>A project is a directory with a <code>pyproject.toml</code> in it :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> init</span><span style="color:#2B5581"> course-work</span></span>
<span class="line"><span style="color:#6F42C1">cd</span><span style="color:#2B5581"> course-work</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>uv init</code> writes three things :
<ul>
<li><code>pyproject.toml</code> , the file that names the project and its dependencies</li>
<li><code>.python-version</code> , the interpreter this project is pinned to</li>
<li><code>main.py</code> , a placeholder to delete or edit</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>course-work/</span></span>
<span class="line"><span>├─ pyproject.toml</span></span>
<span class="line"><span>├─ .python-version</span></span>
<span class="line"><span>├─ main.py</span></span>
<span class="line"><span>└─ .venv/            created on the first uv run or uv add</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Run code through <code>uv run</code>, which uses the project's own interpreter :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> main.py</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="259" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="259" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="adding-dependencies">Adding Dependencies</h1>
<ul>
<li><code>uv add</code> installs a package and records it in <code>pyproject.toml</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> requests</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#22863A"> "requests>=2.28,&#x3C;3"</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> --dev</span><span style="color:#2B5581"> pytest</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Two files describe the dependencies, and both belong in version control :
<ul>
<li><code>pyproject.toml</code> states what the project asks for</li>
<li><code>uv.lock</code> states the exact versions that were resolved</li>
</ul>
</li>
<li>Anyone can then reproduce the environment exactly :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> sync</span><span style="color:#4a9c59">          # install exactly what uv.lock says</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> remove</span><span style="color:#2B5581"> requests</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>--dev</code> marks a tool used while developing, not by the running program :
<ul>
<li><code>ruff</code> is such a tool; so is the test runner <code>pytest</code>, which the libraries appendix covers</li>
</ul>
</li>
<li>There is no environment to activate :
<ul>
<li><code>uv run</code> puts the project's <code>.venv</code> in front for the length of one command</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">uv_project</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="260" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="260" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="linting-with-ruff">Linting with ruff</h1>
<ul>
<li>A linter reads code without running it and reports what looks wrong :
<ul>
<li>Unused imports and variables, shadowed built-ins, unreachable code</li>
<li>Style that departs from the conventions the rest of Python follows</li>
</ul>
</li>
<li>Two commands cover the daily use :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> ruff</span><span style="color:#2B5581"> check</span><span style="color:#2B5581"> .</span><span style="color:#4a9c59">          # report problems</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> ruff</span><span style="color:#2B5581"> check</span><span style="color:#2B5581"> .</span><span style="color:#2B5581"> --fix</span><span style="color:#4a9c59">    # fix the ones that are safe to fix</span></span>
<span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> ruff</span><span style="color:#2B5581"> format</span><span style="color:#2B5581"> .</span><span style="color:#4a9c59">         # lay the code out consistently</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Rules are configured in <code>ruff.toml</code>, which ships with this course :
<ul>
<li>It selects the rule set the course material is written against</li>
<li>Without it the editor would flag patterns the course uses on purpose</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">ruff_findings</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="261" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="261" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="editor-integration">Editor Integration</h1>
<ul>
<li>The course demonstrates Visual Studio Code :
<ul>
<li>Any editor works, but the slides assume this one</li>
</ul>
</li>
<li>Install two extensions from the Extensions panel :
<ul>
<li><code>Python</code> , published by Microsoft</li>
<li><code>Ruff</code> , published by Astral</li>
</ul>
</li>
<li>With both installed the editor will :
<ul>
<li>Underline the problems <code>ruff check</code> would report, as you type</li>
<li>Offer the same fixes, and format on save if you ask it to</li>
<li>Resolve imports against the project's <code>.venv</code> rather than a global Python</li>
</ul>
</li>
<li>Point the editor at the project interpreter :
<ul>
<li>Command Palette, <code>Python: Select Interpreter</code>, choose the one in <code>.venv</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="262" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="262" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="python-identifiers">Python Identifiers</h1>
<ul>
<li>Identifiers are the names of variables, functions, classes and modules :
<ul>
<li>Start with a letter or an underscore, followed by letters, digits and underscores</li>
<li>Punctuation such as <code>@</code>, <code>$</code> and <code>%</code> is not allowed in a name</li>
</ul>
</li>
<li>Python is case sensitive :
<ul>
<li><code>total</code> and <code>Total</code> are two different names</li>
</ul>
</li>
<li>The naming conventions of PEP 8, the Python style guide :
<ul>
<li><code>snake_case</code> for variables, functions and modules</li>
<li><code>CapWords</code> for classes, <code>UPPER_CASE</code> for values meant as constants</li>
</ul>
</li>
<li>Underscores carry meaning :
<ul>
<li>A leading underscore, as in <code>_cache</code>, marks a name as internal to its module</li>
<li>Names such as <code>__init__</code> with two underscores on both sides are defined by Python</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="263" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="263" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="python-reserved-words">Python Reserved Words</h1>
<ul>
<li>Keywords may not be used as a variable, function or other name :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>False    None     True     and      as       assert   async</span></span>
<span class="line"><span>await    break    class    continue def      del      elif</span></span>
<span class="line"><span>else     except   finally  for      from     global   if</span></span>
<span class="line"><span>import   in       is       lambda   nonlocal not      or</span></span>
<span class="line"><span>pass     raise    return   try      while    with     yield</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>match</code>, <code>case</code>, <code>type</code> and <code>_</code> are soft keywords :
<ul>
<li>Reserved only inside the statement they belong to, and usable as names elsewhere</li>
</ul>
</li>
<li>The interpreter can list them : <code>import keyword</code> and print <code>keyword.kwlist</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="264" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="264" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="lines-and-indentation">Lines and Indentation</h1>
<ul>
<li>Indentation groups statements into a block :
<ul>
<li>Use four spaces for each level</li>
<li>Statements in the same block have the same indentation</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">if</span><span style="color:#1976D2"> True</span><span style="color:#212121">:</span><span style="color:#4a9c59">  # The indented block runs.</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Photo ready"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">else</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"Photo missing"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An unindented statement runs after the block :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">photos </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 5</span></span>
<span class="line"><span style="color:#4a9c59"># This comment does not change the photo count.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Photos selected:"</span><span style="color:#212121">, photos)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Inconsistent indentation raises an error before the script runs</li>
<li><code>end=&quot; &quot;</code> makes the next output continue on the same line</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">lines_and_identation</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="265" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="265" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="multi-line-statements">Multi Line Statements</h1>
<ul>
<li>Parentheses allow a calculation to continue across lines :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">thriller </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 357</span></span>
<span class="line"><span style="color:#24292EFF">imagine </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 183</span></span>
<span class="line"><span style="color:#24292EFF">yesterday </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 125</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">total </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span></span>
<span class="line"><span style="color:#24292EFF">    thriller </span><span style="color:#D32F2F">+</span><span style="color:#24292EFF"> imagine </span><span style="color:#D32F2F">+</span><span style="color:#24292EFF"> yesterday</span></span>
<span class="line"><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(total)</span><span style="color:#4a9c59">  # 665</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Lists, dictionaries and calls can also span lines inside their brackets :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [</span></span>
<span class="line"><span style="color:#22863A">    "Thriller"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Imagine"</span><span style="color:#212121">,</span><span style="color:#22863A"> "Yesterday"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(playlist)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A backslash also continues a line :
<ul>
<li>Prefer brackets when they fit the statement</li>
<li>A semicolon separates statements on one line; separate lines are clearer</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">multilinestatements</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="266" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="266" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="string-quote-forms">String Quote Forms</h1>
<ul>
<li>Matching quotes mark the start and end of a string :
<ul>
<li>Single and double quotes produce the same string type</li>
<li>Triple quotes allow the text to span lines</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Imagine"</span></span>
<span class="line"><span style="color:#24292EFF">filename </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> 'cover.jpg'</span></span>
<span class="line"><span style="color:#24292EFF">caption </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> """Friday night</span></span>
<span class="line"><span style="color:#22863A">Live at the observatory"""</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Choose double quotes when the text contains an apostrophe :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Tonight's playlist"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">'Tonight\'s playlist'</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">quotesandescapes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="267" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="267" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="python-execution">Python Execution</h1>
<ul>
<li>The interpreter processes Python source code when a program runs :
<ul>
<li>Python checks the syntax before executing a script</li>
<li>CPython compiles source code to bytecode internally</li>
<li>Its virtual machine executes the bytecode</li>
</ul>
</li>
<li>Imported modules can have cached bytecode in <code>__pycache__</code> :
<ul>
<li>The cache avoids recompiling unchanged source on a later import</li>
<li>A separate compile command is unnecessary for running a <code>.py</code> file</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="268" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="268" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="formatting-text-columns">Formatting Text Columns</h1>
<ul>
<li>A format specification can choose a fill character, alignment and width :
<ul>
<li><code>*^20</code> centres text in twenty characters, filling the remaining space with <code>*</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Imagine"</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">title:</span><span style="color:#D32F2F">*^</span><span style="color:#1976D2">20}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>!s</code> converts a value to text before applying its display format :
<ul>
<li>A Boolean with a width otherwise displays as <code>1</code> or <code>0</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">selected </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> True</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">selected</span><span style="color:#D32F2F">:^8</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">selected</span><span style="color:#D32F2F">!s:^8</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>!s:^8</code> first produces <code>&quot;True&quot;</code>, then centres it in eight characters</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">text_columns</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="269" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="269" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="environment-variables">Environment Variables</h1>
<ul>
<li>An environment variable is a named text setting passed to a running program</li>
<li><code>os.environ</code> gives access to those settings :
<ul>
<li><code>get</code> returns the setting, or its default when the name is absent</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> os</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> os</span><span style="color:#212121">.</span><span style="color:#24292EFF">environ</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span><span style="color:#22863A">"TRACK_TITLE"</span><span style="color:#212121">, </span><span style="color:#22863A">"Imagine"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(title)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>PowerShell sets a variable for subsequent commands in the same terminal :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">$</span><span style="color:#1976D2">env:</span><span style="color:#24292EFF">TRACK_TITLE </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Yesterday"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Bash can set a variable for one run :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">TRACK_TITLE</span><span style="color:#D32F2F">=</span><span style="color:#2B5581">Yesterday</span><span style="color:#6F42C1"> uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> python</span><span style="color:#2B5581"> 07_environment.py</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">environment</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="270" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="270" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#251"><span class="ml-tag">python</span>Python Tooling and Reference</a></div>
<h1 id="summary--python-tooling">Summary : Python Tooling</h1>
<ul>
<li><code>uv run</code> uses the project's Python environment</li>
<li><code>uv add</code> records packages in <code>pyproject.toml</code></li>
<li><code>uv.lock</code> records resolved package versions</li>
<li>Ruff checks code without running it and can format files</li>
<li>Python names are case sensitive and follow naming conventions</li>
<li>Indentation groups statements; brackets allow multiline statements</li>
</ul>
</section>
