</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="172" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="172" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="closing-files">Closing Files</h1>
<ul>
<li>Without <code>with</code>, a file stays open until <code>close</code> is called :
<ul>
<li><code>close</code> writes unwritten data, then closes the file object</li>
<li>No more reading or writing can be done after calling <code>close</code></li>
<li>Do not rely on garbage collection to close a file promptly</li>
</ul>
</li>
<li>Older code opens and closes files by hand :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"playlist.txt"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">first </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> playlist</span><span style="color:#212121">.</span><span style="color:#6F42C1">readline</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">playlist</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(first, end</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # So What</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An exception between <code>open</code> and <code>close</code> skips the <code>close</code>; <code>with</code> does not.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="173" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="173" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="file-object-attributes">File Object Attributes</h1>
<ul>
<li>File objects expose their name, mode, encoding and closed state.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">playlist </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"playlist.txt"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Name of the file :"</span><span style="color:#212121">, playlist.name)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Opening mode     :"</span><span style="color:#212121">, playlist.mode)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Encoding         :"</span><span style="color:#212121">, playlist.encoding)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"First line       :"</span><span style="color:#212121">, playlist.</span><span style="color:#6F42C1">readline</span><span style="color:#212121">(), end</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Closed or not    :"</span><span style="color:#212121">, playlist.closed)</span></span>
<span class="line"><span style="color:#24292EFF">playlist</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"Closed or not    :"</span><span style="color:#212121">, playlist.closed)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Name of the file : playlist.txt</span></span>
<span class="line"><span>Opening mode     : r</span></span>
<span class="line"><span>Encoding         : utf-8</span></span>
<span class="line"><span>First line       : So What</span></span>
<span class="line"><span>Closed or not    : False</span></span>
<span class="line"><span>Closed or not    : True</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">fileioobject</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="174" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="174" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="io-module">IO Module</h1>
<ul>
<li>Core of the I/O system is implemented in io library module</li>
<li>Consists of a collection of different I/O classes :
<ul>
<li><code>FileIO</code></li>
<li><code>BufferedReader</code></li>
<li><code>BufferedWriter</code></li>
<li><code>BufferedRWPair</code></li>
<li><code>BufferedRandom</code></li>
<li><code>TextIOWrapper</code></li>
<li><code>BytesIO</code></li>
<li><code>StringIO</code></li>
</ul>
</li>
<li>Each class implements a different kind of I/O</li>
<li>Classes get layered to add features</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="175" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="175" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="result-of-calling-open">Result of Calling open</h1>
<ul>
<li>The object returned varies with the file mode and the buffering :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>>>> open("playlist.txt", "rt", encoding="utf-8")</span></span>
<span class="line"><span>&#x3C;_io.TextIOWrapper name='playlist.txt' mode='rt' encoding='utf-8'></span></span>
<span class="line"><span>>>> open("playlist.txt", "rb")</span></span>
<span class="line"><span>&#x3C;_io.BufferedReader name='playlist.txt'></span></span>
<span class="line"><span>>>> open("playlist.txt", "rb", buffering=0)</span></span>
<span class="line"><span>&#x3C;_io.FileIO name='playlist.txt' mode='rb' closefd=True></span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Opening a text file stacks three objects, and you are handed the outermost :</li>

<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="bytes-and-byte-arrays">Bytes and Byte Arrays</h1>
<ul>
<li><code>bytes</code> is immutable; <code>bytearray</code> allows individual bytes to change.</li>
<li>Encoding converts text to bytes; decoding converts bytes back to text :
<ul>
<li>In UTF-8, <code>ó</code> takes two bytes, so <code>Jóga</code> is four characters and five bytes</li>
</ul>
</li>
<li>Indexing returns an integer from 0 to 255, not a character.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">title </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Jóga"</span></span>
<span class="line"><span style="color:#24292EFF">data </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> title</span><span style="color:#212121">.</span><span style="color:#6F42C1">encode</span><span style="color:#212121">(</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(data)</span><span style="color:#4a9c59">  # b'J\xc3\xb3ga'</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(title), </span><span style="color:#6F42C1">len</span><span style="color:#212121">(data))</span><span style="color:#4a9c59">  # 4 5</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(data[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span><span style="color:#4a9c59">  # 74</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(data.</span><span style="color:#6F42C1">decode</span><span style="color:#212121">(</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # Jóga</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">mutable </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> bytearray</span><span style="color:#212121">(data)</span></span>
<span class="line"><span style="color:#24292EFF">mutable</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 89</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(mutable)</span><span style="color:#4a9c59">  # bytearray(b'Y\xc3\xb3ga')</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(mutable.</span><span style="color:#6F42C1">decode</span><span style="color:#212121">(</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # Yóga</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Binary files read and write bytes; text files handle encoding for you.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">bytesandbytesarrays</code></p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="177" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="177" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="reading-binary-files">Reading Binary Files</h1>
<ul>
<li>Binary mode (<code>rb</code>) reads bytes without decoding them.</li>
<li><code>read()</code> reads the remaining contents; <code>read(3)</code> reads up to three bytes.</li>
<li>Binary mode takes no <code>encoding</code> argument.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"trilobyte.jpg"</span><span style="color:#212121">, mode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"rb"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    data </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">.</span><span style="color:#6F42C1">read</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#1976D2">type</span><span style="color:#212121">(data))</span><span style="color:#4a9c59">  # &#x3C;class 'bytes'></span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(data))</span><span style="color:#4a9c59">  # 49278, the size in bytes</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(data[:</span><span style="color:#1976D2">3</span><span style="color:#212121">].</span><span style="color:#6F42C1">hex</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # ffd8ff, the start of every JPEG photo</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>hex()</code> shows each byte as two hexadecimal digits.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">readbinaryfile</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="178" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="178" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="writing-binary-files">Writing Binary Files</h1>
<ul>
<li><code>wb</code> writes bytes and replaces any existing file.</li>
<li><code>struct</code> packs numbers into bytes and unpacks them with the same format.</li>
<li>Here <code>&lt;iii</code> means three four-byte integers in little-endian order.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> struct </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> pack</span><span style="color:#212121">,</span><span style="color:#24292EFF"> unpack</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">state </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> pack</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;iii"</span><span style="color:#212121">, </span><span style="color:#1976D2">7</span><span style="color:#212121">, </span><span style="color:#1976D2">184</span><span style="color:#212121">, </span><span style="color:#1976D2">65</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # track number, seconds played, volume</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"player.bin"</span><span style="color:#212121">, mode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"wb"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fw</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    fw</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(state)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"player.bin"</span><span style="color:#212121">, mode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"rb"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fr</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    track</span><span style="color:#212121">,</span><span style="color:#24292EFF"> seconds</span><span style="color:#212121">,</span><span style="color:#24292EFF"> volume </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> unpack</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;iii"</span><span style="color:#212121">, fr.</span><span style="color:#6F42C1">read</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(track, seconds, volume)</span><span style="color:#4a9c59">  # 7 184 65</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>player.bin</code> holds twelve bytes, which a later run reads back to resume playback.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">writebinaryfile</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="179" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="179" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="file-positions">File Positions</h1>
<ul>
<li><code>tell()</code> reports the current position; <code>seek(offset)</code> moves it.</li>
<li>Binary file positions count bytes from the beginning.</li>
<li>Text file positions are opaque values; use <code>seek(0)</code> or a value from <code>tell()</code>.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"trilobyte.jpg"</span><span style="color:#212121">, </span><span style="color:#22863A">"rb"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(photo.</span><span style="color:#6F42C1">read</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#212121">).</span><span style="color:#6F42C1">hex</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # ffd8</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(photo.</span><span style="color:#6F42C1">tell</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # 2</span></span>
<span class="line"><span style="color:#24292EFF">    photo</span><span style="color:#212121">.</span><span style="color:#6F42C1">seek</span><span style="color:#212121">(</span><span style="color:#1976D2">6</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(photo.</span><span style="color:#6F42C1">read</span><span style="color:#212121">(</span><span style="color:#1976D2">4</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # b'JFIF'</span></span>
<span class="line"><span style="color:#24292EFF">    photo</span><span style="color:#212121">.</span><span style="color:#6F42C1">seek</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(photo.</span><span style="color:#6F42C1">read</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#212121">).</span><span style="color:#6F42C1">hex</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # ffd8</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A JPEG photo in the JFIF format has the bytes <code>JFIF</code> from position 6.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">file_positions</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="180" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="180" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="the-csv-module">The csv Module</h1>
<ul>
<li>Use <code>csv</code> for tabular text; it handles quoted commas and embedded newlines.</li>
<li>Open CSV files with <code>newline=&quot;&quot;</code> so <code>csv</code> controls newline handling.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> csv</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"history.csv"</span><span style="color:#212121">, </span><span style="color:#22863A">"w"</span><span style="color:#212121">, newline</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fw</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    writer </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> csv</span><span style="color:#212121">.</span><span style="color:#6F42C1">writer</span><span style="color:#212121">(fw)</span></span>
<span class="line"><span style="color:#24292EFF">    writer</span><span style="color:#212121">.</span><span style="color:#6F42C1">writerow</span><span style="color:#212121">([</span><span style="color:#22863A">"track"</span><span style="color:#212121">, </span><span style="color:#22863A">"artist"</span><span style="color:#212121">, </span><span style="color:#22863A">"seconds"</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">    writer</span><span style="color:#212121">.</span><span style="color:#6F42C1">writerows</span><span style="color:#212121">([[</span><span style="color:#22863A">"So What"</span><span style="color:#212121">, </span><span style="color:#22863A">"Miles Davis"</span><span style="color:#212121">, </span><span style="color:#1976D2">562</span><span style="color:#212121">], [</span><span style="color:#22863A">"Hello, Goodbye"</span><span style="color:#212121">, </span><span style="color:#22863A">"The Beatles"</span><span style="color:#212121">, </span><span style="color:#1976D2">208</span><span style="color:#212121">]])</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"history.csv"</span><span style="color:#212121">, newline</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fr</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> csv</span><span style="color:#212121">.</span><span style="color:#6F42C1">reader</span><span style="color:#212121">(fr):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(row)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>['track', 'artist', 'seconds']</span></span>
<span class="line"><span>['So What', 'Miles Davis', '562']</span></span>
<span class="line"><span>['Hello, Goodbye', 'The Beatles', '208']</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">csv_module</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="181" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="181" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="reading-csv-rows-by-name">Reading CSV Rows by Name</h1>
<ul>
<li><code>DictReader</code> uses the first row as column names.</li>
<li>Field values are strings; convert numeric fields explicitly.</li>
<li><code>listening_history.csv</code> holds one row per track played :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">total </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 0</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> open</span><span style="color:#212121">(</span><span style="color:#22863A">"listening_history.csv"</span><span style="color:#212121">, newline</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> fr</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> csv</span><span style="color:#212121">.</span><span style="color:#6F42C1">DictReader</span><span style="color:#212121">(fr):</span></span>
<span class="line"><span style="color:#24292EFF">        seconds </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(row[</span><span style="color:#22863A">"seconds"</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">        total </span><span style="color:#D32F2F">+=</span><span style="color:#24292EFF"> seconds</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">row[</span><span style="color:#22863A">'track'</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#212121">seconds</span><span style="color:#1976D2">}</span><span style="color:#22863A"> s"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Total: </span><span style="color:#1976D2">{</span><span style="color:#212121">total </span><span style="color:#D32F2F">//</span><span style="color:#1976D2"> 60}</span><span style="color:#22863A"> min </span><span style="color:#1976D2">{</span><span style="color:#212121">total </span><span style="color:#D32F2F">%</span><span style="color:#1976D2"> 60}</span><span style="color:#22863A"> s"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>So What: 562 s</span></span>
<span class="line"><span>Hello, Goodbye: 208 s</span></span>
<span class="line"><span>Jóga: 305 s</span></span>
<span class="line"><span>Take Five: 324 s</span></span>
<span class="line"><span>Total: 23 min 19 s</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">csv_dictionary</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="182" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="182" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="paths-with-pathlib">Paths with pathlib</h1>
<ul>
<li>The <code>pathlib</code> module represents a path as an object, not a string :
<ul>
<li><code>Path</code> knows how to join, inspect, read, write, rename and delete</li>
<li>It is the modern replacement for stringly typed <code>os.path</code> work</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">here </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> Path</span><span style="color:#212121">.</span><span style="color:#6F42C1">cwd</span><span style="color:#212121">()</span><span style="color:#4a9c59">  # the current working directory</span></span>
<span class="line"><span style="color:#24292EFF">song </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> here </span><span style="color:#D32F2F">/</span><span style="color:#22863A"> "music"</span><span style="color:#D32F2F"> /</span><span style="color:#22863A"> "jazz"</span><span style="color:#D32F2F"> /</span><span style="color:#22863A"> "so_what.mp3"</span><span style="color:#4a9c59">  # joining, with / instead of +</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The <code>/</code> operator joins path segments :
<ul>
<li>It produces the right separator on Windows, macOS and Linux alike</li>
<li>No more <code>&quot;music&quot; + &quot;\\&quot; + name</code>, and no more forgetting the separator</li>
</ul>
</li>
<li>A path answers questions about itself :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">song</span><span style="color:#212121">.</span><span style="color:#24292EFF">name      </span><span style="color:#4a9c59"># so_what.mp3</span></span>
<span class="line"><span style="color:#24292EFF">song</span><span style="color:#212121">.</span><span style="color:#24292EFF">stem      </span><span style="color:#4a9c59"># so_what</span></span>
<span class="line"><span style="color:#24292EFF">song</span><span style="color:#212121">.</span><span style="color:#24292EFF">suffix    </span><span style="color:#4a9c59"># .mp3</span></span>
<span class="line"><span style="color:#24292EFF">song</span><span style="color:#212121">.</span><span style="color:#24292EFF">parent    </span><span style="color:#4a9c59"># the jazz directory, as a Path</span></span>
<span class="line"><span style="color:#24292EFF">song</span><span style="color:#212121">.</span><span style="color:#6F42C1">exists</span><span style="color:#212121">()</span><span style="color:#4a9c59">  # True or False</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="183" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="183" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="paths-relative-to-a-module">Paths Relative to a Module</h1>
<ul>
<li><code>Path(__file__)</code> is the path of the running module, so <code>parent</code> is its folder :
<ul>
<li><code>resolve()</code> makes the path absolute, and follows any symbolic links</li>
</ul>
</li>
<li><code>path.open()</code> works like <code>open()</code>, and takes the same arguments :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">here </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#1976D2">__file__</span><span style="color:#212121">).</span><span style="color:#6F42C1">resolve</span><span style="color:#212121">().</span><span style="color:#24292EFF">parent  </span><span style="color:#4a9c59"># the folder of this module</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(here.</span><span style="color:#6F42C1">is_absolute</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # True</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#1976D2">__file__</span><span style="color:#212121">).</span><span style="color:#6F42C1">open</span><span style="color:#212121">(encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> source</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(source.</span><span style="color:#6F42C1">readline</span><span style="color:#212121">().</span><span style="color:#6F42C1">strip</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # from pathlib import Path</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>here / &quot;playlist.txt&quot;</code> then finds a data file beside the module, whatever the working directory.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="184" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="184" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="renaming-and-deleting-files">Renaming and Deleting Files</h1>
<ul>
<li>A <code>Path</code> renames and deletes itself :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">photo </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#22863A">"IMG_0412.jpg"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">photo</span><span style="color:#212121">.</span><span style="color:#6F42C1">touch</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">renamed </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">.</span><span style="color:#6F42C1">rename</span><span style="color:#212121">(</span><span style="color:#22863A">"2026-07-14 beach.jpg"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">renamed</span><span style="color:#212121">.</span><span style="color:#6F42C1">unlink</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>touch</code> creates an empty file, <code>unlink</code> removes one :
<ul>
<li><code>unlink(missing_ok=True)</code> does nothing when the file is already gone</li>
</ul>
</li>
<li>Short reads and writes need no <code>open</code> at all :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">caption </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#22863A">"beach.txt"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">caption</span><span style="color:#212121">.</span><span style="color:#6F42C1">write_text</span><span style="color:#212121">(</span><span style="color:#22863A">"Sunset at the beach\n"</span><span style="color:#212121">, encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(caption.</span><span style="color:#6F42C1">read_text</span><span style="color:#212121">(encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">), end</span><span style="color:#D32F2F">=</span><span style="color:#22863A">""</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The <code>os</code> module still has <code>os.rename</code> and <code>os.remove</code> :
<ul>
<li>They take strings and are what older code uses</li>
</ul>
</li>
</ul>

<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="creating-and-removing-directories">Creating and Removing Directories</h1>
<ul>
<li><code>mkdir</code> creates a directory, <code>rmdir</code> removes an empty one :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">Path</span><span style="color:#212121">(</span><span style="color:#22863A">"albums"</span><span style="color:#212121">).</span><span style="color:#6F42C1">mkdir</span><span style="color:#212121">(exist_ok</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">Path</span><span style="color:#212121">(</span><span style="color:#22863A">"albums"</span><span style="color:#212121">).</span><span style="color:#6F42C1">rmdir</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Two keyword arguments cover the awkward cases :
<ul>
<li><code>parents=True</code> creates every missing directory in the path</li>
<li><code>exist_ok=True</code> succeeds quietly when the directory is already there</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">Path</span><span style="color:#212121">(</span><span style="color:#22863A">"albums/2026/07 beach"</span><span style="color:#212121">).</span><span style="color:#6F42C1">mkdir</span><span style="color:#212121">(parents</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">, exist_ok</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>rmdir</code> only removes an empty directory :
<ul>
<li>Remove the contents first, from the leaf upwards</li>
<li><code>shutil.rmtree</code> removes a whole tree at once, and does not ask twice</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo14</code><br><code class="pill-demo pill-desc">creatingandremoving_directories</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="186" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="186" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="directory-contents">Directory Contents</h1>
<ul>
<li><code>iterdir</code> lists direct entries; <code>glob</code> selects matching names.</li>
<li>Each entry is a <code>Path</code> that you can inspect or open.</li>
<li><code>rglob</code> searches subdirectories too.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">here </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> Path</span><span style="color:#212121">.</span><span style="color:#6F42C1">cwd</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">album </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> here </span><span style="color:#D32F2F">/</span><span style="color:#22863A"> "holiday"</span></span>
<span class="line"><span style="color:#24292EFF">album</span><span style="color:#212121">.</span><span style="color:#6F42C1">mkdir</span><span style="color:#212121">(exist_ok</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> name </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"beach.jpg"</span><span style="color:#212121">,</span><span style="color:#22863A"> "sunset.jpg"</span><span style="color:#212121">,</span><span style="color:#22863A"> "notes.txt"</span><span style="color:#24292EFF">]</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    (album </span><span style="color:#D32F2F">/</span><span style="color:#24292EFF"> name)</span><span style="color:#212121">.</span><span style="color:#6F42C1">touch</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"contents   :"</span><span style="color:#212121">, </span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(p.name </span><span style="color:#D32F2F">for</span><span style="color:#212121"> p </span><span style="color:#D32F2F">in</span><span style="color:#212121"> album.</span><span style="color:#6F42C1">iterdir</span><span style="color:#212121">()))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"only photos:"</span><span style="color:#212121">, </span><span style="color:#6F42C1">sorted</span><span style="color:#212121">(p.name </span><span style="color:#D32F2F">for</span><span style="color:#212121"> p </span><span style="color:#D32F2F">in</span><span style="color:#212121"> album.</span><span style="color:#6F42C1">glob</span><span style="color:#212121">(</span><span style="color:#22863A">"*.jpg"</span><span style="color:#212121">)))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>contents   : ['beach.jpg', 'notes.txt', 'sunset.jpg']</span></span>
<span class="line"><span>only photos: ['beach.jpg', 'sunset.jpg']</span></span>
<span class="line"><span></span></span></code></pre>

<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="reading-a-text-list">Reading a Text List</h1>
<ul>
<li><code>Path</code> from the standard library identifies a file :
<ul>
<li>A relative filename is looked up in the terminal's current folder</li>
<li><code>read_text</code> reads the file into one string</li>
</ul>
</li>
<li><code>encoding=&quot;utf-8&quot;</code> selects how the file's bytes are decoded into text</li>
<li><code>split()</code> separates the text at whitespace into a list of strings</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">text </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#22863A">"tracks.txt"</span><span style="color:#212121">).</span><span style="color:#6F42C1">read_text</span><span style="color:#212121">(encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">tracks </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> text</span><span style="color:#212121">.</span><span style="color:#6F42C1">split</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(tracks)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(tracks))</span></span>
<span class="line"></span></code></pre>
<ul>
<li>With <code>Imagine</code>, <code>Yesterday</code> and <code>Respect</code> on separate lines, the list has three items</li>
<li>Run the demo from <code>demos/09-python-io/</code>, beside <code>tracks.txt</code></li>
</ul>

<div class="ml-eyebrow"><a href="#165"><span class="ml-tag">python</span>Python IO</a></div>
<h1 id="summary--python-io">Summary : Python IO</h1>
<ul>
<li>Simplest way to produce output is to use the <code>print</code> function :
<ul>
<li>Allows you to pass zero or more expressions, separated by commas</li>
</ul>
</li>
<li>The <code>input</code> function reads a line of text from standard input :
<ul>
<li>It always returns a string, so convert it before doing arithmetic with it</li>
</ul>
</li>
<li>Open files with <code>with</code>, which closes them whatever happens :
<ul>
<li>The manual <code>open</code> and <code>close</code> pair is shown so that you recognise older code</li>
</ul>
</li>
<li>A text file is read whole, by line, or by iterating over it</li>
<li>Files can be opened in several modes :
<ul>
<li>For reading, for writing, for appending or combinations thereof</li>
</ul>
</li>
<li>Binary files contain bytes; text files encode and decode strings.</li>
<li><code>tell</code> and <code>seek</code> report and move the file position</li>
<li>Use <code>csv.reader</code>, <code>csv.writer</code> and <code>DictReader</code> for tabular text.</li>
<li><code>pathlib</code> represents a path as an object :
<ul>
<li><code>Path</code> joins with <code>/</code>, and creates, renames, deletes, reads and lists</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise09</code><br><code class="pill-exercise pill-desc">Python IO</code></p>
</blockquote>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="python-db-api">Python DB API</h1>
<ul>
<li>Provides a standard interface from Python to databases :
<ul>
<li>Most Python database interfaces adhere to this standard</li>
<li>Each database has its own module highly consistent with others</li>
</ul>
</li>
<li>The standard is described in PEP 249 :
<ul>
<li>Modules are available for most of the popular relational databases</li>
<li>Code written for one database reads almost the same for another</li>
</ul>
</li>
<li>Python DB API 2.0 compatible modules :
<ul>
<li><code>sqlite3</code> (SQLite), part of the standard library and used in this module</li>
<li><code>psycopg</code> (PostgreSQL)</li>
<li><code>mysqlclient</code> or <code>PyMySQL</code> (MySQL and MariaDB)</li>
<li><code>oracledb</code> (Oracle)</li>
<li><code>pyodbc</code> (any database with an ODBC driver, such as SQL Server and DB2)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="191" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="191" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="db-api-concepts">DB API Concepts</h1>
<ul>
<li>DB API uses two main concepts for processing queries :
<ul>
<li>Connections and cursors</li>
</ul>
</li>
<li>Every script follows the same shape :</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 753 / 64"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 753 64" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M100.03,32L141.03,32" /><path class="pele-marker" d="M148.03,32L140.03,35.36L140.03,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_C_0"><path d="M228.48,32L269.48,32" /><path class="pele-marker" d="M276.48,32L268.48,35.36L268.48,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_C_D_0"><path d="M368.51,32L409.51,32" /><path class="pele-marker" d="M416.51,32L408.51,35.36L408.51,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_D_E_0"><path d="M487.2,32L528.2,32" /><path class="pele-marker" d="M535.2,32L527.2,35.36L527.2,28.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_E_F_0"><path d="M622.75,32L663.75,32" /><path class="pele-marker" d="M670.75,32L662.75,35.36L662.75,28.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(54.02,32)"><rect x="-46.02" y="-24" width="92.03" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">connect</text></g><g class="pele-node pele-shape-rect" data-id="B" transform="translate(188.26,32)"><rect x="-40.22" y="-24" width="80.45" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">cursor</text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(322.5,32)"><rect x="-46.02" y="-24" width="92.03" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">execute</text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(451.86,32)"><rect x="-35.34" y="-24" width="70.69" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">fetch</text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(578.98,32)"><rect x="-43.78" y="-24" width="87.55" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">commit</text></g><g class="pele-node pele-shape-rect" data-id="F" transform="translate(707.42,32)"><rect x="-36.67" y="-24" width="73.34" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">close</text></g></g></svg></div>
<ul>
<li>Connection objects logically wrap a database connection :
<ul>
<li>Provide access to the database and handle transactions</li>
</ul>
</li>
<li><code>sqlite3.connect()</code> opens a database file, and creates it if it does not exist</li>
<li>Cursor objects used to manipulate and query the database :
<ul>
<li>Created on connections using the <code>conn.cursor()</code> method</li>
<li>Cursor objects provide ways to execute statements and access results</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"CREATE TABLE IF NOT EXISTS films(id INTEGER PRIMARY KEY, title TEXT)"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="192" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="192" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="check-database-version">Check Database Version</h1>
<ul>
<li>A first query asks SQLite for its version :
<ul>
<li><code>fetchone()</code> returns the result row as a tuple, here with one value</li>
<li><code>close()</code> releases the database file</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # creates watchlist.db if it does not exist</span></span>
<span class="line"><span style="color:#24292EFF">cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT sqlite_version()"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"SQLite version: </span><span style="color:#1976D2">{</span><span style="color:#212121">cur.</span><span style="color:#6F42C1">fetchone</span><span style="color:#212121">()[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">con</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>SQLite version: 3.50.4</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The version depends on the Python installation.</li>
</ul>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="using-with-1">Using with</h1>
<ul>
<li>A connection used in a <code>with</code> statement manages the transaction :
<ul>
<li>When the block ends normally, the changes are committed</li>
<li>When the block ends with an exception, the changes are rolled back</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT COUNT(*) FROM films"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">con</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span><span style="color:#4a9c59">  # `with con:` commits or rolls back, it does not close</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The connection stays open after the block :
<ul>
<li>Close it yourself with <code>con.close()</code> when you are done</li>
</ul>
</li>
<li><code>closing()</code> from <code>contextlib</code> calls <code>close()</code> when the block ends, so one <code>with</code> line can commit and close :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> contextlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> closing</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> closing</span><span style="color:#212121">(sqlite3.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">))</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> con</span><span style="color:#212121">,</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT COUNT(*) FROM films"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">usingwith</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="194" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="194" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="inserting-data">Inserting Data</h1>
<ul>
<li>Cursor objects provides a <code>cursor.execute()</code> method :
<ul>
<li>Execute SQL statements on a connection</li>
</ul>
</li>
<li><code>INTEGER PRIMARY KEY</code> makes SQLite number the rows :
<ul>
<li>An <code>INSERT</code> that leaves out <code>id</code> gets the next number</li>
</ul>
</li>
<li>This demo creates the <code>films</code> table that the later demos read :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"DROP TABLE IF EXISTS films"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"""</span></span>
<span class="line"><span style="color:#22863A">        CREATE TABLE films(id INTEGER PRIMARY KEY, title TEXT, year INT,</span></span>
<span class="line"><span style="color:#22863A">                           minutes INT, watched INT DEFAULT 0, rating INT)</span></span>
<span class="line"><span style="color:#22863A">        """</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES('Spirited Away', 2001, 125)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES('Amélie', 2001, 122)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES('Arrival', 2016, 116)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES('Paddington 2', 2017, 104)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES('Coco', 2017, 105)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES('Parasite', 2019, 132)"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">insertingdata</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="prepared-statements">Prepared Statements</h1>
<ul>
<li><code>executemany()</code> repeats one parameterized statement for each tuple</li>
<li>Each <code>?</code> placeholder receives a value from that tuple, in order :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>

<span class="line"><span style="color:#24292EFF">    (</span><span style="color:#22863A">"Spirited Away"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2001</span><span style="color:#212121">,</span><span style="color:#1976D2"> 125</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">    (</span><span style="color:#22863A">"Amélie"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2001</span><span style="color:#212121">,</span><span style="color:#1976D2"> 122</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">    (</span><span style="color:#22863A">"Arrival"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2016</span><span style="color:#212121">,</span><span style="color:#1976D2"> 116</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">    (</span><span style="color:#22863A">"Paddington 2"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2017</span><span style="color:#212121">,</span><span style="color:#1976D2"> 104</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">    (</span><span style="color:#22863A">"Coco"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2017</span><span style="color:#212121">,</span><span style="color:#1976D2"> 105</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">    (</span><span style="color:#22863A">"Parasite"</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2019</span><span style="color:#212121">,</span><span style="color:#1976D2"> 132</span><span style="color:#24292EFF">)</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">)</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"DROP TABLE IF EXISTS films"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"""</span></span>
<span class="line"><span style="color:#22863A">        CREATE TABLE films(id INTEGER PRIMARY KEY, title TEXT, year INT,</span></span>
<span class="line"><span style="color:#22863A">                           minutes INT, watched INT DEFAULT 0, rating INT)</span></span>
<span class="line"><span style="color:#22863A">        """</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">executemany</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title, year, minutes) VALUES(?, ?, ?)"</span><span style="color:#212121">, films)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">preparedstatements</code></p>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="last-inserted-row-id">Last inserted row id</h1>
<ul>
<li>Sometimes we need to determine the id of last inserted row :
<ul>
<li>In Python SQLite we use the <code>lastrowid</code> attribute of the cursor object</li>
</ul>
</li>
<li>The name <code>&quot;:memory:&quot;</code> opens a database that lives only while the program runs :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">":memory:"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"CREATE TABLE films(id INTEGER PRIMARY KEY, title TEXT)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title) VALUES('Spirited Away')"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title) VALUES('Arrival')"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO films(title) VALUES('Paddington 2')"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    film_id </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#24292EFF">lastrowid</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Paddington 2 was added with id </span><span style="color:#1976D2">{</span><span style="color:#212121">film_id</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Paddington 2 was added with id 3</span></span>
<span class="line"><span></span></span></code></pre>
