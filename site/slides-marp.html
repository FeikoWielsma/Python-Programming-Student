<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="retrieving-data">Retrieving Data</h1>
<ul>
<li><code>fetchall()</code> returns all rows of the result as a list of tuples :
<ul>
<li>The <code>films</code> table comes from demo03 or demo04, so run one of them first</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT id, title, year FROM films"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">fetchall</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> rows</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(row)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>(1, 'Spirited Away', 2001)</span></span>
<span class="line"><span>(2, 'Amélie', 2001)</span></span>
<span class="line"><span>(3, 'Arrival', 2016)</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Other fetch methods read part of the result :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">first_row </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">fetchone</span><span style="color:#212121">()</span></span>

<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="filtering-and-grouping-data">Filtering and Grouping Data</h1>
<ul>
<li><code>WHERE</code> filters rows; <code>?</code> binds the value from the parameter tuple</li>
<li><code>GROUP BY</code> forms groups; <code>COUNT(*)</code> counts rows and <code>SUM</code> adds non-NULL values</li>
<li><code>COALESCE(value, 0)</code> replaces SQL <code>NULL</code> with zero, including an empty <code>SUM</code></li>
<li><code>ORDER BY</code> sorts results; <code>DESC</code> puts the largest total first</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"></span>
<span class="line"><span style="color:#4a9c59"># Run demo03 or demo04 first to create the films table.</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"""</span></span>
<span class="line"><span style="color:#22863A">        SELECT year, COUNT(*), COALESCE(SUM(minutes), 0)</span></span>
<span class="line"><span style="color:#22863A">        FROM films WHERE year >= ?</span></span>
<span class="line"><span style="color:#22863A">        GROUP BY year ORDER BY SUM(minutes) DESC</span></span>
<span class="line"><span style="color:#22863A">        """</span><span style="color:#212121">, (</span><span style="color:#1976D2">2010</span><span style="color:#212121">,))</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">fetchall</span><span style="color:#212121">():</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(row)</span></span>
<span class="line"><span style="color:#D32F2F">finally</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    con</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">aggregatingdata</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="199" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="199" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="rows-by-column-name">Rows by Column Name</h1>
<ul>
<li>A row is a tuple by default, so a column is read by its position :
<ul>
<li><code>row[1]</code> works, but the reader has to know what the second column is</li>
</ul>
</li>
<li>Set <code>row_factory</code> on the connection to <code>sqlite3.Row</code> :
<ul>
<li>Every row can then be read by column name as well as by position</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">con</span><span style="color:#212121">.</span><span style="color:#24292EFF">row_factory </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#24292EFF">Row  </span><span style="color:#4a9c59"># rows can now be read by column name</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT * FROM films"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">fetchall</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> rows</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">row[</span><span style="color:#22863A">'title'</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A"> (</span><span style="color:#1976D2">{</span><span style="color:#212121">row[</span><span style="color:#22863A">'year'</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A">), </span><span style="color:#1976D2">{</span><span style="color:#212121">row[</span><span style="color:#22863A">'minutes'</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A"> min"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Spirited Away (2001), 125 min</span></span>
<span class="line"><span>Amélie (2001), 122 min</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">rowfactory</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="200" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="200" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="fetching-rows">Fetching Rows</h1>
<ul>
<li>Returning all data at a time may not be feasible :
<ul>
<li>It is also possible to fetch rows one by one with <code>fetchone()</code> :</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT id, title, minutes FROM films"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    while</span><span style="color:#1976D2"> True</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">        row </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">fetchone</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">        if</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">is</span><span style="color:#1976D2"> None</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">            break</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(row[</span><span style="color:#1976D2">0</span><span style="color:#212121">], row[</span><span style="color:#1976D2">1</span><span style="color:#212121">], row[</span><span style="color:#1976D2">2</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>fetchone()</code> method returns next row from the table :
<ul>
<li>If there is no more data left, it returns <code>None</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">fetchone</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="201" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="201" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="parameterized-queries">Parameterized Queries</h1>
<ul>
<li>Passing data from Python to the database :
<ul>
<li>First discouraged option is quoting values and sending plain SQL to the database</li>
<li>Second option preferred using binding parameters in the SQL with place holders</li>
</ul>
</li>
<li>A bound value needs no quoting, so a title such as <code>Howl's Moving Castle</code> is safe</li>
<li>Python sqlite3 module supports two types of placeholders :
<ul>
<li>Question marks and named placeholders</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">film_id </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 3</span></span>
<span class="line"><span style="color:#24292EFF">rating </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 5</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"UPDATE films SET watched = 1, rating = ? WHERE id = ?"</span><span style="color:#212121">, (rating, film_id))</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Number of rows updated: </span><span style="color:#1976D2">{</span><span style="color:#212121">cur.rowcount</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Named placeholders take a dictionary :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT id, title FROM films WHERE title = :title"</span><span style="color:#212121">, {</span><span style="color:#22863A">"title"</span><span style="color:#212121">: title})</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">parameterizedqueries</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="202" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="202" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="metadata">Metadata</h1>
<ul>
<li>Metadata is information about the data in the database :
<ul>
<li>Contains information about the tables and columns like name and datatypes</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>
<span class="line"><span style="color:#24292EFF">con </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"watchlist.db"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> con</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    cur </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> con</span><span style="color:#212121">.</span><span style="color:#6F42C1">cursor</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"PRAGMA table_info(films)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    data </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> cur</span><span style="color:#212121">.</span><span style="color:#6F42C1">fetchall</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> d </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> data</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(d[</span><span style="color:#1976D2">0</span><span style="color:#212121">], d[</span><span style="color:#1976D2">1</span><span style="color:#212121">], d[</span><span style="color:#1976D2">2</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>0 id INTEGER</span></span>
<span class="line"><span>1 title TEXT</span></span>
<span class="line"><span>2 year INT</span></span>
<span class="line"><span>3 minutes INT</span></span>
<span class="line"><span>4 watched INT</span></span>
<span class="line"><span>5 rating INT</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Metadata in SQLite can be obtained using <code>PRAGMA</code> command :
<ul>
<li>Or by querying the SQLite system table <code>sqlite_master</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">metadata</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="203" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="203" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="transactions">Transactions</h1>
<ul>
<li>Transactions logically wrap statements into blocks of execution :
<ul>
<li>Transactions are units of recovery</li>
</ul>
</li>
<li>Main benefit is that you can undo changes very easily :
<ul>
<li>Ensures data consistency at all times</li>
<li>Not all databases provide transactions !</li>
</ul>
</li>
<li>Transactions conform to ACID principles :
<ul>
<li>Atomicity, Consistency, Isolation, Durability</li>
</ul>
</li>
<li>DB API supports transactions if the database supports them :
<ul>
<li>Via methods on the connection object</li>
</ul>
</li>
<li>Write all changes of the last transaction block to the database :</li>
</ul>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>

<li><code>datetime</code> from the standard library represents a date and time</li>
<li><code>isoformat</code> produces text with the year first :
<ul>
<li><code>timespec=&quot;seconds&quot;</code> keeps the time to whole seconds</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> datetime </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> datetime</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(taken_at.</span><span style="color:#6F42C1">isoformat</span><span style="color:#212121">(timespec</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"seconds"</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>2026-10-17T10:08:15</span></span>

<div class="ml-eyebrow"><a href="#189"><span class="ml-tag">python</span>Python Database Access</a></div>
<h1 id="summary--python-database-access">Summary : Python Database Access</h1>
<ul>
<li>Python DB API is standard interface from Python to databases :
<ul>
<li>Each database has its own module highly consistent with others</li>
</ul>
</li>
<li>DB API uses two main concepts for processing queries :
<ul>
<li>Connections and cursors</li>
</ul>
</li>
<li>Connection objects logically wrap a database connection :
<ul>
<li>Provide means to handle database transactions</li>
</ul>
</li>
<li>Cursor objects used to manipulate and query the database :
<ul>
<li>Created on connections using the <code>conn.cursor()</code> method</li>
</ul>
</li>
<li>If same query must be repeated multiple times :
<ul>
<li>Can use parameterized queries with question marks or named parameters</li>
</ul>
</li>
<li>A connection in a <code>with</code> statement commits or rolls back the transaction :
<ul>
<li>It does not close the connection; <code>con.close()</code> does that</li>
</ul>
</li>
<li>DB API supports transactions if database supports them :
<ul>
<li><code>commit()</code> keeps a batch of changes, <code>rollback()</code> undoes it</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise10</code><br><code class="pill-exercise pill-desc">Python Database Access</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="object-orientation-in-python">Object Orientation in Python</h1>
<ul>
<li>Python is an object-oriented language :
<ul>
<li>Every value in Python is an object, and every object has a class</li>
<li>Classes of your own are created with the <code>class</code> keyword</li>
</ul>
</li>
<li>Class :
<ul>
<li>A blueprint for a set of related objects</li>
<li>Defines the attributes and methods that every object of the class has</li>
<li>Attributes hold data, methods are functions; both are reached with dot notation</li>
</ul>
</li>
<li>Object or instance :
<ul>
<li>An individual object of a certain class, with its own identity</li>
<li>Its state is the current value of its attributes</li>
<li>State differs per object, behavior is shared by all instances</li>
</ul>
</li>
<li>Inheritance :
<ul>
<li>A class can extend another class, inheriting its attributes and methods</li>
</ul>
</li>
</ul>
</section>

<span class="line"><span style="color:#24292EFF">thrall</span><span style="color:#212121">.</span><span style="color:#6F42C1">introduce</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>I am Jaina</span></span>
<span class="line"><span>I am Thrall</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>Character(&quot;Jaina&quot;)</code> creates an object and runs <code>__init__</code> on it :
<ul>
<li><code>self</code> is the new object; <code>self.name = name</code> stores the name on it</li>
</ul>
</li>
<li><code>jaina.introduce()</code> runs <code>introduce</code> with <code>self</code> set to <code>jaina</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">firstmethod</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="212" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="212" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="example-creating-classes-and-objects">Example Creating Classes and Objects</h1>
<ul>
<li>The same pattern with more attributes and methods :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#4a9c59">    """A World of Warcraft character, with its own health."""</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> health</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> take_damage</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> amount</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> max</span><span style="color:#212121">(self.health </span><span style="color:#D32F2F">-</span><span style="color:#212121"> amount, </span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> heal</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> amount</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> min</span><span style="color:#212121">(self.health </span><span style="color:#D32F2F">+</span><span style="color:#212121"> amount, </span><span style="color:#1976D2">100</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> show_status</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">self.name</span><span style="color:#1976D2">}</span><span style="color:#22863A"> : </span><span style="color:#1976D2">{</span><span style="color:#212121">self.health</span><span style="color:#1976D2">}</span><span style="color:#22863A"> health"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Call the class by its name and pass the arguments that <code>__init__</code> accepts :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">, </span><span style="color:#1976D2">100</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="213" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="213" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="class-members">Class Members</h1>
<ul>
<li><code>__init__()</code> :
<ul>
<li>The initialization method, often called the constructor</li>
<li>Called by Python when you create a new instance of this class</li>
<li>Sets the instance attributes, here <code>self.name</code> and <code>self.health</code></li>
</ul>
</li>
<li>Instance methods :
<ul>
<li>Declared like normal functions, but the first parameter of each method is <code>self</code></li>
<li>You do not pass <code>self</code> when you call a method, since Python adds it</li>
</ul>
</li>
<li><code>self</code> is a reference to the instance :
<ul>
<li>Instance attributes are read and written as <code>self.health</code></li>
<li><code>jaina.take_damage(10)</code> changes the health of <code>jaina</code> and of no other character</li>
</ul>
</li>
<li>Python frees objects for you when nothing refers to them any more :
<ul>
<li><code>__del__</code> exists and you rarely need it</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="214" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="214" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="creating-and-using-objects">Creating and Using Objects</h1>
<ul>
<li>Creating objects :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">, </span><span style="color:#1976D2">100</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">hogger </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Hogger"</span><span style="color:#212121">, </span><span style="color:#1976D2">60</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Access the object's methods and attributes using the dot operator :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">hogger</span><span style="color:#212121">.</span><span style="color:#6F42C1">take_damage</span><span style="color:#212121">(</span><span style="color:#1976D2">25</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#6F42C1">take_damage</span><span style="color:#212121">(</span><span style="color:#1976D2">10</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#6F42C1">heal</span><span style="color:#212121">(</span><span style="color:#1976D2">5</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#6F42C1">show_status</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">hogger</span><span style="color:#212121">.</span><span style="color:#6F42C1">show_status</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Result :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Jaina : 95 health</span></span>
<span class="line"><span>Hogger : 35 health</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Each object keeps its own <code>health</code>; the methods are shared</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">character</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="215" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="215" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="accessing-attributes">Accessing Attributes</h1>
<ul>
<li>In Python you can add, remove, or modify attributes at any time :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">mount </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Gryphon"</span><span style="color:#4a9c59">  # Add a 'mount' attribute</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">mount </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "Swift Gryphon"</span><span style="color:#4a9c59">  # Modify 'mount' attribute</span></span>
<span class="line"><span style="color:#D32F2F">del</span><span style="color:#24292EFF"> jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">mount  </span><span style="color:#4a9c59"># Delete 'mount' attribute</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Four functions do the same with an attribute name held in a string :
<ul>
<li>Useful when the name is only known while the program runs</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">attr </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "mount"</span><span style="color:#4a9c59">  # an attribute name held in a variable</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">hasattr</span><span style="color:#212121">(jaina, attr))</span><span style="color:#4a9c59">  # True if the attribute exists</span></span>
<span class="line"><span style="color:#6F42C1">setattr</span><span style="color:#212121">(jaina, attr, </span><span style="color:#22863A">"Swift Gryphon"</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # Set or create the attribute</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">getattr</span><span style="color:#212121">(jaina, attr))</span><span style="color:#4a9c59">  # Returns the value of the attribute</span></span>
<span class="line"><span style="color:#6F42C1">delattr</span><span style="color:#212121">(jaina, attr)</span><span style="color:#4a9c59">  # Delete the attribute</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">getattr</span><span style="color:#212121">(jaina, attr, </span><span style="color:#22863A">"no mount"</span><span style="color:#212121">))</span><span style="color:#4a9c59">  # The default, because the attribute is gone</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>False</span></span>
<span class="line"><span>Swift Gryphon</span></span>
<span class="line"><span>no mount</span></span>
<span class="line"><span></span></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="216" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="216" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="class-attributes-and-instance-attributes">Class Attributes and Instance Attributes</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    max_level </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 60</span><span style="color:#4a9c59">  # class attribute, one value shared by every character</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name  </span><span style="color:#4a9c59"># instance attribute, one value per character</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">thrall </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Thrall"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.name, thrall.name)</span><span style="color:#4a9c59">  # Jaina Thrall</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.max_level, thrall.max_level)</span><span style="color:#4a9c59">  # 60 60</span></span>
<span class="line"><span style="color:#24292EFF">Character</span><span style="color:#212121">.</span><span style="color:#24292EFF">max_level </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 70</span><span style="color:#4a9c59">  # an expansion raises the cap for everyone</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.max_level, thrall.max_level)</span><span style="color:#4a9c59">  # 70 70</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">max_level </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 80</span><span style="color:#4a9c59">  # creates an instance attribute on jaina only</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.max_level, thrall.max_level, Character.max_level)</span><span style="color:#4a9c59">  # 80 70 70</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A class attribute is assigned in the class body; an instance attribute on <code>self</code></li>
<li>Reading <code>jaina.max_level</code> looks on the object first, then on the class</li>
<li>Assigning <code>jaina.max_level</code> writes to the object; change shared data on the class</li>
<li>Methods that need no instance exist as well, <code>@staticmethod</code> and <code>@classmethod</code> :
<ul>
<li>They are covered in the Advanced Python course</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">classattributes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="217" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="217" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="__str__-and-__repr__"><code>__str__</code> and <code>__repr__</code></h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> health</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __repr__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"Character(</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">, </span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">)"</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __str__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#1976D2">}</span><span style="color:#22863A"> (</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health</span><span style="color:#1976D2">}</span><span style="color:#22863A"> health)"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">, </span><span style="color:#1976D2">100</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina)</span><span style="color:#4a9c59">  # str(), for people</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">repr</span><span style="color:#212121">(jaina))</span><span style="color:#4a9c59">  # repr(), for developers</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">([jaina])</span><span style="color:#4a9c59">  # a list shows the repr() of its items</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Jaina (100 health)</span></span>
<span class="line"><span>Character('Jaina', 100)</span></span>
<span class="line"><span>[Character('Jaina', 100)]</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>__str__</code> is used by <code>print()</code>, <code>str()</code> and f-strings</li>
<li><code>__repr__</code> is used by the interactive prompt, by containers and by <code>!r</code> :
<ul>
<li>Make it look like the call that creates the object; <code>str()</code> falls back to it</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">strrepr</code></p>
</blockquote>

<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="attributes-are-public">Attributes Are Public</h1>
<ul>
<li>An attribute set in <code>__init__</code> is public, and that is fine :
<ul>
<li>Any code that has the object can read it and assign to it</li>
<li>No methods are written to get or set it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> health</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">, </span><span style="color:#1976D2">100</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.health)</span><span style="color:#4a9c59">  # read it</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 80</span><span style="color:#4a9c59">  # write it</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.health)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>100</span></span>
<span class="line"><span>80</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">publicattributes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="219" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="219" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="a-computed-attribute">A Computed Attribute</h1>
<ul>
<li>Whether a character is alive depends on its health :
<ul>
<li>As a method, <code>def is_alive(self)</code>, it is called as <code>jaina.is_alive()</code></li>
<li>With <code>@property</code> above the <code>def</code>, it is read as <code>jaina.is_alive</code>, like an attribute</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> health</span></span>
<span class="line"><span style="color:#6F42C1">    @</span><span style="color:#1976D2">property</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> is_alive</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> bool</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 0</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">, </span><span style="color:#1976D2">30</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.is_alive)</span><span style="color:#4a9c59">  # no parentheses</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 0</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.is_alive)</span><span style="color:#4a9c59">  # always current</span></span>
<span class="line"><span style="color:#24292EFF">jaina</span><span style="color:#212121">.</span><span style="color:#24292EFF">is_alive </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> True</span><span style="color:#4a9c59">  # read-only : there is no setter</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>True</span></span>
<span class="line"><span>False</span></span>
<span class="line"><span>AttributeError: property 'is_alive' of 'Character' object has no setter</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">computedproperty</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="220" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="220" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="when-a-plain-attribute-is-not-enough">When a Plain Attribute Is Not Enough</h1>
<ul>
<li>The <code>Character</code> so far accepts any health, <code>jaina.health = -20</code> included</li>
<li>The fix makes <code>health</code> a property whose setter checks the value :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> health  </span><span style="color:#4a9c59"># goes through the setter below</span></span>
<span class="line"><span style="color:#6F42C1">    @</span><span style="color:#1976D2">property</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> health</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> self</span><span style="color:#212121">.</span><span style="color:#24292EFF">_health</span></span>
<span class="line"><span style="color:#6F42C1">    @health</span><span style="color:#212121">.</span><span style="color:#6F42C1">setter</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> health</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> value</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        if</span><span style="color:#D32F2F"> not</span><span style="color:#1976D2"> 0</span><span style="color:#D32F2F"> &#x3C;=</span><span style="color:#24292EFF"> value </span><span style="color:#D32F2F">&#x3C;=</span><span style="color:#1976D2"> 100</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">            raise</span><span style="color:#1976D2"> ValueError</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"health must be between 0 and 100, got </span><span style="color:#1976D2">{</span><span style="color:#212121">value</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">_health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> value</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The value is stored in <code>self._health</code>, the property's own storage</li>
<li>The code that uses the class does not change :
<ul>
<li><code>jaina.health = 0</code> still works, and <code>jaina.health = -20</code> now raises <code>ValueError</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">validatingsetter</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="221" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="221" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="the-rule-of-thumb">The Rule of Thumb</h1>
<ul>
<li>Start with a plain attribute :
<ul>
<li>Do not write getter and setter methods in advance</li>
</ul>
</li>
<li>Turn it into a property the day it needs a rule :
<ul>
<li>A check on the value, or a value computed from other attributes</li>
<li>The calling code keeps writing <code>jaina.health</code>, so nothing else changes</li>
</ul>
</li>
<li>The property keeps its value in an attribute with a leading underscore :
<ul>
<li><code>_health</code> is internal to the class, by convention</li>
</ul>
</li>
</ul>
<div class="mermaid-diagram" style="aspect-ratio: 621 / 88"><svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 621 88" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,IBM Plex Mono, ui-monospace, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,IBM Plex Sans, Helvetica Neue, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" preserveAspectRatio="xMidYMid meet"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M128.48,44L284.6,44" /><path class="pele-marker" d="M291.6,44L283.6,47.36L283.6,40.64Z" fill="var(--_l)" stroke="none" /></g><g class="pele-edge" data-id="L_B_C_0"><path d="M446.77,44L487.77,44" /><path class="pele-marker" d="M494.77,44L486.77,47.36L486.77,40.64Z" fill="var(--_l)" stroke="none" /></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_A_B_0"><rect x="150.98" y="33.5" width="111.12" height="21" rx="3" fill="var(--_bg)" /><text x="206.54" y="48.9" text-anchor="middle">jaina.health = 80</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(68.24,44)"><rect x="-60.24" y="-24" width="120.48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">calling code</text></g><g class="pele-node pele-shape-rect" data-id="B" transform="translate(369.19,44)"><rect x="-77.58" y="-36" width="155.17" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">health property</tspan><tspan x="0" y="17.6">checks the value</tspan></text></g><g class="pele-node pele-shape-rect" data-id="C" transform="translate(553.68,44)"><rect x="-58.91" y="-24" width="117.82" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)" /><text class="pele-label" x="0" y="5.6" text-anchor="middle">self._health</text></g></g></svg></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="222" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="222" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="internal-attributes">Internal Attributes</h1>
<ul>
<li>Python has no keyword that makes an attribute private :
<ul>
<li>A leading underscore, <code>_gold</code>, means internal, by convention</li>
<li>Code outside the class can reach it, and is expected not to</li>
</ul>
</li>
<li>Two leading underscores, <code>__auth_code</code>, make Python rename the attribute to <code>_Character__auth_code</code></li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name  </span><span style="color:#4a9c59"># public</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">_gold </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 0</span><span style="color:#4a9c59">  # internal, by convention</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">__auth_code </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "7f3a"</span><span style="color:#4a9c59">  # name mangled to _Character__auth_code</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Character</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.name)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina._gold)</span><span style="color:#4a9c59">  # works, but the underscore says: not for you</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina._Character__auth_code)</span><span style="color:#4a9c59">  # the mangled name still works</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Jaina</span></span>
<span class="line"><span>0</span></span>
<span class="line"><span>7f3a</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">internalattributes</code></p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="223" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="223" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="a-class-can-extend-another">A Class Can Extend Another</h1>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> health</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> describe</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#1976D2">}</span><span style="color:#22863A"> has </span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">health</span><span style="color:#1976D2">}</span><span style="color:#22863A"> health"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Mage</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Character</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> health</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#212121">,</span><span style="color:#FF9800"> spells</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#1976D2">        super</span><span style="color:#212121">().</span><span style="color:#6F42C1">__init__</span><span style="color:#212121">(name, health)</span><span style="color:#4a9c59">  # the Character part</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">spells </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> spells  </span><span style="color:#4a9c59"># what a Mage adds</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> describe</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:  </span><span style="color:#4a9c59"># replaces Character.describe</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{super</span><span style="color:#212121">().</span><span style="color:#6F42C1">describe</span><span style="color:#212121">()</span><span style="color:#1976D2">}</span><span style="color:#22863A"> and knows </span><span style="color:#1976D2">{</span><span style="color:#6F42C1">len</span><span style="color:#212121">(self.spells)</span><span style="color:#1976D2">}</span><span style="color:#22863A"> spells"</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>Mage</code> inherits every method of <code>Character</code>, adds to it and may replace methods</li>
<li><code>super().__init__(...)</code> runs the <code>Character</code> initialization, so <code>name</code> and <code>health</code> are set</li>
<li><code>Mage(&quot;Jaina&quot;, 70, [&quot;Fireball&quot;, &quot;Frostbolt&quot;, &quot;Blizzard&quot;]).describe()</code> returns :
<ul>
<li><code>Jaina has 70 health and knows 3 spells</code></li>
</ul>
</li>
<li>Inheritance in depth is covered in the Advanced Python course</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">inheritance</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="224" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="224" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="270" data-size="16:10">
<div class="ml-eyebrow"><a href="#207"><span class="ml-tag">python</span>Python Classes</a></div>
<h1 id="summary--python-classes">Summary : Python Classes</h1>
<ul>
<li>Classes are blueprints for a set of related objects :
<ul>
<li>Define both attributes and methods and are created with the <code>class</code> keyword</li>
</ul>
</li>
<li>Objects are instances of classes :
<ul>
<li>Each object has its own state and identity, instance methods have a <code>self</code> parameter</li>
</ul>
</li>
<li>The initialization method is named <code>__init__()</code> :
<ul>
<li>Called by Python when the class is called to create an object</li>
</ul>
</li>
<li>Instance attributes belong to one object, class attributes are shared by all instances</li>
<li><code>__str__</code> and <code>__repr__</code> decide how an object is printed</li>
<li>Attributes are public; a property adds a rule without changing the calling code :
<ul>
<li>Start with a plain attribute, turn it into a property the day it needs a rule</li>
</ul>
</li>
<li>A leading underscore marks an attribute as internal, by convention</li>
<li>A class can extend another, and calls <code>super().__init__()</code> to set up the parent part</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise11</code><br><code class="pill-exercise pill-desc">Python Classes</code></p>
</blockquote>
</section>
