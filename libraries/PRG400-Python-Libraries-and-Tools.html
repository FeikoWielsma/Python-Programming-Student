<h1 id="choosing-topics">Choosing Topics</h1>
<ul>
<li>The optional modules are selected with the trainer to suit the group.</li>
<li>Command-line programs and subprocesses support scripting and automation.</li>
<li>The modern toolbelt covers progress displays, formatted output and HTTP.</li>
<li>Web scraping and SQLAlchemy cover collecting and storing records.</li>
<li>NumPy and pandas cover arrays, tables and reports.</li>
<li>GUI toolkits introduce desktop windows.</li>
<li>Inheritance previews Advanced Python and can be skipped.</li>
<li>The supplied data and database seed let later modules run independently.</li>
</ul>
</section>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="inheritance">Inheritance</h1>
<ul>
<li>A first course builds one class at a time :
<ul>
<li>A blueprint, its attributes, its methods, and <code>self</code></li>
</ul>
</li>
<li>Working code is rarely a single class :
<ul>
<li>It is several classes doing one job on different data</li>
</ul>
</li>
<li>This module is about the relationship between them :
<ul>
<li>What they share, what each one changes, where to draw the line</li>
</ul>
</li>
<li>The worked example is a scraper :
<ul>
<li>One base class, two sites, and nothing written twice</li>
</ul>
</li>
<li>The same design comes back in the web scraping module</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="5" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="5" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="duplicated-code">Duplicated Code</h1>
<ul>
<li>A scraper for one site is a small class :
<ul>
<li>Collect the rows, keep them, report what was found</li>
</ul>
</li>
<li>A second site needs that class again :
<ul>
<li>Only the parsing differs, because only the markup differs</li>
</ul>
</li>
<li>Copying the file is the fastest thing to do :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> BooksScraper</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">: ...</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> collect</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">: ...</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> parse</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#24292EFF">dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> str</span><span style="color:#212121">]]</span><span style="color:#24292EFF">: ...   </span><span style="color:#4a9c59"># the only site-specific part</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> report</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">: ...</span></span>
<span class="line"></span>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="cost-of-duplication">Cost of Duplication</h1>
<ul>
<li>A bug fixed in one copy stays alive in the other :
<ul>
<li>Nothing in the code records that the two files belong together</li>
</ul>
</li>
<li>A new field means an edit in every copy :
<ul>
<li>The number of copies only ever grows</li>
</ul>
</li>
<li>A reader cannot tell the shared part from the deliberate difference :
<ul>
<li>Both look the same on the page</li>
</ul>
</li>
<li>The repair is to write the shared part once :
<ul>
<li>And let each site supply only what is genuinely its own</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="7" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="7" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="base-classes-and-subclasses">Base Classes and Subclasses</h1>
<ul>
<li>A class may name another class as its base :
<ul>
<li>Written as <code>class BooksScraper(Scraper):</code></li>
</ul>
</li>
<li>The base class holds everything that is not site-specific</li>
<li>Each subclass supplies only the part that differs :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Scraper</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> name</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">rows</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#24292EFF">dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> str</span><span style="color:#212121">]]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> collect</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> self</span><span style="color:#212121">.</span><span style="color:#6F42C1">parse</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> parse</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#24292EFF">dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> str</span><span style="color:#212121">]]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> []</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> BooksScraper</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Scraper</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> parse</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#24292EFF">dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> str</span><span style="color:#212121">]]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> [row</span><span style="color:#212121">.</span><span style="color:#6F42C1">copy</span><span style="color:#212121">()</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> BOOK_ROWS]</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">subclass</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="8" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="8" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="inherited-members">Inherited Members</h1>
<ul>
<li>Every method the base class defines, without repeating it</li>
<li>Every attribute the base <code>__init__</code> creates, for the same reason</li>
<li>A subclass may add to that, replace part of it, or leave it alone</li>
</ul>

<h1 id="constructor-chaining">Constructor Chaining</h1>
<ul>
<li>A subclass with attributes of its own needs its own <code>__init__</code> :
<ul>
<li>The base initialiser still has to run</li>
</ul>
</li>
<li><code>super().__init__(...)</code> calls the version one level up :
<ul>
<li>Call it first, before setting anything of your own</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> BooksScraper</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Scraper</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> base_url</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#1976D2">        super</span><span style="color:#212121">().</span><span style="color:#6F42C1">__init__</span><span style="color:#212121">(name)</span><span style="color:#4a9c59">          # name and rows exist after this line</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">base_url</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> base_url</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Leaving that line out is the most common mistake in the module :
<ul>
<li>The object is built happily, then fails later with <code>AttributeError</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">super_init</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="10" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="10" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="overriding-methods">Overriding Methods</h1>
<ul>
<li>A method on the subclass wins over the one on the base :
<ul>
<li>Same name, different body, no declaration needed anywhere</li>
</ul>
</li>
<li>Replacing a method throws the base version away :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Scraper</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> clean</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> value</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> value</span><span style="color:#212121">.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> BooksScraper</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Scraper</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> clean</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> value</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> value</span><span style="color:#212121">.</span><span style="color:#6F42C1">removeprefix</span><span style="color:#212121">(</span><span style="color:#22863A">"$"</span><span style="color:#212121">)</span><span style="color:#4a9c59">      # the strip() is gone</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Given the raw value <code>&quot;  $51.77  &quot;</code> that override returns it unchanged :
<ul>
<li>The leading spaces are still there when <code>removeprefix</code> looks</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="11" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="11" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="extending-with-super">Extending with super</h1>
<ul>
<li><code>super()</code> reaches the base version from inside the override :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> BooksScraper</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Scraper</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> clean</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> value</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#1976D2"> super</span><span style="color:#212121">().</span><span style="color:#6F42C1">clean</span><span style="color:#212121">(value).</span><span style="color:#6F42C1">removeprefix</span><span style="color:#212121">(</span><span style="color:#22863A">"$"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The base class does its part, the subclass adds one step</li>
<li>Choose between the two deliberately :
<ul>
<li>Replace when the inherited behaviour is wrong here</li>
<li>Extend when it is right and merely incomplete</li>
</ul>
</li>
<li>Overriding <code>__init__</code> is the same decision, and usually the extending one</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">overriding</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="12" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="12" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="isinstance-and-issubclass">isinstance and issubclass</h1>
<ul>
<li><code>isinstance(obj, Class)</code> asks whether an object is usable as that class :
<ul>
<li>True for the class itself and for every subclass of it</li>
</ul>
</li>
<li><code>issubclass(Sub, Base)</code> asks the same question about two classes</li>
<li><code>type(obj) is Class</code> is a stricter and usually wrong question :
<ul>
<li>It refuses subclasses, which defeats the point of having them</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">isinstance</span><span style="color:#212121">(paged, BooksScraper)</span><span style="color:#4a9c59">     # True, PagedBooksScraper inherits from it</span></span>
<span class="line"><span style="color:#1976D2">type</span><span style="color:#212121">(paged)</span><span style="color:#D32F2F"> is</span><span style="color:#24292EFF"> BooksScraper         </span><span style="color:#4a9c59"># False, the type is not exactly that</span></span>
<span class="line"><span style="color:#6F42C1">isinstance</span><span style="color:#212121">(value, (</span><span style="color:#1976D2">str</span><span style="color:#212121">, </span><span style="color:#1976D2">bytes</span><span style="color:#212121">))</span><span style="color:#4a9c59">     # a tuple asks about several at once</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Reach for it only where the code genuinely has to branch on type</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">relationships</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="13" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="13" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="str-and-repr">str and repr</h1>
<ul>
<li><code>__str__</code> is for the person reading the output :
<ul>
<li>Used by <code>print()</code> and by <code>f&quot;{value}&quot;</code></li>
</ul>
</li>
<li><code>__repr__</code> is for the person debugging :
<ul>
<li>Used by the interpreter, and by every container</li>
</ul>
</li>
<li>A list shows the <code>__repr__</code> of its elements, never the <code>__str__</code> :
<ul>
<li>Which is why a list of objects prints hexadecimal addresses</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Scraper</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __str__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#1976D2">}</span><span style="color:#22863A"> with </span><span style="color:#1976D2">{</span><span style="color:#6F42C1">len</span><span style="color:#212121">(self.rows)</span><span style="color:#1976D2">}</span><span style="color:#22863A"> rows"</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __repr__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{type</span><span style="color:#212121">(self).</span><span style="color:#1976D2">__name__}</span><span style="color:#22863A">(name=</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#D32F2F">!r</span><span style="color:#1976D2">}</span><span style="color:#22863A">, rows=</span><span style="color:#1976D2">{</span><span style="color:#6F42C1">len</span><span style="color:#212121">(self.rows)</span><span style="color:#1976D2">}</span><span style="color:#22863A">)"</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Define both once on the base class and every subclass inherits them</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">str_and_repr</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="14" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="14" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="polymorphism">Polymorphism</h1>
<ul>
<li>One list may hold objects of several classes at once :
<ul>
<li>Provided they answer to the same methods</li>
</ul>
</li>
<li>The loop calls the method and Python picks the version :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> run_all</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">scrapers</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#24292EFF">Scraper</span><span style="color:#212121">]</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    total </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 0</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> scraper </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> scrapers</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">        scraper</span><span style="color:#212121">.</span><span style="color:#6F42C1">collect</span><span style="color:#212121">()</span><span style="color:#4a9c59">            # a different parse() runs each time round</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(scraper.</span><span style="color:#6F42C1">report</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#24292EFF">        total </span><span style="color:#D32F2F">+=</span><span style="color:#6F42C1"> len</span><span style="color:#212121">(scraper.rows)</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> total</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Adding a fourth site changes the list, and nothing else</li>
<li>This is polymorphism, and it is the reason the base class earns its place</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">polymorphism</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="15" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="15" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="abstract-base-classes">Abstract Base Classes</h1>
<ul>
<li>A base <code>parse()</code> that returns an empty list is a promise nobody enforces :
<ul>
<li>A subclass that forgets it scrapes nothing, silently</li>
</ul>
</li>
<li>An abstract base class states the requirement and enforces it :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> abc </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> ABC</span><span style="color:#212121">,</span><span style="color:#24292EFF"> abstractmethod</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Scraper</span><span style="color:#24292EFF">(ABC):</span></span>
<span class="line"><span style="color:#6F42C1">    @abstractmethod</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> parse</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#24292EFF">dict</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#1976D2"> str</span><span style="color:#212121">]]</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#4a9c59">        """Return the rows found in one page of this site."""</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> collect</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:          </span><span style="color:#4a9c59"># concrete, and calls the abstract method</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> self</span><span style="color:#212121">.</span><span style="color:#6F42C1">parse</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A subclass without <code>parse</code> cannot be created at all</li>
<li>Neither can the abstract class itself, which is the point of it</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">abstract_contract</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="16" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="16" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="enforcing-the-contract">Enforcing the Contract</h1>
<ul>
<li>The failure moves to the earliest moment it possibly can :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>TypeError: Can't instantiate abstract class HalfFinishedScraper</span></span>
<span class="line"><span>without an implementation for abstract method 'parse'</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The requirement is written down where the next reader will find it</li>
<li>The base class may still carry real shared code :
<ul>
<li>Abstract methods and ordinary methods sit side by side</li>
</ul>
</li>
<li>Use one when several classes must offer the same set of methods :
<ul>
<li>Leave it out for a base class that already works on its own</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="17" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="17" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="composition">Composition</h1>
<ul>
<li>Inheritance is a strong claim, so say it out loud before writing it :
<ul>
<li>A <code>BooksScraper</code> is a <code>Scraper</code>, so it inherits</li>
<li>A <code>BooksScraper</code> is not a <code>RowStore</code>, so it holds one instead</li>
</ul>
</li>
<li>Holding another object as an attribute is composition :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> BooksScraper</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Scraper</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> store</span><span style="color:#212121">:</span><span style="color:#24292EFF"> RowStore) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#1976D2">        super</span><span style="color:#212121">().</span><span style="color:#6F42C1">__init__</span><span style="color:#212121">(name)</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">store</span><span style="color:#212121">:</span><span style="color:#24292EFF"> RowStore </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> store</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A wrong base class publishes methods nobody meant to offer :
<ul>
<li>Inheriting from <code>dict</code> gives a scraper eleven public dictionary methods</li>
</ul>
</li>
<li>Prefer composition where the choice is unclear, as it is easier to undo</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">composition</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="18" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="18" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="scraper-toolkit">Scraper Toolkit</h1>
<ul>
<li>The finished shape, in one file :
<ul>
<li>An abstract <code>Scraper</code>, with <code>parse</code> as the contract</li>
<li>Shared <code>clean</code>, <code>collect</code>, <code>row_count</code>, <code>__str__</code> and <code>__repr__</code></li>
<li><code>BooksScraper</code> and <code>QuotesScraper</code>, one method each</li>
</ul>
</li>
<li>The rows are canned, so nothing here touches the network</li>
<li>The web scraping module replaces <code>parse</code> with real HTML :
<ul>
<li>Every other line of the file stays exactly as it is</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">scraper_toolkit</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="19" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="19" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="advanced-python-topics">Advanced Python Topics</h1>
<ul>
<li>The same topic, carried a long way further :
<ul>
<li>Multiple inheritance, and the order Python searches the bases in</li>
<li>Mixins, small classes that add one behaviour to many others</li>
<li><code>Protocol</code>, a contract a class satisfies without ever naming it</li>
</ul>
</li>
<li>And the machinery underneath the classes :
<ul>
<li><code>__new__</code>, descriptors, metaclasses and <code>__slots__</code></li>
</ul>
</li>
<li>Everything above assumes exactly what this module has just covered</li>
<li>Nothing on this slide is needed for the rest of this course</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="20" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="20" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="summary--inheritance">Summary : Inheritance</h1>
<ul>
<li>Inheritance exists to stop the same code being written twice :
<ul>
<li>Shared behaviour in a base class, differences in the subclasses</li>
</ul>
</li>
<li>A subclass inherits methods and the attributes the base <code>__init__</code> creates :
<ul>
<li><code>super().__init__(...)</code> runs that initialiser, and is easy to forget</li>
</ul>
</li>
<li>Overriding replaces a method, and <code>super()</code> inside it extends instead</li>
<li><code>__str__</code> is for output and <code>__repr__</code> is for debugging :
<ul>
<li>Containers always show the second one</li>
</ul>
</li>
<li>One loop over a list of related objects calls a different method each time</li>
<li>An abstract base class turns the promise into a rule the interpreter enforces</li>
<li>Composition, a plain attribute, is the answer whenever &quot;is a&quot; sounds wrong</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise01</code><br><code class="pill-exercise pill-desc">Inheritance</code></p>
</blockquote>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="22" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="22" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="command-line-programs">Command-line Programs</h1>
<ul>
<li>A script does one job, to one file, with the settings typed into the source</li>
<li>A tool takes its settings from the command line :
<ul>
<li>The same code serves every file, every level and every output format</li>
</ul>
</li>
<li>Three things separate the two :
<ul>
<li>It explains itself when asked</li>
<li>It refuses a wrong command line clearly, instead of crashing later</li>
<li>It reports success or failure in a way another program can read</li>
</ul>
</li>
<li>Everything in this module is standard library, so it ships with Python</li>
<li>The end of the module is a checklist you can hold a script up against</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="23" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="23" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="sysargv">sys.argv</h1>
<ul>
<li>Everything typed after the program name arrives in <code>sys.argv</code> :
<ul>
<li>A plain list of strings, in the order they were given</li>
<li><code>sys.argv[0]</code> is the program itself, so the real arguments start at <code>1</code></li>
</ul>
</li>
<li>Nothing is converted, so a number arrives as text</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sys</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(sys.argv)</span><span style="color:#4a9c59">          # ['tool.py', 'report', '--limit', '5']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(sys.argv[</span><span style="color:#1976D2">1</span><span style="color:#212121">:])</span><span style="color:#4a9c59">      # ['report', '--limit', '5']</span></span>
<span class="line"></span></code></pre>
<ul>
<li>This is the whole interface between the shell and the program</li>
<li>Every argument library in Python is a layer over this one list</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">sys_argv</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="24" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="24" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="manual-argument-parsing">Manual Argument Parsing</h1>
<ul>
<li>Reading the list yourself works, right up until it does not :
<ul>
<li>An option whose value is missing walks off the end of the list</li>
<li>A value that should be a number is still a string</li>
<li>A mistyped option is silently taken for something else</li>
<li>Nobody wrote <code>--help</code>, so there is none</li>
</ul>
</li>
<li>Each of those is a few more lines of defensive code</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> item </span><span style="color:#D32F2F">==</span><span style="color:#22863A"> "--limit"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    index </span><span style="color:#D32F2F">+=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"><span style="color:#24292EFF">    limit </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(argv[index])</span><span style="color:#4a9c59">   # IndexError, or ValueError</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The handwritten version grows faster than the program it serves</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">argv_by_hand</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="25" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="25" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="argumentparser">ArgumentParser</h1>
<ul>
<li><code>argparse</code> inverts the work : you describe the command line, it does the rest</li>
<li>A positional argument is named and required by position</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> argparse</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">parser </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> argparse</span><span style="color:#212121">.</span><span style="color:#6F42C1">ArgumentParser</span><span style="color:#212121">(description</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Print the square of a number."</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"number"</span><span style="color:#212121">, type</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">int</span><span style="color:#212121">, help</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"the number to square"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">args </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">parse_args</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(args.number </span><span style="color:#D32F2F">**</span><span style="color:#1976D2"> 2</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>type=</code> is a conversion, so <code>args.number</code> is an <code>int</code> and not <code>&quot;12&quot;</code></li>
<li><code>help=</code> is the text that appears under <code>--help</code></li>
<li>The result is a namespace whose attributes are the argument names</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">first_parser</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="26" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="26" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="options-and-flags">Options and Flags</h1>
<ul>
<li>A name starting with a dash is optional, and gets a default</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"--dry-run"</span><span style="color:#212121">, action</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"store_true"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"-v"</span><span style="color:#212121">, </span><span style="color:#22863A">"--verbose"</span><span style="color:#212121">, action</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"count"</span><span style="color:#212121">, default</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">0</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"--format"</span><span style="color:#212121">, choices</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"dec"</span><span style="color:#212121">, </span><span style="color:#22863A">"hex"</span><span style="color:#212121">], default</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"dec"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>action=&quot;store_true&quot;</code> makes a flag, present or absent, no value</li>
<li><code>action=&quot;count&quot;</code> counts repeats, so <code>-vv</code> gives <code>2</code></li>
<li><code>choices=</code> rejects anything outside the list and advertises the options</li>
<li><code>nargs=&quot;?&quot;</code> makes a positional optional, with a default of its own</li>
<li>A dashed name becomes an underscored attribute : <code>--dry-run</code> is <code>args.dry_run</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">options_and_flags</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="27" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="27" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="mutually-exclusive-options">Mutually Exclusive Options</h1>
<ul>
<li>Some options make no sense together, and the parser can say so</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">loudness </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_mutually_exclusive_group</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">loudness</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"-v"</span><span style="color:#212121">, </span><span style="color:#22863A">"--verbose"</span><span style="color:#212121">, action</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"store_true"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">loudness</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"-q"</span><span style="color:#212121">, </span><span style="color:#22863A">"--quiet"</span><span style="color:#212121">, action</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"store_true"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Passing both is refused before a single line of your code runs :
<ul>
<li>The message names the conflict and the process exits with status <code>2</code></li>
</ul>
</li>
<li>This is validation you would otherwise write, forget, or get subtly wrong</li>
<li>The group is only about the command line, not about the values</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">mutually_exclusive</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="28" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="28" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="generated-help-and-errors">Generated Help and Errors</h1>
<ul>
<li><code>--help</code> is generated from the <code>add_argument</code> calls, never written by hand</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>usage: squares [-h] [-v] number</span></span>
<span class="line"><span></span></span>
<span class="line"><span>positional arguments:</span></span>
<span class="line"><span>  number         the number to square</span></span>
<span class="line"><span></span></span>
<span class="line"><span>options:</span></span>
<span class="line"><span>  -h, --help     show this help message and exit</span></span>
<span class="line"><span>  -v, --verbose  explain the answer</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>A wrong command line prints a usage line to stderr and exits with status <code>2</code></li>
<li>Both behaviours are free, and both match what every other tool does</li>
<li><code>prog=</code>, <code>description=</code> and <code>epilog=</code> fill in the surrounding text</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">help_and_errors</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="29" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="29" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="subcommands">Subcommands</h1>
<ul>
<li>One program, several verbs, the shape of <code>git</code>, <code>apt</code> and <code>systemctl</code></li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">verbs </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_subparsers</span><span style="color:#212121">(dest</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"command"</span><span style="color:#212121">, required</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">add </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> verbs</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_parser</span><span style="color:#212121">(</span><span style="color:#22863A">"add"</span><span style="color:#212121">, help</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"add a host"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">add</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"host"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">add</span><span style="color:#212121">.</span><span style="color:#6F42C1">set_defaults</span><span style="color:#212121">(handler</span><span style="color:#D32F2F">=</span><span style="color:#212121">cmd_add)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Each verb is a parser of its own, with its own arguments and its own help</li>
<li><code>dest=</code> names the attribute holding the chosen verb</li>
<li><code>required=True</code> refuses a call with no verb at all</li>
<li><code>set_defaults(handler=...)</code> attaches the function that implements the verb</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">subcommands</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="30" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="30" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="path-arguments">Path Arguments</h1>
<ul>
<li><code>type=</code> accepts any callable, and <code>Path</code> is one</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> pathlib </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Path</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_argument</span><span style="color:#212121">(</span><span style="color:#22863A">"logfile"</span><span style="color:#212121">, type</span><span style="color:#D32F2F">=</span><span style="color:#212121">Path)</span></span>
<span class="line"><span style="color:#24292EFF">args </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> parser</span><span style="color:#212121">.</span><span style="color:#6F42C1">parse_args</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(args.logfile.name, args.logfile.</span><span style="color:#6F42C1">stat</span><span style="color:#212121">().st_size)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The argument arrives as a <code>Path</code>, ready to be read, joined or inspected</li>
<li>A converter of your own can validate at the same time :
<ul>
<li>Return the converted value, or raise <code>argparse.ArgumentTypeError</code></li>
<li>The parser turns that into an ordinary usage error, at status <code>2</code></li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">paths</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="31" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="31" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="filetype">FileType</h1>
<ul>
<li><code>argparse.FileType</code> opens the file during parsing, and looks convenient</li>
<li>Python 3.14 deprecates it, with an unusually direct message :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>FileType is deprecated. Simply open files after parsing arguments.</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The reasons :
<ul>
<li>The file is opened even when a later argument turns out to be wrong</li>
<li>Nothing ever closes it</li>
</ul>
</li>
<li>Take a <code>Path</code>, then open it yourself, in a <code>with</code> block</li>
<li>Handle the single dash yourself when you want to read standard input</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">filetype</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="32" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="32" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="main-and-the-exit-status">main and the Exit Status</h1>
<ul>
<li>Give the program one entry point that returns an integer</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> main</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">argv</span><span style="color:#212121">:</span><span style="color:#24292EFF"> list</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> |</span><span style="color:#1976D2"> None</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    args </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> build_parser</span><span style="color:#212121">().</span><span style="color:#6F42C1">parse_args</span><span style="color:#212121">(argv)</span></span>
<span class="line"><span style="color:#24292EFF">    ...</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#1976D2"> 0</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#1976D2"> __name__</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "__main__"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    raise</span><span style="color:#1976D2"> SystemExit</span><span style="color:#212121">(</span><span style="color:#6F42C1">main</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>argv=None</code> means &quot;take the real command line&quot;, and a list means &quot;take this one&quot;</li>
<li>That default makes the program callable from a test, or from another program</li>
<li><code>SystemExit(0)</code> is success, and any other number is not</li>
<li>The convention : <code>0</code> fine, <code>1</code> ran but found trouble, <code>2</code> unusable</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">main_exit_codes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="33" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="33" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="standard-output-and-standard-error">Standard Output and Standard Error</h1>
<ul>
<li>Two streams, two purposes :
<ul>
<li><code>stdout</code> carries the result, the part another program will read</li>
<li><code>stderr</code> carries progress, warnings and reasons</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(record)</span><span style="color:#4a9c59">                              # data</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"reading log"</span><span style="color:#212121">, file</span><span style="color:#D32F2F">=</span><span style="color:#212121">sys.stderr)</span><span style="color:#4a9c59">      # everything else</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Mixing them is what makes a tool unpleasant to use in a pipeline</li>
<li><code>sys.stdout.isatty()</code> is <code>False</code> when the output is a pipe or a file :
<ul>
<li>The usual signal to drop colour, banners and progress bars</li>
</ul>
</li>
<li>A reader that stops early raises <code>BrokenPipeError</code>, which is normal, not a bug</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">stderr_and_pipes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="34" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="34" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="inline-script-metadata">Inline Script Metadata</h1>
<ul>
<li>PEP 723 lets a single file declare what it needs, in a comment block</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#4a9c59"># /// script</span></span>
<span class="line"><span style="color:#4a9c59"># requires-python = ">=3.12"</span></span>
<span class="line"><span style="color:#4a9c59"># dependencies = ["rich>=13.9"]</span></span>
<span class="line"><span style="color:#4a9c59"># ///</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>uv run script.py</code> reads that block, builds an environment and runs the file</li>
<li>No virtual environment to create, activate, remember or clean up</li>
<li>The file stays one file, so it can be mailed, pasted or dropped in <code>~/bin</code></li>
<li>This is the current answer to &quot;a small program that needs one library&quot;</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">pep723_script</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="35" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="35" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="executable-scripts">Executable Scripts</h1>
<ul>
<li>Add a shebang above the metadata block and the file becomes a command :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#4a9c59">#!/usr/bin/env -S uv run --script</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Then the usual two steps, and it runs from anywhere :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">chmod</span><span style="color:#2B5581"> +x</span><span style="color:#2B5581"> logtool.py</span></span>
<span class="line"><span style="color:#6F42C1">./logtool.py</span><span style="color:#2B5581"> count</span><span style="color:#2B5581"> /var/log/syslog</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>env -S</code> is what allows the extra arguments after the interpreter name</li>
<li>The environment is cached, so only the first run pays for the install</li>
<li>Pin the versions in <code>dependencies</code> and the script still works next year</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="36" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="36" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="command-line-checklist">Command-line Checklist</h1>
<ul>
<li>It accepts its input on the command line, with sensible defaults</li>
<li>It has <code>--help</code>, and the help is generated rather than maintained</li>
<li>It refuses a wrong command line clearly, and exits <code>2</code> when it does</li>
<li>It prints data on stdout and everything else on stderr</li>
<li>It exits <code>0</code> on success and non-zero when the answer is bad news</li>
<li>It reads standard input when the filename is a single dash</li>
<li>It has one <code>main(argv) -&gt; int</code>, so it can be called as well as run</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">unix_citizen</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="37" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="37" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#21"><span class="ml-tag">python</span>Command-line Programs</a></div>
<h1 id="summary--command-line-programs">Summary : Command-line Programs</h1>
<ul>
<li><code>sys.argv</code> is the raw list of strings the shell handed over</li>
<li><code>argparse</code> turns a description of the command line into a parser :
<ul>
<li>Positionals, options, flags, <code>type=</code>, <code>choices=</code>, <code>default=</code> and <code>help=</code></li>
<li>The <code>--help</code> text and the usage errors come with it</li>
</ul>
</li>
<li><code>add_subparsers</code> gives one program several verbs, each with its own arguments</li>
<li>Take a <code>Path</code>, then open the file yourself inside a <code>with</code> block</li>
<li><code>main(argv: list[str] | None = None) -&gt; int</code> plus <code>SystemExit</code> gives real exit codes</li>
<li>Data goes to stdout, diagnostics go to stderr, and a broken pipe is normal</li>
<li>PEP 723 metadata plus <code>uv run</code> makes one file a complete program</li>
</ul>
<blockquote>
<p><code class="pill-exercise pill-id">exercise02</code><br><code class="pill-exercise pill-desc">Command-line Programs</code></p>
</blockquote>
</section>
