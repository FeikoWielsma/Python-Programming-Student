<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="numpy-arrays">NumPy Arrays</h1>
<ul>
<li>NumPy adds one thing to Python, the array :
<ul>
<li>A fixed-size block of numbers, all of the same type</li>
</ul>
</li>
<li>Everything else in the library exists to build or work on that array :
<ul>
<li>Arithmetic, statistics, sorting, reshaping, reading and writing</li>
</ul>
</li>
<li>An operation applies to the whole array at once :
<ul>
<li>No loop is written, and no loop runs in Python</li>
</ul>
</li>
<li>It is the foundation the rest of the numeric stack sits on :
<ul>
<li>Pandas, SciPy, scikit-learn and matplotlib all speak arrays</li>
</ul>
</li>
<li>The usual import, and it is always spelled this way :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> numpy </span><span style="color:#D32F2F">as</span><span style="color:#24292EFF"> np</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">celsius </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">25.3</span><span style="color:#212121">, </span><span style="color:#1976D2">24.8</span><span style="color:#212121">, </span><span style="color:#1976D2">26.9</span><span style="color:#212121">, </span><span style="color:#1976D2">23.9</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(celsius </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 9</span><span style="color:#D32F2F"> /</span><span style="color:#1976D2"> 5</span><span style="color:#D32F2F"> +</span><span style="color:#1976D2"> 32</span><span style="color:#212121">)</span><span style="color:#4a9c59">          # every reading converted</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">first_array</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="97" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="97" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="memory-use">Memory Use</h1>
<ul>
<li>A Python list of numbers is a list of pointers :
<ul>
<li>Each pointer leads to a separate integer object with its own header</li>
</ul>
</li>
<li>A NumPy array is one contiguous block of raw numbers :
<ul>
<li>No per-element object, no per-element pointer</li>
</ul>
</li>
<li>The difference is not marginal :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>1,000,000 integers</span></span>
<span class="line"><span>  as a Python list :   36,000,056 bytes</span></span>
<span class="line"><span>  as a NumPy array :    8,000,000 bytes</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>One Python integer costs 28 bytes, one array element costs 8</li>
<li>Contiguous also means the processor can prefetch it :
<ul>
<li>Which is the reason the next slide comes out the way it does</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">memory_footprint</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="98" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="98" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="speed">Speed</h1>
<ul>
<li>Multiply two sequences together and total the result, the Python way :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">total </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 0.0</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> i </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> range</span><span style="color:#212121">(COUNT):</span></span>
<span class="line"><span style="color:#24292EFF">    total </span><span style="color:#D32F2F">+=</span><span style="color:#24292EFF"> left_list</span><span style="color:#212121">[</span><span style="color:#24292EFF">i</span><span style="color:#212121">]</span><span style="color:#D32F2F"> *</span><span style="color:#24292EFF"> right_list</span><span style="color:#212121">[</span><span style="color:#24292EFF">i</span><span style="color:#212121">]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The same arithmetic with arrays is <code>float((left * right).sum())</code></li>
<li>Two million multiplications, timed :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>Python loop      0.086 s</span></span>
<span class="line"><span>NumPy arrays     0.008 s</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The loop still happens, in compiled C rather than in Python</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">speed_comparison</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="99" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="99" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="creating-arrays">Creating Arrays</h1>
<ul>
<li>From data you already have :
<ul>
<li><code>np.array([3, 1, 4])</code>, <code>np.array([[1, 2], [3, 4]])</code></li>
</ul>
</li>
<li>From a rule, when the values are regular :
<ul>
<li><code>np.arange(0, 10, 2)</code> steps like <code>range</code>, and stops one short</li>
<li><code>np.linspace(0.0, 1.0, 5)</code> asks for a count, and includes both ends</li>
</ul>
</li>
<li>From a shape, when the values come later :
<ul>
<li><code>np.zeros((2, 4))</code>, <code>np.ones(3, dtype=int)</code>, <code>np.full(4, 7.5)</code></li>
</ul>
</li>
<li>A shape is a tuple, so a two-dimensional shape needs the inner brackets :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">np</span><span style="color:#212121">.</span><span style="color:#6F42C1">zeros</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">)</span><span style="color:#4a9c59">            # shape (3,)</span></span>
<span class="line"><span style="color:#24292EFF">np</span><span style="color:#212121">.</span><span style="color:#6F42C1">zeros</span><span style="color:#212121">((</span><span style="color:#1976D2">3</span><span style="color:#212121">, </span><span style="color:#1976D2">1</span><span style="color:#212121">))</span><span style="color:#4a9c59">       # shape (3, 1), a column</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">making_arrays</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="100" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="100" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="array-data-types">Array Data Types</h1>
<ul>
<li>Every array has a single element type, its <code>dtype</code> :
<ul>
<li>Chosen once when the array is created, and fixed for its lifetime</li>
</ul>
</li>
<li>NumPy picks the narrowest type that holds everything given :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">1</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">, </span><span style="color:#1976D2">3</span><span style="color:#212121">]).</span><span style="color:#24292EFF">dtype        </span><span style="color:#4a9c59"># int64</span></span>
<span class="line"><span style="color:#24292EFF">np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">1.0</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">, </span><span style="color:#1976D2">3</span><span style="color:#212121">]).</span><span style="color:#24292EFF">dtype      </span><span style="color:#4a9c59"># float64, one float promotes the lot</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Ask for a type and it is enforced, not negotiated :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">1.7</span><span style="color:#212121">, </span><span style="color:#1976D2">2.9</span><span style="color:#212121">, </span><span style="color:#D32F2F">-</span><span style="color:#1976D2">3.4</span><span style="color:#212121">], dtype</span><span style="color:#D32F2F">=</span><span style="color:#212121">np.int32)</span><span style="color:#4a9c59">   # [ 1  2 -3], truncated</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The common types are <code>int32</code>, <code>int64</code>, <code>float32</code>, <code>float64</code> and <code>bool</code></li>
<li><code>astype</code> converts, and always makes a new array</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">dtypes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="101" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="101" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="shape-and-dimensions">Shape and Dimensions</h1>
<ul>
<li><code>shape</code> is a tuple giving the size along each dimension :
<ul>
<li><code>ndim</code> is how many dimensions, <code>size</code> is the total element count</li>
</ul>
</li>
<li>Shape reads outermost first, so a table is rows then columns :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">table </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([[</span><span style="color:#1976D2">3.4</span><span style="color:#212121">, </span><span style="color:#1976D2">8.7</span><span style="color:#212121">, </span><span style="color:#1976D2">9.9</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#212121">                  [</span><span style="color:#1976D2">1.1</span><span style="color:#212121">, </span><span style="color:#D32F2F">-</span><span style="color:#1976D2">7.8</span><span style="color:#212121">, </span><span style="color:#D32F2F">-</span><span style="color:#1976D2">0.7</span><span style="color:#212121">]])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(table.ndim)</span><span style="color:#4a9c59">      # 2</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(table.shape)</span><span style="color:#4a9c59">     # (2, 3), two rows of three columns</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(table.size)</span><span style="color:#4a9c59">      # 6, the product of the shape</span></span>
<span class="line"></span></code></pre>
<ul>
<li>One dimension is a row of values, two is a table, three is a stack of tables</li>
<li>Almost every NumPy error message is about a shape :
<ul>
<li>Reading the two shapes in the message is usually the whole diagnosis</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">shape_and_ndim</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="102" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="102" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="reshape-and-transpose">Reshape and Transpose</h1>
<ul>
<li><code>reshape</code> gives the same numbers a different shape :
<ul>
<li>The element count has to come out the same</li>
</ul>
</li>
<li><code>-1</code> means work the remaining dimension out for me :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">readings </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">arange</span><span style="color:#212121">(</span><span style="color:#1976D2">12</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">table </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> readings</span><span style="color:#212121">.</span><span style="color:#6F42C1">reshape</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">, </span><span style="color:#1976D2">4</span><span style="color:#212121">)</span><span style="color:#4a9c59">      # 3 rows of 4</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(readings.</span><span style="color:#6F42C1">reshape</span><span style="color:#212121">(</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">).shape)</span><span style="color:#4a9c59">  # (6, 2)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>.T</code> transposes, turning rows into columns :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(table.T.shape)</span><span style="color:#4a9c59">                # (4, 3)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Neither call moves a single number :
<ul>
<li>Both hand back another way of looking at the same block of memory</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">reshape_and_transpose</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="103" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="103" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="indexing-and-slicing">Indexing and Slicing</h1>
<ul>
<li>Indexing works as it does on a list :
<ul>
<li><code>row[0]</code>, <code>row[-1]</code>, <code>row[2:5]</code>, <code>row[::2]</code>, and the stop is excluded</li>
</ul>
</li>
<li>In two dimensions the indices go inside one pair of brackets :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">[</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">]</span><span style="color:#4a9c59">        # row 1, column 2, a single value</span></span>
<span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#4a9c59">           # a whole row</span></span>
<span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">[:,</span><span style="color:#1976D2"> 1</span><span style="color:#212121">]</span><span style="color:#4a9c59">        # a whole column, the colon means "all of them"</span></span>
<span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">[</span><span style="color:#1976D2">1</span><span style="color:#212121">:,</span><span style="color:#1976D2"> 2</span><span style="color:#212121">:]</span><span style="color:#4a9c59">      # a sub-table, from row 1 and column 2 on</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A slice can also go on the left of an assignment :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 0</span><span style="color:#4a9c59">       # the whole first row, in one statement</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The colon means every position along that dimension</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">indexing_and_slicing</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="104" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="104" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="views-and-copies">Views and Copies</h1>
<ul>
<li>Slicing a list gives a copy, slicing an array gives a view :
<ul>
<li>A view is a window onto the original numbers, not a duplicate of them</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">readings </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">arange</span><span style="color:#212121">(</span><span style="color:#1976D2">10</span><span style="color:#212121">)</span><span style="color:#D32F2F"> *</span><span style="color:#1976D2"> 10</span></span>
<span class="line"><span style="color:#24292EFF">window </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> readings</span><span style="color:#212121">[</span><span style="color:#1976D2">1</span><span style="color:#212121">:</span><span style="color:#1976D2">4</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">window</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 999</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(readings)</span><span style="color:#4a9c59">     # [0 999 20 30 ...], the original changed</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>.copy()</code> is the explicit way to detach, and the only reliable one :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">window </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> readings</span><span style="color:#212121">[</span><span style="color:#1976D2">1</span><span style="color:#212121">:</span><span style="color:#1976D2">4</span><span style="color:#212121">].</span><span style="color:#6F42C1">copy</span><span style="color:#212121">()</span><span style="color:#4a9c59">      # now edits stay local</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Two ways to check which one is in your hands :
<ul>
<li><code>np.shares_memory(window, readings)</code> and <code>window.base</code></li>
</ul>
</li>
<li>Indexing with a list of positions copies, slicing does not</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">views_and_copies</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="105" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="105" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="vectorised-arithmetic">Vectorised Arithmetic</h1>
<ul>
<li>An operator between an array and a number applies to every element :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">traffic </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">1_200</span><span style="color:#212121">, </span><span style="color:#1976D2">3_400</span><span style="color:#212121">, </span><span style="color:#1976D2">900</span><span style="color:#212121">, </span><span style="color:#1976D2">15_800</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(traffic </span><span style="color:#D32F2F">/</span><span style="color:#1976D2"> 1024</span><span style="color:#212121">)</span><span style="color:#4a9c59">          # every value in kilobytes</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An operator between two arrays of the same shape works elementwise :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">limits </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">2_000</span><span style="color:#212121">, </span><span style="color:#1976D2">2_000</span><span style="color:#212121">, </span><span style="color:#1976D2">2_000</span><span style="color:#212121">, </span><span style="color:#1976D2">10_000</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(limits </span><span style="color:#D32F2F">-</span><span style="color:#212121"> traffic)</span><span style="color:#4a9c59">        # headroom, per interface</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The named functions behave the same way over the whole array :
<ul>
<li><code>np.sqrt</code>, <code>np.log10</code>, <code>np.abs</code>, <code>np.round</code>, and the rest</li>
</ul>
</li>
<li>A comparison is arithmetic too, and returns an array of <code>True</code> and <code>False</code></li>
<li>This is the habit to build : say what to compute, not how to iterate</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">vectorised_arithmetic</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="106" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="106" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="boolean-masking">Boolean Masking</h1>
<ul>
<li>A comparison over an array gives a mask, which is itself an array :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">latency </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">12.1</span><span style="color:#212121">, </span><span style="color:#1976D2">9.8</span><span style="color:#212121">, </span><span style="color:#1976D2">210.5</span><span style="color:#212121">, </span><span style="color:#1976D2">11.2</span><span style="color:#212121">, </span><span style="color:#1976D2">480.0</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">mask </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> latency </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 100.0</span><span style="color:#4a9c59">         # [False False True False True]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Indexing with the mask keeps the elements where it is <code>True</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(latency[mask])</span><span style="color:#4a9c59">           # [210.5 480. ]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(mask.</span><span style="color:#6F42C1">sum</span><span style="color:#212121">())</span><span style="color:#4a9c59">              # 2, because True counts as one</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Conditions combine with <code>&amp;</code> and <code>|</code>, and each one needs its own brackets :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">(latency </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 12.0</span><span style="color:#24292EFF">) </span><span style="color:#D32F2F">&#x26;</span><span style="color:#24292EFF"> (latency </span><span style="color:#D32F2F">&#x3C;</span><span style="color:#1976D2"> 100.0</span><span style="color:#24292EFF">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The mask also works on the left of an assignment</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">boolean_masking</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="107" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="107" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="npwhere">np.where</h1>
<ul>
<li><code>np.where</code> is an if-else evaluated for every element at once :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">disk </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">41</span><span style="color:#212121">, </span><span style="color:#1976D2">88</span><span style="color:#212121">, </span><span style="color:#1976D2">96</span><span style="color:#212121">, </span><span style="color:#1976D2">12</span><span style="color:#212121">, </span><span style="color:#1976D2">73</span><span style="color:#212121">, </span><span style="color:#1976D2">91</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">where</span><span style="color:#212121">(disk </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 90</span><span style="color:#212121">, </span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">90</span><span style="color:#D32F2F"> -</span><span style="color:#212121"> disk))</span><span style="color:#4a9c59">    # headroom, floored at zero</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">where</span><span style="color:#212121">(disk </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 90</span><span style="color:#212121">, </span><span style="color:#22863A">"FULL"</span><span style="color:#212121">, </span><span style="color:#22863A">"ok"</span><span style="color:#212121">))</span><span style="color:#4a9c59">    # a label per reading</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Either branch can be an array or a single value, in any combination</li>
<li>Nesting gives more than two outcomes, and three is the readable limit :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">np</span><span style="color:#212121">.</span><span style="color:#6F42C1">where</span><span style="color:#212121">(disk </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 90</span><span style="color:#212121">, </span><span style="color:#22863A">"critical"</span><span style="color:#212121">, np.</span><span style="color:#6F42C1">where</span><span style="color:#212121">(disk </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 70</span><span style="color:#212121">, </span><span style="color:#22863A">"warning"</span><span style="color:#212121">, </span><span style="color:#22863A">"fine"</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<ul>
<li>With a single argument it answers &quot;where&quot;, giving positions :
<ul>
<li><code>np.where(disk &gt; 90)</code> and <code>np.nonzero(disk &gt; 90)</code> are the same call</li>
</ul>
</li>
<li><code>np.clip(disk, 0, 90)</code> is the common case, already named</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">np_where</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="108" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="108" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="broadcasting">Broadcasting</h1>
<ul>
<li>Broadcasting lets arrays of different shapes work together :
<ul>
<li>Line the shapes up from the right, then compare them</li>
</ul>
</li>
<li>Two dimensions are compatible when they are equal, or when one is <code>1</code> :
<ul>
<li>A size-one dimension is stretched, and nothing is copied to do it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>   (3, 4)  with  (4,)     ->  (3, 4)   one row applied to every row</span></span>
<span class="line"><span>   (3, 1)  with  (4,)     ->  (3, 4)   a column against a row</span></span>
<span class="line"><span>   (3, 4)  with  (3,)     ->  refused, nothing lines up</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Reshaping to <code>(3, 1)</code> is how a per-row value is applied to whole rows :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">load </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF"> baseline</span><span style="color:#212121">.</span><span style="color:#6F42C1">reshape</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">, </span><span style="color:#1976D2">1</span><span style="color:#212121">)</span><span style="color:#4a9c59">      # each server minus its own baseline</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">broadcasting</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="109" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="109" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="aggregations">Aggregations</h1>
<ul>
<li>A reduction turns a whole array into one number :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(latency.</span><span style="color:#6F42C1">sum</span><span style="color:#212121">(), latency.</span><span style="color:#6F42C1">mean</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(latency.</span><span style="color:#6F42C1">min</span><span style="color:#212121">(), latency.</span><span style="color:#6F42C1">max</span><span style="color:#212121">(), latency.</span><span style="color:#6F42C1">std</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>argmin</code> and <code>argmax</code> give the position rather than the value :
<ul>
<li>Which probe, which hour, which server, and usually the useful answer</li>
</ul>
</li>
<li>Boolean reductions answer yes or no across the array :
<ul>
<li><code>mask.any()</code>, <code>mask.all()</code>, and <code>mask.sum()</code> for the count</li>
</ul>
</li>
<li>A mean is a poor summary of anything skewed :
<ul>
<li><code>np.median</code> and <code>np.percentile(latency, 95)</code> say more, and lie less</li>
</ul>
</li>
<li>Every reduction exists as a method and as a function, either is fine</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo14</code><br><code class="pill-demo pill-desc">aggregations</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="axis-argument">axis Argument</h1>
<ul>
<li>Every reduction takes an <code>axis</code>, and it names the dimension that disappears</li>
<li>With no <code>axis</code> at all, every dimension goes and one number comes back :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>LOAD = [[  1,   2,   3,   4],      axis 0 runs down the rows</span></span>
<span class="line"><span>        [ 10,  20,  30,  40],      axis 1 runs along the columns</span></span>
<span class="line"><span>        [100, 200, 300, 400]]      shape (3, 4)</span></span>
<span class="line"><span></span></span>
<span class="line"><span>LOAD.sum()        ->  1110                 shape ()</span></span>
<span class="line"><span>LOAD.sum(axis=0)  ->  [111 222 333 444]    shape (4,), one per column</span></span>
<span class="line"><span>LOAD.sum(axis=1)  ->  [  10  100 1000]     shape (3,), one per row</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li><code>axis=0</code> removes the rows, so a per-column answer survives</li>
<li><code>keepdims=True</code> leaves the collapsed dimension as size one, ready to broadcast</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo15</code><br><code class="pill-demo pill-desc">the_axis_argument</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="111" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="111" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="random-numbers">Random Numbers</h1>
<ul>
<li>Make a generator, then ask it for what is needed :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">rng </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#24292EFF">random</span><span style="color:#212121">.</span><span style="color:#6F42C1">default_rng</span><span style="color:#212121">(seed</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">42</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rng.</span><span style="color:#6F42C1">random</span><span style="color:#212121">(</span><span style="color:#1976D2">4</span><span style="color:#212121">))</span><span style="color:#4a9c59">                  # uniform, 0 to 1</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rng.</span><span style="color:#6F42C1">integers</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">, </span><span style="color:#1976D2">7</span><span style="color:#212121">, size</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">8</span><span style="color:#212121">))</span><span style="color:#4a9c59">     # eight dice</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rng.</span><span style="color:#6F42C1">normal</span><span style="color:#212121">(</span><span style="color:#1976D2">100.0</span><span style="color:#212121">, </span><span style="color:#1976D2">15.0</span><span style="color:#212121">, </span><span style="color:#1976D2">4</span><span style="color:#212121">))</span><span style="color:#4a9c59">     # mean 100, deviation 15</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Every call takes a <code>size</code>, and a shape works as well as a count</li>
<li><code>rng.choice</code> samples from data already in hand, with or without replacement</li>
<li>A seed makes the run repeatable, which is what a demo or a test needs</li>
<li>The older <code>np.random.seed</code> and <code>np.random.rand</code> still exist :
<ul>
<li>They share one hidden global generator, and are not what to write now</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo16</code><br><code class="pill-demo pill-desc">random_numbers</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="112" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="112" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="reading-a-csv">Reading a CSV</h1>
<ul>
<li><code>np.loadtxt</code> reads a rectangle of numbers, and wants it to be tidy :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">load </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">loadtxt</span><span style="color:#212121">(CSV, delimiter</span><span style="color:#D32F2F">=</span><span style="color:#22863A">","</span><span style="color:#212121">, skiprows</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">, usecols</span><span style="color:#D32F2F">=</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">, </span><span style="color:#1976D2">3</span><span style="color:#212121">, </span><span style="color:#1976D2">4</span><span style="color:#212121">, </span><span style="color:#1976D2">5</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(load.shape)</span><span style="color:#4a9c59">                  # (24, 5), hours by servers</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(load.</span><span style="color:#6F42C1">mean</span><span style="color:#212121">(axis</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">0</span><span style="color:#212121">))</span><span style="color:#4a9c59">           # mean per server</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>skiprows</code> steps over a header, <code>usecols</code> drops columns that are not numbers</li>
<li><code>np.savetxt</code> writes one back out, and <code>np.save</code> stores the exact bytes</li>
<li><code>np.genfromtxt</code> copes with gaps and missing values, at some cost in speed</li>
<li>When the columns have names and different types, this stops being the tool :
<ul>
<li>That is a table rather than an array, and the next module reads it properly</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo17</code><br><code class="pill-demo pill-desc">csv_into_array</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="113" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="113" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="summary--numpy">Summary : NumPy</h1>
<ul>
<li>Reach for it when the data is a rectangle of numbers of one type :
<ul>
<li>Measurements, samples, pixels, matrices, counters over time</li>
</ul>
</li>
<li>Three habits to carry forward :
<ul>
<li>Say what to compute, rather than how to loop over it</li>
<li>Print <code>.shape</code> whenever something is not behaving</li>
<li>Write <code>.copy()</code> when a slice is about to be modified</li>
</ul>
</li>
<li>Reach for Pandas instead when the columns have names and types</li>
<li>The rest of the numeric stack is built on this one object :
<ul>
<li>SciPy, scikit-learn, matplotlib and Pandas all take arrays and give them back</li>
</ul>
</li>
</ul>
</section>

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="pandas">Pandas</h1>
<ul>
<li><code>pandas</code> is the library for tables of data :
<ul>
<li>Rows and columns, where the columns have names and different types</li>
</ul>
</li>
<li>The thing it replaces is a spreadsheet, or a pile of parsing code :
<ul>
<li>A CSV, a sheet of a workbook, a query result, all become the same object</li>
</ul>
</li>
<li>Built on top of NumPy :
<ul>
<li>Each column is an array, so a column operation runs at array speed</li>
</ul>
</li>
<li>The working loop is short :
<ul>
<li>Read a file, look at it, filter it, summarise it, write it out again</li>
</ul>
</li>
<li>Two objects carry the whole library :
<ul>
<li><code>Series</code>, one column · <code>DataFrame</code>, a table of them</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> pandas </span><span style="color:#D32F2F">as</span><span style="color:#24292EFF"> pd</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="116" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="116" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="series">Series</h1>
<ul>
<li>A <code>Series</code> is a one-dimensional array with an index attached :
<ul>
<li>The index is a label per row, not a row number</li>
</ul>
</li>
<li>The two halves are reachable separately :
<ul>
<li><code>.index</code> gives the labels, <code>.to_numpy()</code> gives the values</li>
</ul>
</li>
<li>Arithmetic and comparison apply to the whole column at once</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">free_gb </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">Series</span><span style="color:#212121">([</span><span style="color:#1976D2">55.5</span><span style="color:#212121">, </span><span style="color:#1976D2">48.8</span><span style="color:#212121">, </span><span style="color:#1976D2">550.0</span><span style="color:#212121">], index</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"web01"</span><span style="color:#212121">, </span><span style="color:#22863A">"web02"</span><span style="color:#212121">, </span><span style="color:#22863A">"db01"</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">free_gb</span><span style="color:#212121">[</span><span style="color:#22863A">"db01"</span><span style="color:#212121">]</span><span style="color:#4a9c59">          # 550.0, looked up by label</span></span>
<span class="line"><span style="color:#24292EFF">free_gb </span><span style="color:#D32F2F">/</span><span style="color:#1976D2"> 1024</span><span style="color:#4a9c59">           # every element, no loop</span></span>
<span class="line"><span style="color:#24292EFF">free_gb </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 100</span><span style="color:#4a9c59">            # a Series of True and False</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">series_basics</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="117" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="117" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="dataframe">DataFrame</h1>
<ul>
<li>A <code>DataFrame</code> is a dictionary of <code>Series</code> that all share one index :
<ul>
<li>Each column has a name and its own type</li>
</ul>
</li>
<li>Built from a dictionary, a list of dictionaries, or read from a file</li>
<li><code>.shape</code>, <code>.columns</code> and <code>.index</code> are the three facts to check first</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">DataFrame</span><span style="color:#212121">({</span></span>
<span class="line"><span style="color:#22863A">    "hostname"</span><span style="color:#212121">: [</span><span style="color:#22863A">"web01"</span><span style="color:#212121">, </span><span style="color:#22863A">"web02"</span><span style="color:#212121">, </span><span style="color:#22863A">"db01"</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#22863A">    "site"</span><span style="color:#212121">: [</span><span style="color:#22863A">"AMS"</span><span style="color:#212121">, </span><span style="color:#22863A">"AMS"</span><span style="color:#212121">, </span><span style="color:#22863A">"AMS"</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#22863A">    "cpu_cores"</span><span style="color:#212121">: [</span><span style="color:#1976D2">4</span><span style="color:#212121">, </span><span style="color:#1976D2">4</span><span style="color:#212121">, </span><span style="color:#1976D2">16</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#212121">})</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">shape            </span><span style="color:#4a9c59"># (3, 3), rows by columns</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"cpu_cores"</span><span style="color:#212121">]</span><span style="color:#4a9c59">     # one column, which is a Series</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">dataframe_basics</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="118" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="118" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="the-index">The Index</h1>
<ul>
<li>The index is the row's name, and it travels with the row :
<ul>
<li>Filtering, sorting and joining all keep it</li>
</ul>
</li>
<li><code>set_index</code> promotes a column to be the index</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">by_host </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">set_index</span><span style="color:#212121">(</span><span style="color:#22863A">"hostname"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">by_host</span><span style="color:#212121">.</span><span style="color:#24292EFF">loc</span><span style="color:#212121">[</span><span style="color:#22863A">"db01"</span><span style="color:#212121">]</span><span style="color:#4a9c59">      # a row fetched by name</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Operations align on the label, not on the position :
<ul>
<li>Two Series in different orders still line up correctly</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">quota </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">Series</span><span style="color:#212121">([</span><span style="color:#1976D2">500</span><span style="color:#212121">, </span><span style="color:#1976D2">2000</span><span style="color:#212121">], index</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"web01"</span><span style="color:#212121">, </span><span style="color:#22863A">"db01"</span><span style="color:#212121">])</span></span>

<span class="line"><span style="color:#24292EFF">quota </span><span style="color:#D32F2F">-</span><span style="color:#24292EFF"> used             </span><span style="color:#4a9c59"># matched by name, not by row</span></span>
