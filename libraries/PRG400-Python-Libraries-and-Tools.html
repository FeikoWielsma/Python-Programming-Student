<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="useful-libraries">Useful Libraries</h1>
<ul>
<li>The standard library will do the job, but it will not do it nicely :
<ul>
<li>A long loop with no output looks identical to a hung program</li>
<li>Columns of numbers lined up by hand stop lining up the moment one grows</li>
<li>A traceback tells you what broke, but not what the data was</li>
</ul>
</li>
<li>Four small libraries fix all of that, and none of them changes how you think :
<ul>
<li><code>tqdm</code> puts a progress bar around a loop you already wrote</li>
<li><code>rich</code> prints colour, tables and readable errors</li>
<li><code>httpx</code> fetches things off the web</li>
<li><code>typer</code> builds a command line from a function signature</li>
</ul>
</li>
<li>None of them is required, and all of them are one <code>uv add</code> away</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="40" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="40" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="tqdm-progress-bars">tqdm Progress Bars</h1>
<ul>
<li><code>tqdm</code> takes an iterable and returns the same iterable, with a bar :
<ul>
<li>The loop body does not change, and neither does the result</li>
</ul>
</li>
<li>It measures the rate and estimates the time remaining as it goes</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> tqdm </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> tqdm</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> server </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(servers, desc</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Checking"</span><span style="color:#212121">, unit</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"host"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">    check</span><span style="color:#212121">(server)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>desc</code> labels the bar, <code>unit</code> names the thing being counted</li>
<li>It needs a length to show a percentage :
<ul>
<li>A list has one, a generator does not, so pass <code>total=</code> yourself</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">tqdm_basics</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="41" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="41" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="nested-bars">Nested Bars</h1>
<ul>
<li>Nested loops give nested bars, one line each :
<ul>
<li>The outer bar counts sites, the inner bar counts hosts within a site</li>
</ul>
</li>
<li><code>leave=False</code> on the inner bar is the part people forget :
<ul>
<li>Without it every finished inner bar stays on screen forever</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> site</span><span style="color:#212121">,</span><span style="color:#24292EFF"> hosts </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(sites.</span><span style="color:#6F42C1">items</span><span style="color:#212121">(), desc</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Sites"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> host </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(hosts, desc</span><span style="color:#D32F2F">=</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"  </span><span style="color:#1976D2">{</span><span style="color:#212121">site</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">, leave</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        check</span><span style="color:#212121">(host)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The outer bar's estimate gets better with every site it finishes</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">tqdm_nested</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="42" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="42" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="manual-bar-updates">Manual Bar Updates</h1>
<ul>
<li>Not all work is a loop over items, so <code>tqdm</code> can be driven by hand :
<ul>
<li>Create it with a <code>total</code>, then call <code>update()</code> with how much you did</li>
</ul>
</li>
<li>Use it as a context manager so the bar is closed properly on the way out</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(total</span><span style="color:#D32F2F">=</span><span style="color:#212121">size, desc</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Reading"</span><span style="color:#212121">, unit</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"B"</span><span style="color:#212121">, unit_scale</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> bar</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    while</span><span style="color:#24292EFF"> chunk </span><span style="color:#D32F2F">:=</span><span style="color:#24292EFF"> handle</span><span style="color:#212121">.</span><span style="color:#6F42C1">read</span><span style="color:#212121">(</span><span style="color:#1976D2">65536</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">        process</span><span style="color:#212121">(chunk)</span></span>
<span class="line"><span style="color:#24292EFF">        bar</span><span style="color:#212121">.</span><span style="color:#6F42C1">update</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(chunk))</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>unit_scale=True</code> turns 1500 into 1.50k, which keeps the width steady</li>
<li><code>bar.set_postfix(ok=12, failed=2)</code> hangs a live tally off the right-hand end</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">tqdm_manual</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="43" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="43" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="tqdmwrite">tqdm.write</h1>
<ul>
<li>A bar owns one line and repaints it by writing over itself</li>
<li>A plain <code>print()</code> writes a newline into the middle of that :
<ul>
<li>The bar loses the line it was drawing on</li>
<li>Every repaint leaves another half-finished copy behind</li>
</ul>
</li>
<li><code>tqdm.write()</code> clears the line, prints, and repaints the bar underneath</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> server </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(servers, desc</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Scanning"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#6F42C1"> is_full</span><span style="color:#212121">(server):</span></span>
<span class="line"><span style="color:#24292EFF">        tqdm</span><span style="color:#212121">.</span><span style="color:#6F42C1">write</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">server[</span><span style="color:#22863A">'hostname'</span><span style="color:#212121">]</span><span style="color:#1976D2">}</span><span style="color:#22863A"> is nearly full"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Same arguments as <code>print</code>, so converting a script is a search and replace</li>
<li>Once a bar exists, nothing in the program may call <code>print</code> again</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">tqdm_write</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="44" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="44" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="rich-console">rich Console</h1>
<ul>
<li><code>rich</code> replaces <code>print</code> with a <code>Console</code> that knows what it is printing :
<ul>
<li>Strings get markup, everything else gets pretty-printed and coloured</li>
</ul>
</li>
<li>Markup is square brackets, closed with a bare <code>[/]</code>, and it nests</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich</span><span style="color:#212121">.</span><span style="color:#24292EFF">console </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Console</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">console </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Console</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">console</span><span style="color:#212121">.</span><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"[bold]disk usage [red]91%[/] on [blue underline]/srv[/][/]"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">console</span><span style="color:#212121">.</span><span style="color:#6F42C1">print</span><span style="color:#212121">({</span><span style="color:#22863A">"host"</span><span style="color:#212121">: </span><span style="color:#22863A">"db01"</span><span style="color:#212121">, </span><span style="color:#22863A">"cores"</span><span style="color:#212121">: </span><span style="color:#1976D2">16</span><span style="color:#212121">, </span><span style="color:#22863A">"roles"</span><span style="color:#212121">: [</span><span style="color:#22863A">"primary"</span><span style="color:#212121">]})</span></span>
<span class="line"></span></code></pre>
<ul>
<li>It detects that output is being redirected and drops the colour by itself</li>
<li><code>Console(stderr=True)</code> writes to standard error, so pipelines still work</li>
<li><code>console.rule(&quot;Title&quot;)</code> draws a full-width divider, useful on a projector</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">rich_console</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="45" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="45" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="rich-tables">rich Tables</h1>
<ul>
<li>A <code>Table</code> is declared column by column, then fed one row at a time :
<ul>
<li>Alignment, width and style belong to the column, not to the row</li>
</ul>
</li>
<li>The widths are computed from the data, so nothing has to be guessed</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">table </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Table</span><span style="color:#212121">(title</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Server inventory"</span><span style="color:#212121">, header_style</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"bold magenta"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_column</span><span style="color:#212121">(</span><span style="color:#22863A">"Host"</span><span style="color:#212121">, style</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"cyan"</span><span style="color:#212121">, no_wrap</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_column</span><span style="color:#212121">(</span><span style="color:#22863A">"Used"</span><span style="color:#212121">, justify</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"right"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">table</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_row</span><span style="color:#212121">(</span><span style="color:#22863A">"db01"</span><span style="color:#212121">, </span><span style="color:#22863A">"[red]91%[/]"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">console</span><span style="color:#212121">.</span><span style="color:#6F42C1">print</span><span style="color:#212121">(table)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Per-cell colour goes in the text as markup, not as an argument</li>
<li><code>row_styles=[&quot;&quot;, &quot;dim&quot;]</code> gives zebra striping for free</li>
<li><code>show_footer</code> plus <code>column.footer</code> produces a totals row</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">rich_table</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="46" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="46" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="rich-progress">rich Progress</h1>
<ul>
<li><code>track()</code> is the one-line form, and behaves like <code>tqdm</code> :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich</span><span style="color:#212121">.</span><span style="color:#24292EFF">progress </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> track</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> host </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> track</span><span style="color:#212121">(hosts, description</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Collecting facts"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">    collect</span><span style="color:#212121">(host)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>Progress</code> is the version for when one bar is not enough :
<ul>
<li>Several tasks on screen at once, each with its own total</li>
<li>The bar is assembled from column objects rather than a format string</li>
</ul>
</li>
<li>Inside a <code>Progress</code> block, <code>print</code> is redirected and cannot corrupt the display</li>
<li>This is the one place <code>rich</code> is meaningfully easier than <code>tqdm</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">rich_progress</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="47" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="47" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="rich-tracebacks">rich Tracebacks</h1>
<ul>
<li>One line at the top of a program restyles every uncaught exception :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich</span><span style="color:#212121">.</span><span style="color:#24292EFF">traceback </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> install</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">install</span><span style="color:#212121">(show_locals</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The frames get syntax highlighting and the surrounding lines of source</li>
<li><code>show_locals=True</code> is the reason to bother :
<ul>
<li>The standard traceback says a <code>ValueError</code> happened</li>
<li>This one shows the row of data that caused it, with no added <code>print</code></li>
</ul>
</li>
<li><code>console.print_exception()</code> does the same inside an <code>except</code> block</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">rich_traceback</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="48" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="48" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="rich-inspect">rich inspect</h1>
<ul>
<li>The usual way to explore an unfamiliar object is <code>dir()</code> and a lot of squinting</li>
<li><code>rich.inspect</code> prints the same information as a readable panel :
<ul>
<li>The repr at the top, then every attribute with its current value</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> inspect</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">inspect</span><span style="color:#212121">(connection, methods</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>methods=True</code> adds the call signatures, for &quot;what can I do with this&quot;</li>
<li><code>help=True</code> adds the docstrings, for &quot;what does this one mean&quot;</li>
<li>Worth memorising, because it works on anything, including modules</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">rich_inspect</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="49" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="49" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="rich-logging-handler">rich Logging Handler</h1>
<ul>
<li>Nothing about the <code>logging</code> API changes, only the handler does :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> logging</span></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich</span><span style="color:#212121">.</span><span style="color:#24292EFF">logging </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> RichHandler</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">logging</span><span style="color:#212121">.</span><span style="color:#6F42C1">basicConfig</span><span style="color:#212121">(level</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"INFO"</span><span style="color:#212121">, format</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"</span><span style="color:#1976D2">%(message)s</span><span style="color:#22863A">"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">                    handlers</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#6F42C1">RichHandler</span><span style="color:#212121">(rich_tracebacks</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)])</span></span>
<span class="line"><span style="color:#24292EFF">log </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> logging</span><span style="color:#212121">.</span><span style="color:#6F42C1">getLogger</span><span style="color:#212121">(</span><span style="color:#22863A">"patchrun"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Levels get colour, times get a column, and the source line is shown</li>
<li><code>rich_tracebacks=True</code> means <code>log.exception()</code> renders the pretty traceback</li>
<li>Every library that logs through <code>logging</code> is improved at the same time</li>
<li>The format string shrinks to <code>&quot;%(message)s&quot;</code> because the handler adds the rest</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">rich_logging</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="50" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="50" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="http-with-httpx">HTTP with httpx</h1>
<ul>
<li><code>httpx.Client</code> sends HTTP requests and reuses connections.</li>
<li><code>MockTransport</code> supplies a local response for this offline example.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> httpx</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> example_response</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">request</span><span style="color:#212121">:</span><span style="color:#24292EFF"> httpx</span><span style="color:#212121">.</span><span style="color:#24292EFF">Request) </span><span style="color:#212121">-></span><span style="color:#24292EFF"> httpx</span><span style="color:#212121">.</span><span style="color:#24292EFF">Response:</span></span>
<span class="line"><span style="color:#D32F2F">    return</span><span style="color:#24292EFF"> httpx</span><span style="color:#212121">.</span><span style="color:#6F42C1">Response</span><span style="color:#212121">(</span><span style="color:#1976D2">200</span><span style="color:#212121">, json</span><span style="color:#D32F2F">=</span><span style="color:#212121">{</span><span style="color:#22863A">"host"</span><span style="color:#212121">: </span><span style="color:#22863A">"db01"</span><span style="color:#212121">, </span><span style="color:#22863A">"disk_pct"</span><span style="color:#212121">: </span><span style="color:#1976D2">73</span><span style="color:#212121">})</span></span>
<span class="line"></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">transport </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> httpx</span><span style="color:#212121">.</span><span style="color:#6F42C1">MockTransport</span><span style="color:#212121">(example_response)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> httpx</span><span style="color:#212121">.</span><span style="color:#6F42C1">Client</span><span style="color:#212121">(transport</span><span style="color:#D32F2F">=</span><span style="color:#212121">transport, timeout</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">10.0</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> client</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    response </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> client</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span><span style="color:#22863A">"https://example.org/hosts/db01"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    response</span><span style="color:#212121">.</span><span style="color:#6F42C1">raise_for_status</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(response.</span><span style="color:#6F42C1">json</span><span style="color:#212121">())</span><span style="color:#4a9c59">  # {'host': 'db01', 'disk_pct': 73}</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>raise_for_status()</code> raises an exception for an HTTP error response.</li>
<li>For a live service, remove <code>transport=transport</code> and use its URL.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">httpx_client</code></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="51" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="51" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="requests-and-httpx">requests and httpx</h1>
<div class="two-col">
<div>
<ul>
<li><code>requests</code> :
<ul>
<li>Installed with <code>uv add requests</code></li>
<li>Unchanged and stable for a decade</li>
<li>Synchronous only</li>
<li>No timeout unless you set one</li>
</ul>
</li>
</ul>
</div>
<div>
<ul>
<li><code>httpx</code> :
<ul>
<li>Same names, same shapes</li>
<li>Also does <code>async</code> and HTTP/2</li>
<li>Has a default timeout</li>
<li>Testable without a network</li>
</ul>
</li>
</ul>
</div>
</div>
<ul>
<li>Either is fine for a synchronous script that fetches a few pages</li>
<li>Choose <code>httpx</code> when you need <code>async</code>, HTTP/2, or tests that never leave the machine</li>
<li>The scraping module uses <code>requests</code>, because that is what the examples use</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">requests_or_httpx</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="52" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="52" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="typer">typer</h1>
<ul>
<li><code>typer</code> builds the parser out of the function it is decorating :
<ul>
<li>The parameter name becomes the option name</li>
<li>The annotation becomes the type conversion</li>
<li>The default becomes the default, and the docstring becomes the help</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">@app</span><span style="color:#212121">.</span><span style="color:#6F42C1">command</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> show</span><span style="color:#24292EFF">(</span></span>
<span class="line"><span style="color:#FF9800">    hostname</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Annotated</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">,</span><span style="color:#24292EFF"> typer</span><span style="color:#212121">.</span><span style="color:#6F42C1">Argument</span><span style="color:#212121">(help</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"The host to describe."</span><span style="color:#212121">)],</span></span>
<span class="line"><span style="color:#FF9800">    site</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Annotated</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#D32F2F"> |</span><span style="color:#1976D2"> None</span><span style="color:#212121">,</span><span style="color:#24292EFF"> typer</span><span style="color:#212121">.</span><span style="color:#6F42C1">Option</span><span style="color:#212121">(</span><span style="color:#22863A">"--site"</span><span style="color:#212121">, </span><span style="color:#22863A">"-s"</span><span style="color:#212121">)]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> None</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#4a9c59">    """Show one host in full."""</span></span>
<span class="line"></span></code></pre>
<ul>
<li>There is no parser object, no <code>add_argument</code>, and no <code>dest</code> to spell twice</li>
<li><code>--help</code> is generated, coloured, and correct without being written</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">typer_cli</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="53" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="53" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="typer-trade-offs">typer Trade-offs</h1>
<ul>
<li>It is a dependency, and <code>argparse</code> is not :
<ul>
<li>A script using <code>argparse</code> runs on any Python anywhere, forever</li>
<li>A script using <code>typer</code> needs an environment, which is what <code>uv</code> is for</li>
</ul>
</li>
<li>It is a thin layer over the same ideas from module 2 :
<ul>
<li>Positionals, options, flags, types, defaults, subcommands, exit codes</li>
<li><code>typer.Exit(code=1)</code> is how a command reports failure</li>
</ul>
</li>
<li>Learn <code>argparse</code> first, because it is always there and always readable</li>
<li>Reach for <code>typer</code> when a tool grows past a handful of options</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="54" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="54" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="finding-libraries">Finding Libraries</h1>
<ul>
<li>Almost everything is on PyPI, and the search there is the starting point :
<ul>
<li><code>pypi.org</code>, then the project's own documentation site</li>
</ul>
</li>
<li>Better signals than the search ranking :
<ul>
<li>What the documentation of a library you already trust recommends</li>
<li>What comes up repeatedly in answers to the question you are asking</li>
</ul>
</li>
<li>Adding one is a single command, and it records the decision :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> add</span><span style="color:#2B5581"> rich</span></span>
<span class="line"></span></code></pre>
<ul>
<li>That writes the dependency into <code>pyproject.toml</code> and pins it in <code>uv.lock</code></li>
<li>Anyone who runs <code>uv sync</code> afterwards gets exactly the versions you had</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="55" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="55" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="judging-a-library">Judging a Library</h1>
<ul>
<li>Before depending on something, look for five things :
<ul>
<li>A release within the last year or so, and a visible changelog</li>
<li>Real documentation rather than a README with three examples</li>
<li>An OSI licence, stated plainly, that your employer can live with</li>
<li>Issues that get answered, even if not always fixed</li>
<li>A dependency list you would be willing to own</li>
</ul>
</li>
<li>Every dependency is code you are trusting and will have to keep updated</li>
<li>Much of this is readable from the metadata already on your disk</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> importlib</span><span style="color:#212121">.</span><span style="color:#24292EFF">metadata </span><span style="color:#D32F2F">as</span><span style="color:#24292EFF"> metadata</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">metadata</span><span style="color:#212121">.</span><span style="color:#6F42C1">distribution</span><span style="color:#212121">(</span><span style="color:#22863A">"rich"</span><span style="color:#212121">).</span><span style="color:#24292EFF">version</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo14</code><br><code class="pill-demo pill-desc">judging_a_library</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="56" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="56" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#38"><span class="ml-tag">python</span>Modern Toolbelt</a></div>
<h1 id="summary--modern-toolbelt">Summary : Modern Toolbelt</h1>
<ul>
<li>Four imports that will make your next script look finished :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> tqdm </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> tqdm</span></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich</span><span style="color:#212121">.</span><span style="color:#24292EFF">console </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Console</span></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich</span><span style="color:#212121">.</span><span style="color:#24292EFF">table </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> Table</span></span>
<span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> rich </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> inspect</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A loop that takes more than a second or two should show a bar</li>
<li>A report with more than two columns should be a <code>Table</code></li>
<li>An object you do not understand should be handed to <code>inspect</code></li>
<li>Everything else here is optional, and none of it changes how Python works</li>
</ul>
</section>

<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="web-scraping">Web Scraping</h1>
<ul>
<li>Every scraper is the same three steps, in the same order :
<ul>
<li>Fetch, parse, store</li>
</ul>
</li>
<li>They stay separate on purpose :
<ul>
<li>Each step can be tested and re-run without the others</li>
<li>Only the middle step knows anything about HTML</li>

<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="fetching-a-page">Fetching a Page</h1>
<ul>
<li><code>requests.get</code> returns a response object, not a string :
<ul>
<li><code>.text</code> is the decoded body, <code>.content</code> is the raw bytes</li>
</ul>
</li>
<li>Two arguments matter far more than the rest :
<ul>
<li><code>timeout</code>, because there is no default and a hung server hangs you</li>
<li><code>headers</code>, to say which program is asking</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">response </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> requests</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#22863A">    "https://books.toscrape.com/catalogue/category/books/mystery_3/index.html"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">    timeout</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">10</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">    headers</span><span style="color:#D32F2F">=</span><span style="color:#212121">{</span><span style="color:#22863A">"User-Agent"</span><span style="color:#212121">: </span><span style="color:#22863A">"MyScraper/1.0 (you@example.com)"</span><span style="color:#212121">},</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">response</span><span style="color:#212121">.</span><span style="color:#6F42C1">raise_for_status</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(response.status_code, </span><span style="color:#6F42C1">len</span><span style="color:#212121">(response.text))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">fetching_pages</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="60" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="60" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="status-codes-and-timeouts">Status Codes and Timeouts</h1>
<ul>
<li>The status code is the first thing to check :
<ul>
<li><code>200</code> fine, <code>301</code> and <code>302</code> redirects that <code>requests</code> follows for you</li>
<li><code>404</code> gone, <code>403</code> refused, <code>429</code> slow down, <code>5xx</code> their problem</li>
</ul>
</li>
<li><code>raise_for_status</code> turns any <code>4xx</code> or <code>5xx</code> into an exception :
<ul>
<li>Nothing happens for <code>2xx</code> and <code>3xx</code>, so it is safe to always call</li>
</ul>
</li>
<li><code>response.encoding</code> can be set when a page is decoded wrongly</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>  200 OK                    passes, response.ok is True</span></span>
<span class="line"><span>  404 Not Found             raises HTTPError</span></span>
<span class="line"><span>  429 Too Many Requests     raises HTTPError</span></span>
<span class="line"><span></span></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="61" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="61" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="beautifulsoup">BeautifulSoup</h1>
<ul>
<li><code>BeautifulSoup</code> takes the markup and the name of a parser :
<ul>
<li><code>&quot;lxml&quot;</code> is fast and forgiving, and is installed for this course</li>
<li><code>&quot;html.parser&quot;</code> is built into Python and needs nothing extra</li>
</ul>
</li>
<li>The result is a tree you can search, not a string :
<ul>
<li>Real pages are malformed, and the parser quietly repairs them</li>
</ul>
</li>
<li><code>response.text</code> is already decoded, so it goes straight in :
<ul>
<li>The server declares the encoding, and a price of £51.77 proves it worked</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> bs4 </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> BeautifulSoup</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">html </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> requests</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(URL, timeout</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">10</span><span style="color:#212121">).</span><span style="color:#24292EFF">text</span></span>

<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="find-and-find_all">find and find_all</h1>
<ul>
<li><code>find</code> returns the first match, or <code>None</code> :
<ul>
<li><code>find_all</code> returns a list, which may be empty</li>
</ul>
</li>
<li>Both take a tag name, and keyword arguments for attributes :
<ul>
<li><code>class_</code> has the underscore because <code>class</code> is a Python keyword</li>
</ul>
</li>
<li>Searching a tag searches inside that tag only</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">pods </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_all</span><span style="color:#212121">(</span><span style="color:#22863A">"article"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"product_pod"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> pod </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> pods</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    title </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"h3"</span><span style="color:#212121">).</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"a"</span><span style="color:#212121">)</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"title"</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">    price </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"price_color"</span><span style="color:#212121">).</span><span style="color:#24292EFF">text</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(title, price)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">finding_the_books</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="63" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="63" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="text-and-attributes">Text and Attributes</h1>
<ul>
<li><code>.text</code> collects every string inside a tag :
<ul>
<li><code>get_text(strip=True)</code> is the same thing with the whitespace tidied</li>
</ul>
</li>
<li>Attributes are read like a dictionary :
<ul>
<li><code>tag[&quot;href&quot;]</code> raises <code>KeyError</code> when the attribute is absent</li>
<li><code>tag.get(&quot;href&quot;)</code> returns <code>None</code>, or a default you supply</li>
</ul>
</li>
<li><code>class</code> comes back as a list, because an element can carry several</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">stars </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"star-rating"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(stars[</span><span style="color:#22863A">"class"</span><span style="color:#212121">])</span><span style="color:#4a9c59">              # ['star-rating', 'Four']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(stars.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span><span style="color:#22863A">"data-value"</span><span style="color:#212121">))</span><span style="color:#4a9c59">     # None, the attribute is not there</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="64" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="64" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="css-selectors">CSS Selectors</h1>
<ul>
<li><code>select</code> and <code>select_one</code> take one selector string :
<ul>
<li>The same language a stylesheet or the browser inspector uses</li>
</ul>
</li>
<li>A whole path through the document fits in one argument :
<ul>
<li><code>article.product_pod h3 a</code> means a inside h3 inside that article</li>
<li><code>p.star-rating.Four</code> means both classes on one element</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">titles </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"article.product_pod h3 a"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">crumb </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"ul.breadcrumb li.active"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">images </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"div.image_container > a > img[alt]"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>

<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">css_selectors</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="65" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="65" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="navigating-the-tree">Navigating the Tree</h1>
<ul>
<li>Start at something easy to find and move from there :
<ul>
<li><code>.parent</code> is one step up, <code>.find_parent(&quot;article&quot;)</code> goes up until it matches</li>
<li><code>.find_next_sibling(&quot;p&quot;)</code> skips the whitespace between tags</li>
</ul>
</li>
<li>Useful when the thing you want has no class of its own :
<ul>
<li>A price is easy to find, the module it belongs to is upward from it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">price </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"p.price_color"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">pod </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> price</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_parent</span><span style="color:#212121">(</span><span style="color:#22863A">"article"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">availability </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> price</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_next_sibling</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(pod.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"h3 a"</span><span style="color:#212121">)[</span><span style="color:#22863A">"title"</span><span style="color:#212121">], availability.</span><span style="color:#6F42C1">get_text</span><span style="color:#212121">(strip</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">walking_the_tree</code></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="66" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="66" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="missing-elements">Missing Elements</h1>
<ul>
<li>Real pages are inconsistent, and a scraper meets all of it :
<ul>
<li>The attribute missing on one row in five hundred</li>
<li>The module that has no price because the item is sold out</li>
</ul>
</li>
<li>Decide per field what absence means :
<ul>
<li><code>.get(&quot;href&quot;)</code> for optional, square brackets for required</li>
<li>A required field that is missing should fail loudly, not silently</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">url </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> link</span><span style="color:#212121">[</span><span style="color:#22863A">"href"</span><span style="color:#212121">]</span><span style="color:#4a9c59">                        # required, so let it raise</span></span>
<span class="line"><span style="color:#24292EFF">cover </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> image</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span><span style="color:#22863A">"data-src"</span><span style="color:#212121">, </span><span style="color:#22863A">""</span><span style="color:#212121">)</span><span style="color:#4a9c59">         # optional, so a default is fine</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"price_color"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> is</span><span style="color:#1976D2"> None</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    continue</span><span style="color:#4a9c59">                              # no price, no record</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="67" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="67" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="html-tables">HTML Tables</h1>
<ul>
<li>A table is the easiest markup to scrape, and the most common :
<ul>
<li>One header row gives the keys, one body row gives the values</li>
</ul>
</li>
<li><code>zip(headers, cells, strict=True)</code> refuses to guess :
<ul>
<li>A short row raises instead of silently shifting every column</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">headers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [cell</span><span style="color:#212121">.</span><span style="color:#6F42C1">get_text</span><span style="color:#212121">(strip</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> cell </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> table</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"tr th"</span><span style="color:#212121">)</span><span style="color:#24292EFF">]</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> table</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"tbody tr"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#24292EFF">    cells </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [cell</span><span style="color:#212121">.</span><span style="color:#6F42C1">get_text</span><span style="color:#212121">(strip</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> cell </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> row</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_all</span><span style="color:#212121">(</span><span style="color:#22863A">"td"</span><span style="color:#212121">)</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">    rows</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#1976D2">dict</span><span style="color:#212121">(</span><span style="color:#6F42C1">zip</span><span style="color:#212121">(headers, cells, strict</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">parsing_a_table</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="68" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="68" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="extracting-records">Extracting Records</h1>
<ul>
<li>One function, one page, a list of dictionaries out :
<ul>
<li>After this line the markup has stopped mattering</li>
</ul>
</li>
<li>Convert while parsing, not later :
<ul>
<li>A price becomes a <code>float</code>, a rating becomes an <code>int</code></li>
<li>A relative link becomes an absolute one, with <code>urljoin</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">soup </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> BeautifulSoup</span><span style="color:#212121">(html, </span><span style="color:#22863A">"lxml"</span><span style="color:#212121">)</span></span>

<span class="line"><span style="color:#24292EFF">    link </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"h3 a"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    books</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">({</span></span>
<span class="line"><span style="color:#22863A">        "title"</span><span style="color:#212121">: link[</span><span style="color:#22863A">"title"</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#22863A">        "price_gbp"</span><span style="color:#212121">: </span><span style="color:#1976D2">float</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">sub</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"[</span><span style="color:#D32F2F">^</span><span style="color:#1976D2">\d</span><span style="color:#22863A">.]"</span><span style="color:#212121">, </span><span style="color:#22863A">""</span><span style="color:#212121">, pod.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"p.price_color"</span><span style="color:#212121">).text)),</span></span>
<span class="line"><span style="color:#22863A">        "url"</span><span style="color:#212121">: </span><span style="color:#6F42C1">urljoin</span><span style="color:#212121">(URL, link[</span><span style="color:#22863A">"href"</span><span style="color:#212121">]),</span></span>
<span class="line"><span style="color:#212121">    })</span></span>
<span class="line"></span></code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="69" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="69" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="sqlite-schema">SQLite Schema</h1>
<ul>
<li>The same care as any other schema :
<ul>
<li>One column per field, with a type, and <code>NOT NULL</code> where it is true</li>
<li>A natural key, <code>UNIQUE</code>, so the same page cannot arrive twice</li>
</ul>
</li>
<li><code>first_seen</code> and <code>last_seen</code> make a re-run informative</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">CREATE</span><span style="color:#D32F2F"> TABLE</span><span style="color:#6F42C1"> IF</span><span style="color:#D32F2F"> NOT</span><span style="color:#D32F2F"> EXISTS</span><span style="color:#24292EFF"> books (</span></span>
<span class="line"><span style="color:#24292EFF">    id           </span><span style="color:#D32F2F">INTEGER</span><span style="color:#D32F2F"> PRIMARY KEY</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    title        </span><span style="color:#D32F2F">TEXT</span><span style="color:#D32F2F">    NOT NULL</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    price_gbp    </span><span style="color:#D32F2F">REAL</span><span style="color:#D32F2F">    NOT NULL</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    rating       </span><span style="color:#D32F2F">INTEGER</span><span style="color:#D32F2F"> NOT NULL</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#D32F2F">    url</span><span style="color:#D32F2F">          TEXT</span><span style="color:#D32F2F">    NOT NULL</span><span style="color:#D32F2F"> UNIQUE</span><span style="color:#24292EFF">,</span></span>
