<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="running-other-programs">Running Other Programs</h1>
<ul>
<li>Some work belongs to a program that already exists :
<ul>
<li><code>git</code>, <code>systemctl</code>, <code>rsync</code>, a vendor's command-line tool</li>
</ul>
</li>
<li><code>subprocess</code> starts it, waits for it, and reports back</li>
<li>This is the module for the script that has outgrown its shell :
<ul>
<li>The logic got complicated, the quoting got worse</li>
<li>The commands themselves were never the problem</li>
</ul>
</li>
<li>Everything here is standard library, so there is nothing to install</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="158" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="158" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="subprocessrun">subprocess.run</h1>
<ul>
<li><code>run()</code> starts the program, waits, and returns a <code>CompletedProcess</code></li>
<li>The command is a list : the program, then each argument separately</li>
<li>Nothing is captured unless you ask, so output goes straight to the terminal</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">finished </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">([</span><span style="color:#22863A">"git"</span><span style="color:#212121">, </span><span style="color:#22863A">"--version"</span><span style="color:#212121">], check</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(finished.args)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(finished.returncode)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">running_a_command</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="159" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="159" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="capturing-output">Capturing Output</h1>
<ul>
<li><code>capture_output=True</code> fills in <code>stdout</code> and <code>stderr</code></li>
<li><code>text=True</code> makes them strings rather than bytes :
<ul>
<li>Without it you get <code>b'18\n'</code>, which is almost never wanted</li>
</ul>
</li>
<li>After that it is ordinary Python, not a shell pipeline</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">finished </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    [</span><span style="color:#22863A">"wc"</span><span style="color:#212121">, </span><span style="color:#22863A">"-l"</span><span style="color:#212121">, </span><span style="color:#1976D2">str</span><span style="color:#212121">(log)], capture_output</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">, text</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">, check</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">count </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(finished.stdout.</span><span style="color:#6F42C1">split</span><span style="color:#212121">()[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">capturing_output</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="160" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="160" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="exit-codes">Exit Codes</h1>
<ul>
<li>A non-zero exit is information, not always a failure :
<ul>
<li><code>grep</code> exits 1 when it did not match</li>
</ul>
</li>
<li><code>check=False</code> and read <code>returncode</code> yourself when the code is meaningful</li>
<li><code>check=True</code> raises <code>CalledProcessError</code> when it is not</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">found </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">([</span><span style="color:#22863A">"grep"</span><span style="color:#212121">, </span><span style="color:#22863A">"-c"</span><span style="color:#212121">, </span><span style="color:#22863A">"ERROR"</span><span style="color:#212121">, </span><span style="color:#1976D2">str</span><span style="color:#212121">(log)],</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(found.returncode, found.stdout.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">exit_codes</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="161" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="161" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="argument-lists">Argument Lists</h1>
<ul>
<li>A list hands the arguments to the program directly :
<ul>
<li>No shell starts, so nothing splits and nothing expands</li>
</ul>
</li>
<li><code>shell=True</code> hands the whole string to a shell first :
<ul>
<li>A space in a filename becomes two arguments</li>
<li>Punctuation becomes syntax</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">([</span><span style="color:#22863A">"wc"</span><span style="color:#212121">, </span><span style="color:#22863A">"-l"</span><span style="color:#212121">, </span><span style="color:#1976D2">str</span><span style="color:#212121">(awkward)])</span><span style="color:#4a9c59">          # correct</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"wc -l </span><span style="color:#1976D2">{</span><span style="color:#212121">awkward</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">, shell</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span><span style="color:#4a9c59">      # splits on the space</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">a_list_not_a_string</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="162" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="162" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="standard-input-and-pipelines">Standard Input and Pipelines</h1>
<ul>
<li><code>input=</code> writes to the child's stdin and closes it</li>
<li>Two commands join without a shell :
<ul>
<li>Run the first, capture it, hand the text to the second</li>
</ul>
</li>
<li>Clearer than a pipeline string, with nothing for a shell to misread</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">levels </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">([</span><span style="color:#22863A">"grep"</span><span style="color:#212121">, </span><span style="color:#22863A">"-o"</span><span style="color:#212121">, </span><span style="color:#22863A">"-E"</span><span style="color:#212121">, </span><span style="color:#22863A">"INFO|WARN|ERROR"</span><span style="color:#212121">, </span><span style="color:#1976D2">str</span><span style="color:#212121">(log)],</span></span>

<span class="line"><span style="color:#24292EFF">counted </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">([</span><span style="color:#22863A">"uniq"</span><span style="color:#212121">, </span><span style="color:#22863A">"-c"</span><span style="color:#212121">], input</span><span style="color:#D32F2F">=</span><span style="color:#212121">levels.stdout,</span></span>
<span class="line"><span style="color:#212121">                         capture_output</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">, text</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">, check</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="163" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="163" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="timeouts">Timeouts</h1>
<ul>
<li>A child that hangs will hang the parent for ever</li>
<li><code>timeout=</code> kills it and raises <code>TimeoutExpired</code> :
<ul>
<li>Nothing is left running behind you</li>
</ul>
</li>
<li>Any command touching a network, a device or another machine wants one</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">(slow_command, timeout</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1.5</span><span style="color:#212121">, check</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">except</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#24292EFF">TimeoutExpired </span><span style="color:#D32F2F">as</span><span style="color:#24292EFF"> error</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#22863A">"gave up after"</span><span style="color:#212121">, error.timeout, </span><span style="color:#22863A">"seconds"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">timeouts</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="164" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="164" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="environment-and-working-directory">Environment and Working Directory</h1>
<ul>
<li>The child inherits this process's environment by default</li>
<li><code>env=</code> replaces it wholesale :
<ul>
<li>Copy <code>os.environ</code> and add to the copy, or the child loses <code>PATH</code></li>
</ul>
</li>
<li><code>cwd=</code> runs the command elsewhere without moving yourself :
<ul>
<li>Better than <code>os.chdir()</code>, which changes it for everything</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">environment </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> os</span><span style="color:#212121">.</span><span style="color:#24292EFF">environ</span><span style="color:#212121">.</span><span style="color:#6F42C1">copy</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">environment</span><span style="color:#212121">[</span><span style="color:#22863A">"GREETING"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#22863A"> "set for the child only"</span></span>
<span class="line"><span style="color:#24292EFF">subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">(command, env</span><span style="color:#D32F2F">=</span><span style="color:#212121">environment, check</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">environment</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="165" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="165" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="missing-programs">Missing Programs</h1>
<ul>
<li>A missing command raises <code>FileNotFoundError</code>, not a non-zero exit</li>
<li><code>shutil.which()</code> answers the question without running anything</li>
<li>Check dependencies at the start of a script, not at the point of use :
<ul>
<li>Failing immediately with a clear message beats failing halfway through</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> shutil</span><span style="color:#212121">.</span><span style="color:#6F42C1">which</span><span style="color:#212121">(</span><span style="color:#22863A">"rsync"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> is</span><span style="color:#1976D2"> None</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    sys</span><span style="color:#212121">.</span><span style="color:#6F42C1">exit</span><span style="color:#212121">(</span><span style="color:#22863A">"rsync is not installed"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>

<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">finding_the_program</code></p>

<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="popen-and-streaming-output">Popen and Streaming Output</h1>
<ul>
<li><code>run()</code> returns nothing until the command has finished</li>
<li><code>Popen</code> starts the process and hands back control immediately :
<ul>
<li>Iterating <code>stdout</code> yields lines as the child flushes them</li>
</ul>
</li>
<li>Use it for anything long enough that silence looks like a hang</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">Popen</span><span style="color:#212121">(command, stdout</span><span style="color:#D32F2F">=</span><span style="color:#212121">subprocess.PIPE,</span></span>
<span class="line"><span style="color:#212121">                      text</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">, bufsize</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> process</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> line </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> process</span><span style="color:#212121">.</span><span style="color:#24292EFF">stdout</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"received :"</span><span style="color:#212121">, line.</span><span style="color:#6F42C1">rstrip</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">streaming_output</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="pathlib-alternatives">pathlib Alternatives</h1>
<ul>
<li>Starting a process costs time and brings quoting with it</li>
<li>Python already does most of what the small commands do :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>ls *.log     ->  Path.glob            basename  ->  Path.name</span></span>
<span class="line"><span>wc -l        ->  str.splitlines       test -f   ->  Path.exists</span></span>
<span class="line"><span>grep         ->  a comprehension      find      ->  Path.rglob</span></span>
<span class="line"><span>cp / mv / rm ->  shutil.copy, Path.rename, Path.unlink</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Reach for <code>subprocess</code> when the work belongs to another program</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">when_not_to_shell_out</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="168" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="168" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="summary--running-other-programs">Summary : Running Other Programs</h1>
<ul>
<li><code>subprocess.run()</code> starts a program, waits, and reports back</li>
<li>Pass a list, not a string, and leave <code>shell=True</code> alone</li>
<li><code>capture_output=True</code> with <code>text=True</code> to read what it printed</li>
<li><code>check=True</code> to raise on failure, <code>check=False</code> when the code means something</li>
<li><code>timeout=</code> on anything that could hang</li>
<li><code>shutil.which()</code> to fail early with a clear message</li>
<li><code>Popen</code> when you need the output as it arrives</li>
<li>And <code>pathlib</code> instead, for anything the filesystem already does</li>
</ul>
</section>
