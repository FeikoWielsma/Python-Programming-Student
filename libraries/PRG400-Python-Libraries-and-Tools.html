</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="119" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="119" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="reading-a-csv-1">Reading a CSV</h1>
<ul>
<li><code>read_csv</code> takes a path and returns a <code>DataFrame</code> :
<ul>
<li>Column types are inferred from the file, not declared</li>
</ul>
</li>
<li>The keywords that rescue somebody else's export :
<ul>
<li><code>sep=</code> a different delimiter · <code>index_col=</code> which column is the key</li>
<li><code>usecols=</code> only the columns wanted · <code>na_values=</code> what counts as empty</li>
<li><code>skiprows=</code> junk at the top · <code>header=None</code> no header row at all</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_csv</span><span style="color:#212121">(DATA </span><span style="color:#D32F2F">/</span><span style="color:#22863A"> "servers.csv"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(servers.</span><span style="color:#6F42C1">head</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#212121">))</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">servers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_csv</span><span style="color:#212121">(DATA </span><span style="color:#D32F2F">/</span><span style="color:#22863A"> "servers.csv"</span><span style="color:#212121">, index_col</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"hostname"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(servers.</span><span style="color:#6F42C1">head</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">read_csv</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="120" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="120" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="reading-a-spreadsheet">Reading a Spreadsheet</h1>
<ul>
<li><code>read_excel</code> is the same idea for a workbook :
<ul>
<li>Needs <code>openpyxl</code> installed, which the lockfile already pins</li>
</ul>
</li>
<li>A workbook has sheets, so one more argument is needed :
<ul>
<li><code>sheet_name=&quot;servers&quot;</code> by name, <code>0</code> by position, <code>None</code> for all of them</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">ExcelFile</span><span style="color:#212121">(</span><span style="color:#22863A">"data/servers.xlsx"</span><span style="color:#212121">).</span><span style="color:#24292EFF">sheet_names   </span><span style="color:#4a9c59"># ['servers', 'sites']</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">servers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_excel</span><span style="color:#212121">(</span><span style="color:#22863A">"data/servers.xlsx"</span><span style="color:#212121">, sheet_name</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"servers"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">every </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_excel</span><span style="color:#212121">(</span><span style="color:#22863A">"data/servers.xlsx"</span><span style="color:#212121">, sheet_name</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">None</span><span style="color:#212121">)</span><span style="color:#4a9c59">   # a dict</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Reading every sheet gives a dictionary keyed by sheet name</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">read_excel</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="121" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="121" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="head-and-tail">head and tail</h1>
<ul>
<li><code>head()</code> and <code>tail()</code> show the ends of the table :
<ul>
<li>Five rows by default, or as many as asked for</li>
</ul>
</li>
<li>They return a <code>DataFrame</code>, so they chain and print like any other</li>
<li><code>sample()</code> is the honest third option :
<ul>
<li>The head of a file is often sorted, and a sorted head is not typical</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">head</span><span style="color:#212121">()</span><span style="color:#4a9c59">           # first five rows</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">head</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#212121">)</span><span style="color:#4a9c59">          # first two</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">tail</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">)</span><span style="color:#4a9c59">          # last three</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">sample</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">, random_state</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">0</span><span style="color:#212121">)</span><span style="color:#4a9c59">   # three at random, reproducibly</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">head_and_tail</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="122" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="122" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="info-and-describe">info and describe</h1>
<ul>
<li><code>info()</code> describes the structure :
<ul>
<li>Row count, column names, type of each, and how many values are present</li>
</ul>
</li>
<li><code>describe()</code> summarises the numbers :
<ul>
<li>Count, mean, standard deviation, minimum, quartiles, maximum</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span> #   Column        Non-Null Count  Dtype</span></span>
<span class="line"><span>---  ------        --------------  -----</span></span>
<span class="line"><span> 6   disk_gb       14 non-null     int64</span></span>
<span class="line"><span> 7   used_gb       13 non-null     float64</span></span>
<span class="line"><span> 8   last_patched  12 non-null     str</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The non-null counts are the fastest missing-data check there is :
<ul>
<li>Any column short of the row count has holes in it</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">info_and_describe</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="123" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="123" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="selecting-columns">Selecting Columns</h1>
<ul>
<li>One name in square brackets gives a <code>Series</code> :
<ul>
<li><code>servers[&quot;memory_gb&quot;]</code></li>
</ul>
</li>
<li>A list of names gives a <code>DataFrame</code>, in the order given :
<ul>
<li><code>servers[[&quot;site&quot;, &quot;role&quot;, &quot;memory_gb&quot;]]</code></li>
</ul>
</li>
<li>The double brackets are a list inside a selection, not special syntax</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"memory_gb"</span><span style="color:#212121">]</span><span style="color:#4a9c59">                  # a Series</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"memory_gb"</span><span style="color:#24292EFF">]</span><span style="color:#212121">]</span><span style="color:#4a9c59">                # a DataFrame with one column</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"role"</span><span style="color:#212121">,</span><span style="color:#22863A"> "site"</span><span style="color:#212121">,</span><span style="color:#22863A"> "disk_gb"</span><span style="color:#24292EFF">]</span><span style="color:#212121">]</span><span style="color:#4a9c59">  # three columns, reordered</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Selecting with a list is also how a report gets its column order</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">selecting_columns</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="124" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="124" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="loc">loc</h1>
<ul>
<li><code>loc[rows, columns]</code>, both given as labels :
<ul>
<li>A single label, a list of labels, or a slice of labels</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">loc</span><span style="color:#212121">[</span><span style="color:#22863A">"db01"</span><span style="color:#212121">,</span><span style="color:#22863A"> "memory_gb"</span><span style="color:#212121">]</span><span style="color:#4a9c59">              # one cell</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">loc</span><span style="color:#212121">[</span><span style="color:#22863A">"db01"</span><span style="color:#212121">]</span><span style="color:#4a9c59">                           # one row, as a Series</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">loc</span><span style="color:#212121">[</span><span style="color:#22863A">"db01"</span><span style="color:#212121">,</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"site"</span><span style="color:#212121">,</span><span style="color:#22863A"> "role"</span><span style="color:#24292EFF">]</span><span style="color:#212121">]</span><span style="color:#4a9c59">         # one row, chosen columns</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">loc</span><span style="color:#212121">[:,</span><span style="color:#24292EFF"> [</span><span style="color:#22863A">"site"</span><span style="color:#212121">,</span><span style="color:#22863A"> "role"</span><span style="color:#24292EFF">]</span><span style="color:#212121">]</span><span style="color:#4a9c59">              # every row, two columns</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">loc</span><span style="color:#212121">[</span><span style="color:#22863A">"web01"</span><span style="color:#212121">:</span><span style="color:#22863A">"db01"</span><span style="color:#212121">,</span><span style="color:#22863A"> "site"</span><span style="color:#212121">:</span><span style="color:#22863A">"os"</span><span style="color:#212121">]</span><span style="color:#4a9c59">      # a module</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A label slice includes both ends, unlike every other slice in Python</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">loc_by_label</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="125" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="125" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="iloc">iloc</h1>
<ul>
<li><code>iloc[rows, columns]</code>, both given as integers :
<ul>
<li>The labels are ignored entirely, as if the table were a list of lists</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">iloc</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">,</span><span style="color:#1976D2"> 4</span><span style="color:#212121">]</span><span style="color:#4a9c59">        # first row, fifth column</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">iloc</span><span style="color:#212121">[:</span><span style="color:#1976D2">3</span><span style="color:#212121">,</span><span style="color:#212121"> :</span><span style="color:#1976D2">4</span><span style="color:#212121">]</span><span style="color:#4a9c59">      # first three rows, first four columns</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">iloc</span><span style="color:#212121">[</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">2</span><span style="color:#212121">:,</span><span style="color:#212121"> :</span><span style="color:#1976D2">4</span><span style="color:#212121">]</span><span style="color:#4a9c59">     # last two rows</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#24292EFF">iloc</span><span style="color:#212121">[</span><span style="color:#24292EFF">[</span><span style="color:#1976D2">0</span><span style="color:#212121">,</span><span style="color:#1976D2"> 5</span><span style="color:#212121">,</span><span style="color:#1976D2"> 2</span><span style="color:#24292EFF">]</span><span style="color:#212121">,</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">0</span><span style="color:#212121">,</span><span style="color:#1976D2"> 1</span><span style="color:#24292EFF">]</span><span style="color:#212121">]</span><span style="color:#4a9c59">   # lists of positions, in that order</span></span>
<span class="line"></span></code></pre>
<ul>
<li>An integer slice stops before its end, exactly like a list slice</li>
<li>The same cell, two ways : <code>loc[&quot;db01&quot;, &quot;memory_gb&quot;]</code> is <code>iloc[2, 4]</code></li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">iloc_by_position</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="126" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="126" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="loc-and-iloc">loc and iloc</h1>
<div class="two-col">
<div>
<p><code>loc</code>, by label</p>
<ul>
<li>Takes the row and column names</li>
<li>Slices include both ends</li>
<li>Survives a re-sort of the table</li>
<li>What you want most of the time</li>
</ul>
</div>
<div>
<p><code>iloc</code>, by position</p>
<ul>
<li>Takes integers, counting from zero</li>
<li>Slices stop before the end</li>
<li>Changes meaning when rows move</li>
<li>For &quot;the first&quot; and &quot;the last&quot;</li>
</ul>
</div>
</div>
<ul>
<li>Both take a comma : rows first, then columns</li>
<li>Plain <code>[]</code> is neither : it selects columns on a frame</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="127" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="127" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="filtering-rows">Filtering Rows</h1>
<ul>
<li>A comparison on a column gives one <code>True</code> or <code>False</code> per row :
<ul>
<li>That is an ordinary value, and it can be given a name</li>
</ul>
</li>
<li>Indexing the frame with that mask keeps only the matching rows</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">big </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">[</span><span style="color:#22863A">"memory_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> >=</span><span style="color:#1976D2"> 64</span><span style="color:#4a9c59">      # a Series of booleans</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">big</span><span style="color:#212121">]</span><span style="color:#4a9c59">                          # the rows where it is True</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> ></span><span style="color:#1976D2"> 1000</span><span style="color:#212121">]</span><span style="color:#4a9c59">    # usually written in one line</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"role"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "web"</span><span style="color:#212121">]</span><span style="color:#4a9c59">     # text compares just as well</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A mask sums to a count, because <code>True</code> is one and <code>False</code> is zero</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">boolean_filter</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="128" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="128" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="combining-filters">Combining Filters</h1>
<ul>
<li><code>&amp;</code> for and, <code>|</code> for or, <code>~</code> for not :
<ul>
<li>Not the words <code>and</code>, <code>or</code> and <code>not</code>, which want one answer, not a column</li>
</ul>
</li>
<li>Every comparison needs its own parentheses, because <code>&amp;</code> binds tighter</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">(servers</span><span style="color:#212121">[</span><span style="color:#22863A">"cpu_cores"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> >=</span><span style="color:#1976D2"> 8</span><span style="color:#24292EFF">) </span><span style="color:#D32F2F">&#x26;</span><span style="color:#24292EFF"> (servers</span><span style="color:#212121">[</span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> >=</span><span style="color:#1976D2"> 2000</span><span style="color:#24292EFF">)</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">(servers</span><span style="color:#212121">[</span><span style="color:#22863A">"role"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "database"</span><span style="color:#24292EFF">) </span><span style="color:#D32F2F">|</span><span style="color:#24292EFF"> (servers</span><span style="color:#212121">[</span><span style="color:#22863A">"role"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> ==</span><span style="color:#22863A"> "build"</span><span style="color:#24292EFF">)</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#D32F2F">~</span><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"site"</span><span style="color:#212121">].</span><span style="color:#6F42C1">isin</span><span style="color:#212121">([</span><span style="color:#22863A">"AMS"</span><span style="color:#212121">, </span><span style="color:#22863A">"RTM"</span><span style="color:#212121">])]</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Two shorthands :
<ul>
<li><code>.isin([...])</code> replaces a chain of ors</li>
<li><code>.between(low, high)</code> replaces two comparisons, and includes both ends</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">combining_filters</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="129" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="129" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="adding-a-column">Adding a Column</h1>
<ul>
<li>Assigning to a name that does not exist creates the column :
<ul>
<li>A scalar is broadcast to every row</li>
<li>A <code>Series</code> is computed element by element, aligned on the index</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"managed"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> True</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"free_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">[</span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> -</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">[</span><span style="color:#22863A">"used_gb"</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"used_pct"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> (servers</span><span style="color:#212121">[</span><span style="color:#22863A">"used_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> /</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">[</span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> *</span><span style="color:#1976D2"> 100</span><span style="color:#24292EFF">)</span><span style="color:#212121">.</span><span style="color:#6F42C1">round</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>assign</code> does the same but returns a new frame, so it chains</li>
<li><code>drop(columns=[...])</code> removes columns and also returns a new frame</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">adding_columns</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="130" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="130" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="deriving-a-column">Deriving a Column</h1>
<ul>
<li>Three ways to compute a column from another :
<ul>
<li><code>.str</code> gives every string method, applied down the column</li>
<li><code>.map(dictionary)</code> translates codes into labels</li>
<li><code>np.where(condition, yes, no)</code> is a vectorised if-else</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"distro"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">[</span><span style="color:#22863A">"os"</span><span style="color:#212121">].</span><span style="color:#24292EFF">str</span><span style="color:#212121">.</span><span style="color:#6F42C1">split</span><span style="color:#212121">().</span><span style="color:#24292EFF">str</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"tier"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">[</span><span style="color:#22863A">"role"</span><span style="color:#212121">].</span><span style="color:#6F42C1">map</span><span style="color:#212121">({</span><span style="color:#22863A">"web"</span><span style="color:#212121">: </span><span style="color:#22863A">"front line"</span><span style="color:#212121">, </span><span style="color:#22863A">"db"</span><span style="color:#212121">: </span><span style="color:#22863A">"critical"</span><span style="color:#212121">})</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#22863A">"alert"</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">where</span><span style="color:#212121">(servers[</span><span style="color:#22863A">"used_pct"</span><span style="color:#212121">] </span><span style="color:#D32F2F">></span><span style="color:#1976D2"> 75</span><span style="color:#212121">, </span><span style="color:#22863A">"FULL"</span><span style="color:#212121">, </span><span style="color:#22863A">"ok"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A missing value never compares true, so it lands in the <code>no</code> branch :
<ul>
<li>Which quietly turns &quot;never measured&quot; into &quot;fine&quot;</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo14</code><br><code class="pill-demo pill-desc">deriving_columns</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="131" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="131" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="sorting">Sorting</h1>
<ul>
<li><code>sort_values</code> takes a column name, or a list of them :
<ul>
<li><code>ascending=</code> takes one boolean, or one per column</li>
</ul>
</li>
<li>It returns a new frame, the original is untouched</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">sort_values</span><span style="color:#212121">(</span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">, ascending</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">sort_values</span><span style="color:#212121">([</span><span style="color:#22863A">"site"</span><span style="color:#212121">, </span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">], ascending</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#1976D2">True</span><span style="color:#212121">, </span><span style="color:#1976D2">False</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">nlargest</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">, </span><span style="color:#22863A">"used_gb"</span><span style="color:#212121">)</span><span style="color:#4a9c59">     # sort plus head, saying what it means</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">sort_index</span><span style="color:#212121">()</span><span style="color:#4a9c59">               # back into label order</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>nlargest</code> and <code>nsmallest</code> read better than a sort followed by a head</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo15</code><br><code class="pill-demo pill-desc">sort_values</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="132" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="132" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="groupby-aggregation">groupby Aggregation</h1>
<ul>
<li><code>groupby(&quot;column&quot;)</code>, then a column to summarise, then a summary</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"site"</span><span style="color:#212121">)</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"cpu_cores"</span><span style="color:#24292EFF">]</span><span style="color:#212121">.</span><span style="color:#6F42C1">sum</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"role"</span><span style="color:#212121">)</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"disk_gb"</span><span style="color:#24292EFF">]</span><span style="color:#212121">.</span><span style="color:#6F42C1">mean</span><span style="color:#212121">().</span><span style="color:#6F42C1">round</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"site"</span><span style="color:#212121">).</span><span style="color:#6F42C1">size</span><span style="color:#212121">()</span><span style="color:#4a9c59">                    # how many per group</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>agg</code> takes a list of functions, or a dictionary per column</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"site"</span><span style="color:#212121">)</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"memory_gb"</span><span style="color:#24292EFF">]</span><span style="color:#212121">.</span><span style="color:#6F42C1">agg</span><span style="color:#212121">([</span><span style="color:#22863A">"count"</span><span style="color:#212121">, </span><span style="color:#22863A">"sum"</span><span style="color:#212121">, </span><span style="color:#22863A">"mean"</span><span style="color:#212121">, </span><span style="color:#22863A">"max"</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"site"</span><span style="color:#212121">).</span><span style="color:#6F42C1">agg</span><span style="color:#212121">({</span><span style="color:#22863A">"cpu_cores"</span><span style="color:#212121">: </span><span style="color:#22863A">"sum"</span><span style="color:#212121">, </span><span style="color:#22863A">"disk_gb"</span><span style="color:#212121">: </span><span style="color:#22863A">"max"</span><span style="color:#212121">})</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The grouping column becomes the index of the answer</li>
</ul>

</blockquote>

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="named-aggregation">Named Aggregation</h1>
<ul>
<li>Named aggregation gives each output column the name the report wants :
<ul>
<li>Keyword is the new column, value is <code>(column, summary)</code></li>
</ul>
</li>
<li><code>reset_index()</code> turns the grouping key back into an ordinary column</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">per_site </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (</span></span>
<span class="line"><span style="color:#24292EFF">    servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"site"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#212121">    .</span><span style="color:#6F42C1">agg</span><span style="color:#212121">(servers</span><span style="color:#D32F2F">=</span><span style="color:#212121">(</span><span style="color:#22863A">"hostname"</span><span style="color:#212121">, </span><span style="color:#22863A">"count"</span><span style="color:#212121">),</span></span>

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="merge">merge</h1>
<ul>
<li><code>merge</code> combines two frames on a shared key column :
<ul>
<li><code>on=</code> names a column that exists in both</li>
<li><code>left_on=</code> and <code>right_on=</code> when the two sides call it different things</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_csv</span><span style="color:#212121">(</span><span style="color:#22863A">"data/servers.csv"</span><span style="color:#212121">)</span><span style="color:#4a9c59">   # has a site code</span></span>
<span class="line"><span style="color:#24292EFF">sites </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_csv</span><span style="color:#212121">(</span><span style="color:#22863A">"data/sites.csv"</span><span style="color:#212121">)</span><span style="color:#4a9c59">       # explains what the code means</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">joined </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">merge</span><span style="color:#212121">(sites, on</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"site"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">joined</span><span style="color:#212121">.</span><span style="color:#6F42C1">groupby</span><span style="color:#212121">(</span><span style="color:#22863A">"city"</span><span style="color:#212121">).</span><span style="color:#6F42C1">size</span><span style="color:#212121">()</span><span style="color:#4a9c59">               # only possible after the join</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The result is an ordinary frame, so it filters, sorts and groups</li>
</ul>

<p><code class="pill-demo pill-id">demo18</code><br><code class="pill-demo pill-desc">merge_on_key</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="136" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="136" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="join-types">Join Types</h1>
<ul>
<li><code>how=</code> decides what happens to rows that match nothing :
<ul>
<li><code>inner</code>, the default, keeps only rows present on both sides</li>
<li><code>left</code> keeps every row of the left frame, filling gaps with <code>NaN</code></li>
<li><code>right</code> does the mirror image, <code>outer</code> keeps everything</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">merge</span><span style="color:#212121">(sites, on</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"site"</span><span style="color:#212121">, how</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"left"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">merge</span><span style="color:#212121">(sites, on</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"site"</span><span style="color:#212121">, how</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"outer"</span><span style="color:#212121">, indicator</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<ul>
<li><code>indicator=True</code> adds a <code>_merge</code> column saying where each row came from :
<ul>
<li><code>both</code>, <code>left_only</code>, <code>right_only</code></li>
</ul>
</li>
<li>It answers whether the join lost rows</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo19</code><br><code class="pill-demo pill-desc">merge_how</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="137" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="137" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="missing-values">Missing Values</h1>
<ul>
<li>An empty field becomes <code>NaN</code>, and <code>NaN</code> is not equal to anything</li>
<li><code>isna()</code> gives a mask of the same shape, and a mask sums to a count</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">isna</span><span style="color:#212121">().</span><span style="color:#6F42C1">sum</span><span style="color:#212121">()</span><span style="color:#4a9c59">                       # holes per column</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">[</span><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">isna</span><span style="color:#212121">().</span><span style="color:#6F42C1">any</span><span style="color:#212121">(axis</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">)]</span><span style="color:#4a9c59">        # the rows with any hole</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">dropna</span><span style="color:#212121">()</span><span style="color:#4a9c59">                           # drop any row with any hole</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">dropna</span><span style="color:#212121">(subset</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"used_gb"</span><span style="color:#212121">])</span><span style="color:#4a9c59">         # only rows missing that column</span></span>
<span class="line"><span style="color:#24292EFF">servers</span><span style="color:#212121">.</span><span style="color:#6F42C1">fillna</span><span style="color:#212121">({</span><span style="color:#22863A">"used_gb"</span><span style="color:#212121">: </span><span style="color:#1976D2">0.0</span><span style="color:#212121">, </span><span style="color:#22863A">"last_patched"</span><span style="color:#212121">: </span><span style="color:#22863A">"never"</span><span style="color:#212121">})</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Summaries skip <code>NaN</code> silently, so a mean is a mean of what was there</li>
</ul>

<p><code class="pill-demo pill-id">demo20</code><br><code class="pill-demo pill-desc">missing_data</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="138" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="138" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">

</ul>
</li>
<li>Values go in as parameters, never by string formatting</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> sqlite3</span></span>

<span class="line"><span style="color:#212121">                   conn, params</span><span style="color:#D32F2F">=</span><span style="color:#212121">(</span><span style="color:#1976D2">45.0</span><span style="color:#212121">,))</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="to_sql">to_sql</h1>
<ul>
<li><code>to_sql</code> writes a frame into a table, creating it if it is not there :
<ul>
<li><code>if_exists=</code> is <code>fail</code> by default, or <code>replace</code>, or <code>append</code></li>
<li><code>index=False</code> keeps the frame's row labels out of the table</li>

<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">conn </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(</span><span style="color:#22863A">"data/pandas-demo.db"</span><span style="color:#212121">)</span></span>

<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(pd.</span><span style="color:#6F42C1">read_sql</span><span style="color:#212121">(</span><span style="color:#22863A">"PRAGMA table_info(servers)"</span><span style="color:#212121">, conn))</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<ul>
<li>The round trip is the point : summarise in pandas, store the result back</li>

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="summary--pandas">Summary : Pandas</h1>
<ul>
<li><code>Series</code> is a column with labels, <code>DataFrame</code> is a table of them :
<ul>
<li>The index is a name per row, and everything aligns on it</li>
</ul>
</li>
<li>Read with <code>read_csv</code>, <code>read_excel</code>, <code>read_sql</code>, write with the <code>to_</code> pair</li>
<li>Look before working : <code>head</code>, <code>tail</code>, <code>info</code>, <code>describe</code></li>
<li>Address with <code>loc</code> by label and <code>iloc</code> by position, rows before columns</li>
<li>Filter with a boolean mask, combined with <code>&amp;</code>, <code>|</code> and <code>~</code></li>
<li>Summarise with <code>groupby().agg()</code>, combine tables with <code>merge</code></li>
<li>Handle holes deliberately : <code>isna</code>, <code>dropna(subset=)</code>, <code>fillna</code></li>
</ul>
</section>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="gui-toolkits">GUI Toolkits</h1>
<ul>
<li>Everything so far has printed to a terminal :
<ul>
<li>Which is the right answer more often than people admit</li>
</ul>
</li>
<li>Sometimes the audience is not you :
<ul>
<li>A colleague who will not type a command</li>
<li>A tool that has to be handed over and used unattended</li>
</ul>
</li>
<li>Python has a graphical toolkit in the standard library :
<ul>
<li><code>tkinter</code>, which is always present and never has to be installed</li>
</ul>
</li>
<li>The goal here is recognition, not a finished application</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="145" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="145" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="installing-tkinter">Installing tkinter</h1>
<ul>
<li><code>tkinter</code> ships with Python, but not with every Python package :
<ul>
<li>The Windows and macOS installers include it</li>
<li>Most Linux distributions split it into a separate package</li>
</ul>
</li>
<li>On Debian and Ubuntu it is one command :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">sudo</span><span style="color:#2B5581"> apt</span><span style="color:#2B5581"> install</span><span style="color:#2B5581"> python3-tk</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Check it before writing any code :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">python</span><span style="color:#2B5581"> -c</span><span style="color:#22863A"> "import tkinter; print(tkinter.TkVersion)"</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="146" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="146" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="root-window-and-event-loop">Root Window and Event Loop</h1>
<ul>
<li>A graphical program has a different shape from a script :
<ul>
<li>A script runs top to bottom and exits</li>
<li>A window is created, then waits</li>
</ul>
</li>
<li><code>Tk()</code> is the root window, and there is exactly one</li>
<li><code>mainloop()</code> waits for an event, dispatches it, and waits again :
<ul>
<li>It does not return until the window is destroyed</li>
<li>Nothing written after it runs before then</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">root </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> tk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Tk</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">title</span><span style="color:#212121">(</span><span style="color:#22863A">"A window"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">geometry</span><span style="color:#212121">(</span><span style="color:#22863A">"420x220"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">mainloop</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">gui_root_window</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="147" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="147" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="widgets">Widgets</h1>
<ul>
<li>Three widgets carry most simple forms :
<ul>
<li><code>Label</code> shows text, <code>Entry</code> takes text, <code>Button</code> does something</li>
</ul>
</li>
<li>Prefer the themed <code>ttk</code> versions over the plain <code>tk</code> ones :
<ul>
<li>Same names, native appearance</li>
</ul>
</li>
<li>A widget is created with its parent as the first argument</li>
<li><code>command=</code> takes the function itself, without parentheses</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">entry </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Entry</span><span style="color:#212121">(root, width</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">24</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">button </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Button</span><span style="color:#212121">(root, text</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Look up"</span><span style="color:#212121">, command</span><span style="color:#D32F2F">=</span><span style="color:#212121">look_up)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">gui_widgets</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="148" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="148" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="widget-values">Widget Values</h1>
<ul>
<li>A widget owns its value, and is asked for it rather than tracked :
<ul>
<li><code>entry.get()</code> reads what the user typed</li>
<li><code>label.configure(text=...)</code> writes it back</li>
</ul>
</li>
<li><code>configure()</code> sets any option after construction</li>
<li>The callback is an ordinary method :
<ul>
<li>It runs when the event happens, not when it is registered</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> look_up</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    name </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> entry</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">().</span><span style="color:#6F42C1">strip</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#D32F2F"> not</span><span style="color:#24292EFF"> name</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">        result</span><span style="color:#212121">.</span><span style="color:#6F42C1">configure</span><span style="color:#212121">(text</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"type a hostname first"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">        return</span></span>
<span class="line"><span style="color:#24292EFF">    result</span><span style="color:#212121">.</span><span style="color:#6F42C1">configure</span><span style="color:#212121">(text</span><span style="color:#D32F2F">=</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">name</span><span style="color:#1976D2">}</span><span style="color:#22863A"> resolved"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="149" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="149" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="grid-layout">grid Layout</h1>
<ul>
<li>Widgets do not place themselves, a geometry manager places them</li>
<li><code>grid</code> puts a widget in a row and a column :
<ul>
<li><code>sticky</code> takes compass points, so <code>&quot;e&quot;</code> pins right and <code>&quot;ew&quot;</code> fills</li>
<li><code>padx</code> and <code>pady</code> add space around the widget</li>
<li><code>columnspan</code> lets one widget sit across several columns</li>
</ul>
</li>
<li>A widget stretches only if its row or column is given a weight :
<ul>
<li>Weight is a share of the spare space, not a yes or no</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">label</span><span style="color:#212121">.</span><span style="color:#6F42C1">grid</span><span style="color:#212121">(row</span><span style="color:#D32F2F">=</span><span style="color:#212121">row, column</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">0</span><span style="color:#212121">, sticky</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"e"</span><span style="color:#212121">, padx</span><span style="color:#D32F2F">=</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">8</span><span style="color:#212121">), pady</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">entry</span><span style="color:#212121">.</span><span style="color:#6F42C1">grid</span><span style="color:#212121">(row</span><span style="color:#D32F2F">=</span><span style="color:#212121">row, column</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">, sticky</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"ew"</span><span style="color:#212121">, pady</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">form</span><span style="color:#212121">.</span><span style="color:#6F42C1">columnconfigure</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">, weight</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">gui_grid_layout</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="150" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="150" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="events-and-callbacks">Events and Callbacks</h1>
<ul>
<li><code>bind()</code> maps an event pattern to a callback :
<ul>
<li><code>&lt;Key&gt;</code> is any key, <code>&lt;Key-a&gt;</code> is one key, <code>&lt;Button-1&gt;</code> is a left click</li>
<li><code>&lt;Configure&gt;</code> fires when the widget is resized</li>
</ul>
</li>
<li>Every bound callback is handed one argument, the event :
<ul>
<li>It carries <code>x</code>, <code>y</code>, <code>keysym</code> and the widget it happened on</li>
</ul>
</li>
<li>A <code>Button</code>'s <code>command=</code> is the same idea with the event thrown away</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">bind</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;Key>"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> event</span><span style="color:#212121">: </span><span style="color:#6F42C1">report</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"key </span><span style="color:#1976D2">{</span><span style="color:#212121">event.keysym</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">, event))</span></span>
<span class="line"><span style="color:#24292EFF">canvas</span><span style="color:#212121">.</span><span style="color:#6F42C1">bind</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;Button-1>"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> event</span><span style="color:#212121">: </span><span style="color:#6F42C1">report</span><span style="color:#212121">(</span><span style="color:#22863A">"left click"</span><span style="color:#212121">, event))</span></span>
<span class="line"><span style="color:#24292EFF">canvas</span><span style="color:#212121">.</span><span style="color:#6F42C1">bind</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;Configure>"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> event</span><span style="color:#212121">: </span><span style="color:#6F42C1">report</span><span style="color:#212121">(</span><span style="color:#22863A">"resized"</span><span style="color:#212121">, event))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">gui_events</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="151" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="151" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="ttktreeview">ttk.Treeview</h1>
<ul>
<li><code>ttk.Treeview</code> is a real table, with headings and columns</li>
<li>Rows are inserted, and each one gets an identifier back</li>
<li>Clicking a heading can re-order the rows :
<ul>
<li><code>tree.set</code> reads one cell, <code>tree.move</code> re-places a row</li>
</ul>
</li>
<li>The widget most internal tools need :
<ul>
<li>Most internal tools are a table of something with a filter above it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">tree </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Treeview</span><span style="color:#212121">(root, columns</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">list</span><span style="color:#212121">(COLUMNS), show</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"headings"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> rows</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    tree</span><span style="color:#212121">.</span><span style="color:#6F42C1">insert</span><span style="color:#212121">(</span><span style="color:#22863A">""</span><span style="color:#212121">, </span><span style="color:#22863A">"end"</span><span style="color:#212121">, values</span><span style="color:#D32F2F">=</span><span style="color:#212121">[row[name] </span><span style="color:#D32F2F">for</span><span style="color:#212121"> name </span><span style="color:#D32F2F">in</span><span style="color:#212121"> COLUMNS])</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">gui_treeview</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="152" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="152" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="treeview-and-sqlite">Treeview and SQLite</h1>
<ul>
<li>The same table, filled from SQLite instead of a CSV :
<ul>
<li>Type a filter, press Return, run the query, refill the table</li>
</ul>
</li>
<li>The user's text is a parameter, never formatted into the SQL :
<ul>
<li>Exactly as in the scraping module</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">sql </span><span style="color:#D32F2F">=</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"SELECT </span><span style="color:#1976D2">{</span><span style="color:#22863A">', '</span><span style="color:#212121">.</span><span style="color:#6F42C1">join</span><span style="color:#212121">(COLUMNS)</span><span style="color:#1976D2">}</span><span style="color:#22863A"> FROM servers"</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> term</span><span style="color:#212121">:</span></span>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="choosing-a-toolkit">Choosing a Toolkit</h1>
<div class="two-col">
<div>
<ul>
<li><code>tkinter</code> :
<ul>
<li>In the standard library</li>
<li>Plain, dated, acceptable</li>
<li>Small tools and dialogs</li>
</ul>
</li>
<li><code>PySide6</code>, the Qt binding :
<ul>
<li>A large install</li>
<li>Native and modern</li>
<li>Real desktop applications</li>
</ul>
</li>
</ul>
</div>
<div>
<ul>
<li><code>Streamlit</code> :
<ul>
<li>Opens a browser tab</li>
<li>No event loop, no callbacks</li>
<li>Dashboards over data</li>
</ul>
</li>
<li>Model and view :
<ul>
<li><code>tkinter</code> holds the rows itself</li>
<li>Qt asks a model for them</li>
<li>Which matters at scale</li>
</ul>
</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="154" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="154" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="gui-trade-offs">GUI Trade-offs</h1>
<ul>
<li>A graphical program costs more than it looks :
<ul>
<li>It cannot be run from cron, piped, or driven from a script</li>
<li>It needs a display, which rules out most servers</li>
<li>It is harder to test than anything else in this course</li>
</ul>
</li>
<li>Reach for a window when the user is not you :
<ul>
<li>And reach for a command-line tool when the user is</li>
</ul>
</li>
<li>The command-line tools cover most of the middle ground :
<ul>
<li>A clear <code>--help</code>, real exit codes, and a table printed with <code>rich</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="155" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="155" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="summary--gui-toolkits">Summary : GUI Toolkits</h1>
<ul>
<li>A GUI inverts the shape of a program :
<ul>
<li>Build the widgets, then hand control to an event loop</li>
</ul>
</li>
<li><code>tkinter</code> is in the standard library and always available :
<ul>
<li><code>python3-tk</code> on Debian and Ubuntu</li>
</ul>
</li>
<li>Three widgets and one geometry manager cover most forms :
<ul>
<li><code>Label</code>, <code>Entry</code>, <code>Button</code>, placed with <code>grid</code></li>
</ul>
</li>
<li><code>ttk.Treeview</code> is the widget most internal tools actually need</li>
<li>Qt and Streamlit are the other two answers, and both are in <code>reference/gui/</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="156" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="156" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10"><div class="ml-eyebrow"><a href="#156"><span class="ml-tag">python</span>Course Schedule</a></div>
