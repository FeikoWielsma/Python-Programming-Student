</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="70" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="70" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="parameterised-inserts">Parameterised Inserts</h1>
<ul>
<li>Placeholders keep the values out of the SQL text :
<ul>
<li><code>?</code> by position, or <code>:name</code> by name</li>
</ul>
</li>
<li>Named placeholders take a dictionary as it is :
<ul>
<li>Which is exactly what the parse step produced</li>
</ul>
</li>
<li><code>executemany</code> sends the whole list in one call</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">INSERT </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> """</span></span>
<span class="line"><span style="color:#22863A">INSERT INTO books (title, price_gbp, rating, url, last_seen)</span></span>
<span class="line"><span style="color:#22863A">VALUES (:title, :price_gbp, :rating, :url, :seen_at)</span></span>
<span class="line"><span style="color:#22863A">"""</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">executemany</span><span style="color:#212121">(INSERT, [book </span><span style="color:#D32F2F">|</span><span style="color:#212121"> {</span><span style="color:#22863A">"seen_at"</span><span style="color:#212121">: now} </span><span style="color:#D32F2F">for</span><span style="color:#212121"> book </span><span style="color:#D32F2F">in</span><span style="color:#212121"> books])</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">storing_in_sqlite</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="71" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="71" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="sql-injection">SQL Injection</h1>
<ul>
<li>The database is not the only thing that reads the string :
<ul>
<li>A title containing an apostrophe ends the quoted value early</li>
<li>Anything after it is executed as SQL</li>
</ul>
</li>
<li>One book on the page proves it :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>title = "The Bachelor Girl's Guide to Murder"</span></span>
<span class="line"><span></span></span>
<span class="line"><span>f"SELECT ... WHERE title = '{title}'"   sqlite3.OperationalError: near "s"</span></span>
<span class="line"><span>"SELECT ... WHERE title = ?", (title,)  found 1 row</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>The parameterised form is also faster, because the query is reused</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="72" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="72" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="upsert">Upsert</h1>
<ul>
<li>A scrape that only works the first time is not finished :
<ul>
<li>The job will be re-run, after a crash, or every night</li>
</ul>
</li>
<li><code>INSERT ... ON CONFLICT DO UPDATE</code> is one statement for both cases :
<ul>
<li><code>excluded</code> is the row that was about to be inserted</li>
<li>Columns left out of the <code>SET</code> keep the value they had</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">INSERT INTO</span><span style="color:#24292EFF"> books (title, price_gbp, </span><span style="color:#D32F2F">url</span><span style="color:#24292EFF">, first_seen, last_seen)</span></span>
<span class="line"><span style="color:#D32F2F">VALUES</span><span style="color:#24292EFF"> (:title, :price_gbp, :</span><span style="color:#D32F2F">url</span><span style="color:#24292EFF">, :seen_at, :seen_at)</span></span>
<span class="line"><span style="color:#D32F2F">ON</span><span style="color:#24292EFF"> CONFLICT(</span><span style="color:#D32F2F">url</span><span style="color:#24292EFF">) DO </span><span style="color:#D32F2F">UPDATE</span><span style="color:#D32F2F"> SET</span></span>
<span class="line"><span style="color:#24292EFF">    price_gbp </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> excluded.price_gbp,</span></span>
<span class="line"><span style="color:#24292EFF">    last_seen </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> excluded.last_seen</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">upsert</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="73" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="73" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="scrape-pipeline">Scrape Pipeline</h1>
<ul>
<li>One script, read top to bottom, in four labelled sections :
<ul>
<li>Fetch the page, parse the records, store them, report on the table</li>
</ul>
</li>
<li>Nothing is wrapped in a function it does not need :
<ul>
<li>The whole file is the pipeline, and the order on screen is the order it runs</li>
</ul>
</li>
<li>Running it a second time changes <code>last_seen</code> and nothing else</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> demos/04-web-scraping/10_scrape_pipeline.py</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">scrape_pipeline</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="74" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="74" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="robotstxt-and-rate-limiting">robots.txt and Rate Limiting</h1>
<ul>
<li><code>robots.txt</code> describes which paths a crawler may request.</li>
<li><code>RobotFileParser</code> reads the rules; this example uses saved text.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> urllib</span><span style="color:#212121">.</span><span style="color:#24292EFF">robotparser </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> RobotFileParser</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">ROBOTS </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "User-agent: *\nDisallow: /basket/\nCrawl-delay: 5\n"</span></span>
<span class="line"><span style="color:#24292EFF">AGENT </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "TrainingDemo/1.0"</span></span>
<span class="line"><span style="color:#24292EFF">url </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "https://books.toscrape.com/basket/"</span></span>
<span class="line"><span style="color:#24292EFF">rules </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> RobotFileParser</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">rules</span><span style="color:#212121">.</span><span style="color:#6F42C1">parse</span><span style="color:#212121">(ROBOTS.</span><span style="color:#6F42C1">splitlines</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rules.</span><span style="color:#6F42C1">can_fetch</span><span style="color:#212121">(AGENT, url))</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rules.</span><span style="color:#6F42C1">crawl_delay</span><span style="color:#212121">(AGENT))</span><span style="color:#4a9c59">  # 5</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Identify the scraper with a <code>User-Agent</code> and contact details.</li>
<li>Respect the site's rules, pause between requests and reuse cached pages.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">being_a_good_citizen</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="75" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="75" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="scraping-versus-an-api">Scraping versus an API</h1>
<ul>
<li>Scraping is the last resort, not the first :
<ul>
<li>An API returns JSON that does not change when the design does</li>
<li>A CSV or data export is better still, and often already there</li>
</ul>
</li>
<li>Signs it is time to stop :
<ul>
<li>The page builds itself with JavaScript, so the markup is empty</li>
<li>There is a login, a CAPTCHA, or a rate limit aimed at you</li>
<li>The markup changes weekly and the parser breaks weekly</li>
</ul>
</li>
<li>Look for <code>/api/</code>, an RSS feed, or a documented download first</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="76" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="76" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="database-handover">Database Handover</h1>
<ul>
<li>The database is the handover point :
<ul>
<li>Pandas reads it back with <code>read_sql</code></li>
<li>A GUI can put a window on the same table</li>
</ul>
</li>
<li>A checked in <code>.sql</code> file rebuilds it without the scraper :
<ul>
<li>So the later blocks work even if nothing was ever scraped</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">seed </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Path</span><span style="color:#212121">(</span><span style="color:#22863A">"data/books-seed.sql"</span><span style="color:#212121">).</span><span style="color:#6F42C1">read_text</span><span style="color:#212121">(encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">executescript</span><span style="color:#212121">(seed)</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT title, price_gbp FROM books ORDER BY price_gbp DESC"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">rebuilding_from_seed</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="77" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="77" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="summary--web-scraping">Summary : Web Scraping</h1>
<ul>
<li>Fetch, parse and store live in separate functions</li>
<li>Every request has a timeout and a <code>User-Agent</code></li>
<li>Parsing is a separate step, so it can be re-run without re-fetching</li>
<li>Values are converted at the parse step, not at the database</li>
<li>Inserts are parameterised, and the re-run is an upsert</li>
<li>The pace respects <code>robots.txt</code>, and the log says who you are</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="78" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="78" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10"><div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>Course Schedule</a></div>

<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="sqlalchemy">SQLAlchemy</h1>
<ul>
<li>The scraping module talked to SQLite with <code>sqlite3</code> :
<ul>
<li>Which is the driver, and drivers are database-specific</li>
</ul>
</li>
<li>SQLAlchemy sits above the driver :
<ul>
<li>One way of working, whichever database is underneath</li>
</ul>
</li>
<li>It has two halves, and both are useful :
<ul>
<li><code>Core</code>, which builds SQL out of Python objects</li>
<li>The <code>ORM</code>, which maps rows onto classes</li>
</ul>
</li>
<li>Nothing here replaces knowing SQL :
<ul>
<li>It repays knowing SQL, which is the point</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="80" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="80" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="sqlite3-and-sqlalchemy">sqlite3 and SQLAlchemy</h1>
<ul>
<li>The same call, against a different database :
<ul>
<li>Change the URL, not the program</li>
</ul>
</li>
<li>Parameters have names instead of positions</li>
<li>Rows can come back as objects rather than tuples</li>
<li>The query is a value you can build up, print and reuse</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">engine </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_engine</span><span style="color:#212121">(</span><span style="color:#22863A">"sqlite:///:memory:"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">begin</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    found </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#6F42C1">        text</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT title FROM book WHERE price > :floor"</span><span style="color:#212121">), {</span><span style="color:#22863A">"floor"</span><span style="color:#212121">: </span><span style="color:#1976D2">25</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#212121">    )</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">why_a_layer</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="81" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="81" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="engine-and-url">Engine and URL</h1>
<ul>
<li>An engine is a factory and a connection pool :
<ul>
<li>Make one per database, once, and keep it</li>
<li>It does not open a connection until something asks</li>
</ul>
</li>
<li>The URL says everything about where the data lives :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>dialect+driver://user:password@host/database</span></span>
<span class="line"><span></span></span>
<span class="line"><span>sqlite:///:memory:</span></span>
<span class="line"><span>sqlite:///data/library.db</span></span>
<span class="line"><span>postgresql+psycopg://feiko@localhost/inventory</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>SQLite needs no server, so the middle of the URL is empty</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">engine_and_connection</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="82" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="82" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="begin-and-connect">begin and connect</h1>
<ul>
<li><code>engine.begin()</code> opens a transaction :
<ul>
<li>Commits when the module ends, rolls back if it raises</li>
</ul>
</li>
<li><code>engine.connect()</code> gives you a connection and nothing else :
<ul>
<li>Anything written is discarded unless you commit it yourself</li>
</ul>
</li>
<li>Prefer <code>begin()</code> for anything that writes</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">begin</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#6F42C1">text</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO note VALUES ('kept')"</span><span style="color:#212121">))</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#6F42C1">text</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT body FROM note"</span><span style="color:#212121">)).</span><span style="color:#6F42C1">scalars</span><span style="color:#212121">().</span><span style="color:#6F42C1">all</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="83" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="83" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="bound-parameters">Bound Parameters</h1>
<ul>
<li>The parameter is sent separately from the statement :
<ul>
<li>The database never parses the value as SQL</li>
</ul>
</li>
<li>Named, so there are no question marks to count</li>
<li>The same lesson as the scraping module, one layer up</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">statement </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> text</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT title FROM book WHERE rating >= :floor"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(statement, {</span><span style="color:#22863A">"floor"</span><span style="color:#212121">: </span><span style="color:#1976D2">3</span><span style="color:#212121">})</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A formatted query breaks on ordinary data long before it is attacked :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>SELECT rating FROM book WHERE title = 'The Widow's Tale'</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">parameters</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="84" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="84" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="table-definitions">Table Definitions</h1>
<ul>
<li>Core describes a table as a Python object :
<ul>
<li>Columns, types, constraints, all as values</li>
</ul>
</li>
<li><code>MetaData</code> is the catalogue every table registers in</li>
<li><code>create_all()</code> issues <code>CREATE TABLE</code> for whatever is missing</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">book </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Table</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#22863A">    "book"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">    metadata,</span></span>
<span class="line"><span style="color:#6F42C1">    Column</span><span style="color:#212121">(</span><span style="color:#22863A">"id"</span><span style="color:#212121">, Integer, primary_key</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#6F42C1">    Column</span><span style="color:#212121">(</span><span style="color:#22863A">"title"</span><span style="color:#212121">, </span><span style="color:#6F42C1">String</span><span style="color:#212121">(</span><span style="color:#1976D2">200</span><span style="color:#212121">), nullable</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#6F42C1">    Column</span><span style="color:#212121">(</span><span style="color:#22863A">"price_gbp"</span><span style="color:#212121">, Float, nullable</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">describing_a_table</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="85" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="85" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="core-queries">Core Queries</h1>
<ul>
<li><code>select()</code> returns something you can hold, print and add to :
<ul>
<li><code>.where()</code>, <code>.order_by()</code>, <code>.limit()</code> each return a new query</li>
</ul>
</li>
<li>Column access is <code>table.c.name</code></li>
<li>Printing the query shows the SQL it will send</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">statement </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> select</span><span style="color:#212121">(book.c.title, book.c.price_gbp).</span><span style="color:#6F42C1">where</span><span style="color:#212121">(book.c.rating </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(statement)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> price </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(statement):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(title, price)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">core_insert_and_select</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="86" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="86" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="declarative-models">Declarative Models</h1>
<ul>
<li>The ORM maps a class onto a table :
<ul>
<li>One class, one table, one instance per row</li>
</ul>
</li>
<li>Every model inherits from a <code>DeclarativeBase</code> :
<ul>
<li>Which is block one doing real work</li>
</ul>
</li>
<li><code>Mapped[int]</code> is an ordinary annotation, so editors understand it</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Book</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Base</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    __tablename__ </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "book"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">    id</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#1976D2">int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> mapped_column</span><span style="color:#212121">(Integer, primary_key</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    title</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> mapped_column</span><span style="color:#212121">(</span><span style="color:#6F42C1">String</span><span style="color:#212121">(</span><span style="color:#1976D2">200</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#24292EFF">    price_gbp</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#1976D2">float</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> mapped_column</span><span style="color:#212121">(Float)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">declarative_model</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="87" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="87" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="session">Session</h1>
<ul>
<li>A <code>Session</code> is a unit of work, not a connection :
<ul>
<li>Add objects to it, then commit once</li>
</ul>
</li>
<li>Ids appear after the commit, because the database assigns them</li>
<li>The session tracks what it loaded :
<ul>
<li>Change an attribute and there is no <code>UPDATE</code> to write</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> Session</span><span style="color:#212121">(engine)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> session</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_all</span><span style="color:#212121">([first, second])</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">    first</span><span style="color:#212121">.</span><span style="color:#24292EFF">price_gbp </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 41.99</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">session_and_persistence</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="88" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="88" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="orm-queries">ORM Queries</h1>
<ul>
<li>The same <code>select()</code>, but the rows are objects</li>
<li><code>scalars()</code> unwraps a one-column result into the thing itself</li>
<li>Comparisons build SQL rather than returning a boolean :
<ul>
<li><code>Book.rating &gt;= 4</code> is a fragment of a <code>WHERE</code> clause</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">found </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> session</span><span style="color:#212121">.</span><span style="color:#6F42C1">scalars</span><span style="color:#212121">(</span><span style="color:#6F42C1">select</span><span style="color:#212121">(Book).</span><span style="color:#6F42C1">where</span><span style="color:#212121">(Book.rating </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 4</span><span style="color:#212121">)).</span><span style="color:#6F42C1">all</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">by_rating </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> select</span><span style="color:#212121">(Book.rating, func.</span><span style="color:#6F42C1">count</span><span style="color:#212121">(), func.</span><span style="color:#6F42C1">avg</span><span style="color:#212121">(Book.price_gbp)).</span><span style="color:#6F42C1">group_by</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    Book.rating</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">orm_queries</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="89" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="89" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="relationships">Relationships</h1>
<ul>
<li>A foreign key becomes an attribute on both sides :
<ul>
<li><code>category.books</code> is a list, <code>book.category</code> is an object</li>
</ul>
</li>
<li><code>back_populates</code> names the attribute pointing the other way</li>
<li>Appending to the list is what creates the link :
<ul>
<li>No ids written by hand, and the insert order is worked out</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Category</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Base</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    books</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#24292EFF">list</span><span style="color:#212121">[</span><span style="color:#24292EFF">Book</span><span style="color:#212121">]]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> relationship</span><span style="color:#212121">(back_populates</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"category"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">mystery</span><span style="color:#212121">.</span><span style="color:#24292EFF">books</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#6F42C1">Book</span><span style="color:#212121">(title</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Sharp Objects"</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#24292EFF">session</span><span style="color:#212121">.</span><span style="color:#6F42C1">add</span><span style="color:#212121">(mystery)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">relationships</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="90" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="90" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="joins-and-relationships">Joins and Relationships</h1>
<div class="two-col">
<div>
<ul>
<li>As a join :
<ul>
<li>One query</li>
<li>Explicit, and familiar</li>
<li>What the database does anyway</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">select</span><span style="color:#212121">(Book.title, Category.name).</span><span style="color:#6F42C1">join</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    Book.category</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
</div>
<div>
<ul>
<li>As an attribute :
<ul>
<li>Reads better</li>
<li>Issues a query per object</li>
<li>Easy to do by accident</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> book </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> session</span><span style="color:#212121">.</span><span style="color:#6F42C1">scalars</span><span style="color:#212121">(</span><span style="color:#6F42C1">select</span><span style="color:#212121">(Book)):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(book.category.name)</span></span>
<span class="line"></span></code></pre>
</div>
</div>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">joins</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="sqlalchemy-and-pandas">SQLAlchemy and Pandas</h1>
<ul>
<li><code>read_sql</code> takes an engine anywhere it takes a connection :
<ul>
<li>So the portable half comes along for free</li>
</ul>
</li>
<li>The grouping can happen in either place :
<ul>
<li>In the database, or in the DataFrame afterwards</li>
</ul>
</li>
<li>For twenty rows it makes no difference :
<ul>
<li>For twenty million, let the database do it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">engine </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> create_engine</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"sqlite:///</span><span style="color:#1976D2">{</span><span style="color:#212121">DB</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">frame </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">read_sql</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT title, price_gbp, rating FROM books"</span><span style="color:#212121">, engine)</span></span>

<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="text-core-and-orm">text, Core and ORM</h1>
<ul>
<li><code>text()</code> when the SQL is the clearest way to say it :
<ul>
<li>Or when it is already written and correct</li>
</ul>
</li>
<li><code>Core</code> when the query is assembled from parts, or must be portable</li>
<li>The <code>ORM</code> when rows are things the program keeps hold of and changes</li>
<li>These are not levels, and not a progression :
<ul>
<li>Plenty of good programs use all three in one file</li>
</ul>
</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo13</code><br><code class="pill-demo pill-desc">core_or_orm</code></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="94" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="94" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="168" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="summary--sqlalchemy">Summary : SQLAlchemy</h1>
<ul>
<li>SQLAlchemy sits above the driver, not above SQL</li>
<li>An engine is made once and carries the URL :
<ul>
<li>Use <code>begin()</code> for anything that writes</li>
</ul>
</li>
<li>Core builds queries as objects you can print and compose</li>
<li>The ORM maps a class onto a table, with a <code>Session</code> as the unit of work</li>
<li>Relationships turn a foreign key into an attribute on both sides</li>
<li>Reflection reads a schema somebody else designed</li>
<li>An engine drops straight into <code>pandas.read_sql</code></li>
</ul>
</section>
