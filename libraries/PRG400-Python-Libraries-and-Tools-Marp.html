<h1 id="choosing-topics">Choosing Topics</h1>
<ul>
<li>The optional modules are selected with the trainer to suit the group.</li>
<li>Command-line programs and subprocesses support scripting and automation.</li>
<li>The modern toolbelt covers progress displays, formatted output and HTTP.</li>
<li>Web scraping and SQLAlchemy cover collecting and storing records.</li>
<li>NumPy and pandas cover arrays, tables and reports.</li>
<li>GUI toolkits introduce desktop windows.</li>
<li>Inheritance previews Advanced Python and can be skipped.</li>
<li>The supplied data and database seed let later modules run independently.</li>
</ul>
</section>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="inheritance">Inheritance</h1>
<ul>
<li>A subclass inherits behaviour from a base class</li>
<li>Related objects can share an interface while supplying different methods</li>
<li><code>Mage</code>, <code>Warrior</code> and <code>Priest</code> specialise <code>Character</code></li>
<li>Health, mana and rage values here are simplified teaching data</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="5" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="5" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="duplicated-code">Duplicated Code</h1>
<ul>
<li>Both classes initialise a name and health</li>
<li>A change to shared behaviour requires editing both implementations</li>
<li>A base class can hold that common behaviour</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Mage</span><span style="color:#24292EFF">:</span></span>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="cost-of-duplication">Cost of Duplication</h1>
<ul>
<li>Repeated logic can diverge when one copy changes</li>
<li>Inheritance puts shared behaviour in one implementation</li>
<li>Subclasses retain their specific state and methods</li>
</ul>
</section>

<h1 id="base-classes-and-subclasses">Base Classes and Subclasses</h1>

<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Character</span><span style="color:#24292EFF">:</span></span>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="constructor-chaining">Constructor Chaining</h1>
<ul>
<li>A subclass initialiser can call <code>super().__init__</code></li>
<li>The base initialiser stores shared attributes on the same object</li>

</ul>

<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> mana</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 100</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#1976D2">        super</span><span style="color:#212121">().</span><span style="color:#6F42C1">__init__</span><span style="color:#212121">(name)</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">mana</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> mana</span></span>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="overriding-methods">Overriding Methods</h1>
<ul>
<li>Defining the same method name in a subclass overrides the base method</li>
<li>Method lookup starts at the instance's class and follows its method resolution order</li>
<li><code>Mage.attack</code> is found before <code>Character.attack</code></li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> attack</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#D32F2F"> f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#24292EFF">self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span><span style="color:#1976D2">}</span><span style="color:#22863A"> casts Frostbolt"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">jaina </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Mage</span><span style="color:#212121">(</span><span style="color:#22863A">"Jaina"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(jaina.</span><span style="color:#6F42C1">attack</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(Character.</span><span style="color:#6F42C1">attack</span><span style="color:#212121">(jaina))</span></span>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>
<h1 id="extending-with-super">Extending with super</h1>
<ul>
<li><code>super()</code> delegates according to the method resolution order</li>
<li>An initialiser can extend shared setup without copying it</li>
<li>Both initialisers receive the same <code>self</code> object</li>
</ul>

<span class="line"><span style="color:#D32F2F">    def</span><span style="color:#6F42C1"> __init__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#212121">,</span><span style="color:#FF9800"> name</span><span style="color:#212121">:</span><span style="color:#1976D2"> str</span><span style="color:#212121">,</span><span style="color:#FF9800"> mana</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> =</span><span style="color:#1976D2"> 100</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#1976D2">        super</span><span style="color:#212121">().</span><span style="color:#6F42C1">__init__</span><span style="color:#212121">(name)</span></span>
<span class="line"><span style="color:#24292EFF">        self</span><span style="color:#212121">.</span><span style="color:#24292EFF">mana</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> mana</span></span>

</section>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">isinstance</span><span style="color:#212121">(jaina, Character))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">issubclass</span><span style="color:#212121">(Mage, Character))</span></span>

<div class="ml-eyebrow"><a href="#3"><span class="ml-tag">python</span>Inheritance</a></div>

<ul>

<li><code>__repr__</code> supplies a debugging representation</li>

</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> __str__</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">self</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#D32F2F">        return</span><span style="color:#24292EFF"> self</span><span style="color:#212121">.</span><span style="color:#24292EFF">name</span></span>

<h1 id="sysargv">sys.argv</h1>

<li><code>sys.argv[0]</code> is the script name</li>
<li>The remaining entries are strings supplied by the caller</li>

</ul>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(line.</span><span style="color:#6F42C1">split</span><span style="color:#212121">(maxsplit</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">4</span><span style="color:#212121">))</span></span>

<li>Missing values, invalid conversions and unknown options need error handling</li>

<span class="line"><span style="color:#24292EFF">            index </span><span style="color:#D32F2F">+=</span><span style="color:#1976D2"> 1</span></span>
<span class="line"><span style="color:#24292EFF">            limit </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> int</span><span style="color:#212121">(argv[index])</span></span>

<h1 id="argumentparser">ArgumentParser</h1>

<li>A duration in seconds can be formatted as minutes and seconds</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> format_duration</span><span style="color:#24292EFF">(</span><span style="color:#FF9800">seconds</span><span style="color:#212121">:</span><span style="color:#1976D2"> int</span><span style="color:#24292EFF">) </span><span style="color:#212121">-></span><span style="color:#1976D2"> str</span><span style="color:#24292EFF">:</span></span>

<h1 id="standard-output-and-standard-error">Standard Output and Standard Error</h1>

<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> load</span><span style="color:#212121">(path):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(row[</span><span style="color:#22863A">"title"</span><span style="color:#212121">])</span></span>

<ul>
<li><code>tqdm</code> wraps an iterable without changing its values</li>

<li>Pass <code>total=</code> when the iterable has no known length</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> _track </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(tracks, desc</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Converting"</span><span style="color:#212121">, unit</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"track"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#24292EFF">    time</span><span style="color:#212121">.</span><span style="color:#6F42C1">sleep</span><span style="color:#212121">(</span><span style="color:#1976D2">0.01</span><span style="color:#212121">)</span><span style="color:#4a9c59">  # Simulated conversion; no audio files are read.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"Converted </span><span style="color:#1976D2">{</span><span style="color:#6F42C1">len</span><span style="color:#212121">(tracks)</span><span style="color:#1976D2">}</span><span style="color:#22863A"> track records"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> (track </span><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> track </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> tracks)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> _track </span><span style="color:#D32F2F">in</span><span style="color:#6F42C1"> tqdm</span><span style="color:#212121">(rows, total</span><span style="color:#D32F2F">=</span><span style="color:#6F42C1">len</span><span style="color:#212121">(tracks), desc</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"From a generator"</span><span style="color:#212121">):</span></span>

<span class="line"><span style="color:#24292EFF">        time</span><span style="color:#212121">.</span><span style="color:#6F42C1">sleep</span><span style="color:#212121">(</span><span style="color:#1976D2">0.02</span><span style="color:#212121">)</span></span>

<span class="line"><span style="color:#24292EFF">        time</span><span style="color:#212121">.</span><span style="color:#6F42C1">sleep</span><span style="color:#212121">(</span><span style="color:#1976D2">0.01</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">        bar</span><span style="color:#212121">.</span><span style="color:#6F42C1">update</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">        bar</span><span style="color:#212121">.</span><span style="color:#6F42C1">set_postfix</span><span style="color:#212121">(title</span><span style="color:#D32F2F">=</span><span style="color:#212121">track[</span><span style="color:#22863A">"title"</span><span style="color:#212121">][:</span><span style="color:#1976D2">12</span><span style="color:#212121">])</span></span>

<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="web-scraping">Web Scraping</h1>
<ul>
<li>Every scraper is the same three steps, in the same order :
<ul>
<li>Fetch, parse, store</li>
</ul>
</li>
<li>Each stage has an independent responsibility :
<ul>
<li>Each step can be tested and re-run without the others</li>
<li>Only the middle step knows anything about HTML</li>
</ul>

</ul>

<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="fetching-a-page">Fetching a Page</h1>
<ul>
<li><code>requests.get</code> returns a response object, not a string :
<ul>
<li><code>.text</code> is the decoded body, <code>.content</code> is the raw bytes</li>
</ul>
</li>
<li>Two arguments matter far more than the rest :
<ul>
<li><code>timeout</code>, because there is no default and a hung server hangs you</li>
<li><code>headers</code>, to say which program is asking</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">response </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> requests</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(URL, timeout</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">10</span><span style="color:#212121">, headers</span><span style="color:#D32F2F">=</span><span style="color:#212121">{</span><span style="color:#22863A">"User-Agent"</span><span style="color:#212121">: </span><span style="color:#22863A">"SpiralTrain-Day4/1.0"</span><span style="color:#212121">})</span></span>
<span class="line"></span></code></pre>

</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="60" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="60" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="status-codes-and-timeouts">Status Codes and Timeouts</h1>
<ul>
<li>The status code is the first thing to check :
<ul>
<li><code>200</code> fine, <code>301</code> and <code>302</code> redirects that <code>requests</code> follows for you</li>
<li><code>404</code> gone, <code>403</code> refused, <code>429</code> slow down, <code>5xx</code> their problem</li>
</ul>
</li>
<li><code>raise_for_status</code> turns any <code>4xx</code> or <code>5xx</code> into an exception :
<ul>
<li>Nothing happens for <code>2xx</code> and <code>3xx</code>, so it is safe to always call</li>
</ul>
</li>
<li><code>response.encoding</code> can be set when a page is decoded wrongly</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>  200 OK                    passes, response.ok is True</span></span>
<span class="line"><span>  404 Not Found             raises HTTPError</span></span>
<span class="line"><span>  429 Too Many Requests     raises HTTPError</span></span>
<span class="line"><span></span></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="61" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="61" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="beautifulsoup">BeautifulSoup</h1>
<ul>
<li><code>BeautifulSoup</code> takes the markup and the name of a parser :
<ul>
<li><code>&quot;lxml&quot;</code> is fast and forgiving, and is installed for this course</li>
<li><code>&quot;html.parser&quot;</code> is built into Python and needs nothing extra</li>
</ul>
</li>
<li>The result is a tree you can search, not a string :
<ul>
<li>Real pages are malformed, and the parser quietly repairs them</li>
</ul>
</li>
<li><code>response.text</code> is already decoded, so it goes straight in :
<ul>
<li>The server declares the encoding, and a price of £51.77 proves it worked</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">soup </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> BeautifulSoup</span><span style="color:#212121">(html, </span><span style="color:#22863A">"lxml"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#4a9c59"># Page titles are full of markup whitespace, so collapse it rather than</span></span>
<span class="line"><span style="color:#4a9c59"># trusting what the page hands you.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">" "</span><span style="color:#212121">.</span><span style="color:#6F42C1">join</span><span style="color:#212121">(soup.title.text.</span><span style="color:#6F42C1">split</span><span style="color:#212121">()))</span></span>
<span class="line"></span></code></pre>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="62" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="62" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="find-and-find_all">find and find_all</h1>
<ul>
<li><code>find</code> returns the first match, or <code>None</code> :
<ul>
<li><code>find_all</code> returns a list, which may be empty</li>
</ul>
</li>
<li>Both take a tag name, and keyword arguments for attributes :
<ul>
<li><code>class_</code> has the underscore because <code>class</code> is a Python keyword</li>
</ul>
</li>
<li>Searching a tag searches inside that tag only</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> article </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_all</span><span style="color:#212121">(</span><span style="color:#22863A">"article"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"product_pod"</span><span style="color:#212121">):</span></span>

<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#24292EFF"> title </span><span style="color:#D32F2F">==</span><span style="color:#22863A"> "Sharp Objects"</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">        price </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> article</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"price_color"</span><span style="color:#212121">).</span><span style="color:#24292EFF">text</span></span>
<span class="line"><span style="color:#4a9c59">        # The page spells the rating as a class name, not a number: markup is</span></span>
<span class="line"><span style="color:#4a9c59">        # written for a browser, not for you.</span></span>
<span class="line"><span style="color:#24292EFF">        stars </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> article</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"star-rating"</span><span style="color:#212121">)</span><span style="color:#24292EFF">[</span><span style="color:#22863A">"class"</span><span style="color:#24292EFF">][</span><span style="color:#1976D2">1</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">RATINGS[stars]</span><span style="color:#1976D2">}</span><span style="color:#1976D2">  {</span><span style="color:#212121">price</span><span style="color:#D32F2F">:>8</span><span style="color:#1976D2">}</span><span style="color:#1976D2">  {</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="63" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="63" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="text-and-attributes">Text and Attributes</h1>
<ul>
<li><code>.text</code> collects every string inside a tag :
<ul>
<li><code>get_text(strip=True)</code> is the same thing with the whitespace tidied</li>
</ul>
</li>
<li>Attributes are read like a dictionary :
<ul>
<li><code>tag[&quot;href&quot;]</code> raises <code>KeyError</code> when the attribute is absent</li>
<li><code>tag.get(&quot;href&quot;)</code> returns <code>None</code>, or a default you supply</li>
</ul>
</li>
<li><code>class</code> comes back as a list, because an element can carry several</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">stars </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"star-rating"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(stars[</span><span style="color:#22863A">"class"</span><span style="color:#212121">])</span><span style="color:#4a9c59">              # ['star-rating', 'Four']</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(stars.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span><span style="color:#22863A">"data-value"</span><span style="color:#212121">))</span><span style="color:#4a9c59">     # None, the attribute is not there</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="64" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="64" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="css-selectors">CSS Selectors</h1>
<ul>
<li><code>select</code> and <code>select_one</code> take one selector string :
<ul>
<li>The same language a stylesheet or the browser inspector uses</li>
</ul>
</li>
<li>A whole path through the document fits in one argument :
<ul>
<li><code>article.product_pod h3 a</code> means a inside h3 inside that article</li>
<li><code>p.star-rating.Four</code> means both classes on one element</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(soup.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"article.product_pod h3 a"</span><span style="color:#212121">)), </span><span style="color:#22863A">"title links"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(soup.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"article.product_pod h3 a"</span><span style="color:#212121">)[</span><span style="color:#1976D2">1</span><span style="color:#212121">][</span><span style="color:#22863A">"title"</span><span style="color:#212121">])</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(soup.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"ul.breadcrumb li.active"</span><span style="color:#212121">).text.</span><span style="color:#6F42C1">strip</span><span style="color:#212121">())</span></span>
<span class="line"></span>
<span class="line"><span style="color:#4a9c59"># Two class names on one element: both, with no space between them.</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(soup.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"p.star-rating.Four"</span><span style="color:#212121">)), </span><span style="color:#22863A">"books rated four"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#6F42C1">len</span><span style="color:#212121">(soup.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"div.image_container > a > img[alt]"</span><span style="color:#212121">)), </span><span style="color:#22863A">"thumbnails"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">css_selectors</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="65" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="65" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="navigating-the-tree">Navigating the Tree</h1>
<ul>
<li>Start at something easy to find and move from there :
<ul>
<li><code>.parent</code> is one step up, <code>.find_parent(&quot;article&quot;)</code> goes up until it matches</li>
<li><code>.find_next_sibling(&quot;p&quot;)</code> skips the whitespace between tags</li>
</ul>
</li>
<li>Useful when the thing you want has no class of its own :
<ul>
<li>A price is easy to find, the module it belongs to is upward from it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">price </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"p.price_color"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(price.parent.name)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">pod </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> price</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_parent</span><span style="color:#212121">(</span><span style="color:#22863A">"article"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(pod.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"h3 a"</span><span style="color:#212121">)[</span><span style="color:#22863A">"title"</span><span style="color:#212121">])</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(price.</span><span style="color:#6F42C1">find_next_sibling</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">).</span><span style="color:#6F42C1">get_text</span><span style="color:#212121">(strip</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">walking_the_tree</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="66" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="66" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="missing-elements">Missing Elements</h1>
<ul>
<li>Real pages are inconsistent, and a scraper meets all of it :
<ul>
<li>The attribute missing on one row in five hundred</li>
<li>The module that has no price because the item is sold out</li>
</ul>
</li>
<li>Decide per field what absence means :
<ul>
<li><code>.get(&quot;href&quot;)</code> for optional, square brackets for required</li>
<li>A required field that is missing should fail loudly, not silently</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">url </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> link</span><span style="color:#212121">[</span><span style="color:#22863A">"href"</span><span style="color:#212121">]</span><span style="color:#4a9c59">                        # required, so let it raise</span></span>
<span class="line"><span style="color:#24292EFF">cover </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> image</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">(</span><span style="color:#22863A">"data-src"</span><span style="color:#212121">, </span><span style="color:#22863A">""</span><span style="color:#212121">)</span><span style="color:#4a9c59">         # optional, so a default is fine</span></span>
<span class="line"><span style="color:#D32F2F">if</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">find</span><span style="color:#212121">(</span><span style="color:#22863A">"p"</span><span style="color:#212121">, class_</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"price_color"</span><span style="color:#212121">)</span><span style="color:#D32F2F"> is</span><span style="color:#1976D2"> None</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    continue</span><span style="color:#4a9c59">                              # no price, no record</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="67" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="67" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="html-tables">HTML Tables</h1>
<ul>
<li>A table is the easiest markup to scrape, and the most common :
<ul>
<li>One header row gives the keys, one body row gives the values</li>
</ul>
</li>
<li><code>zip(headers, cells, strict=True)</code> refuses to guess :
<ul>
<li>A short row raises instead of silently shifting every column</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">headers </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [cell</span><span style="color:#212121">.</span><span style="color:#6F42C1">get_text</span><span style="color:#212121">(strip</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> cell </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> table</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"tr th"</span><span style="color:#212121">)</span><span style="color:#24292EFF">]</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> table</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"tbody tr"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#24292EFF">    cells </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> [cell</span><span style="color:#212121">.</span><span style="color:#6F42C1">get_text</span><span style="color:#212121">(strip</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span><span style="color:#D32F2F"> for</span><span style="color:#24292EFF"> cell </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> row</span><span style="color:#212121">.</span><span style="color:#6F42C1">find_all</span><span style="color:#212121">(</span><span style="color:#22863A">"td"</span><span style="color:#212121">)</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#24292EFF">    rows</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#1976D2">dict</span><span style="color:#212121">(</span><span style="color:#6F42C1">zip</span><span style="color:#212121">(headers, cells, strict</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">parsing_a_table</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="68" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="68" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="extracting-records">Extracting Records</h1>
<ul>
<li>One function, one page, a list of dictionaries out :
<ul>
<li>After this line the markup has stopped mattering</li>
</ul>
</li>
<li>Convert while parsing, not later :
<ul>
<li>A price becomes a <code>float</code>, a rating becomes an <code>int</code></li>
<li>A relative link becomes an absolute one, with <code>urljoin</code></li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">soup </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> BeautifulSoup</span><span style="color:#212121">(html, </span><span style="color:#22863A">"lxml"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">books </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> []</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> pod </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> soup</span><span style="color:#212121">.</span><span style="color:#6F42C1">select</span><span style="color:#212121">(</span><span style="color:#22863A">"article.product_pod"</span><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#24292EFF">    link </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pod</span><span style="color:#212121">.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"h3 a"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    books</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">({</span></span>
<span class="line"><span style="color:#22863A">        "title"</span><span style="color:#212121">: link[</span><span style="color:#22863A">"title"</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#22863A">        "price_gbp"</span><span style="color:#212121">: </span><span style="color:#1976D2">float</span><span style="color:#212121">(re.</span><span style="color:#6F42C1">sub</span><span style="color:#212121">(</span><span style="color:#D32F2F">r</span><span style="color:#22863A">"[</span><span style="color:#D32F2F">^</span><span style="color:#1976D2">\d</span><span style="color:#22863A">.]"</span><span style="color:#212121">, </span><span style="color:#22863A">""</span><span style="color:#212121">, pod.</span><span style="color:#6F42C1">select_one</span><span style="color:#212121">(</span><span style="color:#22863A">"p.price_color"</span><span style="color:#212121">).text)),</span></span>
<span class="line"><span style="color:#22863A">        "url"</span><span style="color:#212121">: </span><span style="color:#6F42C1">urljoin</span><span style="color:#212121">(URL, link[</span><span style="color:#22863A">"href"</span><span style="color:#212121">]),</span></span>
<span class="line"><span style="color:#212121">    })</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">extracting_records</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="69" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="69" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="sqlite-schema">SQLite Schema</h1>
<ul>
<li>The same care as any other schema :
<ul>
<li>One column per field, with a type, and <code>NOT NULL</code> where it is true</li>
<li>A natural key, <code>UNIQUE</code>, so the same page cannot arrive twice</li>
</ul>
</li>
<li><code>first_seen</code> and <code>last_seen</code> make a re-run informative</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">CREATE</span><span style="color:#D32F2F"> TABLE</span><span style="color:#6F42C1"> IF</span><span style="color:#D32F2F"> NOT</span><span style="color:#D32F2F"> EXISTS</span><span style="color:#24292EFF"> books (</span></span>
<span class="line"><span style="color:#24292EFF">    id           </span><span style="color:#D32F2F">INTEGER</span><span style="color:#D32F2F"> PRIMARY KEY</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    title        </span><span style="color:#D32F2F">TEXT</span><span style="color:#D32F2F">    NOT NULL</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    price_gbp    </span><span style="color:#D32F2F">REAL</span><span style="color:#D32F2F">    NOT NULL</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    rating       </span><span style="color:#D32F2F">INTEGER</span><span style="color:#D32F2F"> NOT NULL</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#D32F2F">    url</span><span style="color:#D32F2F">          TEXT</span><span style="color:#D32F2F">    NOT NULL</span><span style="color:#D32F2F"> UNIQUE</span><span style="color:#24292EFF">,</span></span>
<span class="line"><span style="color:#24292EFF">    last_seen    </span><span style="color:#D32F2F">TEXT</span><span style="color:#D32F2F">    NOT NULL</span></span>
<span class="line"><span style="color:#24292EFF">);</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="70" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="70" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="parameterised-inserts">Parameterised Inserts</h1>
<ul>
<li>Placeholders keep the values out of the SQL text :
<ul>
<li><code>?</code> by position, or <code>:name</code> by name</li>
</ul>
</li>
<li>Named placeholders take a dictionary as it is :
<ul>
<li>Which is exactly what the parse step produced</li>
</ul>
</li>
<li><code>executemany</code> sends the whole list in one call</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">conn </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(DB)</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">executescript</span><span style="color:#212121">(SCHEMA)</span></span>
<span class="line"><span style="color:#4a9c59"># Named placeholders take the dictionaries exactly as they already are.</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">executemany</span><span style="color:#212121">(INSERT, books)</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">storing_in_sqlite</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="71" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="71" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="sql-injection">SQL Injection</h1>
<ul>
<li>The database is not the only thing that reads the string :
<ul>
<li>A title containing an apostrophe ends the quoted value early</li>
<li>The following text is parsed as SQL</li>
</ul>
</li>
<li>One book on the page proves it :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>title = "The Bachelor Girl's Guide to Murder"</span></span>
<span class="line"><span></span></span>
<span class="line"><span>f"SELECT ... WHERE title = '{title}'"   sqlite3.OperationalError: near "s"</span></span>
<span class="line"><span>"SELECT ... WHERE title = ?", (title,)  found 1 row</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Parameters keep values separate from the SQL statement</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="72" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="72" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="upsert">Upsert</h1>
<ul>
<li>A scrape that only works the first time is not finished :
<ul>
<li>The job will be re-run, after a crash, or every night</li>
</ul>
</li>
<li><code>INSERT ... ON CONFLICT DO UPDATE</code> is one statement for both cases :
<ul>
<li><code>excluded</code> is the row that was about to be inserted</li>
<li>Columns left out of the <code>SET</code> keep the value they had</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">INSERT INTO</span><span style="color:#24292EFF"> books (title, price_gbp, </span><span style="color:#D32F2F">url</span><span style="color:#24292EFF">, first_seen, last_seen)</span></span>
<span class="line"><span style="color:#D32F2F">VALUES</span><span style="color:#24292EFF"> (:title, :price_gbp, :</span><span style="color:#D32F2F">url</span><span style="color:#24292EFF">, :seen_at, :seen_at)</span></span>
<span class="line"><span style="color:#D32F2F">ON</span><span style="color:#24292EFF"> CONFLICT(</span><span style="color:#D32F2F">url</span><span style="color:#24292EFF">) DO </span><span style="color:#D32F2F">UPDATE</span><span style="color:#D32F2F"> SET</span></span>
<span class="line"><span style="color:#24292EFF">    price_gbp </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> excluded.price_gbp,</span></span>
<span class="line"><span style="color:#24292EFF">    last_seen </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> excluded.last_seen</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">upsert</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="73" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="73" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="scrape-pipeline">Scrape Pipeline</h1>
<ul>
<li>One script, read top to bottom, in four labelled sections :
<ul>
<li>Fetch the page, parse the records, store them, report on the table</li>
</ul>
</li>
<li>Nothing is wrapped in a function it does not need :
<ul>
<li>The whole file is the pipeline, and the order on screen is the order it runs</li>
</ul>
</li>
<li>Running it a second time changes <code>last_seen</code> and nothing else</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">uv</span><span style="color:#2B5581"> run</span><span style="color:#2B5581"> demos/04-web-scraping/10_scrape_pipeline.py</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">scrape_pipeline</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="74" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="74" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="robotstxt-and-rate-limiting">robots.txt and Rate Limiting</h1>
<ul>
<li><code>robots.txt</code> describes which paths a crawler may request.</li>
<li><code>RobotFileParser</code> reads the rules; this example uses saved text.</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">from</span><span style="color:#24292EFF"> urllib</span><span style="color:#212121">.</span><span style="color:#24292EFF">robotparser </span><span style="color:#D32F2F">import</span><span style="color:#24292EFF"> RobotFileParser</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">ROBOTS </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "User-agent: *\nDisallow: /basket/\nCrawl-delay: 5\n"</span></span>
<span class="line"><span style="color:#24292EFF">AGENT </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "TrainingDemo/1.0"</span></span>
<span class="line"><span style="color:#24292EFF">url </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "https://books.toscrape.com/basket/"</span></span>
<span class="line"><span style="color:#24292EFF">rules </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> RobotFileParser</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">rules</span><span style="color:#212121">.</span><span style="color:#6F42C1">parse</span><span style="color:#212121">(ROBOTS.</span><span style="color:#6F42C1">splitlines</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rules.</span><span style="color:#6F42C1">can_fetch</span><span style="color:#212121">(AGENT, url))</span><span style="color:#4a9c59">  # False</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(rules.</span><span style="color:#6F42C1">crawl_delay</span><span style="color:#212121">(AGENT))</span><span style="color:#4a9c59">  # 5</span></span>
<span class="line"></span></code></pre>
<ul>
<li>Identify the scraper with a <code>User-Agent</code> and contact details.</li>
<li>Respect the site's rules, pause between requests and reuse cached pages.</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">being_a_good_citizen</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="75" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="75" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="scraping-versus-an-api">Scraping versus an API</h1>
<ul>
<li>Scraping is the last resort, not the first :
<ul>
<li>An API returns JSON that does not change when the design does</li>
<li>A CSV or data export is better still, and often already there</li>
</ul>
</li>
<li>Signs it is time to stop :
<ul>
<li>The page builds itself with JavaScript, so the markup is empty</li>
<li>There is a login, a CAPTCHA, or a rate limit aimed at you</li>
<li>The markup changes weekly and the parser breaks weekly</li>
</ul>
</li>
<li>Look for <code>/api/</code>, an RSS feed, or a documented download first</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="76" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="76" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="database-handover">Database Handover</h1>
<ul>
<li>The database is the handover point :
<ul>
<li>Pandas reads it back with <code>read_sql</code></li>
<li>A GUI can put a window on the same table</li>
</ul>
</li>
<li>A checked in <code>.sql</code> file rebuilds it without the scraper :
<ul>
<li>So the later blocks work even if nothing was ever scraped</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">conn </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> sqlite3</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">(DB)</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">executescript</span><span style="color:#212121">((DATA </span><span style="color:#D32F2F">/</span><span style="color:#22863A"> "books-seed.sql"</span><span style="color:#212121">).</span><span style="color:#6F42C1">read_text</span><span style="color:#212121">(encoding</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"utf-8"</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#24292EFF">conn</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo12</code><br><code class="pill-demo pill-desc">rebuilding_from_seed</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="77" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="77" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#57"><span class="ml-tag">python</span>Web Scraping</a></div>
<h1 id="summary--web-scraping">Summary : Web Scraping</h1>
<ul>
<li>Fetch, parse and store live in separate functions</li>
<li>Every request has a timeout and a <code>User-Agent</code></li>
<li>Parsing is a separate step, so it can be re-run without re-fetching</li>
<li>Values are converted at the parse step, not at the database</li>
<li>Inserts are parameterised, and the re-run is an upsert</li>
<li>The pace respects <code>robots.txt</code>, and the log says who you are</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="78" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="78" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10"><div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>Course Schedule</a></div>

<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="sqlalchemy">SQLAlchemy</h1>
<ul>
<li>The scraping module talked to SQLite with <code>sqlite3</code> :
<ul>
<li>Which is the driver, and drivers are database-specific</li>
</ul>
</li>
<li>SQLAlchemy sits above the driver :
<ul>
<li>One way of working, whichever database is underneath</li>
</ul>
</li>
<li>It has two halves, and both are useful :
<ul>
<li><code>Core</code>, which builds SQL out of Python objects</li>
<li>The <code>ORM</code>, which maps rows onto classes</li>
</ul>
</li>
<li>Nothing here replaces knowing SQL :
<ul>
<li>It repays knowing SQL, which is the point</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="80" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="80" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="sqlite3-and-sqlalchemy">sqlite3 and SQLAlchemy</h1>
<ul>
<li>The same call, against a different database :
<ul>
<li>Change the URL, not the program</li>
</ul>
</li>
<li>Parameters have names instead of positions</li>
<li>Rows can come back as objects rather than tuples</li>
<li>The query is a value you can build up, print and reuse</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">found </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#6F42C1">    text</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT title, price FROM book WHERE price > :floor"</span><span style="color:#212121">), {</span><span style="color:#22863A">"floor"</span><span style="color:#212121">: </span><span style="color:#1976D2">25</span><span style="color:#212121">}</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"sqlalchemy :"</span><span style="color:#212121">, found.</span><span style="color:#6F42C1">all</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">why_a_layer</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="81" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="81" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="engine-and-url">Engine and URL</h1>
<ul>
<li>An engine is a factory and a connection pool :
<ul>
<li>Make one per database, once, and keep it</li>
<li>It does not open a connection until something asks</li>
</ul>
</li>
<li>The URL says everything about where the data lives :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>dialect+driver://user:password@host/database</span></span>
<span class="line"><span></span></span>
<span class="line"><span>sqlite:///:memory:</span></span>
<span class="line"><span>sqlite:///data/library.db</span></span>
<span class="line"><span>postgresql+psycopg://feiko@localhost/inventory</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>SQLite needs no server, so the middle of the URL is empty</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo02</code><br><code class="pill-demo pill-desc">engine_and_connection</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="82" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="82" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="begin-and-connect">begin and connect</h1>
<ul>
<li><code>engine.begin()</code> opens a transaction :
<ul>
<li>Commits when the module ends, rolls back if it raises</li>
</ul>
</li>
<li><code>engine.connect()</code> gives you a connection and nothing else :
<ul>
<li>Anything written is discarded unless you commit it yourself</li>
</ul>
</li>
<li>Prefer <code>begin()</code> for anything that writes</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">begin</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#6F42C1">text</span><span style="color:#212121">(</span><span style="color:#22863A">"INSERT INTO note VALUES ('kept')"</span><span style="color:#212121">))</span></span>

<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    rows </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span><span style="color:#6F42C1">text</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT body FROM note"</span><span style="color:#212121">)).</span><span style="color:#6F42C1">scalars</span><span style="color:#212121">().</span><span style="color:#6F42C1">all</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
