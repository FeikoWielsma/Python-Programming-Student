</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="83" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="83" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="bound-parameters">Bound Parameters</h1>
<ul>
<li>The parameter is sent separately from the statement :
<ul>
<li>The database never parses the value as SQL</li>
</ul>
</li>
<li>Named, so there are no question marks to count</li>
<li>The scraping module uses the same separation of SQL and values</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">statement </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> text</span><span style="color:#212121">(</span><span style="color:#22863A">"SELECT title FROM book WHERE rating >= :floor"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(statement, {</span><span style="color:#22863A">"floor"</span><span style="color:#212121">: </span><span style="color:#1976D2">3</span><span style="color:#212121">})</span></span>
<span class="line"></span></code></pre>
<ul>
<li>A formatted query breaks on ordinary data long before it is attacked :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>SELECT rating FROM book WHERE title = 'The Widow's Tale'</span></span>
<span class="line"><span></span></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">parameters</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="84" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="84" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="table-definitions">Table Definitions</h1>
<ul>
<li>Core describes a table as a Python object :
<ul>
<li>Columns, types, constraints, all as values</li>
</ul>
</li>
<li><code>MetaData</code> is the catalogue every table registers in</li>
<li><code>create_all()</code> issues <code>CREATE TABLE</code> for whatever is missing</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">book </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> Table</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#22863A">    "book"</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">    metadata,</span></span>
<span class="line"><span style="color:#6F42C1">    Column</span><span style="color:#212121">(</span><span style="color:#22863A">"id"</span><span style="color:#212121">, Integer, primary_key</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#6F42C1">    Column</span><span style="color:#212121">(</span><span style="color:#22863A">"title"</span><span style="color:#212121">, </span><span style="color:#6F42C1">String</span><span style="color:#212121">(</span><span style="color:#1976D2">200</span><span style="color:#212121">), nullable</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#6F42C1">    Column</span><span style="color:#212121">(</span><span style="color:#22863A">"price_gbp"</span><span style="color:#212121">, Float, nullable</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">),</span></span>
<span class="line"><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">describing_a_table</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="85" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="85" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="core-queries">Core Queries</h1>
<ul>
<li><code>select()</code> returns something you can hold, print and add to :
<ul>
<li><code>.where()</code>, <code>.order_by()</code>, <code>.limit()</code> each return a new query</li>
</ul>
</li>
<li>Column access is <code>table.c.name</code></li>
<li>Printing the query shows the SQL it will send</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">statement </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> select</span><span style="color:#212121">(book.c.title, book.c.price_gbp).</span><span style="color:#6F42C1">where</span><span style="color:#212121">(book.c.rating </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(statement)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> engine</span><span style="color:#212121">.</span><span style="color:#6F42C1">connect</span><span style="color:#212121">()</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> price </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(statement):</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#D32F2F">:&#x3C;24</span><span style="color:#1976D2">}</span><span style="color:#1976D2"> {</span><span style="color:#212121">price</span><span style="color:#D32F2F">:>6.2f</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo05</code><br><code class="pill-demo pill-desc">core_insert_and_select</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="86" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="86" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="declarative-models">Declarative Models</h1>
<ul>
<li>The ORM maps a class onto a table :
<ul>
<li>One class, one table, one instance per row</li>
</ul>
</li>
<li>Every model inherits from a <code>DeclarativeBase</code> :
<ul>
<li>Which is block one doing real work</li>
</ul>
</li>
<li><code>Mapped[int]</code> is an ordinary annotation, so editors understand it</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Book</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Base</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    __tablename__ </span><span style="color:#D32F2F">=</span><span style="color:#22863A"> "book"</span></span>
<span class="line"></span>
<span class="line"><span style="color:#6F42C1">    id</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#1976D2">int</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> mapped_column</span><span style="color:#212121">(Integer, primary_key</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    title</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#1976D2">str</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> mapped_column</span><span style="color:#212121">(</span><span style="color:#6F42C1">String</span><span style="color:#212121">(</span><span style="color:#1976D2">200</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#24292EFF">    price_gbp</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#1976D2">float</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> mapped_column</span><span style="color:#212121">(Float)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">declarative_model</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="87" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="87" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="session">Session</h1>
<ul>
<li>
<p>A <code>Session</code> is a unit of work, not a connection :</p>
<ul>
<li>Add objects to it, then commit once</li>
</ul>
</li>
<li>
<p>Generated ids become available when inserts are flushed</p>
</li>
<li>
<p>The session tracks what it loaded :</p>
<ul>
<li>Change an attribute and there is no <code>UPDATE</code> to write</li>
</ul>
</li>
<li>
<p><code>flush()</code> sends pending writes inside the current transaction</p>
</li>
<li>
<p><code>commit()</code> makes the transaction permanent</p>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#6F42C1"> Session</span><span style="color:#212121">(engine)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> session</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">add_all</span><span style="color:#212121">([first, second])</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">flush</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">    first</span><span style="color:#212121">.</span><span style="color:#24292EFF">price_gbp </span><span style="color:#D32F2F">=</span><span style="color:#1976D2"> 41.99</span></span>
<span class="line"><span style="color:#24292EFF">    session</span><span style="color:#212121">.</span><span style="color:#6F42C1">commit</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">session_and_persistence</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="88" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="88" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="orm-queries">ORM Queries</h1>
<ul>
<li>The same <code>select()</code>, but the rows are objects</li>
<li><code>scalars()</code> unwraps a one-column result into the thing itself</li>
<li>Comparisons build SQL rather than returning a boolean :
<ul>
<li><code>Book.rating &gt;= 4</code> is a fragment of a <code>WHERE</code> clause</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> found </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> session</span><span style="color:#212121">.</span><span style="color:#6F42C1">scalars</span><span style="color:#212121">(</span><span style="color:#6F42C1">select</span><span style="color:#212121">(Book).</span><span style="color:#6F42C1">where</span><span style="color:#212121">(Book.rating </span><span style="color:#D32F2F">>=</span><span style="color:#1976D2"> 4</span><span style="color:#212121">)):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(found)</span></span>
<span class="line"></span></code></pre>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> rating</span><span style="color:#212121">,</span><span style="color:#24292EFF"> count</span><span style="color:#212121">,</span><span style="color:#24292EFF"> mean </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> session</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#6F42C1">    select</span><span style="color:#212121">(Book.rating, func.</span><span style="color:#6F42C1">count</span><span style="color:#212121">(), func.</span><span style="color:#6F42C1">avg</span><span style="color:#212121">(Book.price_gbp)).</span><span style="color:#6F42C1">group_by</span><span style="color:#212121">(Book.rating)</span></span>
<span class="line"><span style="color:#212121">):</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">rating</span><span style="color:#1976D2">}</span><span style="color:#22863A">* </span><span style="color:#1976D2">{</span><span style="color:#212121">count</span><span style="color:#D32F2F">:>3</span><span style="color:#1976D2">}</span><span style="color:#1976D2"> {</span><span style="color:#212121">mean</span><span style="color:#D32F2F">:>8.2f</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">orm_queries</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="89" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="89" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="relationships">Relationships</h1>
<ul>
<li>A foreign key becomes an attribute on both sides :
<ul>
<li><code>category.books</code> is a list, <code>book.category</code> is an object</li>
</ul>
</li>
<li><code>back_populates</code> names the attribute pointing the other way</li>
<li>Appending to the list is what creates the link :
<ul>
<li>No ids written by hand, and the insert order is worked out</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">class</span><span style="color:#6F42C1"> Category</span><span style="color:#24292EFF">(</span><span style="color:#6F42C1">Base</span><span style="color:#24292EFF">):</span></span>
<span class="line"><span style="color:#24292EFF">    books</span><span style="color:#212121">:</span><span style="color:#24292EFF"> Mapped</span><span style="color:#212121">[</span><span style="color:#24292EFF">list</span><span style="color:#212121">[</span><span style="color:#24292EFF">Book</span><span style="color:#212121">]]</span><span style="color:#D32F2F"> =</span><span style="color:#6F42C1"> relationship</span><span style="color:#212121">(back_populates</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"category"</span><span style="color:#212121">)</span></span>
<span class="line"></span>
<span class="line"><span style="color:#24292EFF">mystery</span><span style="color:#212121">.</span><span style="color:#24292EFF">books</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">(</span><span style="color:#6F42C1">Book</span><span style="color:#212121">(title</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Sharp Objects"</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#24292EFF">session</span><span style="color:#212121">.</span><span style="color:#6F42C1">add</span><span style="color:#212121">(mystery)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">relationships</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="90" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="90" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#78"><span class="ml-tag">python</span>SQLAlchemy</a></div>
<h1 id="joins-and-relationships">Joins and Relationships</h1>
<div class="two-col">
<div>
<ul>
<li>As a join :
<ul>
<li>One query</li>
<li>Explicit, and familiar</li>
<li>What the database does anyway</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">joined </span><span style="color:#D32F2F">=</span><span style="color:#6F42C1"> select</span><span style="color:#212121">(Book.title, Category.name).</span><span style="color:#6F42C1">join</span><span style="color:#212121">(Book.category)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(joined)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> title</span><span style="color:#212121">,</span><span style="color:#24292EFF"> category </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> session</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(joined):</span></span>

<h1 id="summary--sqlalchemy">Summary : SQLAlchemy</h1>
<ul>
<li>SQLAlchemy sits above the driver, not above SQL</li>
<li>An engine is made once and carries the URL :
<ul>
<li>Use <code>begin()</code> for anything that writes</li>
</ul>
</li>

<li>An engine drops straight into <code>pandas.read_sql</code></li>
</ul>

<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="array-data-types">Array Data Types</h1>
<ul>
<li><code>dtype</code> determines the representation of each element</li>
<li>Request a dtype at construction or convert with <code>astype</code></li>
<li>Integer conversions discard fractional parts; narrow integers have limits</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">samples </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">0.1</span><span style="color:#212121">, </span><span style="color:#1976D2">0.5</span><span style="color:#212121">, </span><span style="color:#D32F2F">-</span><span style="color:#1976D2">0.4</span><span style="color:#212121">], dtype</span><span style="color:#D32F2F">=</span><span style="color:#212121">np.float32)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(samples.dtype)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(samples.</span><span style="color:#6F42C1">astype</span><span style="color:#212121">(np.int16))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">iinfo</span><span style="color:#212121">(np.int16).min, np.</span><span style="color:#6F42C1">iinfo</span><span style="color:#212121">(np.int16).max)</span></span>

<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="shape-and-dimensions">Shape and Dimensions</h1>
<ul>
<li>An RGB image has height, width and colour-channel dimensions</li>
<li><code>.shape</code> gives each dimension's length; <code>.ndim</code> counts dimensions</li>
<li><code>.size</code> counts all elements</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo.shape)</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo[</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">0</span><span style="color:#212121">].shape)</span></span>
<span class="line"></span></code></pre>

<p><code class="pill-demo pill-id">demo06</code><br><code class="pill-demo pill-desc">shape_and_ndim</code></p>
</blockquote>

<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="reshaping-and-transposing">Reshaping and Transposing</h1>
<ul>
<li><code>reshape</code> changes dimensions while preserving the element count</li>
<li><code>-1</code> asks NumPy to calculate one dimension</li>
<li><code>transpose</code> rearranges axes; <code>.T</code> reverses them</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">pixels </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">.</span><span style="color:#6F42C1">reshape</span><span style="color:#212121">(</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">, </span><span style="color:#1976D2">3</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(pixels.shape)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">shares_memory</span><span style="color:#212121">(pixels, photo))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo.</span><span style="color:#6F42C1">transpose</span><span style="color:#212121">(</span><span style="color:#1976D2">1</span><span style="color:#212121">, </span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">2</span><span style="color:#212121">).shape)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(pixels.T.shape)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo07</code><br><code class="pill-demo pill-desc">reshape_and_transpose</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="indexing-and-slicing">Indexing and Slicing</h1>
<ul>
<li>Give one index or slice per dimension, separated by commas</li>
<li>A slice excludes its stop position</li>
<li>A negative step reverses an axis</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo[</span><span style="color:#1976D2">24</span><span style="color:#212121">, </span><span style="color:#1976D2">32</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">crop </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">[</span><span style="color:#1976D2">12</span><span style="color:#212121">:</span><span style="color:#1976D2">36</span><span style="color:#212121">,</span><span style="color:#1976D2"> 16</span><span style="color:#212121">:</span><span style="color:#1976D2">48</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(crop.shape)</span></span>
<span class="line"><span style="color:#24292EFF">flipped </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">[::</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">array_equal</span><span style="color:#212121">(flipped[</span><span style="color:#1976D2">0</span><span style="color:#212121">], photo[</span><span style="color:#D32F2F">-</span><span style="color:#1976D2">1</span><span style="color:#212121">]))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo[:, :, </span><span style="color:#1976D2">0</span><span style="color:#212121">].shape)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo08</code><br><code class="pill-demo pill-desc">indexing_and_slicing</code></p>

<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="views-and-copies">Views and Copies</h1>
<ul>
<li>Basic slicing returns a view of the same buffer</li>
<li>Writing through a view also changes the original</li>
<li><code>.copy()</code> makes an independent buffer; advanced indexing also copies</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">crop </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> photo</span><span style="color:#212121">[</span><span style="color:#1976D2">12</span><span style="color:#212121">:</span><span style="color:#1976D2">36</span><span style="color:#212121">,</span><span style="color:#1976D2"> 16</span><span style="color:#212121">:</span><span style="color:#1976D2">48</span><span style="color:#212121">]</span></span>
<span class="line"><span style="color:#24292EFF">detached </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> crop</span><span style="color:#212121">.</span><span style="color:#6F42C1">copy</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">crop</span><span style="color:#212121">[</span><span style="color:#1976D2">0</span><span style="color:#212121">,</span><span style="color:#1976D2"> 0</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> [</span><span style="color:#1976D2">1.0</span><span style="color:#212121">,</span><span style="color:#1976D2"> 0.0</span><span style="color:#212121">,</span><span style="color:#1976D2"> 0.0</span><span style="color:#24292EFF">]</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(photo[</span><span style="color:#1976D2">12</span><span style="color:#212121">, </span><span style="color:#1976D2">16</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(detached[</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">0</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">shares_memory</span><span style="color:#212121">(crop, photo))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">shares_memory</span><span style="color:#212121">(detached, photo))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">shares_memory</span><span style="color:#212121">(photo[[</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">1</span><span style="color:#212121">]], photo))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo09</code><br><code class="pill-demo pill-desc">views_and_copies</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="105" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="105" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="vectorised-arithmetic">Vectorised Arithmetic</h1>
<ul>
<li>A scalar applies to every element</li>
<li>Matching shapes combine element by element</li>
<li>Functions such as <code>sqrt</code>, <code>sin</code> and <code>log10</code> also accept arrays</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">times </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">arange</span><span style="color:#212121">(</span><span style="color:#1976D2">8</span><span style="color:#212121">)</span><span style="color:#D32F2F"> /</span><span style="color:#1976D2"> 8000</span></span>
<span class="line"><span style="color:#24292EFF">tone </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">sin</span><span style="color:#212121">(</span><span style="color:#1976D2">2</span><span style="color:#D32F2F"> *</span><span style="color:#212121"> np.pi </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 440</span><span style="color:#D32F2F"> *</span><span style="color:#212121"> times)</span></span>
<span class="line"><span style="color:#24292EFF">quiet </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> tone </span><span style="color:#D32F2F">*</span><span style="color:#1976D2"> 0.5</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(quiet.</span><span style="color:#6F42C1">round</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">sqrt</span><span style="color:#212121">(tone </span><span style="color:#D32F2F">**</span><span style="color:#1976D2"> 2</span><span style="color:#212121">).</span><span style="color:#6F42C1">round</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">))</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">((tone </span><span style="color:#D32F2F">-</span><span style="color:#212121"> quiet).</span><span style="color:#6F42C1">round</span><span style="color:#212121">(</span><span style="color:#1976D2">3</span><span style="color:#212121">))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">vectorised_arithmetic</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="106" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="106" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="boolean-masking">Boolean Masking</h1>
<ul>
<li>A comparison creates an array of booleans</li>
<li>Indexing with a mask keeps matching values</li>
<li><code>&amp;</code> and <code>|</code> combine conditions; each comparison needs parentheses</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">tone </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">array</span><span style="color:#212121">([</span><span style="color:#1976D2">0.0</span><span style="color:#212121">, </span><span style="color:#1976D2">0.2</span><span style="color:#212121">, </span><span style="color:#1976D2">0.9</span><span style="color:#212121">, </span><span style="color:#D32F2F">-</span><span style="color:#1976D2">0.8</span><span style="color:#212121">, </span><span style="color:#1976D2">0.0</span><span style="color:#212121">, </span><span style="color:#D32F2F">-</span><span style="color:#1976D2">0.1</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#24292EFF">silent </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> np</span><span style="color:#212121">.</span><span style="color:#6F42C1">abs</span><span style="color:#212121">(tone)</span><span style="color:#D32F2F"> &#x3C;</span><span style="color:#1976D2"> 0.05</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(tone[silent])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(silent.</span><span style="color:#6F42C1">sum</span><span style="color:#212121">(), silent.</span><span style="color:#6F42C1">any</span><span style="color:#212121">(), silent.</span><span style="color:#6F42C1">all</span><span style="color:#212121">())</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(np.</span><span style="color:#6F42C1">nonzero</span><span style="color:#212121">(silent)[</span><span style="color:#1976D2">0</span><span style="color:#212121">])</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(tone[(tone </span><span style="color:#D32F2F">></span><span style="color:#D32F2F"> -</span><span style="color:#1976D2">0.5</span><span style="color:#212121">) </span><span style="color:#D32F2F">&#x26;</span><span style="color:#212121"> (tone </span><span style="color:#D32F2F">&#x3C;</span><span style="color:#1976D2"> 0.5</span><span style="color:#212121">)])</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo11</code><br><code class="pill-demo pill-desc">boolean_masking</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="107" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="107" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#95"><span class="ml-tag">python</span>NumPy</a></div>
<h1 id="npwhere">np.where</h1>
<ul>
<li><code>where(condition, yes, no)</code> chooses a value for each element</li>
<li>Each branch can be an array or a scalar</li>
<li>Nesting a second <code>where</code> supports three outcomes</li>

<h1 id="pandas">Pandas</h1>
<ul>
<li><code>pandas</code> works with labelled tables :
<ul>

</ul>
</li>
<li>CSV files, spreadsheets and query results share the same operations</li>
<li>Column operations use NumPy arrays and other array implementations</li>
<li>A typical report reads, inspects, filters, summarises and exports data</li>
</ul>

<div class="ml-eyebrow"><a href="#114"><span class="ml-tag">python</span>Pandas</a></div>
<h1 id="series">Series</h1>
<ul>
<li>A <code>Series</code> has one index label per value</li>
<li>Arithmetic and comparisons apply to every value</li>
<li><code>.index</code> gives the labels; <code>.to_numpy()</code> gives the values</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">durations </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> pd</span><span style="color:#212121">.</span><span style="color:#6F42C1">Series</span><span style="color:#212121">([</span><span style="color:#1976D2">183</span><span style="color:#212121">, </span><span style="color:#1976D2">126</span><span style="color:#212121">, </span><span style="color:#1976D2">146</span><span style="color:#212121">],</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(durations.index.</span><span style="color:#6F42C1">tolist</span><span style="color:#212121">())</span></span>

<h1 id="dataframe">DataFrame</h1>

</ul>

<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="146" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="146" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="root-window-and-event-loop">Root Window and Event Loop</h1>
<ul>
<li>A graphical program has a different shape from a script :
<ul>
<li>A script runs top to bottom and exits</li>
<li>A window is created, then waits</li>
</ul>
</li>
<li><code>Tk()</code> is the root window, and there is exactly one</li>
<li><code>mainloop()</code> waits for an event, dispatches it, and waits again :
<ul>
<li>It does not return until the window is destroyed</li>
<li>Nothing written after it runs before then</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">root </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> tk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Tk</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">title</span><span style="color:#212121">(</span><span style="color:#22863A">"Playlist"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">mainloop</span><span style="color:#212121">()</span></span>
<span class="line"></span></code></pre>
<blockquote>

</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="147" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="147" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="widgets">Widgets</h1>
<ul>
<li>Three widgets carry most simple forms :
<ul>
<li><code>Label</code> shows text, <code>Entry</code> takes text, <code>Button</code> does something</li>
</ul>
</li>
<li>Prefer the themed <code>ttk</code> versions over the plain <code>tk</code> ones :
<ul>
<li>Same names, native appearance</li>
</ul>
</li>
<li>A widget is created with its parent as the first argument</li>
<li><code>command=</code> takes the function itself, without parentheses</li>
</ul>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="widget-values">Widget Values</h1>
<ul>
<li>A widget owns its value, and is asked for it rather than tracked :
<ul>
<li><code>entry.get()</code> reads what the user typed</li>
<li><code>label.configure(text=...)</code> writes it back</li>
</ul>
</li>
<li><code>configure()</code> sets any option after construction</li>
<li>The callback is an ordinary function :
<ul>
<li>It runs when the event happens, not when it is registered</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">def</span><span style="color:#6F42C1"> add_track</span><span style="color:#24292EFF">() </span><span style="color:#212121">-></span><span style="color:#1976D2"> None</span><span style="color:#24292EFF">:</span></span>
<span class="line"><span style="color:#24292EFF">    title </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> entry</span><span style="color:#212121">.</span><span style="color:#6F42C1">get</span><span style="color:#212121">().</span><span style="color:#6F42C1">strip</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#D32F2F">    if</span><span style="color:#D32F2F"> not</span><span style="color:#24292EFF"> title</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">        result</span><span style="color:#212121">.</span><span style="color:#6F42C1">configure</span><span style="color:#212121">(text</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"Enter a title first"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">        return</span></span>
<span class="line"><span style="color:#24292EFF">    playlist</span><span style="color:#212121">.</span><span style="color:#6F42C1">append</span><span style="color:#212121">((title, genre.</span><span style="color:#6F42C1">get</span><span style="color:#212121">()))</span></span>
<span class="line"><span style="color:#24292EFF">    result</span><span style="color:#212121">.</span><span style="color:#6F42C1">configure</span><span style="color:#212121">(text</span><span style="color:#D32F2F">=</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">title</span><span style="color:#1976D2">}</span><span style="color:#22863A">: </span><span style="color:#1976D2">{</span><span style="color:#212121">genre.</span><span style="color:#6F42C1">get</span><span style="color:#212121">()</span><span style="color:#1976D2">}</span><span style="color:#22863A"> (</span><span style="color:#1976D2">{</span><span style="color:#6F42C1">len</span><span style="color:#212121">(playlist)</span><span style="color:#1976D2">}</span><span style="color:#22863A"> tracks)"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">    entry</span><span style="color:#212121">.</span><span style="color:#6F42C1">delete</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">, tk.END)</span></span>
<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="149" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="149" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="choosing-a-genre">Choosing a Genre</h1>
<ul>
<li><code>Combobox</code> combines a text field with a list of choices</li>
<li><code>state=&quot;readonly&quot;</code> limits input to those choices</li>
<li><code>set</code> selects a value; <code>get</code> reads it</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">genre </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Combobox</span><span style="color:#212121">(root, values</span><span style="color:#D32F2F">=</span><span style="color:#212121">[</span><span style="color:#22863A">"Rock"</span><span style="color:#212121">, </span><span style="color:#22863A">"Pop"</span><span style="color:#212121">, </span><span style="color:#22863A">"Soul"</span><span style="color:#212121">, </span><span style="color:#22863A">"Country"</span><span style="color:#212121">, </span><span style="color:#22863A">"Electronic"</span><span style="color:#212121">],</span></span>
<span class="line"><span style="color:#212121">                     state</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"readonly"</span><span style="color:#212121">)</span></span>

<span class="line"></span></code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="150" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="150" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="grid-layout">grid Layout</h1>
<ul>
<li>Widgets do not place themselves, a geometry manager places them</li>
<li><code>grid</code> puts a widget in a row and a column :
<ul>
<li><code>sticky</code> takes compass points, so <code>&quot;e&quot;</code> pins right and <code>&quot;ew&quot;</code> fills</li>
<li><code>padx</code> and <code>pady</code> add space around the widget</li>
<li><code>columnspan</code> lets one widget sit across several columns</li>
</ul>
</li>
<li>A widget stretches only if its row or column is given a weight :
<ul>
<li>Weight is a share of the spare space, not a yes or no</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Label</span><span style="color:#212121">(form, text</span><span style="color:#D32F2F">=</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">field</span><span style="color:#1976D2">}</span><span style="color:#22863A"> :"</span><span style="color:#212121">).</span><span style="color:#6F42C1">grid</span><span style="color:#212121">(row</span><span style="color:#D32F2F">=</span><span style="color:#212121">row, column</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">0</span><span style="color:#212121">, sticky</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"e"</span><span style="color:#212121">, padx</span><span style="color:#D32F2F">=</span><span style="color:#212121">(</span><span style="color:#1976D2">0</span><span style="color:#212121">, </span><span style="color:#1976D2">8</span><span style="color:#212121">), pady</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">entry </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Entry</span><span style="color:#212121">(form)</span></span>
<span class="line"><span style="color:#24292EFF">entry</span><span style="color:#212121">.</span><span style="color:#6F42C1">grid</span><span style="color:#212121">(row</span><span style="color:#D32F2F">=</span><span style="color:#212121">row, column</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">, sticky</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"ew"</span><span style="color:#212121">, pady</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">4</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#24292EFF">entries</span><span style="color:#212121">[</span><span style="color:#24292EFF">field</span><span style="color:#212121">]</span><span style="color:#D32F2F"> =</span><span style="color:#24292EFF"> entry</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo03</code><br><code class="pill-demo pill-desc">gui_grid_layout</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="151" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="151" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="events-and-callbacks">Events and Callbacks</h1>
<ul>
<li><code>bind()</code> maps an event pattern to a callback :
<ul>
<li><code>&lt;Key&gt;</code> is any key, <code>&lt;Key-a&gt;</code> is one key, <code>&lt;Button-1&gt;</code> is a left click</li>
<li><code>&lt;Configure&gt;</code> fires when the widget is resized</li>
</ul>
</li>
<li>Every bound callback is handed one argument, the event :
<ul>
<li>It carries <code>x</code>, <code>y</code>, <code>keysym</code> and the widget it happened on</li>
</ul>
</li>
<li>A <code>Button</code>'s <code>command=</code> is the same idea with the event thrown away</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">root</span><span style="color:#212121">.</span><span style="color:#6F42C1">bind</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;Key>"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> event</span><span style="color:#212121">: </span><span style="color:#6F42C1">report</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"key </span><span style="color:#1976D2">{</span><span style="color:#212121">event.keysym</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">, event))</span></span>
<span class="line"><span style="color:#24292EFF">canvas</span><span style="color:#212121">.</span><span style="color:#6F42C1">bind</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;Button-1>"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> event</span><span style="color:#212121">: </span><span style="color:#6F42C1">report</span><span style="color:#212121">(</span><span style="color:#22863A">"left click"</span><span style="color:#212121">, event))</span></span>
<span class="line"><span style="color:#24292EFF">canvas</span><span style="color:#212121">.</span><span style="color:#6F42C1">bind</span><span style="color:#212121">(</span><span style="color:#22863A">"&#x3C;Configure>"</span><span style="color:#212121">, </span><span style="color:#D32F2F">lambda</span><span style="color:#FF9800"> event</span><span style="color:#212121">: </span><span style="color:#6F42C1">report</span><span style="color:#212121">(</span><span style="color:#22863A">"resized"</span><span style="color:#212121">, event))</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo04</code><br><code class="pill-demo pill-desc">gui_events</code></p>
</blockquote>
</section>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="ttktreeview">ttk.Treeview</h1>
<ul>
<li><code>ttk.Treeview</code> is a real table, with headings and columns</li>
<li>Rows are inserted, and each one gets an identifier back</li>
<li>Clicking a heading can re-order the rows :
<ul>
<li><code>tree.set</code> reads one cell, <code>tree.move</code> re-places a row</li>
</ul>
</li>
<li>The widget most internal tools need :
<ul>
<li>Most internal tools are a table of something with a filter above it</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">tree </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> ttk</span><span style="color:#212121">.</span><span style="color:#6F42C1">Treeview</span><span style="color:#212121">(root, columns</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">list</span><span style="color:#212121">(COLUMNS), show</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"headings"</span><span style="color:#212121">, selectmode</span><span style="color:#D32F2F">=</span><span style="color:#22863A">"browse"</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> row </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> rows</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    tree</span><span style="color:#212121">.</span><span style="color:#6F42C1">insert</span><span style="color:#212121">(</span><span style="color:#22863A">""</span><span style="color:#212121">, tk.END, values</span><span style="color:#D32F2F">=</span><span style="color:#212121">[row[name] </span><span style="color:#D32F2F">for</span><span style="color:#212121"> name </span><span style="color:#D32F2F">in</span><span style="color:#212121"> COLUMNS], tags</span><span style="color:#D32F2F">=</span><span style="color:#212121">(tag,))</span></span>
<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>

<li>Type a filter, press Return, run the query, refill the table</li>

<span class="line"><span style="color:#24292EFF">found </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">execute</span><span style="color:#212121">(sql, parameters).</span><span style="color:#6F42C1">fetchall</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#24292EFF">connection</span><span style="color:#212121">.</span><span style="color:#6F42C1">close</span><span style="color:#212121">()</span></span>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="choosing-a-toolkit">Choosing a Toolkit</h1>
<div class="two-col">
<div>
<ul>
<li><code>tkinter</code> :
<ul>
<li>In the standard library</li>
<li>Plain, dated, acceptable</li>
<li>Small tools and dialogs</li>
</ul>
</li>
<li><code>PySide6</code>, the Qt binding :
<ul>
<li>A large install</li>
<li>Native and modern</li>
<li>Real desktop applications</li>
</ul>
</li>
</ul>
</div>
<div>
<ul>
<li><code>Streamlit</code> :
<ul>
<li>Opens a browser tab</li>
<li>No event loop, no callbacks</li>
<li>Dashboards over data</li>
</ul>
</li>
<li>Model and view :
<ul>
<li><code>tkinter</code> holds the rows itself</li>
<li>Qt asks a model for them</li>
<li>Which matters at scale</li>
</ul>
</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="155" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="155" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="gui-trade-offs">GUI Trade-offs</h1>
<ul>
<li>A graphical program costs more than it looks :
<ul>
<li>It cannot be run from cron, piped, or driven from a script</li>
<li>It needs a display, which rules out most servers</li>
<li>It is harder to test than anything else in this course</li>
</ul>
</li>
<li>Reach for a window when the user is not you :
<ul>
<li>And reach for a command-line tool when the user is</li>
</ul>
</li>
<li>The command-line tools cover most of the middle ground :

</li>

<div class="ml-eyebrow"><a href="#143"><span class="ml-tag">python</span>GUI Toolkits</a></div>
<h1 id="summary--gui-toolkits">Summary : GUI Toolkits</h1>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="running-other-programs">Running Other Programs</h1>
<ul>
<li>Some work belongs to a program that already exists :
<ul>
<li><code>git</code>, <code>systemctl</code>, <code>rsync</code>, a vendor's command-line tool</li>
</ul>
</li>
<li><code>subprocess</code> starts it, waits for it, and reports back</li>
<li>This is the module for the script that has outgrown its shell :
<ul>
<li>The logic got complicated, the quoting got worse</li>
<li>The commands themselves were never the problem</li>
</ul>
</li>
<li>Everything here is standard library, so there is nothing to install</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="159" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="159" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="subprocessrun">subprocess.run</h1>
<ul>
<li><code>run()</code> starts the program, waits, and returns a <code>CompletedProcess</code></li>
<li>The command is a list : the program, then each argument separately</li>
<li>Nothing is captured unless you ask, so output goes straight to the terminal</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">finished </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">([</span><span style="color:#22863A">"git"</span><span style="color:#212121">, </span><span style="color:#22863A">"--version"</span><span style="color:#212121">], check</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">False</span><span style="color:#212121">)</span></span>

<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">()</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"type       :"</span><span style="color:#212121">, </span><span style="color:#1976D2">type</span><span style="color:#212121">(finished).</span><span style="color:#1976D2">__name__</span><span style="color:#212121">)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"args       :"</span><span style="color:#212121">, finished.args)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"returncode :"</span><span style="color:#212121">, finished.returncode)</span></span>
<span class="line"><span style="color:#6F42C1">print</span><span style="color:#212121">(</span><span style="color:#22863A">"stdout     :"</span><span style="color:#212121">, finished.stdout)</span></span>
<span class="line"></span></code></pre>
<blockquote>
<p><code class="pill-demo pill-id">demo01</code><br><code class="pill-demo pill-desc">running_a_command</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 800"><foreignObject width="1280" height="800"><section id="160" data-paginate="true" data-class="lang-python" data-theme="spiraltrain" lang="C" class="lang-python" data-marpit-pagination="160" style="--paginate:true;--class:lang-python;--theme:spiraltrain;" data-marpit-pagination-total="169" data-size="16:10">
<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="capturing-output">Capturing Output</h1>

<li><code>capture_output=True</code> fills in <code>stdout</code> and <code>stderr</code></li>
<li><code>text=True</code> makes them strings rather than bytes :

</ul>
</li>
<li>After that it is ordinary Python, not a shell pipeline</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">finished </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    [</span><span style="color:#22863A">"wc"</span><span style="color:#212121">, </span><span style="color:#22863A">"-l"</span><span style="color:#212121">, </span><span style="color:#1976D2">str</span><span style="color:#212121">(DATA </span><span style="color:#D32F2F">/</span><span style="color:#22863A"> "listening.log"</span><span style="color:#212121">)],</span></span>

<h1 id="exit-codes">Exit Codes</h1>

<li>A non-zero exit is information, not always a failure :

<li><code>grep</code> exits 1 when it did not match</li>

<li><code>check=False</code> and read <code>returncode</code> yourself when the code is meaningful</li>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="argument-lists">Argument Lists</h1>
<ul>
<li>A list hands the arguments to the program directly :
<ul>
<li>No shell starts, so nothing splits and nothing expands</li>
</ul>
</li>
<li><code>shell=True</code> hands the whole string to a shell first :
<ul>
<li>A space in a filename becomes two arguments</li>
<li>Punctuation becomes syntax</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#24292EFF">listed </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">run</span><span style="color:#212121">(</span></span>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="standard-input-and-pipelines">Standard Input and Pipelines</h1>
<ul>
<li><code>input=</code> writes to the child's stdin and closes it</li>
<li>Two commands join without a shell :
<ul>
<li>Run the first, capture it, hand the text to the second</li>
</ul>
</li>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="timeouts">Timeouts</h1>
<ul>
<li>A child that hangs will hang the parent for ever</li>
<li><code>timeout=</code> kills it and raises <code>TimeoutExpired</code> :
<ul>
<li>Nothing is left running behind you</li>
</ul>
</li>
<li>Any command touching a network, a device or another machine wants one</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">try</span><span style="color:#212121">:</span></span>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="environment-and-working-directory">Environment and Working Directory</h1>
<ul>
<li>The child inherits this process's environment by default</li>
<li><code>env=</code> replaces it wholesale :
<ul>
<li>Copy <code>os.environ</code> and add to the copy, or the child loses <code>PATH</code></li>
</ul>
</li>
<li><code>cwd=</code> runs the command elsewhere without moving yourself :
<ul>

</ul>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="missing-programs">Missing Programs</h1>
<ul>
<li>A missing command raises <code>FileNotFoundError</code>, not a non-zero exit</li>
<li><code>shutil.which()</code> answers the question without running anything</li>
<li>Check dependencies at the start of a script, not at the point of use :
<ul>
<li>Failing immediately with a clear message beats failing halfway through</li>
</ul>
</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">for</span><span style="color:#24292EFF"> program </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> (</span><span style="color:#22863A">"git"</span><span style="color:#212121">,</span><span style="color:#22863A"> "grep"</span><span style="color:#212121">,</span><span style="color:#22863A"> "definitely-not-installed"</span><span style="color:#24292EFF">)</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#24292EFF">    location </span><span style="color:#D32F2F">=</span><span style="color:#24292EFF"> shutil</span><span style="color:#212121">.</span><span style="color:#6F42C1">which</span><span style="color:#212121">(program)</span></span>
<span class="line"><span style="color:#6F42C1">    print</span><span style="color:#212121">(</span><span style="color:#D32F2F">f</span><span style="color:#22863A">"</span><span style="color:#1976D2">{</span><span style="color:#212121">program</span><span style="color:#D32F2F">:&#x3C;26</span><span style="color:#1976D2">}</span><span style="color:#1976D2"> {</span><span style="color:#212121">location </span><span style="color:#D32F2F">or</span><span style="color:#22863A"> '-- not on PATH'</span><span style="color:#1976D2">}</span><span style="color:#22863A">"</span><span style="color:#212121">)</span></span>
<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="popen-and-streaming-output">Popen and Streaming Output</h1>
<ul>
<li><code>run()</code> returns nothing until the command has finished</li>
<li><code>Popen</code> starts the process and hands back control immediately :
<ul>
<li>Iterating <code>stdout</code> yields lines as the child flushes them</li>
</ul>
</li>
<li>Use it for anything long enough that silence looks like a hang</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span style="color:#D32F2F">with</span><span style="color:#24292EFF"> subprocess</span><span style="color:#212121">.</span><span style="color:#6F42C1">Popen</span><span style="color:#212121">(</span></span>
<span class="line"><span style="color:#212121">    [sys.executable, </span><span style="color:#22863A">"-c"</span><span style="color:#212121">, CHILD],</span></span>
<span class="line"><span style="color:#212121">    stdout</span><span style="color:#D32F2F">=</span><span style="color:#212121">subprocess.PIPE,</span></span>
<span class="line"><span style="color:#212121">    text</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">True</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">    bufsize</span><span style="color:#D32F2F">=</span><span style="color:#1976D2">1</span><span style="color:#212121">,</span></span>
<span class="line"><span style="color:#212121">)</span><span style="color:#D32F2F"> as</span><span style="color:#24292EFF"> process</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#4a9c59">    # Iterating the pipe yields lines as the child flushes them.</span></span>
<span class="line"><span style="color:#D32F2F">    for</span><span style="color:#24292EFF"> line </span><span style="color:#D32F2F">in</span><span style="color:#24292EFF"> process</span><span style="color:#212121">.</span><span style="color:#24292EFF">stdout</span><span style="color:#212121">:</span></span>
<span class="line"><span style="color:#6F42C1">        print</span><span style="color:#212121">(</span><span style="color:#22863A">"  received :"</span><span style="color:#212121">, line.</span><span style="color:#6F42C1">rstrip</span><span style="color:#212121">())</span></span>
<span class="line"></span></code></pre>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="pathlib-alternatives">pathlib Alternatives</h1>
<ul>
<li>Starting a process costs time and brings quoting with it</li>
<li>Python already does most of what the small commands do :</li>
</ul>
<pre class="shiki min-light" style="background-color:#ffffff;color:#24292eff" tabindex="0"><code><span class="line"><span>ls *.log     ->  Path.glob            basename  ->  Path.name</span></span>
<span class="line"><span>wc -l        ->  str.splitlines       test -f   ->  Path.exists</span></span>
<span class="line"><span>grep         ->  a comprehension      find      ->  Path.rglob</span></span>
<span class="line"><span>cp / mv / rm ->  shutil.copy, Path.rename, Path.unlink</span></span>
<span class="line"><span></span></span></code></pre>
<ul>
<li>Reach for <code>subprocess</code> when the work belongs to another program</li>
</ul>
<blockquote>
<p><code class="pill-demo pill-id">demo10</code><br><code class="pill-demo pill-desc">when_not_to_shell_out</code></p>

<div class="ml-eyebrow"><a href="#157"><span class="ml-tag">python</span>Running Other Programs</a></div>
<h1 id="summary--running-other-programs">Summary : Running Other Programs</h1>
<ul>
<li><code>subprocess.run()</code> starts a program, waits, and reports back</li>
<li>Pass a list, not a string, and leave <code>shell=True</code> alone</li>
<li><code>capture_output=True</code> with <code>text=True</code> to read what it printed</li>
<li><code>check=True</code> to raise on failure, <code>check=False</code> when the code means something</li>
<li><code>timeout=</code> on anything that could hang</li>
<li><code>shutil.which()</code> to fail early with a clear message</li>
<li><code>Popen</code> when you need the output as it arrives</li>
<li>And <code>pathlib</code> instead, for anything the filesystem already does</li>
</ul>
</section>
